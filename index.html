  places:[
    /* ================= TARİHİ: KALE TARAFI ================= */
    {id:"p_hrad",cat:"hist",name:"Prag Kalesi (Pražský hrad)",wiki:"Prague_Castle",lat:50.0910966,lon:14.4016165,pid:"ChIJw7ckbB6VC0cRnyUSr4g8zyo",desc:"Dünyanın en büyük antik kale kompleksi. Saraylar, katedral, kiliseler ve Altın Sokak tek surun içinde.",hist:"Kaleyi yaklaşık 880'de Přemysl hanedanından Prens Bořivoj kurdu. O günden beri Çek topraklarının yönetimi buradan yapıldı: Bohemya kralları, Kutsal Roma-Germen imparatorları ve bugün Çek Cumhuriyeti'nin cumhurbaşkanı. Kale yaklaşık 70 bin metrekareyle Guinness kayıtlarına dünyanın en büyük antik kale kompleksi olarak geçmiştir.\n\nAvrupa tarihini değiştiren bir olay da burada yaşandı. 23 Mayıs 1618'de Protestan soylular, Katolik Habsburg imparatorunun iki temsilcisini ve kâtiplerini sarayın penceresinden aşağı attı. Üçü de yaklaşık 20 metreden düşüp hayatta kaldı; Katolikler bunu meleklere, Protestanlar altlarındaki gübre yığınına bağladı. Bu \"İkinci Prag Defenestrasyonu\" Otuz Yıl Savaşları'nı başlattı.\n\nKale bugün açık bir şehir gibidir: avlular ve bahçeler ücretsiz gezilir, binaların içi biletlidir. Ana girişteki muhafızlar her saat başı değişir; öğlen 12'de bando eşliğinde büyük tören yapılır.",why:"Prag'ın kalbi. Katedral, eski saray ve Altın Sokak için en az yarım gün ayır.",dur:"3 sa",fee:"Avlular ücretsiz; binalar için ana tur bileti yaklaşık 450 CZK (yorumdan)",hours:"Avlular her gün 06:00-22:00; binalar yaklaşık 09:00-17:00 (Kasım-Mart 16:00)",tip:"Tramvay 22 ile Pražský hrad durağında in, yokuşu yukarı değil aşağı yürü. Öğlen 12 nöbet töreni için 11:45'te ana kapıda ol."},
    {id:"p_vitus",cat:"hist",name:"St. Vitus Katedrali",wiki:"St._Vitus_Cathedral",lat:50.0908918,lon:14.4005114,pid:"ChIJW08COB6VC0cRoonZ8lA4rWk",desc:"Kalenin ortasındaki dev Gotik katedral. İçinde Alfons Mucha'nın vitrayı ve Aziz Václav şapeli var.",hist:"Katedralin temelini 1344'te Kral ve İmparator IV. Karl attı. Yapımı savaşlar ve para sıkıntısı yüzünden yüzyıllarca durdu; ancak 1929'da, Aziz Václav'ın ölümünün bininci yılında tamamlandı. Yani dışarıdan tek parça Gotik görünen bina aslında 585 yılda yapıldı.\n\nİçerinin en çok konuşulan parçası, girişin solundaki üçüncü şapelde Art Nouveau ustası Alfons Mucha'nın 1931 tarihli vitrayı. Aziz Václav Şapeli ise duvarları yarı değerli taşlar ve altınla kaplı bir mücevher kutusu gibidir; Çek taç mücevherleri bu şapelin üstündeki odada, yedi ayrı kilitli bir kapının ardında saklanır. Yedi anahtar yedi ayrı kişidedir, cumhurbaşkanı da onlardan biridir.\n\nKatedralde Bohemya krallarının çoğu, IV. Karl dahil, gömülüdür.",why:"Girişin ilk bölümü ücretsiz ve Mucha vitrayı oradan görülür. İçerisi Prag'ın en etkileyici mekânı.",dur:"45 dk",fee:"Ön bölüm ücretsiz, iç kısım kale biletine dahil",hours:"Pzt-Cmt 09:00-16:00, Paz 12:00-16:00",tip:"Kuleye ayrı biletle çıkılıyor, merdiven 287 basamak civarı."},
    {id:"p_zlata",cat:"hist",name:"Altın Sokak (Zlatá ulička)",wiki:"Golden_Lane",lat:50.0920495,lon:14.4040813,pid:"ChIJS7rJFh-VC0cR6yEQX6AGf9U",desc:"Kale surunun içine yaslanmış minik renkli evler. Kafka bir dönem 22 numarada yazdı.",hist:"Evler 16. yüzyılda kale muhafızları ve zanaatkârlar için surların içindeki boşluklara yapıldı. Sonra kuyumcular yerleşti ve sokak Altın Sokak adını aldı. Bir efsaneye göre burada İmparator II. Rudolf'un simyacıları altın yapmaya çalışırdı; gerçekte bu dar odalarda yoksul aileler yaşıyordu.\n\nFranz Kafka 1916-1917 kışında kız kardeşi Ottla'nın kiraladığı 22 numaralı evde geceleri yazdı. Evlerin içi bugün eski meslekleri anlatan küçük sergiler; sokağın sonunda bir zırh koleksiyonu ve Daliborka kulesinin zindanı var.",why:"Kale biletine dahil, 20 dakikalık şirin bir dolaşma.",dur:"20 dk",fee:"Kale bileti ile",hours:"Her gün 09:00-17:00"},
    {id:"p_loreta",cat:"hist",name:"Loreta Manastırı",wiki:"Loreto_(Prague)",lat:50.089239,lon:14.39151,pid:"ChIJC5zY0RuVC0cRUQlKCL3UIoI",desc:"Barok hac yeri. Hazinesinde 6.222 elmaslı \"Prag Güneşi\" var, kulesindeki çanlar her saat çalar.",hist:"1626'da bir soylu kadın, İtalya'daki Loreto kentinde bulunan ve Meryem'in Nasıra'daki evi olduğuna inanılan Santa Casa'nın bir kopyasını burada yaptırdı. Çevresine kemerli avlular, şapeller ve barok bir kilise eklendi.\n\nHazine odasındaki Prag Güneşi adlı kutsal ekmek kabı 1699'da yapıldı ve üzerinde 6.222 elmas vardır. Kuledeki 27 çanlık karillon her saat başı Meryem ilahisi çalar.",why:"Kaleden Strahov'a yürürken yolun üstünde. Saat başı çanları dinle.",dur:"45 dk",fee:"Yaklaşık €10 (yorumdan)",hours:"Her gün 10:00-17:00"},
    {id:"p_strahov",cat:"hist",name:"Strahov Manastırı Kütüphanesi",wiki:"Strahov_Monastery",lat:50.0863503,lon:14.3886968,pid:"ChIJTaiY3xqVC0cRs0KSAKWl-WU",desc:"İki ünlü barok kütüphane salonu: Teoloji ve Felsefe. Kapıdan bakılarak görülüyor.",hist:"Premonstratens rahipleri manastırı 1143'te kurdu. Teoloji Salonu 17. yüzyıldan, Felsefe Salonu 18. yüzyıl sonundan. Felsefe Salonu'nun ceviz rafları, kapatılan başka bir manastırdan sökülüp buraya taşındı ve ölçüsü tam tutsun diye salon onlara göre yapıldı. Tavandaki dev freskte insanlığın düşünce tarihi anlatılır.\n\nZiyaretçiler salonlara giremiyor, kapı eşiğinden bakılıyor. Yorumlara göre bu yüzden bazıları bileti pahalı buluyor; ama koridordaki eski küreler ve tuhaf doğa koleksiyonu da görülmeye değer.",why:"Prag'ın en güzel iç mekânlarından. Yanındaki bira evi ve şehir manzarası ile birleştir.",dur:"40 dk",fee:"Yaklaşık 190 CZK (yorumdan)",hours:"Her gün 09:00-17:00"},
    {id:"p_mikulas",cat:"hist",name:"St. Nikolaus Kilisesi (Malá Strana)",wiki:"St._Nicholas_Church_(Malá_Strana)",lat:50.0880269,lon:14.4034704,pid:"ChIJI8HWguGUC0cR_FG_wGIqqwY",desc:"Malá Strana meydanını kaplayan yeşil kubbeli barok başyapıt. Mozart orgunu çaldı.",hist:"Cizvitler kiliseyi 1704-1755 arasında Dientzenhofer baba ve oğluna yaptırdı. Aynı aile Bamberg'deki St. Martin'i de yapmıştı. Kubbe ve kule Prag silüetinin en tanınan parçalarındandır.\n\nMozart 1787'de Prag'dayken buradaki orgu çaldı; 1791'de ölümünden sonra şehirdeki anma ayini bu kilisede yapıldı. Komünist dönemde kilisenin kulesi gizli polisin gözetleme noktası olarak kullanıldı, çünkü yakındaki batı büyükelçilikleri tepeden görülebiliyordu.",why:"Barok sevmesen bile tavan freskine bakmaya değer. Galeriye çıkmayı unutma.",dur:"30 dk",fee:"Yaklaşık 150 CZK (yorumdan)",hours:"Her gün 09:00-17:45 (Cum-Cmt 16:45)"},
    /* ================= TARİHİ: KÖPRÜ VE ESKİ ŞEHİR ================= */
    {id:"p_karluv",cat:"hist",name:"Karlův most (Karl Köprüsü)",wiki:"Charles_Bridge",lat:50.0864771,lon:14.4114366,pid:"ChIJn7WO5eWUC0cRJrHT0TiXIHU",desc:"Vltava'yı geçen 14. yüzyıl taş köprüsü. Üzerinde 30 barok heykel.",hist:"IV. Karl köprünün temel taşını 9 Temmuz 1357 sabahı saat 5:31'de koydu. Bu tarih ve saat yan yana yazılınca 1-3-5-7-9-7-5-3-1 olur; bir sayı palindromu. Astrologların seçtiği bu anın köprüyü güçlü kılacağına inanıldı. Bir efsaneye göre harca dayanıklı olsun diye yumurta karıştırıldı ve bütün Bohemya'dan arabalarla yumurta getirildi. Köprü 1841'e kadar Vltava'yı geçen tek köprüydü.\n\nHeykeller 17. ve 18. yüzyıllarda eklendi. En ünlüsü Aziz Jan Nepomuk: Kral IV. Václav'ın emriyle 1393'te bu köprüden nehre atıldı, anlatıya göre kraliçenin günah çıkarmasında söylediklerini krala açıklamadığı için. Heykelin altındaki bronz kabartmaya dokunmak şans getirir ve Prag'a geri döneceğini garantiler denir; kabartmanın parlaklığı buradan gelir.",why:"Prag'ın simgesi. Sabah erken (07:00 öncesi) ya da gece git, gündüz çok kalabalık.",dur:"30 dk",fee:"Ücretsiz",hours:"Her zaman açık",tip:"Kalabalıkta cebine dikkat. Gün doğumunda köprü neredeyse boş."},
    {id:"p_mostecka",cat:"hist",name:"Eski Şehir Köprü Kulesi",wiki:"Old_Town_Bridge_Tower",lat:50.0862306,lon:14.4136141,pid:"ChIJMbJV6eWUC0cRZM00zzxyBhA",desc:"Karl Köprüsü'nün Eski Şehir ucundaki Gotik kule. Tepeden köprü ve kale aynı karede.",hist:"Kuleyi katedralin de mimarı olan Peter Parler 14. yüzyıl sonunda bitirdi. Kralların taç giyme alayı bu kapıdan geçerek kaleye giderdi. Cephedeki heykellerde IV. Karl, oğlu IV. Václav ve Aziz Vitus var. 1648'de İsveç ordusu Prag'ı kuşattığında kule öğrenciler ve kentliler tarafından savunuldu.",why:"Köprünün en iyi fotoğrafı buradan. Açılıştan sonraki ilk saat yarı fiyat (yorumlardan).",dur:"30 dk",fee:"Ücretli; ilk saat yarı fiyat",hours:"Her gün 10:00-18:00"},
    {id:"p_ots",cat:"hist",name:"Eski Şehir Meydanı (Staroměstské náměstí)",wiki:"Old_Town_Square",lat:50.0874682,lon:14.4207565,pid:"ChIJF6gfPumUC0cRNxOlactBiAU",desc:"Týn Kilisesi'nin kuleleri, astronomik saat ve Jan Hus anıtıyla Prag'ın ana meydanı.",hist:"Meydan 12. yüzyıldan beri Prag'ın pazar yeri. Ortadaki büyük anıt Jan Hus'a ait: Katolik kilisesini eleştiren bu Prag'lı rahip 1415'te Konstanz'da yakıldı ve Çek ulusunun simgesi oldu. Anıt ölümünün 500. yılında, 1915'te dikildi.\n\nRathaus'un önündeki kaldırıma bak: 27 beyaz haç var. 21 Haziran 1621'de, Habsburglara karşı ayaklanan 27 Protestan lider burada idam edildi. Haçlar onların yeridir.\n\nMeydanın bir köşesindeki zemine gömülü bakır şerit, Prag meridyenini gösterir; eskiden öğlen vaktini buradaki gölge belirlerdi.",why:"Her şeyin merkezi. Kahveyi meydanda değil yan sokaklarda iç, meydan çok pahalı.",dur:"30 dk",fee:"Ücretsiz",hours:"Her zaman açık"},
    {id:"p_orloj",cat:"hist",name:"Astronomik Saat ve Belediye Kulesi",wiki:"Prague_astronomical_clock",lat:50.0870215,lon:14.4207065,pid:"ChIJSS_AOemUC0cRlgaiWrJEe_E",desc:"1410'dan beri çalışan astronomik saat. Her saat başı on iki havari pencerelerden geçer.",hist:"Saat 1410'da yerleştirildi ve hâlâ çalışan en eski astronomik saattir. Üstteki kadran Güneş'in ve Ay'ın gökyüzündeki yerini, burçları ve eski Bohemya saatini gösterir. Alttaki kadran bir takvimdir.\n\nSaat başı 09:00-23:00 arası gösteri başlar: iskelet şeklindeki Ölüm ipi çeker ve kum saatini çevirir, yukarıdaki iki pencerede on iki havari sırayla geçer, en sonda altın bir horoz öter. Ölüm'ün yanındaki figürler Orta Çağ'ın korkularını temsil eder: aynaya bakan Kibir, para kesesini sallayan Açgözlülük.\n\nBir efsaneye göre saati yapan usta Hanuš, başka bir şehre benzerini yapmasın diye kör edildi. Gerçek yapımcı ise saatçi Kadaňlı Mikuláš'tı.\n\nBelediye binasının 70 metrelik kulesine asansör ya da merdivenle çıkılır; Prag'ın en iyi meydan manzarası buradan.",why:"Gösteriyi bir kez izle, sonra kuleye çık. Gösteri kısa, kalabalık uzun.",dur:"45 dk",fee:"Saat ücretsiz, kule ve rehberli tur ücretli",hours:"Gösteri her saat 09:00-23:00; kule her gün 09:00-20:00"},
    {id:"p_tyn",cat:"hist",name:"Týn Kilisesi",wiki:"Church_of_Our_Lady_before_Týn",lat:50.0877486,lon:14.4225396,pid:"ChIJu2niIWeTC0cRHEJGY5xf_Io",desc:"Meydanın üzerinde yükselen iki sivri kuleli Gotik kilise. Gökbilimci Tycho Brahe burada gömülü.",hist:"Kilise 14. ve 15. yüzyıllarda yapıldı ve Jan Hus'un takipçileri Husçuların ana kilisesi oldu. Cephesinde Husçuların simgesi altın bir kadeh vardı. Katolikler 1620'de şehri geri alınca kadeh eritildi ve yerine Meryem heykeli kondu; heykelin halesi o kadehin altınından yapıldı.\n\nİki kule birbirine benzer ama biri biraz daha incedir: dişi ve erkek kule diye anılırlar. İçeride Danimarkalı gökbilimci Tycho Brahe'nin mezarı var; İmparator II. Rudolf'un sarayında çalışmış ve 1601'de Prag'da ölmüştü.\n\nGiriş meydandan değil, kafelerin arasındaki dar bir geçitten.",why:"Ücretsiz. İçerisi sessiz ve görkemli; fotoğraf yasak.",dur:"20 dk",fee:"Ücretsiz",hours:"Sal-Cmt 10:00-13:00 ve 15:00-17:00, Paz 10:30-12:00, Pazartesi kapalı"},
    {id:"p_klementinum",cat:"hist",name:"Klementinum (Barok Kütüphane)",wiki:"Klementinum",lat:50.0865979,lon:14.4160186,pid:"ChIJNUIyNe-UC0cRnw1-EJKuNLI",desc:"Eski Cizvit koleji. Barok kütüphane ve 1775'ten beri hava ölçümü yapılan astronomi kulesi rehberli turla.",hist:"Cizvitler 1556'da Prag'a gelince kaleden sonra şehrin en büyük yapı kompleksini kurdu. Barok Kütüphane 1722'de açıldı: tavan freskleri, ahşap raflar ve ortada sıra sıra eski küreler. Ziyaretçiler kapıdan bakar.\n\nAstronomi kulesinde 1775'ten beri her gün hava sıcaklığı ölçülür. Bu, dünyanın en uzun kesintisiz hava ölçüm serilerinden biridir. Kulenin tepesindeki terastan Eski Şehir'in kuleleri görülür.",why:"Tur kısa ama kütüphane ve kule manzarası çok güzel. Bileti önceden al.",dur:"50 dk",fee:"Ücretli, rehberli tur",hours:"Turlar her gün 09:00-20:00",tip:"Turlar öğlene kadar dolabiliyor; online bilet al. Kulede dar merdiven ve dik basamaklar var."},
    {id:"p_staronova",cat:"hist",name:"Eski-Yeni Sinagog (Staronová synagoga)",wiki:"Old_New_Synagogue",lat:50.0900716,lon:14.4186049,pid:"ChIJycjlaOiUC0cR-kuI2y8OvpQ",desc:"Avrupa'nın hâlâ ibadete açık en eski sinagogu. Golem efsanesinin geçtiği yer.",hist:"Sinagog yaklaşık 1270'te yapıldı ve 750 yıldır ibadet ediliyor. Adı tuhaftır: yapıldığında Yeni Sinagog'du, sonra daha yeni sinagoglar yapılınca Eski-Yeni diye anıldı.\n\nEfsaneye göre 16. yüzyılda Haham Judah Löw, Yahudi mahallesini korumak için Vltava kıyısındaki kilden bir dev, Golem'i yarattı ve ağzına konan bir yazıyla canlandırdı. Golem kontrolden çıkınca haham onu durdurdu ve cansız gövdesini sinagogun tavan arasına sakladı. Tavan arası bugün de ziyaretçilere kapalıdır.",why:"Prag Yahudi tarihinin en eski ve canlı mekânı.",dur:"20 dk",fee:"Ayrı bilet (Yahudi Müzesi biletine dahil değil)",hours:"Paz-Cum 09:00-17:00, Cumartesi kapalı",tip:"Erkekler başını örtmeli; kapıda kâğıt kipa veriliyor."},
    {id:"p_pinkas",cat:"hist",name:"Pinkas Sinagogu ve Eski Yahudi Mezarlığı",wiki:"Old_Jewish_Cemetery,_Prague",lat:50.089225,lon:14.4169722,pid:"ChIJhfGaXuiUC0cRLXI5leEqTyk",desc:"Duvarlarında 80 bin Holokost kurbanının adı yazan sinagog ve 12 bin mezar taşlı eski mezarlık.",hist:"Pinkas Sinagogu'nun duvarlarına, Holokost'ta öldürülen Bohemya ve Moravya'lı yaklaşık 80 bin Yahudinin adı, doğum ve ölüm tarihleriyle tek tek yazılmıştır. Üst kattaki sergide Terezín gettosundaki çocukların yaptığı resimler var; çocukların çoğu sonra kamplarda öldü.\n\nSinagogdan çıkınca Eski Yahudi Mezarlığı'na girilir. 1439'dan 1787'ye kadar kullanıldı. Yahudilerin gettodan dışarı gömülmesi yasak olduğu için yer daraldıkça mezarların üstüne toprak atılıp yeni mezarlar yapıldı; bazı yerlerde on iki kat üst üste mezar vardır. Bu yüzden 12 bine yakın mezar taşı birbirine yaslanmış durur. Golem efsanesinin hahamı Judah Löw de buradadır.",why:"Prag'ın en ağır ve en etkileyici iki yeri. Sessiz ve saygılı bir ziyaret.",dur:"1 sa",fee:"Yahudi Müzesi kombine bileti",hours:"Paz-Cum 09:00-18:00, Cumartesi ve Yahudi bayramlarında kapalı"},
    {id:"p_spanelska",cat:"hist",name:"İspanyol Sinagogu",wiki:"Spanish_Synagogue_(Prague)",lat:50.0901479,lon:14.4208465,pid:"ChIJZ9pfyumUC0cR3ZMJBZmRTrc",desc:"Elhamra'dan esinlenen Mağribi süslemeli 19. yüzyıl sinagogu. Avrupa'nın en güzellerinden sayılır.",hist:"Sinagog 1868'de, Prag'ın en eski sinagogunun yerine yapıldı. İç süslemesi İspanya'daki Elhamra Sarayı'nın İslam motiflerinden esinlenir, adı da buradan gelir. Duvar ve tavanın her yeri altın ve renkli geometrik desenlerle kaplıdır. Akşamları konserler düzenlenir.",why:"Yahudi Müzesi biletine dahil. Tavana bakınca neden bu adı aldığını anlarsın.",dur:"20 dk",fee:"Yahudi Müzesi kombine bileti",hours:"Paz-Cum 09:00-18:00, Cumartesi kapalı"},
    {id:"p_prasna",cat:"hist",name:"Barut Kulesi (Prašná brána)",wiki:"Powder_Tower,_Prague",lat:50.087273,lon:14.4277887,pid:"ChIJBfIPBeuUC0cRphNG7F-4SZM",desc:"Eski Şehir'in Gotik giriş kapısı. Kraliyet Yolu buradan başlar.",hist:"Kule 1475'te Eski Şehir'in 13 kapısından biri olarak yapılmaya başlandı. Kraliyet Yolu, yani taç giyecek kralların alay yolu, bu kapıdan girip Eski Şehir'i ve Karl Köprüsü'nü geçerek kaleye çıkardı. 17. yüzyılda kule barut deposu olarak kullanıldı ve adını oradan aldı. 186 basamakla tepesine çıkılır.",why:"Kraliyet Yolu yürüyüşünün başlangıcı. Yanındaki Belediye Evi ile birlikte gör.",dur:"30 dk",fee:"Ücretli; ilk saat yarı fiyat (yorumdan)",hours:"Her gün 10:00-18:00"},
    {id:"p_obecni",cat:"hist",name:"Belediye Evi (Obecní dům)",wiki:"Municipal_House",lat:50.0877208,lon:14.4277908,pid:"ChIJL0C4HuuUC0cREJonDZJQMWo",desc:"Prag'ın en güzel Art Nouveau binası. Çekoslovakya'nın bağımsızlığı burada ilan edildi.",hist:"Bina 1912'de, eski kraliyet sarayının yerine Çek ulusal kimliğini gösteren bir kültür merkezi olarak açıldı. Döneminin bütün önemli Çek sanatçıları, Alfons Mucha dahil, iç süslemelerde çalıştı. Smetana Konser Salonu Prag Baharı festivalinin açılış yeridir.\n\n28 Ekim 1918'de Çekoslovakya'nın Avusturya-Macaristan'dan bağımsızlığı bu binada ilan edildi. 1989'da Kadife Devrim sırasında komünist yönetimle muhalefet arasındaki ilk görüşmeler de burada yapıldı.",why:"Dışarıdan bak, içi için rehberli tura gir. Bodrumdaki bira salonu az bilinir.",dur:"1 sa",fee:"Rehberli tur yaklaşık 190 CZK (yorumdan)",hours:"Her gün 10:00-19:00"},
    {id:"p_stavovske",cat:"hist",name:"Stavovské divadlo (Estates Tiyatrosu)",wiki:"Estates_Theatre",lat:50.0859782,lon:14.4236651,pid:"ChIJKatTv-iUC0cRCTSHs2hbV3Q",desc:"Mozart'ın Don Giovanni operasının ilk kez sahnelendiği yeşil cepheli tiyatro.",hist:"Tiyatro 1783'te açıldı. 29 Ekim 1787'de Mozart, Don Giovanni operasının ilk gösterisini burada bizzat yönetti. Viyana'da pek sevilmeyen Mozart'ı Prag halkı bağrına basmıştı; Mozart da \"Pragerlerim beni anlıyor\" demişti. Bugün de Mozart'ın sahnesinin hâlâ kullanılan tek tiyatrosu budur. Miloš Forman'ın Amadeus filminin opera sahneleri burada çekildi.",why:"Dışarıdan bakmak yeter. Bir akşam operası için bilet bakabilirsin.",dur:"10 dk",fee:"Dışarıdan ücretsiz",hours:"Gösteri saatlerine göre"},
    {id:"p_vaclav",cat:"hist",name:"Václav Meydanı (Václavské náměstí)",wiki:"Wenceslas_Square",lat:50.0817831,lon:14.4271187,pid:"ChIJMb_LNu2UC0cRTBVR5nC64bg",desc:"Yeni Şehir'in 750 metrelik bulvar-meydanı. Çek tarihinin bütün büyük gösterileri burada yapıldı.",hist:"Meydan 1348'de IV. Karl'ın kurduğu Yeni Şehir'in at pazarı olarak açıldı. Tepede Ulusal Müze ve atlı Aziz Václav heykeli durur.\n\n1968'de Sovyet tankları buraya girdi. Ocak 1969'da öğrenci Jan Palach işgali protesto ederek burada hayatını kaybetti; müzenin önündeki yerde bir anma işareti var. Kasım 1989'da yüz binlerce kişi bu meydanda anahtarlarını şıngırdatarak komünist yönetimin sonunu istedi. Bu Kadife Devrim'di ve birkaç hafta içinde Václav Havel cumhurbaşkanı oldu.",why:"Modern Çek tarihinin sahnesi. Müzeye doğru yürü.",dur:"20 dk",fee:"Ücretsiz",hours:"Her zaman açık"},
    {id:"p_narodni",cat:"hist",name:"Ulusal Müze (Národní muzeum)",wiki:"National_Museum_(Prague)",lat:50.0789704,lon:14.4309369,pid:"ChIJua9Ogo2UC0cRpkk9dANajkI",desc:"Václav Meydanı'nın tepesindeki görkemli müze. Kubbesinden meydan manzarası.",hist:"Müze 1818'de kuruldu, bugünkü neo-Rönesans binası 1891'de açıldı. Çek ulusal uyanışının simgesidir. Cephede 1968 Sovyet işgalinde açılan kurşun izleri, restorasyondan sonra bilerek farklı renkte taşla işaretlendi.\n\nİçeride doğa tarihi, mineral koleksiyonu ve Çek tarihi sergileri var. Kubbenin altındaki panteonda ünlü Çeklerin büstleri durur; kubbeden Václav Meydanı'nın tamamı görülür.",why:"Yorumlara göre fiyatına göre çok dolu bir müze. Yağmurlu gün için ideal.",dur:"2 sa",fee:"Yaklaşık €10 (yorumdan)",hours:"Her gün 10:00-18:00"},
    {id:"p_vysehrad",cat:"hist",name:"Vyšehrad",wiki:"Vyšehrad",lat:50.0641941,lon:14.4188977,pid:"ChIJCd13PWeUC0cRZihTX2RPn0w",desc:"Nehre bakan kayalık üstündeki eski kale. Bazilika ve Dvořák'ın, Mucha'nın yattığı mezarlık.",hist:"Çek efsanesine göre Prag'ın hikâyesi burada başlar. Kâhin Prenses Libuše bu kayalıktan Vltava'nın karşı yakasına bakıp \"Görkemi yıldızlara uzanacak büyük bir şehir görüyorum\" dedi ve Prag'ın kuruluşunu buyurdu.\n\nGerçekte burası 10. yüzyıldan bir kaledir. Bugünkü surlar 17. yüzyıl Habsburg tabyalarıdır. Neo-Gotik Aziz Petrus ve Pavlus Bazilikası'nın yanındaki Vyšehrad Mezarlığı'nda Çek kültürünün büyükleri yatar: besteci Antonín Dvořák ve Bedřich Smetana, ressam Alfons Mucha. Ortak anıt mezar Slavín'dir.\n\nSurların üstünden nehir ve kale yönünde Prag'ın en sakin manzaralarından biri görülür.",why:"Kalabalıktan uzak, yerlilerin pazar yürüyüşü. Gün batımında surlarda ol.",dur:"1 sa 30 dk",fee:"Ücretsiz (bazilika içi ücretli)",hours:"Alan her zaman açık"},
    /* ================= MİMARİ ================= */
    {id:"p_tancici",cat:"arch",name:"Dans Eden Ev (Tančící dům)",wiki:"Dancing_House",lat:50.0754031,lon:14.4141786,pid:"ChIJFz83wvaUC0cRRDMLBTdlAZM",desc:"Nehir kıyısında, iki dansçıya benzeyen eğri cam ve beton bina. Tepesinde manzaralı bar.",hist:"Bina 1996'da Frank Gehry ve Çek mimar Vlado Milunić tarafından yapıldı. Bu köşedeki eski bina 1945'te bir Amerikan bombardımanında yıkılmıştı. Cam kule bir kadına, beton kule bir erkeğe benzetildi; ünlü dansçılar Fred Astaire ve Ginger Rogers'tan esinlenerek ilk adı Fred ve Ginger'dı.\n\nYapımı sırasında Prag'ın barok dokusuna yakışmadığı için çok tartışıldı. Fikri destekleyenlerden biri, hemen yandaki apartmanda yaşayan Václav Havel'di. Bugün Prag'ın en çok fotoğraflanan modern binasıdır.",why:"Vyšehrad'a nehir boyunca yürürken. Tepedeki terasa içecekle çıkılıyor.",dur:"20 dk",fee:"Teras yaklaşık 150 CZK ya da içecek alarak",hours:"Teras bar gündüz ve akşam açık"},
    {id:"p_kafka",cat:"arch",name:"Kafka'nın Dönen Kafası",wiki:"Head_of_Franz_Kafka",lat:50.0816752,lon:14.4208307,pid:"ChIJSfv87u2UC0cRMLvFpMvuPNY",desc:"42 parçadan oluşan, dönüp birleşerek Kafka'nın yüzünü oluşturan 11 metrelik aynalı heykel.",hist:"Heykeltıraş David Černý 2014'te Quadrio alışveriş merkezinin arkasına yaptı. 42 paslanmaz çelik katman ayrı ayrı döner; yüz dağılır, sonra yeniden birleşir. Bu, Kafka'nın Dönüşüm öyküsüne ve kendi bölünmüş kimliğine gönderme olarak okunur. Franz Kafka 1883'te Prag'da doğdu, Almanca yazan bir Yahudi olarak bu şehirde yaşadı ve öldü.",why:"Kısa ama büyüleyici bir durak. Saat başı yaklaşık 15 dakika dönüyor.",dur:"15 dk",fee:"Ücretsiz",hours:"Her gün 09:00-23:00"},
    {id:"p_zizkov",cat:"arch",name:"Žižkov Televizyon Kulesi",wiki:"Žižkov_Television_Tower",lat:50.0810526,lon:14.4511741,pid:"ChIJweACSJyUC0cRE4gGU06KHKY",desc:"Gövdesine dev bebek heykelleri tırmanan 216 metrelik kule. 93 metrede seyir terası.",hist:"Kule 1985-1992 arasında, komünist dönemin sonunda yapıldı ve yerliler tarafından uzun süre Prag'ın en çirkin binası seçildi. 2000'de David Černý gövdeye yüzleri barkod gibi olan dev bebek heykelleri yerleştirince kule bir sanat eserine dönüştü. Seyir katından bütün şehir görünür, ama yorumlara göre eski şehir uzakta küçük kalıyor.",why:"Tuhaf ve fotojenik. Riegrovy Sady bira bahçesiyle birleştir.",dur:"45 dk",fee:"Ücretli",hours:"Her gün 09:00-24:00"},
    /* ================= PARK ================= */
    {id:"p_kampa",cat:"park",name:"Kampa Adası",wiki:"Kampa_Island",lat:50.0848479,lon:14.4083515,pid:"ChIJX7tVieSUC0cRA6Lpcx9-RGg",desc:"Karl Köprüsü'nün hemen altında, Şeytan Deresi ile ayrılan sakin ada ve park.",hist:"Adayı Malá Strana'dan Čertovka (Şeytan Deresi) adlı dar bir kanal ayırır; adının huysuz bir çamaşırcı kadından geldiği anlatılır. Kanal kenarındaki eski değirmen çarkları ve evler yüzünden burasına Prag'ın Venedik'i de denir. Parkta David Černý'nin yüzü olmayan dev bebek heykelleri ve Kampa Müzesi var.",why:"Köprünün kalabalığından iki dakikada uzaklaş.",dur:"30 dk",fee:"Ücretsiz",hours:"Her zaman açık"},
    {id:"p_valdstejn",cat:"park",name:"Valdštejn Bahçesi",wiki:"Wallenstein_Palace",lat:50.090403,lon:14.4078806,pid:"ChIJ6b6z1OaUC0cROV8QtOpp8W0",desc:"Malá Strana'da tavus kuşlarının dolaştığı ücretsiz barok saray bahçesi.",hist:"Otuz Yıl Savaşları'nın en zengin ve güçlü komutanı Albrecht von Wallenstein, bu sarayı 1623-1630 arasında kaleyle yarışsın diye yaptırdı; bunun için 23 ev ve bir tuğla fabrikası yıkıldı. Wallenstein 1634'te imparatorun emriyle öldürüldü.\n\nBahçede bronz heykeller, büyük bir sütunlu açık salon ve bir tarafında sarkıt mağarasını taklit eden tuhaf damla taş duvar var. Saray bugün Çek Senatosu.",why:"Ücretsiz ve çok huzurlu. Kaleden aşağı inerken uğra.",dur:"30 dk",fee:"Ücretsiz",hours:"Her gün 09:00-17:00 (Nisan-Ekim)"},
    {id:"p_riegrovy",cat:"park",name:"Riegrovy Sady",wiki:"Riegrovy_sady",lat:50.080538,lon:14.4429787,pid:"ChIJxVEGjZqUC0cR2NIcdyBK-fA",desc:"Vinohrady'de, şehrin ve kalenin üzerine gün batımı manzaralı park ve bira bahçesi.",hist:"Park 19. yüzyıl sonunda bir bağ ve çiftliğin yerinde açıldı. Yamacından eski şehir ve kale karşıdan görünür. Yazın bira bahçesi yerlilerin buluşma yeridir.",why:"Yerlilerle gün batımı izlemek için.",dur:"1 sa",fee:"Ücretsiz",hours:"Bira bahçesi Pzt-Cum 14:00-22:00, Cmt-Paz 12:00-22:00 (Google'a göre)"},
    /* ================= FOTO NOKTALARI ================= */
    {id:"p_lennon",cat:"photo",name:"John Lennon Duvarı",wiki:"Lennon_Wall",lat:50.0862506,lon:14.4067918,pid:"ChIJ3fi1iOOUC0cR__Q9EXbH-kc",desc:"Barış mesajları ve grafitilerle sürekli değişen duvar.",hist:"John Lennon 1980'de öldürülünce gençler bu duvara onun portresini ve şarkı sözlerini yazdı. Komünist rejimde Batı müziği ve özgürlük çağrıları yasaktı; polis duvarı defalarca boyadı, ertesi gün yeniden yazıldı. Duvar Malta Şövalyeleri'ne aittir ve bugün de herkes üstüne yazabilir.",why:"Sabah erken git, gündüz fotoğraf için sıra oluyor.",dur:"10 dk",fee:"Ücretsiz",hours:"Her zaman açık"},
    {id:"p_metronom",cat:"photo",name:"Letná Metronomu",wiki:"Prague_Metronome",lat:50.094744,lon:14.4159406,pid:"ChIJ1XcuBd2UC0cRmArvNbWmjws",desc:"Stalin anıtının yerindeki dev metronom. Prag'ın köprülerine en güzel manzara.",hist:"Burada 1955'te dünyanın en büyük Stalin anıtı dikildi: 15 metrelik granit Stalin'in arkasında halkı temsil eden figürler sıralanıyordu. Stalin'in ölümünden sonra Sovyetler Birliği onu kınayınca anıt 1962'de dinamitle havaya uçuruldu. 1991'de yerine zamanın akışını simgeleyen 23 metrelik metronom kondu. Kaidesi bugün kaykaycıların buluşma yeri.",why:"Vltava'nın köprülerini sıra sıra görmek için en iyi nokta. Gün batımında.",dur:"30 dk",fee:"Ücretsiz",hours:"Her zaman açık",tip:"Čech köprüsünden karşıya geçip merdivenleri çık."},
    {id:"p_petrin",cat:"photo",name:"Petřín Kulesi ve Füniküleri",wiki:"Petřín_Lookout_Tower",lat:50.083527,lon:14.3950837,pid:"ChIJd71LDf2UC0cRkcGvwf8x33E",desc:"Eyfel'in küçük kardeşi: 63 metrelik çelik kule. Tepesinden bütün Prag.",hist:"Çek turistler 1889 Paris Fuarı'ndan Eyfel Kulesi'ne hayran dönünce Prag'a da bir tane istediler. 1891'de, beşte biri boyunda, 63,5 metrelik bu kule yapıldı. Tepe zaten yüksek olduğu için zirvesi Eyfel'inkiyle neredeyse aynı yüksekliğe çıkar. 299 basamak ya da asansörle çıkılır.\n\nTepeye çıkan füniküler 2024'te heyelan yüzünden kapanmış, iki yıllık onarımdan sonra 22 Eylül 2026'da yeniden açıldı.",why:"Kale tepesinin ve kırmızı çatıların en geniş manzarası.",dur:"1 sa",fee:"Kule ücretli; füniküler tek yön 100 CZK",hours:"Kule her gün 10:00-18:00",tip:"Füniküler Újezd durağından kalkıyor. Çık ve Strahov'a doğru tepeden yürü."},
    {id:"p_naplavka",cat:"photo",name:"Náplavka Rıhtımı",wiki:"Vltava",gen:1,lat:50.0697738,lon:14.4146479,pid:"ChIJQXd5N1-UC0cR6L0K3Gl0xyY",desc:"Nehir kıyısında tekne barlar ve kale manzarası. Cumartesi sabahı çiftçi pazarı.",hist:"Eskiden salların ve kerestenin indirildiği rıhtım bugün Prag gençlerinin buluşma yeri. Taş duvarlara oyulmuş eski depolar kafe olarak açıldı. Cumartesi sabahları Prag'ın en ünlü çiftçi pazarı kurulur.",why:"Dans Eden Ev'den Vyšehrad'a yürürken. Akşam bir tekne barda otur.",dur:"30 dk",fee:"Ücretsiz",hours:"Her zaman açık"},
    /* ================= KAHVE VE TARİHİ KAFELER ================= */
    {id:"p_slavia",cat:"coffee",name:"Café Slavia",wiki:"Café_Slavia",lat:50.0815599,lon:14.4134325,pid:"ChIJ23fPA_CUC0cR8r0Zdb5P65M",price:"€€",rating:4.3,rc:9536,rdate:"19.10.2026",eat:"Kahve, likörlü külah tatlısı, kahvaltı; pencere kenarından kale ve nehir manzarası.",hist:"Slavia 1884'ten beri Prag'ın aydın kafesi. Ulusal Tiyatro'nun karşısında olduğu için oyuncular, yazarlar ve muhalifler burada buluştu. Komünist dönemde Václav Havel ve arkadaşları bu masalarda oturdu. Ziyaretçi yorumlarına göre Nâzım Hikmet de Prag'a geldiğinde burada otururdu ve içeride portresi asılı.",why:"Nâzım Hikmet'in izinden bir kahve. Pencere kenarı masa iste.",hours:"Pzt-Cmt 09:00-23:00, Paz 09:00-22:00"},

    {id:"bu_var",cat:"hist",name:"Buda Kalesi (Budavári Palota)",wiki:"Buda_Castle",lat:47.4962048,lon:19.0395666,pid:"ChIJDw826jzcQUcRdiUBqV86zj0",desc:"Tuna'ya bakan tepedeki kraliyet sarayı. İçinde Ulusal Galeri ve Budapeşte Tarih Müzesi var.",hist:"Macar kralları 13. yüzyılda Moğol istilasından sonra bu tepeye kale yaptı. 15. yüzyılda Kral Matthias Corvinus zamanında saray Avrupa'nın en parlak Rönesans saraylarından biriydi.\n\n1541'de Kanuni Sultan Süleyman Budin'i aldı. Şehir 145 yıl Osmanlı yönetiminde kaldı ve Budin Eyaleti'nin merkezi oldu. 1686'da Habsburg ve müttefik orduları iki aylık bir kuşatmayla kaleyi geri aldı; bu kuşatmada saray büyük ölçüde yıkıldı. Bugünkü barok saray Habsburglar zamanında, sonra 1945 savaşından sonra yeniden yapıldı.\n\nSarayın avluları ve terasları ücretsiz gezilir. Terastan Zincirli Köprü, Parlamento ve Pest yakası tek karede görünür.",why:"Budapeşte'nin tepesi. Terastan manzara ücretsiz, müzeler isteğe bağlı.",dur:"1 sa 30 dk",fee:"Avlu ve teraslar ücretsiz, müzeler ücretli",hours:"Avlular her zaman açık; müzeler genelde Sal-Paz 10:00-18:00",tip:"Füniküler (Sikló) pahalı; 16 numaralı otobüs ya da merdivenler daha ucuz."},
    {id:"bu_matyas",cat:"hist",name:"Matthias Kilisesi (Mátyás-templom)",wiki:"Matthias_Church",lat:47.5019537,lon:19.0341617,pid:"ChIJ1yuefiLcQUcR1Uppb4xy0GI",desc:"Renkli Zsolnay çini çatılı Gotik kilise. Osmanlı döneminde 145 yıl camiydi.",hist:"Kilise 13. yüzyılda yapıldı ve Kral Matthias Corvinus iki düğününü burada yaptığı için onun adıyla anılır. 1541'de Osmanlılar Budin'i alınca kilise Büyük Cami'ye (Eski Cami) çevrildi. Duvarlardaki freskler badanalandı, iç süslemeler kaldırıldı. Yaklaşık 145 yıl boyunca burada namaz kılındı.\n\n1686'da kuşatma sırasında bir duvar yıkılınca, Osmanlıların gizlediği bir Meryem heykeli ortaya çıktı ve dua eden askerlerin önüne düştü; anlatıya göre bu, savunanların moralini bozdu.\n\nBugünkü görünüm 19. yüzyıl sonunda yapılan büyük restorasyondan. Çatının renkli çinileri Pécs'teki Zsolnay fabrikasından. İçerideki duvar süslemelerinde Osmanlı dönemini hatırlatan geometrik ve bitkisel motifler de görülür. Son iki Habsburg kralı Franz Joseph ve IV. Karl burada Macar kralı olarak taç giydi.",why:"Budapeşte'nin en güzel kilisesi, Osmanlı geçmişiyle birlikte.",dur:"40 dk",fee:"Ücretli",hours:"Her gün 09:00-17:00 (Google'a göre; ayin ve düğünlerde kısıtlı)"},

    {id:"bu_velibej",cat:"hist",name:"Veli Bey Hamamı",wiki:"Rudas_Baths",gen:1,lat:47.5190282,lon:19.0370026,pid:"ChIJzQpGtAHcQUcR_T5GXU5OLNM",desc:"1575'ten kalma, bir hastane binasının içinde saklı Osmanlı hamamı. Kalabalıksız.",hist:"Hamam 1575'te Sokollu Mustafa Paşa döneminde yapıldı. Yüzyıllar sonra çevresine bir hastane yapılınca dışarıdan görünmez oldu. Yakın zamanda restore edildi. Merkezde kubbenin altında sekizgen bir havuz ve köşelerde farklı sıcaklıkta küçük havuzlar var.\n\nZiyaretçi sayısı sınırlı tutulduğu için yorumlara göre şehrin en sakin hamamı.",why:"Gül Baba'nın hemen altında. Turist kalabalığı olmadan Osmanlı hamamı.",dur:"2 sa",fee:"Yaklaşık 7.200 HUF, 3 saatlik (yorumdan)",hours:"Pzt-Sal 15:00-21:00; Çar-Paz 06:00-12:00 ve 15:00-21:00",tip:"Online rezervasyon yok, açılıştan önce git ve sıraya gir."},
    {id:"bu_kiraly",cat:"hist",name:"Király Hamamı",wiki:"Király_Baths",lat:47.5105556,lon:19.0380556,pid:"ChIJayWMQxvcQUcRm5HMYekTyNs",desc:"1565'te başlanan, Budapeşte'nin en eski Osmanlı hamamlarından biri.",hist:"Király hamamını Budin beylerbeyi Arslan Paşa 1565'te yaptırmaya başladı, Sokollu Mustafa Paşa bitirdi. Kale surlarının içinde yapıldı ki kuşatma sırasında da kullanılabilsin. Adı Macarca kral demektir ama bu, hamamı sonradan alan König ailesinin adından gelir.\n\nYorumlara göre hamam şu an onarım nedeniyle kapalı.",why:"Gül Baba'dan Batthyány meydanına inerken dışarıdan bak.",dur:"10 dk",fee:null,hours:"Kapalı görünüyor (onarım), gitmeden kontrol et"},
    {id:"bu_szikla",cat:"hist",name:"Kayadaki Hastane (Sziklakórház)",wiki:"Hospital_in_the_Rock",lat:47.5007642,lon:19.0315115,pid:"ChIJu2IXSCLcQUcRiviM4kLiHn4",desc:"Kale tepesinin altındaki mağaralarda İkinci Dünya Savaşı hastanesi ve Soğuk Savaş nükleer sığınağı.",hist:"Kale tepesinin altında kilometrelerce doğal mağara vardır. 1944-45'te Budapeşte kuşatması sırasında bu mağaralarda gizli bir hastane çalıştı; kapasitesinin çok üstünde yaralı burada tedavi edildi. 1956 ayaklanmasında yeniden hastane oldu, Soğuk Savaş'ta nükleer sığınağa çevrildi. Rehberli turla geziliyor, içeride fotoğraf yasak.",why:"Yorumlara göre şehrin en etkileyici turlarından. Önceden bilet al.",dur:"1 sa",fee:"Ücretli, rehberli tur",hours:"Her gün 10:00-19:00"},
    {id:"bu_citadella",cat:"photo",name:"Gellért Tepesi ve Citadella",wiki:"Citadella",lat:47.487708,lon:19.043764,pid:"ChIJ2yAmK0jcQUcRjBKEjm_O1i4",desc:"Şehrin en yüksek manzara noktası. Bütün köprüler, Parlamento ve kale bir arada.",hist:"Tepe adını, 1046'da paganlar tarafından bir fıçıya konup tepeden aşağı yuvarlandığı anlatılan Aziz Gellért'ten alır. Tepedeki kale Citadella'yı Habsburglar 1851'de, 1848-49 Macar devriminden sonra şehri kontrol altında tutmak için yaptı. Yanındaki kadın heykeli Özgürlük Anıtı 1947'de dikildi.",why:"Budapeşte'nin en iyi panoraması. Gün batımında.",dur:"1 sa",fee:"Ücretsiz",hours:"Her zaman açık",tip:"Yokuş dik. Özgürlük Köprüsü'nün Buda ucundan merdivenle çık."},
    {id:"bu_lanchid",cat:"photo",name:"Széchenyi Zincirli Köprüsü",wiki:"Széchenyi_Chain_Bridge",lat:47.4989928,lon:19.0436994,pid:"ChIJKRqatz_cQUcRpMnQhdf-QB4",desc:"Buda ile Pest'i birleştiren ilk kalıcı köprü. Uçlarında taş aslanlar.",hist:"1840'lara kadar Buda ile Pest arasında kalıcı köprü yoktu; kışın buz tutunca iki şehir arasında geçiş durur ya da donmuş nehrin üstünden yürünürdü. Kont István Széchenyi, babasının cenazesine buz yüzünden yetişemeyince köprü yaptırmaya karar verdiği anlatılır. İngiliz mühendis William Tierney Clark'ın tasarladığı, İskoç Adam Clark'ın inşa ettiği köprü 1849'da açıldı. Buda ve Pest 1873'te tek şehir oldu.\n\nŞehirde, aslanların dili olmadığı ve heykeltıraşın buna üzülüp nehre atladığı anlatılır. Gerçekte dilleri var, sadece aşağıdan görünmüyor.",why:"Gece ışıklarıyla yürü.",dur:"20 dk",fee:"Ücretsiz",hours:"Her zaman açık"},
    /* ================= TARİHİ: PEST ================= */
    {id:"bu_parlament",cat:"hist",name:"Macar Parlamentosu (Országház)",wiki:"Hungarian_Parliament_Building",lat:47.507121,lon:19.045669,pid:"ChIJPaPURhDcQUcRbg-P_7giITQ",desc:"Tuna kıyısındaki dev neo-Gotik bina. İçinde Aziz İstvan'ın kutsal tacı.",hist:"Parlamento 1885-1904 arasında yapıldı ve Macaristan'ın en büyük binasıdır. Kubbe 96 metre yüksekliktedir; bu sayı, Macarların 896'da Karpat havzasına gelişine ve 1896'daki binyıl kutlamalarına göndermedir. Aynı yükseklikte olan tek bina Aziz İstvan Bazilikası'dır: devlet ile kilisenin eşit olduğu mesajı. Kanunla daha yüksek bina yapılamaz.\n\nİçerideki kubbe salonunda Macar Kutsal Tacı sergilenir. Bin yıllık geleneğe göre Macar kralları bu taçla taç giyerdi; tacın tepesindeki haçın eğik durması kazayla olmuştur ve öyle bırakılmıştır.",why:"Dışarıdan Tuna kıyısından, içini rehberli turla. Tur biletleri tükenir, önceden al.",dur:"1 sa",fee:"Rehberli tur ücretli, online al",hours:"Ziyaretçi merkezi her gün 08:00-18:00"},
    {id:"bu_cipok",cat:"hist",name:"Tuna Kıyısındaki Ayakkabılar",wiki:"Shoes_on_the_Danube_Bank",lat:47.5039274,lon:19.0448015,pid:"ChIJ32QtdBbcQUcR1mrLvmwZjvY",desc:"Nehir kıyısında 60 çift demir ayakkabı. 1944-45'te burada kurşuna dizilen Yahudilerin anıtı.",hist:"1944-45 kışında Macar faşist Ok Haç milisleri, binlerce Budapeşteli Yahudiyi bu kıyıya getirdi, ayakkabılarını çıkarttırdı ve nehre bakar şekilde kurşuna dizdi; cesetler Tuna'ya düştü. Ayakkabılar o dönemde değerliydi, bu yüzden çıkartılırdı.\n\nAnıtı yönetmen Can Togay ve heykeltıraş Gyula Pauer 2005'te yaptı. Erkek, kadın ve çocuk ayakkabıları dönemin modellerine göre dökülmüştür.",why:"Parlamento'nun hemen güneyinde. Sessiz ve saygılı bir durak.",dur:"15 dk",fee:"Ücretsiz",hours:"Her zaman açık"},
    {id:"bu_bazilika",cat:"hist",name:"Aziz İstvan Bazilikası",wiki:"St._Stephen's_Basilica",lat:47.5008902,lon:19.0539887,pid:"ChIJ982jOl7BQUcRy7x_rqz8Qt0",desc:"Pest'in en büyük kilisesi. Kubbe terasından şehir manzarası; içinde ilk kralın mumyalanmış eli.",hist:"Bazilika 54 yılda, 1905'te tamamlandı. Yapım sırasında 1868'de kubbe çöktü ve yeniden yapıldı. Adını Macaristan'ın ilk kralı ve kurucusu Aziz İstvan'dan (I. Stephen, 1000-1038) alır.\n\nYan şapelde Kutsal Sağ El (Szent Jobb) saklanır: İstvan'ın bin yıllık mumyalanmış sağ eli. Her yıl 20 Ağustos'ta şehirde alayla gezdirilir. Kubbenin çevresindeki terasa asansör ve merdivenle çıkılır; 96 metre yükseklikle Parlamento ile eşittir.",why:"Kubbe terasından Pest'in en iyi manzarası.",dur:"45 dk",fee:"Kilise için bağış, kubbe terası ücretli",hours:"Pzt-Cmt 09:00-17:15, Paz 12:30-17:15"},
    {id:"bu_dohany",cat:"hist",name:"Dohány Sokağı Sinagogu",wiki:"Dohány_Street_Synagogue",lat:47.4959071,lon:19.0606139,pid:"ChIJz0F9UELcQUcRCIZQ0GOvKEE",desc:"Avrupa'nın en büyük sinagogu. Bahçesinde gümüş yapraklı Hayat Ağacı anıtı.",hist:"Sinagog 1859'da açıldı. Mağribi tarzda iki soğan kubbeli kulesi ve 3.000 kişilik salonuyla Avrupa'nın en büyük sinagogudur. İçerisi bir katedral gibi org ve kürsülerle düzenlenmiştir; bu, Macar Yahudilerinin reformcu Neolog akımının özelliğidir.\n\n1944-45'te sinagog Budapeşte gettosunun sınırındaydı. Bahçesine gettoda ölen binlerce kişi gömüldü. Arkadaki Hatıra Bahçesi'nde, her yaprağında bir kurbanın adı yazan gümüş bir söğüt ağacı heykeli var.",why:"Budapeşte Yahudi tarihinin merkezi. Bilet pahalı ama tur iyi.",dur:"1 sa 15 dk",fee:"Pahalı; yorumlara göre yaklaşık €35",hours:"Paz-Per 10:00-18:00, Cum 10:00-16:00, Cumartesi kapalı"},
    {id:"bu_opera",cat:"hist",name:"Macar Devlet Operası",wiki:"Hungarian_State_Opera_House",lat:47.5027169,lon:19.0583076,pid:"ChIJ_USZjWvcQUcRzouk4CFRMyE",desc:"Andrássy Bulvarı'nda altın ve kadife iç mekânlı neo-Rönesans opera binası.",hist:"Opera 1884'te Miklós Ybl'in tasarımıyla açıldı. İmparator Franz Joseph yapım için para verdi ama tek şartı Viyana Operası'ndan büyük olmamasıydı. Ybl bunu kabul etti; bina daha küçük ama yorumlara göre daha güzel oldu. Gustav Mahler bir dönem burada müdürlük yaptı.",why:"Bir gösteri ya da rehberli tur. Dışarıdan da bulvarın en güzel binası.",dur:"45 dk",fee:"Tur ücretli",hours:"Gösteri ve tur saatlerine göre"},
    {id:"bu_hosok",cat:"hist",name:"Kahramanlar Meydanı (Hősök tere)",wiki:"Heroes'_Square_(Budapest)",lat:47.5149429,lon:19.0778626,pid:"ChIJaSHx-YfbQUcRPylIurx8QTQ",desc:"Macar tarihinin kahramanlarının heykelleriyle Binyıl Anıtı.",hist:"Meydan 1896'daki binyıl kutlamaları için yapıldı. Ortadaki sütunun dibinde, 896'da Macarları Karpat havzasına getiren Arpad ve diğer altı boy beyi atları üzerinde durur. Arkadaki yarım daire sütun dizisinde Macar krallarının ve devlet adamlarının heykelleri vardır.",why:"Andrássy Bulvarı'nın sonu, Városliget parkının girişi.",dur:"20 dk",fee:"Ücretsiz",hours:"Her zaman açık"},
    {id:"bu_vajdahunyad",cat:"hist",name:"Vajdahunyad Kalesi",wiki:"Vajdahunyad_Castle",lat:47.5148896,lon:19.0830593,pid:"ChIJoaLtEYfbQUcRjp9d1Wfk97w",desc:"Gölün kenarında masal şatosu. Aslında farklı Macar binalarının kopyalarından yapılmış bir koleksiyon.",hist:"Kale 1896 binyıl sergisi için önce karton ve ahşaptan geçici olarak yapıldı. O kadar sevildi ki 1904-1908 arasında taştan kalıcı hâli yapıldı. Romanesk, Gotik, Rönesans ve barok kanatları, Macaristan'ın farklı yerlerindeki ünlü binaların kopyalarıdır; en büyük parçası Transilvanya'daki Hunyad Kalesi'nden esinlenir. İçinde Tarım Müzesi var.",why:"Kahramanlar Meydanı ile Széchenyi Hamamı arasında, avlusu ücretsiz.",dur:"30 dk",fee:"Avlu ücretsiz, müze ücretli",hours:"Müze Sal-Paz 10:00-17:00, Pazartesi kapalı"},
    {id:"bu_szechenyi",cat:"hist",name:"Széchenyi Hamamı",wiki:"Széchenyi_thermal_bath",lat:47.5186568,lon:19.0823791,pid:"ChIJd1VnBYbbQUcREiSNtgjDwMs",desc:"Sarı neo-barok binada açık hava termal havuzları. Avrupa'nın en büyük hamamlarından.",hist:"Hamam 1913'te açıldı. Budapeşte'nin altında 100'den fazla sıcak su kaynağı vardır; şehir bu yüzden kendini Kaplıcalar Şehri diye tanıtır. Széchenyi'nin suyu 1.200 metre derinlikteki bir kuyudan gelir. Açık havadaki 38 derecelik havuzda kışın bile insanlar satranç oynar.",why:"Budapeşte'nin simgesi; açık havada sıcak su deneyimi. Yorumlar bakım konusunda karışık.",dur:"3 sa",fee:"Günlük bilet yaklaşık €35-50 (yorumlardan)",hours:"Pzt-Per 07:00-20:00, Cum 07:00-22:00, Cmt-Paz 08:00-20:00",tip:"Havlu ve terlik götür, kirası pahalı. Sabah erken git."},
    {id:"bu_muzeum",cat:"hist",name:"Macar Ulusal Müzesi",wiki:"Hungarian_National_Museum",lat:47.4911983,lon:19.0624765,pid:"ChIJU67wUVvcQUcReF8LOW-Dfck",desc:"1848 devriminin başladığı merdivenleriyle neo-klasik müze.",hist:"Müze 1802'de kuruldu, bugünkü bina 1847'de açıldı. 15 Mart 1848'de şair Sándor Petőfi'nin bu merdivenlerde Ulusal Şarkı'yı okuduğu ve Habsburglara karşı devrimin başladığı anlatılır. İçeride Macar tarihi baştan sona anlatılır; Osmanlı dönemi bölümü de vardır.",why:"Macar tarihini, Osmanlı dönemi dahil, tek binada görmek için.",dur:"2 sa",fee:"Ücretli",hours:"Sal-Paz 10:00-18:00, Pazartesi kapalı"},
    {id:"bu_szabadsag",cat:"hist",name:"Özgürlük Meydanı (Szabadság tér)",wiki:"de:Szabadság tér (Budapest)",lat:47.5038733,lon:19.0505153,pid:"ChIJU38IeRTcQUcRgS7iEqdG_U8",desc:"Sovyet anıtı, Reagan heykeli ve tartışmalı işgal anıtı aynı meydanda.",hist:"Meydanda Macaristan'ın 20. yüzyılı yan yana durur: 1945'te Budapeşte'yi alan Sovyet askerlerinin anıtı, Soğuk Savaş'ı bitirenlerden sayılan Ronald Reagan'ın heykeli ve 2014'te dikilen, Almanya'nın 1944 işgalini anlatan tartışmalı anıt. Karşısına vatandaşlar kendi fotoğraf ve mektuplarıyla bir karşı anıt kurdu.",why:"Parlamento ile Bazilika arasında, yakın tarih için kısa bir durak.",dur:"15 dk",fee:"Ücretsiz",hours:"Her zaman açık"},

    {id:"bu_margit",cat:"park",name:"Margit Adası",wiki:"Margaret_Island",lat:47.5352585,lon:19.0521108,pid:"ChIJt4RCaOHbQUcRvibhTk8TU3s",desc:"Tuna'nın ortasında 2,5 km'lik araba girmeyen park adası. Müzikli kuyu ve fıskiyeler.",hist:"Ada adını, burada yaşayan Kral IV. Béla'nın kızı Prenses Margit'ten alır. Moğol istilasından kurtulursa kızını Tanrı'ya adayacağına söz veren kral onu adadaki manastıra verdi. Ada bugün Budapeşte'nin akciğeri: koşu yolu, Japon bahçesi, müzikli fıskiye ve kuzeyde saat başı Macar ezgileri çalan müzikli kuyu.",why:"Şehirden bir saat kaçmak için. Margit Köprüsü'nden yürüyerek girilir.",dur:"1 sa 30 dk",fee:"Ücretsiz",hours:"Her zaman açık"},
