    places:[
      /* ================= TARİHİ ================= */
      {id:"u_dom",cat:"hist",name:"Domtoren (Dom Kulesi)",wiki:"Dom_Tower_of_Utrecht",lat:52.0908254,lon:5.1213254,pid:"ChIJgf7hSkVvxkcRNQQW-7nl0T8",desc:"Hollanda'nın en yüksek kilise kulesi, 112 metre. Şehrin her yerinden görünür, Utrecht'te kaybolursan ona bak.",hist:"Kule 1321'de başladı, 1382'de bitti. Utrecht o dönem Kuzey Hollanda'nın dini başkentiydi ve piskoposun katedrali bütün bölgeye gücünü göstermeliydi. Tasarımı Hainautlu Jan'a (Jan van Henegouwen) atfedilir. O zamanın vaizlerinden Geert Groote kuleyi fazla yüksek, fazla pahalı ve gösterişçi bulup eleştirmişti.\n\nKule bir zamanlar katedralin batı ucuydu, kiliseyle arasındaki nef 1 Ağustos 1674 gecesi bir kasırgada çöktü ve bir daha yapılmadı. O günden beri kule kilisenin karşısında tek başına durur. Arada açılan boşluk bugünkü Domplein'dır.\n\nTepeye 465 basamak çıkılır. İçeride toplam ağırlığı 32 tonu bulan 14 çan var, en büyüğü Salvator yaklaşık 8 ton. Havanın açık olduğu günlerde tepeden Amsterdam ve Rotterdam görünür.",why:"Utrecht'in simgesi. Çıkmasan da altından geçmek şart.",dur:"1 sa",fee:null,hours:"Her gün 10:00-17:00",tip:"Kuleye yalnızca rehberli turla çıkılıyor. Bileti kulenin yanındaki ofisten ya da internetten saatli al. Tur üç molalı, son kısım çok dar merdiven."},
      {id:"u_domkerk",cat:"hist",name:"Domkerk (Dom Kilisesi)",wiki:"St._Martin's_Cathedral,_Utrecht",lat:52.0909146,lon:5.1222327,pid:"ChIJ1YcENUVvxkcRF6Woa2FQZYU",desc:"Kulenin karşısındaki gotik katedral. Bugün gördüğün kısım, 1674'te nefi yıkılan dev kilisenin ayakta kalan koro ve transept bölümü.",hist:"Bu noktada 7. yüzyıldan beri kilise var. Gotik katedral 1254'te başladı ve yaklaşık 270 yıl sürdü. Para bitince nefin üst kısmı aceleyle ve zayıf payandalarla tamamlandı. 1674 kasırgası tam bu zayıf bölümü yıktı: kule ve koro ayakta kaldı, ortası çöktü.\n\n1580'de Utrecht Protestanlığa geçince kilise Kalvinistlere verildi, heykel ve resimlerin çoğu söküldü ya da tahrip edildi. Duvarlardaki başı kesilmiş kabartmalar o günlerden kalmadır. Bugün Hollanda Protestan Kilisesi'ne ait ve ziyaret ücretsiz.",why:"Ücretsiz ve içi ferah. Kuleye çıkmasan bile mutlaka gir.",dur:"30 dk",fee:"Ücretsiz (bağış kabul ediliyor)",hours:"Pzt-Cum 10:00-17:00, Cmt 10:00-15:15, Paz 12:30-16:00",tip:"Cumartesi öğleden sonraları yerel halkın çok sevdiği ücretsiz konser oluyor (ziyaretçi yorumundan)."},
      {id:"u_pandhof",cat:"hist",name:"Pandhof",wiki:"St._Martin's_Cathedral,_Utrecht",gen:1,lat:52.0905308,lon:5.122583,pid:"ChIJM1Oyq1pvxkcR7k4195pnIJs",desc:"Dom Kilisesi ile üniversite binası arasında saklı gotik avlu ve bahçe. Kapıdan girer girmez şehrin gürültüsü kesilir.",hist:"Pandhof katedralin manastır avlusudur, 14. yüzyıl sonunda yapıldı. Rahipler kemerli koridorlarda dua ederek dolaşır, ortadaki bahçede şifalı otlar yetiştirirdi. Bugün bahçede yine ortaçağdan bilinen tıbbi bitkiler var.\n\nKemerlerin üstündeki üçgen panellerde Utrecht'in koruyucu azizi Aziz Martin'in hayatından sahneler oyulmuştur. Martin, pelerinini ikiye bölüp bir dilenciyle paylaşan Romalı askerdir.",why:"Beş dakikalık sessizlik, ücretsiz. Fotoğraf için çok güzel.",dur:"15 dk",fee:"Ücretsiz",hours:"Her gün 10:00-16:00"},
      {id:"u_domunder",cat:"hist",name:"DOMunder",wiki:"Domplein",gen:1,lat:52.0908175,lon:5.1216784,pid:"ChIJoRQHFnZUZUERULgFeNykcqQ",desc:"Domplein'ın altına inilen rehberli tur. Elinde fenerle Roma kalesinin ve yıkılan katedralin kalıntılarını arıyorsun.",hist:"Utrecht'in hikâyesi bu meydanın altında başlar. Romalılar yaklaşık MS 50'de Ren kıyısına Traiectum adında küçük bir ahşap kale kurdu. Ren o zaman Roma İmparatorluğu'nun kuzey sınırıydı ve kale bir geçit noktasını koruyordu. Şehrin adı da buradan gelir: Traiectum zamanla \"Uut-Trecht\", sonra Utrecht oldu.\n\nKale terk edildikten sonra yerine kiliseler yapıldı, sonra dev katedral. 1674'te çöken nefin temelleri de bu toprağın altında. Meydanın yüzeyinde Roma kalesinin duvar hattını gösteren işaretler vardır, yürürken yere bak.",why:"Dom'un hikâyesini en iyi anlatan tur. Yorumlara göre beklentiyi aşıyor.",dur:"1 sa 15 dk",fee:null,hours:"Her gün 10:00-17:00 (tur saatleri belli)",tip:"Tur 75 dakika, ilk yarım saati yer üstünde anlatım. İngilizce tur saatini önceden kontrol et."},
      {id:"u_academie",cat:"hist",name:"Academiegebouw (Üniversite Binası)",wiki:"Utrecht_University",gen:1,lat:52.090237,lon:5.122578,pid:"ChIJoWoiLHVvxkcRuoNuMDjZr4E",desc:"Domplein'ın güney yanındaki görkemli üniversite binası. Hollanda Cumhuriyeti'nin doğduğu salon bu binanın içinde.",hist:"Utrecht Üniversitesi 1636'da kuruldu. Bugünkü cephe 19. yüzyılın sonunda yapıldı, ama binanın arka kısmı katedralin ortaçağdan kalma kapitel salonudur.\n\n1579'da kuzeydeki eyaletler İspanya'ya karşı birlik olmak için Utrecht Birliği'ni (Unie van Utrecht) bu salonda imzaladı. Bu antlaşma bugünkü Hollanda devletinin başlangıcı sayılır. Bugün salonda doktora savunmaları ve törenler yapılır.",why:"Dışarıdan bak, Pandhof'un çıkışında zaten önünden geçiyorsun.",dur:"10 dk",fee:"Dışarıdan ücretsiz",hours:"İç mekân genelde ziyarete kapalı",tip:"Hafta içi kapı açık olsa bile içeri girmek için izin gerekiyor (ziyaretçi yorumundan)."},
      {id:"u_paushuize",cat:"hist",name:"Paushuize (Papa Evi)",wiki:"Paushuize",lat:52.0903861,lon:5.1241417,pid:"ChIJQ0b2HlBvxkcRSlRETIZ9mDg",desc:"Kromme Nieuwegracht kıyısında, tek Hollandalı papa için yapılmış ev.",hist:"Utrechtli Adriaan Florenszoon Boeyens, gençliğinde geleceğin İmparatoru Şarlken'in hocasıydı. 1517'de emekliliğinde yaşamak için bu evi yaptırmaya başladı. Ama 1522'de papa seçildi ve VI. Adrianus adıyla Roma'ya gitti. Bir yıl sonra orada öldü ve evini hiç görmedi.\n\nAdrianus, 1978'de II. Ioannes Paulus seçilene kadar İtalyan olmayan son papaydı. Ev bugün Utrecht eyaletinin resmi kabul binası, içi yalnızca rehberli turlarla geziliyor.",why:"Kromme Nieuwegracht yürüyüşünde önünden geçersin.",dur:"10 dk",fee:"Dışarıdan ücretsiz",hours:"İçi yalnızca rehberli turla",tip:"Rehberli tur için turizm ofisine sor."},
      {id:"u_pieterskerk",cat:"hist",name:"Pieterskerk",wiki:"Pieterskerk,_Utrecht",lat:52.0914501,lon:5.1244639,pid:"ChIJb4aN6E9vxkcR8GtkP_xBMSc",desc:"Utrecht'in ayakta kalan en eski kilisesi. Romanesk sütunları ve kriptası 11. yüzyıldan.",hist:"11. yüzyılda Piskopos Bernold, Dom'un çevresine haç şeklinde dört kilise yaptırdı. Kuzeyde Janskerk, doğuda bu Pieterskerk, batıda Mariakerk ve güneyde Paulus Manastırı. Haritada çizgi çekersen ortası Dom'a düşer. Bu düzene \"kerkenkruis\" (kiliseler haçı) denir. Dördünden bugün yalnızca Pieterskerk ve Janskerk ayakta.\n\nPieterskerk 1048'de kutsandı. Kalın taş sütunları ve kemerleri Hollanda'da az kalmış Romanesk mimari örneklerindendir. 17. yüzyıldan beri Fransızca konuşan Valon Protestan cemaatinin kilisesi; Fransa'dan kaçan Huguenotlar burada ibadet etti.",why:"Dom kalabalığından iki sokak ötede, gerçekten bin yaşında bir iç mekân.",dur:"20 dk",fee:null,hours:null,tip:"Açılış saatleri değişken, gitmeden Google Maps'ten bak."},
      {id:"u_janskerk",cat:"hist",name:"Janskerk",wiki:"Janskerk_(Utrecht)",gen:1,lat:52.0932605,lon:5.1214765,pid:"ChIJgScEC0VvxkcR5wj44PSIaNk",desc:"Ağaçlı Janskerkhof meydanındaki kilise. Cumartesi meydanı çiçek pazarı kaplar.",hist:"Janskerk, Piskopos Bernold'un kiliseler haçının kuzey koludur ve 11. yüzyılda kuruldu. Sonraki yüzyıllarda gotik koro eklendi. Reformdan sonra bir dönem üniversite kütüphanesi olarak da kullanıldı.\n\nKilisenin önünde Anne Frank heykeli var. Meydanın çevresi bugün üniversite binaları ve öğrenci kafeleriyle dolu.",why:"Cumartesi çiçek pazarı için git, kilise dışarıdan yeter.",dur:"10 dk",fee:"Dışarıdan ücretsiz",hours:"İç mekân yenileme nedeniyle ziyarete kapalı (ziyaretçi yorumundan)",tip:"Cumartesi meydanda çiçek pazarı kuruluyor."},
      {id:"u_speelklok",cat:"hist",name:"Museum Speelklok",wiki:"Museum_Speelklok",lat:52.0908267,lon:5.1195937,pid:"ChIJi_joKltvxkcRXXh-E9QA1ZU",desc:"Ortaçağdan kalma Buurkerk'in içinde kendi kendine çalan müzik aletleri müzesi: laterna, müzik kutusu, dev dans orgları.",hist:"Buurkerk, Utrecht'in en eski mahalle (buurt) kilisesidir. Dom piskoposun kilisesiyken burası sıradan halkın kilisesiydi. Bugün içinde 18. yüzyıldan 20. yüzyıla kadar yapılmış otomatik müzik aletleri sergileniyor.\n\nHollanda sokaklarında hâlâ görebileceğin büyük, süslü laternalar (draaiorgel) buranın uzmanlık alanıdır. Rehberli turda aletler gerçekten çalıştırılıyor.",why:"Yorumlara göre her yaşa hitap eden, beklenenden çok daha keyifli bir müze.",dur:"1 sa 30 dk",fee:"Yaklaşık €17 (ziyaretçi yorumundan, doğrula)",hours:"Her gün 10:00-17:00",tip:"Rehberli turu kaçırma, aletleri o zaman çalıştırıyorlar."},
      {id:"u_oudaen",cat:"hist",name:"Stadskasteel Oudaen",wiki:"Oudaen",gen:1,lat:52.0928674,lon:5.116691,pid:"ChIJWxOEnURvxkcRvlE0JbI2exI",desc:"Oudegracht kıyısında, ortaçağdan kalma bir şehir şatosu. Bugün içinde kendi birasını yapan bir restoran var.",hist:"Ortaçağda Utrecht'in zengin aileleri kanal kıyısına \"stadskasteel\" denen, kule gibi yüksek ve taş evler yaptırırdı. Hem güç gösterisiydi hem de şehir içindeki kavgalara karşı korunmanın yoluydu. Oudaen bu evlerin en iyi korunmuş örneklerinden biri ve 13. yüzyıla dayanır.\n\nKanal tarafındaki mahzen katı doğrudan suya açılır. Bugün içi restoran, bira fabrikası ve toplantı salonu.",why:"Oudegracht yürüyüşünde dışarıdan bakmalık. İçeride bira tadımı da yapılabilir.",dur:"10 dk",fee:"Dışarıdan ücretsiz",hours:"Restoran her gün, yaklaşık 10:00-22:30"},
      {id:"u_catharijne",cat:"hist",name:"Museum Catharijneconvent",wiki:"Museum_Catharijneconvent",lat:52.0872889,lon:5.1239194,pid:"ChIJrZtH7VBvxkcR4NrImVuDYC8",desc:"Eski bir manastırda, Hollanda'da Hristiyanlık tarihini ve ortaçağ dini sanatını anlatan müze.",hist:"Bina 15. yüzyılda Kudüs'teki Aziz Yahya Şövalyeleri'nin (Johanniterler) manastırıydı. Yanındaki Catharijnekerk bugün Utrecht'in Katolik katedrali.\n\nMüzenin bodrumundaki hazine odasında ortaçağdan kalma altın kadehler, işlemeli piskopos giysileri ve el yazmaları var. Yorumlara göre açıklamaların çoğu Felemenkçe, sesli rehber istemek iyi olur.",why:"Ortaçağ sanatına meraklıysan. Değilsen dışarıdan bakmak yeter.",dur:"1 sa 30 dk",fee:null,hours:"Sal-Cum 10:00-17:00, hafta sonu 11:00-17:00, Pazartesi kapalı"},
      {id:"u_centraal",cat:"hist",name:"Centraal Museum",wiki:"Centraal_Museum",lat:52.083748,lon:5.12591,pid:"ChIJ30TWwVZvxkcRl1x9CXB9YcI",desc:"Eski bir manastır kompleksinde şehir müzesi: Utrecht Karavaggiocuları, 1000 yıllık Utrecht gemisi, Rietveld mobilyaları ve Dick Bruna'nın atölyesi.",hist:"Müze 1838'de kuruldu ve Hollanda'nın en eski belediye müzesi sayılır. Agnietenklooster adlı eski bir rahibe manastırına yerleşmiştir.\n\nEn çok konuşulan parçası, 1930'da şehirde kazı sırasında bulunan ve yaklaşık bin yıllık olan Utrecht gemisidir. 17. yüzyılda Roma'da Caravaggio'dan etkilenip dönen Utrechtli ressamların (Honthorst, Ter Brugghen) eserleri de burada. Bir bölümde Miffy'nin yaratıcısı Dick Bruna'nın atölyesi olduğu gibi kurulmuş.",why:"Utrecht'i tek binada anlatan müze. Rietveld evinin bileti de buradan.",dur:"1 sa 30 dk",fee:null,hours:"Sal-Paz 11:00-17:00, Pazartesi kapalı"},
      {id:"u_nijntje",cat:"hist",name:"Nijntje Museum (Miffy Müzesi)",wiki:"Miffy",gen:1,lat:52.0838688,lon:5.125625,pid:"ChIJwwY26FZvxkcRmHlnni0UfX8",desc:"Miffy'nin (Nijntje) müzesi. Asıl hedef kitlesi küçük çocuklar; yetişkinler için hızlı bir tur ve dükkân.",hist:"Miffy, Utrechtli çizer Dick Bruna'nın 1955'te yarattığı küçük tavşandır. Felemenkçe adı Nijntje. Bruna bütün hayatını Utrecht'te geçirdi ve 2017'de burada öldü. Kitaplar 50'den fazla dile çevrildi.\n\nMüze tamamen çocuk boyunda tasarlandı. Yorumlara göre yetişkinler için 20-30 dakika yeterli; karşıdaki Centraal Museum dükkânında Miffy ürünleri şehirdeki diğer dükkânlardan daha uygun.",why:"Utrecht'in en sevilen sembolü. Hızlı bir uğrama.",dur:"30 dk",fee:null,hours:"Sal-Paz 10:00-17:00, Pazartesi kapalı",tip:"Yetişkinler için 15:00'ten sonra gitmek öneriliyor, çocuk kalabalığı azalıyor."},
      {id:"u_sonnenborgh",cat:"hist",name:"Sonnenborgh Gözlemevi",wiki:"Sonnenborgh",lat:52.085383,lon:5.1292032,pid:"ChIJ3eLj-VNvxkcRvVGnkrg9WlI",desc:"16. yüzyıldan kalma bir surun burcunun üstüne kurulmuş gözlemevi ve müze, Zocherpark'ın içinde.",hist:"Sonnenborgh, 16. yüzyılın ortasında şehri savunmak için yapılan bir burçtur. 1853'te üniversite burcun üstüne gözlemevi kurdu. Bir yıl sonra meteorolog Buys Ballot, Hollanda'nın ulusal meteoroloji enstitüsü KNMI'yi burada kurdu; enstitü sonradan De Bilt'e taşındı.\n\nBugün müzede eski teleskoplar, güneş gözlemi ve Hollanda'nın astronomiye katkıları anlatılıyor. Burcun altındaki eski top galerisi de gezilebiliyor.",why:"Sakin, turistsiz ve parkın içinde. Güneşli pazarlarda teleskopla güneşe bakılabiliyor.",dur:"1 sa",fee:null,hours:"Sal-Cum 11:00-17:00 (Per akşam da açık), hafta sonu 13:00-17:00, Pazartesi kapalı"},
      {id:"u_spoorweg",cat:"hist",name:"Spoorwegmuseum (Demiryolu Müzesi)",wiki:"Spoorwegmuseum",lat:52.0879257,lon:5.1311934,pid:"ChIJlzLgSVJvxkcRR16e-9yzpYA",desc:"Eski Maliebaan istasyonunda Hollanda'nın ulusal demiryolu müzesi. Buharlı lokomotifler, kraliyet vagonları, döner platform.",hist:"Müze 19. yüzyıldan kalma Maliebaan istasyon binasında. Utrecht ülkenin tam ortasında olduğu için demiryolları başından beri buradan yönetildi. Hollanda demiryolu şirketi NS'nin merkezi bugün de Utrecht'tedir.\n\nİçeride ülkenin ilk lokomotifi De Arend'in kopyası, kraliyet ailesinin eski vagonları ve çalışan bir döner platform var.",why:"Google'da şehrin en çok yorum alan müzesi. Çocuk ya da tren meraklısı değilsen bile keyifli.",dur:"2-3 sa",fee:null,hours:"Her gün 10:00-17:00",tip:"Merkezden 15-20 dakika yürüme. Yakındaki SAB. Broodjes ile öğle yemeğini birleştir."},
      {id:"u_bartholomeus",cat:"hist",name:"Bartholomeus Gasthuis",wiki:"Bartholomeusgasthuis",gen:1,lat:52.0855186,lon:5.1199272,pid:"ChIJuZ7BiVlvxkcRs8Pr2Grquoo",desc:"Ortaçağdan beri aynı işi yapan bir bakımevi. Avlusu, bahçesi ve uygun fiyatlı brasserisi ziyaretçilere açık.",hist:"Gasthuis, ortaçağda yaşlıların, hastaların ve yolcuların bakıldığı hayır kurumudur. Bartholomeus 14. yüzyılda kuruldu ve yüzyıllardır aynı yerde aynı amaçla çalışıyor; bugün de bir bakım ve iyileşme merkezi.\n\nİçerideki Brasserie Zunte ve bahçe herkese açık. Yorumlara göre şehir merkezinde beklenmeyecek kadar uygun fiyatlı.",why:"Şehrin saklı köşelerinden. Kahve ya da öğle yemeği molasına uygun.",dur:"20 dk",fee:"Ücretsiz",hours:"Her gün 08:30-20:00",tip:"Burası bir bakımevi; sakin ol, sakinlerin fotoğrafını çekme."},
      /* ================= MİMARİ ================= */
      {id:"u_rietveld",cat:"arch",name:"Rietveld Schröderhuis",wiki:"Rietveld_Schröder_House",lat:52.0853216,lon:5.1475553,pid:"ChIJ7_vH9qVoxkcRCe6nL5FRYJQ",desc:"1924'te Gerrit Rietveld'in tasarladığı De Stijl evi. UNESCO Dünya Mirası.",hist:"Dul Truus Schröder çocuklarıyla yaşayacağı, alışılmışın dışında bir ev istedi. Mobilya ustası Gerrit Rietveld ile birlikte tasarladılar. Sonuç, Mondrian'ın tablolarındaki gibi yalnızca düz yüzeyler, ana renkler (kırmızı, sarı, mavi) ve siyah beyazdan oluşan bir evdi.\n\nÜst kat neredeyse tek bir odadır: kayar paneller çekilince yatak odalarına bölünür, açılınca kocaman bir yaşam alanı olur. Ev yapıldığında sokağın sonunda tarla vardı. 2000'de UNESCO Dünya Mirası listesine girdi.",why:"Mimarlık tarihinin en ünlü evlerinden. İçini görmek için bilet şart.",dur:"1 sa",fee:null,hours:"Sal-Paz 11:00-16:00, Pazartesi kapalı",tip:"Giriş saatli ve sesli rehberli. Bileti Centraal Museum üzerinden önceden al."},
      {id:"u_fiets",cat:"arch",name:"Stationsplein Bisiklet Otoparkı",wiki:"Utrecht_Centraal_station",gen:1,lat:52.0911977,lon:5.110556,pid:"ChIJodthTV1vxkcR_aOPrFFcwAs",desc:"Dünyanın en büyük bisiklet otoparkı: 12.500 bisiklet, üç kat, içinde bisiklet yolları.",hist:"Utrecht Centraal ülkenin en işlek tren istasyonudur ve yolcuların büyük kısmı istasyona bisikletle gelir. Belediye bunun için garın önündeki meydanın altına üç katlı bir otopark yaptı. Son bölüm 19 Ağustos 2019'da açıldı ve 30 milyon eurodan fazlaya mal oldu.\n\nİçeride bisikletinle sürerek boş yere gidersin; her sıranın üstündeki ışıklı tabela kaç boş yer kaldığını gösterir. İlk 24 saat ücretsizdir.",why:"Hollanda'nın bisiklet kültürünü en çarpıcı gösteren yer. Turistlerin çoğu kaçırıyor.",dur:"15 dk",fee:"Bakmak ücretsiz",hours:"Her zaman açık"},
      {id:"u_tivoli",cat:"arch",name:"TivoliVredenburg",wiki:"TivoliVredenburg",lat:52.0924298,lon:5.1128171,pid:"ChIJZVoL6EJvxkcRtj7MXDv3c8s",desc:"Beş konser salonunun üst üste dizildiği müzik binası. Pop konserinden klasik müziğe her akşam bir şey var.",hist:"Bina 2014'te açıldı. Utrecht'in iki müzik kurumu, pop kulübü Tivoli ile klasik konser salonu Vredenburg, tek çatı altında birleşti. Her salonu farklı bir mimar tasarladı ve salonlar kutular gibi üst üste kondu; aralarındaki merdivenler ve teraslar bir dikey sokak gibi.\n\nYorumlara göre ses kalitesi ve salonların sahneye yakınlığı çok iyi.",why:"Akşam programına bak, uygun fiyatlı bir konser yakalayabilirsin.",dur:"15 dk",fee:"Dışarıdan ücretsiz",hours:null,tip:"Konser takvimi ve bilet fiyatları resmi sitede."},
      {id:"u_neude",cat:"arch",name:"Bibliotheek Neude (Eski Postane)",wiki:"Neude",gen:1,lat:52.0930912,lon:5.118041,pid:"ChIJ6wUC1ahvxkcRYUe-5GRNPD0",desc:"Amsterdam Okulu tarzında tuğla postane, bugün halk kütüphanesi. Ana salonun parabolik tavanı görülmeye değer.",hist:"Bina 1924'te şehrin ana postanesi olarak açıldı, mimarı Joseph Crouwel'di. Amsterdam Okulu'nun tuğla süslemeleri ve ana salonun yüksek, kemerli cam tavanı dönemin en gösterişli kamu binalarından biri yaptı.\n\nPostane 2011'de kapandı. Belediye binayı yıkmak yerine kütüphaneye çevirdi ve 2020'de açtı. Ziyaretçi yorumları burayı bir kütüphaneden çok mahalle merkezi gibi anlatıyor.",why:"Ücretsiz, sıcak ve kuru. Yağmurda mola için birebir.",dur:"15 dk",fee:"Ücretsiz",hours:"Pzt-Cmt 09:00-21:00, Paz 10:00-18:00"},
      /* ================= PARK ================= */
      {id:"u_zocher",cat:"park",name:"Zocherpark (Singel)",wiki:"Singel_(Utrecht)",gen:1,lat:52.0886009,lon:5.1278539,pid:"ChIJs2Lp6FpvxkcRtwqaivYVBzQ",desc:"Eski şehir hendeği boyunca uzanan şerit park. Yaşlı çınarlar, ginkgo ve sekoya ağaçları.",hist:"Singel, ortaçağ Utrecht'ini çevreleyen savunma hendeğidir. 19. yüzyılda surlar artık işe yaramayınca yıkıldı ve peyzaj mimarı Jan David Zocher hendek boyunca İngiliz bahçesi tarzında bir park tasarladı. Eski burçlar ağaçlı tepelere dönüştü; Sonnenborgh bunlardan biridir.\n\nPark bugün hendeğin doğu ve güney kıyısını takip eder. Bisiklete kapalı olduğu için yürüyüşe çok uygun.",why:"Müze mahallesinden Spoorwegmuseum'a giderken en güzel yol.",dur:"30 dk",fee:"Ücretsiz",hours:"Her zaman açık"},
      {id:"u_hortus",cat:"park",name:"Oude Hortus (Eski Botanik Bahçesi)",wiki:"Utrecht_University_Botanic_Gardens",gen:1,lat:52.084843,lon:5.125769,pid:"ChIJi3mu0VZvxkcR1XUwZPuqBMI",desc:"Müze mahallesinin ortasında, seralarıyla küçük ve sakin bir üniversite botanik bahçesi.",hist:"Utrecht Üniversitesi'nin tıp öğrencileri için şifalı bitki yetiştirdiği bahçedir ve 18. yüzyılın başından beri bu konumdadır. Ana bahçe sonradan şehrin dışına taşındı, burası \"eski bahçe\" olarak kaldı.\n\nSeralardan birinde Hollanda'nın en yaşlı ağaçlarından sayılan bir sagu palmiyesi (cycas) bulunduğu anlatılır. Yanında üniversite müzesi var.",why:"Kalabalıktan kaçmak için. Kafesi de iyi.",dur:"45 dk",fee:"Yaklaşık €5, yalnızca kart (ziyaretçi yorumundan)",hours:"Sal-Paz 10:00-17:00, Pazartesi kapalı"},
      {id:"u_wilhelmina",cat:"park",name:"Wilhelminapark",wiki:"Wilhelminapark_(Utrecht)",gen:1,lat:52.0885152,lon:5.1390991,pid:"ChIJv5Vspa1oxkcRw1rZtrE4C60",desc:"Doğudaki villa mahallesinin ortasında göllü, geniş bir park. Rietveld evine giderken yolun üstünde.",hist:"19. yüzyılın sonunda, surların dışında zenginler için villa mahallesi kurulurken parkın ortasına yapıldı. Adını Kraliçe Wilhelmina'dan alır.\n\nÇevresindeki sokaklar Utrecht'in en şık villalarıyla doludur.",why:"Rietveld'e yürürken mola yeri.",dur:"30 dk",fee:"Ücretsiz",hours:"Her zaman açık"},
      {id:"u_griftpark",cat:"park",name:"Griftpark",wiki:"Griftpark",gen:1,lat:52.0991848,lon:5.128452,pid:"ChIJFRF0JEhvxkcRzAOOBqB6Ve4",desc:"Merkezin kuzeydoğusunda mahallelinin parkı: hayvan çiftliği, sebze bahçeleri, kaykay parkı ve kafe.",hist:"Park eski bir gaz fabrikasının arazisine kuruldu. Fabrika kapandıktan sonra toprak ağır biçimde kirli çıktı ve yıllarca süren bir temizlik projesinden sonra park olarak açıldı. Bugün yerel halkın en sevdiği parklardan biri.",why:"Turist rotasının dışında, gerçek Utrecht hayatını görmek için.",dur:"45 dk",fee:"Ücretsiz",hours:"Her zaman açık"},
      /* ================= FOTO NOKTALARI ================= */
      {id:"u_oudegracht",cat:"photo",name:"Oudegracht Werfleri",wiki:"Oudegracht",lat:52.0895354,lon:5.120886,pid:"ChIJC7Lm5FpvxkcR_GDbpi-FzVk",desc:"Utrecht'e özgü iki katlı kanal: sokak yukarıda, kafeler ve restoranlar aşağıda, suyun hemen kıyısında.",hist:"Oudegracht, Ren'in eski bir kolunun kanala çevrilmesiyle oluştu. Ortaçağda tüccarlar malları teknelerden doğrudan su seviyesindeki rıhtıma (werf) indirdi ve sokağın altına oyulmuş mahzenlerde sakladı. Sokak bu mahzenlerin tavanının üstünden geçer.\n\nBu yapı dünyada nadirdir. Bugün eski depoların çoğu kafe, restoran ve dükkân; yazın rıhtım masalarla dolar.",why:"Utrecht'in en ikonik fotoğrafı. Rıhtıma inen merdivenlerden aşağı in.",dur:"30 dk",fee:"Ücretsiz",hours:"Her zaman açık",tip:"En güzel kare Gaardbrug ve Bezembrug arasından, kule arkada."},
      {id:"u_miffy",cat:"photo",name:"Miffy Trafik Lambası",wiki:"Miffy",gen:1,lat:52.0931011,lon:5.1149599,pid:"ChIJo3G_qXdvxkcRlWTBb7p-UJQ",desc:"Vredenburg'daki yaya geçidinde ışıkta adam yerine Miffy yanıyor. Geçit gökkuşağı renkli.",hist:"Dick Bruna'nın memleketinde, onun en ünlü karakterine küçük bir saygı. Kırmızıda Miffy duruyor, yeşilde yürüyor. Turistler doğru ışığı yakalamak için geçidi defalarca karşıdan karşıya geçer.",why:"İki dakikalık eğlenceli bir kare.",dur:"5 dk",fee:"Ücretsiz",hours:"Her zaman"},
      {id:"u_kromme",cat:"photo",name:"Kromme Nieuwegracht",wiki:"Kromme_Nieuwegracht",gen:1,lat:52.0937732,lon:5.1232513,pid:"ChIJK0TEwk9vxkcR3NKRV9345a4",desc:"Her evin kendi küçük köprüsüyle kanala bağlandığı kavisli, sakin kanal.",hist:"Kanalın kıyısındaki evlerin çoğunun önünde kendi özel köprüsü vardır, bu yüzden kanal boyunca onlarca küçük köprü dizilir. Paushuize ve Pieterskerk bu kanalın üstündedir. Sonbaharda ağaçların rengiyle şehrin en güzel köşelerinden biri olur.",why:"Oudegracht'ın sakin, turistsiz kardeşi.",dur:"15 dk",fee:"Ücretsiz",hours:"Her zaman açık"},
      {id:"u_twijnstraat",cat:"photo",name:"Twijnstraat ve Tolsteegbrug",wiki:"Oudegracht",gen:1,lat:52.0827323,lon:5.1234164,pid:"ChIJS6uvCVdvxkcR-wSq7rPbldw",desc:"Oudegracht'ın güney ucunda küçük dükkânlı eski sokak ve kanala bakan köprü.",hist:"Twijnstraat'ın adının ortaçağda burada iplik büken (twijnen) zanaatkârlardan geldiği söylenir. Oudegracht'ın bu ucu merkezden daha sakindir; yerel dükkânlar, fırınlar ve kanal manzarası bir arada.",why:"Oudegracht rotasının bitişi, sakin bir son.",dur:"15 dk",fee:"Ücretsiz",hours:"Her zaman açık"},
      {id:"u_weerd",cat:"photo",name:"Bemuurde Weerd ve Weerdsluis",wiki:"Oudegracht",gen:1,lat:52.0974943,lon:5.1148896,pid:"ChIJ3ZhBckFvxkcR4DqiLe37h5c",desc:"Oudegracht'ın kuzey ucunda kanal kilidi ve sakin kıyılar.",hist:"Weerdsluis, Oudegracht'ın Vecht nehrine bağlandığı kanal kilididir. Tekneler buradan şehre girip çıkar. Kıyıdaki evler eski şehir surunun dışındaki ilk mahalledendir.",why:"Oudegracht rotasının başlangıcı. Turist neredeyse yok.",dur:"10 dk",fee:"Ücretsiz",hours:"Her zaman açık"},
      /* ================= KAHVE ================= */
      {id:"u_keen",cat:"coffee",name:"Keen Coffee Bar",lat:52.0925061,lon:5.1200664,pid:"ChIJUb38QgBvxkcRGDnBCoP44QY",price:"€",rating:4.6,rc:401,rdate:"17.10.2026",eat:"Geniş filtre kahve seçkisi (ör. Ruanda Baho), her kahveye köken kartı.",why:"Filtre kahvede şehrin en iddialısı. Ganzenmarkt'ta, Dom'a iki dakika.",hours:"Pzt-Cmt 08:30-18:00, Paz 09:00-18:00"},
      {id:"u_blackbird",cat:"coffee",name:"Blackbird Coffee",lat:52.0883558,lon:5.1217029,pid:"ChIJsaxth1pvxkcRCoMBlzDa4AA",price:"€",rating:4.8,rc:522,rdate:"17.10.2026",eat:"Flat white ve hamur işleri. Kanal kenarındaki taburelerde gerçek fincanla.",why:"Oudegracht'ın tam kıyısında küçük ve samimi.",hours:"Çar-Cmt 09:00-17:00, Paz 12:00-17:00, Pzt-Sal kapalı"},
      {id:"u_darras",cat:"coffee",name:"Darras Coffee Roasters",lat:52.091464,lon:5.1168719,pid:"ChIJK6y6RGlvxkcRUrV4u-W7a6o",price:"€",rating:4.8,rc:628,rdate:"17.10.2026",eat:"Kendi kavurduğu kahve, latte; falafel ve tavuk dürüm de iyi.",why:"Kahve ve hafif öğle yemeğini tek yerde.",hours:"Pzt-Cum 09:30-20:00, Cmt-Paz 10:00/11:00-20:30"},

  places:[
    /* ================= TARİHİ ================= */
    {id:"b_dom",cat:"hist",name:"Bamberger Dom (Bamberg Katedrali)",wiki:"Bamberg_Cathedral",lat:49.8907746,lon:10.882515,pid:"ChIJvTmYNBYjokcRwWcNRzrydwg",desc:"Domberg tepesinde dört kuleli, yeşil çatılı katedral. Bamberg'in her yerinden görünür.",hist:"Bamberg'in hikâyesi bir imparatorla başlar. Kutsal Roma-Germen İmparatoru II. Heinrich ve eşi Kunigunde, 1007'de Bamberg'i piskoposluk yaptı. Heinrich şehri imparatorluğun yeni merkezi, bir tür ikinci Roma olarak düşünüyordu. İlk katedral 1012'de kutsandı. Yangınlardan sonra bugünkü bina yapıldı ve 1237'de kutsandı. Bu yüzden içeride iki üslup yan yana durur: doğu yanı yuvarlak kemerli Romanesk, batı yanı sivri kemerli erken Gotik.\n\nİçerinin en ünlü heykeli Bamberger Reiter (Bamberg Atlısı). Yaklaşık 1230'da yapıldı ve Orta Çağ'dan beri ilk serbest duran büyük atlı heykellerden biri sayılır. Atlının kim olduğu bilinmiyor; bir kral, bir aziz ya da kıyamette gelecek kurtarıcı olabileceği tartışılır.\n\nNefin ortasında Heinrich ile Kunigunde'nin mermer mezarı var. Tilman Riemenschneider 1500-1513 arasında yaptı. Yan yüzlerdeki kabartmalardan birinde Kunigunde, sadakati sorgulanınca kızgın demirlerin üzerinde yürüyerek masumiyetini kanıtlar. Batı korosunda ise Papa II. Clemens yatar. Kendisi Bamberg piskoposuyken papa seçildi ve 1047'de öldü. Alpler'in kuzeyindeki tek papa mezarı budur.\n\nKuzeydeki Fürstenportal kapısında Kıyamet Günü sahnesi var. Kapının iki yanındaki Ecclesia ve Synagoga heykelleri dikkat çeker: gözü bağlı Synagoga, Orta Çağ'ın Yahudilere bakışını gösterir.",why:"Bamberg'in kalbi. Ücretsiz, içi büyük ve sakin. Atlı heykeli ve imparator mezarı için tek başına gelmeye değer.",dur:"45 dk",fee:"Ücretsiz",hours:"Pzt-Cmt yaklaşık 09:00-18:00 (Kasım-Mart 17:00'ye kadar), Paz 13:00-18:00; ayin sırasında gezilmez",tip:"Cumartesi 11:30-12:00 arası org konseri öncesi kapalı. Cumartesi öğlen org dinlemek istersen 12:00'de içeride ol."},
    {id:"b_rathaus",cat:"hist",name:"Altes Rathaus (Eski Belediye Binası)",wiki:"Bamberg_City_Hall",lat:49.8916449,lon:10.8868071,pid:"ChIJSR4exxYjokcR8Hgp7XBufDo",desc:"Regnitz nehrinin ortasında, iki köprünün üstüne oturtulmuş belediye binası. Cephesi baştan sona fresk.",hist:"Bamberg Orta Çağ'da ikiye bölünmüş bir şehirdi. Tepedeki Bergstadt piskoposa, nehrin öbür yanındaki Inselstadt ise tüccar ve zanaatkâr halka aitti. Anlatılana göre halk bir belediye binası istedi ama piskopos ona toprak vermedi. Bunun üzerine kentliler nehre kazık çakıp yapay bir ada yaptı ve binayı tam da iki tarafın sınırı olan suyun ortasına kurdu. Böylece belediye ne piskoposun ne de kimsenin toprağındaydı.\n\nBina ilk kez 14. yüzyılda anılır. 1460'larda Gotik olarak yeniden yapıldı, 1744-1756 arasında da bugünkü barok halini aldı. Duvarlardaki freskleri Johann Anwander çizdi. Doğu cephesine dikkatli bak: resimdeki bir meleğin bacağı duvardan dışarı, üç boyutlu bir taş olarak taşar.\n\nBinanın nehre sarkan yarı ahşap küçük bölümü Rottmeisterhäuschen'dir. Şehrin bekçi başı bir zamanlar burada otururdu. Bugün bu bölüm Bamberg'in en çok fotoğraflanan köşesidir.",why:"Bamberg'in simgesi. Altından geçen köprüden ve iki yandaki köprülerden fotoğraf çek.",dur:"20 dk",fee:"Dışarıdan ücretsiz",hours:"Köprü ve dış cephe her zaman açık. İçindeki porselen koleksiyonu (Sammlung Ludwig) şu an kapalı görünüyor.",tip:"En iyi açı: güneyde Geyerswörthsteg'den ve kuzeyde Untere Brücke'den."},
    {id:"b_residenz",cat:"hist",name:"Neue Residenz (Yeni Saray)",wiki:"de:Neue Residenz (Bamberg)",lat:49.8915619,lon:10.8818812,pid:"ChIJxSDgNhYjokcRRCqYT7EX_vY",desc:"Domplatz'ın kuzey yanını kaplayan prens-piskoposların barok sarayı. Avlusunda Gül Bahçesi var.",hist:"Bamberg yüzyıllarca prens-piskoposlarla yönetildi: hem kilisenin başı hem de bölgenin hükümdarıydılar. 17. yüzyıl sonunda Domberg'deki eski saray, yani Alte Hofhaltung, artık gösterişe yetmiyordu. Prens-piskopos Lothar Franz von Schönborn 1697'de mimar Johann Leonhard Dientzenhofer'e bu sarayı yaptırdı.\n\nİçeride 40'tan fazla oda var. En gösterişlisi ikinci kattaki Kaisersaal (İmparator Salonu): tavan ve duvarlar baştan sona imparator portreleriyle süslü. Bir rehberin dediğine göre imparatorlar bu salonu hiç kullanmadı.\n\nSarayın en tuhaf hikâyesi Napolyon'un mareşali Louis-Alexandre Berthier'e ait. Berthier, Napolyon'un sürgünden döndüğü 1815'te Bamberg'deydi ve 1 Haziran 1815'te bu sarayın bir penceresinden düşerek öldü. Kaza mı, intihar mı, cinayet mi olduğu hiç çözülmedi.",why:"Sarayın içi yalnızca rehberli turla. Gül Bahçesi ücretsiz ve şehrin en güzel manzaralarından biri.",dur:"1 sa",fee:"Yaklaşık €6 (yorumdan, doğrula)",hours:"Ekim-Mart her gün 10:00-16:00, Nisan-Eylül 09:00-18:00 (Google'a göre); içerisi rehberli turla"},
    {id:"b_hofhaltung",cat:"hist",name:"Alte Hofhaltung ve Tarih Müzesi",wiki:"Historical_Museum_Bamberg",lat:49.8911215,lon:10.8815232,pid:"ChIJu3NfemojokcRbni0P-PXd6E",desc:"Katedralin yanında, yarı ahşap evlerle çevrili Rönesans avlusu. İçinde şehrin tarih müzesi var.",hist:"Burası prens-piskoposların eski sarayıdır. Heinrich II'nin kalesi de bu noktadaydı. Bugünkü yapılar 16. yüzyılda Rönesans tarzında yapıldı. Domplatz'a bakan süslü kapı, Schöne Pforte, o dönemden.\n\nAvluyu çevreleyen yarı ahşap binalar eskiden ahır, ambar ve hizmetli evleriydi. Saray 1700'lerde karşıdaki Neue Residenz'e taşınınca burası boşaldı. Avlu bugün yazın açık hava tiyatrosu ve konserlerine sahne olur. Üç Silahşörler filminin bazı sahneleri de burada çekildi.\n\nTarih müzesi Bamberg'in Orta Çağ'dan bugüne hikâyesini anlatır. Yorumlara göre açıklamaların çoğu Almanca.",why:"Avlu ücretsiz ve çok fotojenik. Müze yağmurlu bir saat için.",dur:"30 dk",fee:"Avlu ücretsiz, müze ücretli",hours:"Müze Sal-Paz 11:00-17:00, Pazartesi kapalı. Avlu gündüz açık."},
    {id:"b_michaelsberg",cat:"hist",name:"Kloster Michaelsberg (St. Michael)",wiki:"Michaelsberg_Abbey,_Bamberg",lat:49.8934625,lon:10.8757269,pid:"ChIJWwpEYj4jokcRSo2FDCLLHR0",desc:"Bamberg'in yedi tepesinden birinin üstündeki Benedikten manastırı. Kilisesi 14 yıllık restorasyondan sonra Nisan 2026'da yeniden açıldı.",hist:"Manastırı 1015'te yine İmparator Heinrich II kurdu. Yüzyıllarca Benedikten rahipleri burada yaşadı, bira yaptı, şarap bağları işletti. 1803'te Bavyera kiliselerin malına el koyunca manastır kapatıldı ve binalar şehrin yaşlı bakım evine (Bürgerspital) verildi. Bugün de öyle.\n\nKilisenin tavanı Himmelsgarten (Gök Bahçesi) diye bilinir. 17. yüzyılda yüzlerce şifalı ve süs bitkisi tek tek tavana resmedildi. Bina 2012'de çökme tehlikesi yüzünden kapatıldı. 14 yıl süren onarımdan sonra 25 Nisan 2026'da yeniden açıldı.\n\nKilise kapalı olsa da önündeki teras Bamberg'in en iyi manzaralarından birini verir: aşağıda katedral, kırmızı çatılar ve nehir.",why:"Tepedeki teras için mutlaka çık. Kilise yeni açıldı, cuma-pazar günleri içine gir.",dur:"40 dk",fee:"Ücretsiz",hours:"Kilise Cum-Paz ve bayramlarda 11:00-16:00. Teras ve bahçe her gün açık.",tip:"Salı günü kilise kapalı, teras açık. Yukarı Michelsberg yolundan çık, aşağı meyve bahçelerinin içinden (Panoramaweg) in."},
    {id:"b_altenburg",cat:"hist",name:"Altenburg Kalesi",wiki:"Altenburg_(Bamberg)",lat:49.8806777,lon:10.8692741,pid:"ChIJpfzJ1iEjokcRP2vf0i9octQ",desc:"Bamberg'in en yüksek tepesindeki Orta Çağ kalesi. Kulesine 1 euroya çıkılıyor, manzara bütün şehri kapsıyor.",hist:"Bamberg Roma gibi yedi tepe üzerine kuruludur ve Altenburg bunların en yükseğinin üstündedir, deniz seviyesinden yaklaşık 386 metre. Kale ilk kez 1109'da yazılı kaynaklarda geçer. Bir dönem prens-piskoposların sığınağı ve yazlık konutu oldu.\n\n1553'te Brandenburg-Kulmbach Uçbeyi Albrecht Alcibiades'in savaşında yakılıp yıkıldı ve uzun süre harabe kaldı. 19. yüzyıl başında romantik dönemin Orta Çağ merakıyla kurtarıldı: bir Bamberg doktoru harabeyi satın alıp kuleyi ve bazı binaları yeniden düzenletti. Yazar E.T.A. Hoffmann'ın Bamberg yıllarında buraya sık çıktığı anlatılır.\n\nBugün avlu serbestçe gezilir. 33 metrelik kuleye dar ve dik merdivenlerle çıkılır. Tepeden Bamberg'in yedi tepesi, katedral ve Franken ovası görünür.",why:"Kale dendiğinde Bamberg'in cevabı. Yürüyüş biraz yokuş ama manzara her adıma değer.",dur:"1 sa 30 dk",fee:"Avlu ücretsiz, kule yaklaşık €1",hours:"Avlu her gün 09:00-19:00, kule 09:00-17:00 (Google'a göre)",tip:"Domplatz'tan yürüyerek 30-40 dk, sürekli yokuş. Yoldaki restoran Pazartesi ve Salı kapalı, su götür. Yolda iki seyir noktası var."},
    {id:"b_obere",cat:"hist",name:"Obere Pfarre (Meryem Ana Kilisesi)",wiki:"de:Obere Pfarre",lat:49.8893996,lon:10.8845245,pid:"ChIJrzj4DBcjokcRGUOllz0Ww88",desc:"Kaulberg tepesinde, Bamberg'in en önemli Gotik kilisesi. Dışı sade, içi barok altın.",hist:"Kilise 14. yüzyılda halkın kilisesi olarak yapıldı. Bu, katedralle bir tür rekabetti: tepedeki katedral piskoposundu, Obere Pfarre ise kentlinin. Ana gövde 1338-1350, yüksek koro 1392 dolaylarında yapıldı. Koroyu dışarıdan taşıyan uçan payandalar Bamberg'de pek görülmeyen saf Gotik örneğidir.\n\nİçerisi 18. yüzyılda barok tarzda yeniden süslendi. Ana sunaktaki Meryem heykeli 14. yüzyıldan kalmadır ve yüzyıllardır hacıların ziyaret ettiği bir lütuf tasviridir. Kilisede Venedikli ressam Tintoretto'ya atfedilen bir Meryem'in Göğe Yükselişi tablosu da bulunur.",why:"Katedralden Altenburg'a giderken yolun üstünde. Beş dakikalık bir mola, içi çok etkileyici.",dur:"15 dk",fee:"Ücretsiz",hours:"Her gün 09:00-18:00"},
    {id:"b_martin",cat:"hist",name:"St. Martin Kilisesi",wiki:"de:St. Martin (Bamberg)",lat:49.8935352,lon:10.888342,pid:"ChIJDQpYBRQjokcRz5olUgwIcCg",desc:"Grüner Markt'taki barok Cizvit kilisesi. Tavanındaki kubbe aslında yok, resim.",hist:"Kiliseyi 1686-1693 arasında Cizvitler yaptırdı. Mimarlar Dientzenhofer kardeşlerdi; aynı aile Bamberg ve Prag'ın barok yüzünü büyük ölçüde şekillendirdi.\n\nİçeri girince tavana bak. Yukarıda büyük bir kubbe görürsün. Ama kilisenin kubbesi yoktur: düz tavana perspektif hilesiyle boyanmış bir kubbe resmidir. Ressam Giovanni Francesco Marchini bunu 18. yüzyıl başında yaptı. Birkaç adım yürüyüp tekrar bakınca hile bozulur.\n\nCizvit tarikatı 1773'te kapatılınca kilise 1803'ten itibaren mahalle kilisesi oldu.",why:"Pazarın ortasında, ücretsiz. Sahte kubbe için iki dakika yeter.",dur:"10 dk",fee:"Ücretsiz",hours:"Her gün 09:00-17:00"},
    {id:"b_gabelmann",cat:"hist",name:"Gabelmoo ve Grüner Markt",wiki:"de:Neptunbrunnen (Bamberg)",lat:49.8927434,lon:10.888531,pid:"ChIJa5PsqhYjokcRsKJioXuuGSE",desc:"Şehrin ana pazar caddesi ve ortasındaki Neptün çeşmesi. Bamberglilerin buluşma noktası.",hist:"Grüner Markt adını sebze ve meyve pazarından alır. Kırmızı şemsiyeli tezgâhlar bugün de hafta içi kuruluyor. Ortadaki çeşmeyi heykeltıraş Johann Kaspar Metzner 1698'de yaptı. Deniz tanrısı Neptün elinde üç dişli mızrağıyla yunusların arasında durur.\n\nBamberg'liler ona Gabelmoo der. Frankonya lehçesinde \"çatallı adam\" demek. Mızrağı çatala benzettikleri için. \"Gabelmoo'da buluşalım\" şehirde herkesin anladığı bir buluşma cümlesidir.",why:"Şehrin günlük hayatı burada. Pazardan meyve al, çeşmenin önünde fotoğraf çek.",dur:"15 dk",fee:"Ücretsiz",hours:"Her zaman açık. Pazar tezgâhları hafta içi gündüz."},
    {id:"b_stephan",cat:"hist",name:"Stephanskirche",wiki:"de:Stephanskirche (Bamberg)",lat:49.8883869,lon:10.8862425,pid:"ChIJk4QtfDYjokcR7xYIKy5n0qg",desc:"Stephansberg tepesindeki kilise. Bir papanın kutsadığı tek Protestan kilisesi olarak bilinir.",hist:"Kiliseyi 1020 Paskalyası'nda Papa VIII. Benedictus, İmparator Heinrich II'nin yanında bizzat kutsadı. Papa Bamberg'e imparatoru ziyarete gelmişti. Yüzyıllar sonra, 19. yüzyılda kilise Protestan cemaatine verildi. Bu yüzden \"bir papanın kutsadığı tek Protestan kilisesi\" diye anılır.\n\nBugünkü bina 17. yüzyılda yeniden yapıldı. Plan neredeyse kare olduğu için akustiği orgla çok güzel çalışır.",why:"Bira mahzenlerine (Spezial-Keller, Wilde Rose) çıkarken yolun üstünde.",dur:"10 dk",fee:"Ücretsiz",hours:"Her gün 09:00-17:00"},
    {id:"b_boettinger",cat:"hist",name:"Böttingerhaus",wiki:"de:Böttingerhaus",lat:49.8891634,lon:10.8861087,pid:"ChIJRYALRxcjokcRoJvBjOIDMQA",desc:"Dar Judenstraße'de birden karşına çıkan süslü barok konak.",hist:"Bamberg'in saray danışmanı Johann Ignaz Tobias Böttinger bu evi 1707-1713 arasında yaptırdı. Cephedeki taş süslemeler, kapı ve pencere çerçeveleri dönemin Bamberg barokunun en zengin örneklerindendir. Dar bir sokağa sıkıştırıldığı için bütün cepheyi tek karede görmek zordur.\n\nBöttinger bu evi yetersiz bulup birkaç yıl sonra nehir kıyısında ikinci bir saray, Concordia'yı yaptırdı. Ev bugün özel mülk ve içi ziyarete açık değil.",why:"Obere Pfarre'den aşağı inerken önünden geçersin. Kapı süslemelerine yakından bak.",dur:"5 dk",fee:"Dışarıdan ücretsiz",hours:"Yalnızca dışarıdan"},
    {id:"b_concordia",cat:"hist",name:"Wasserschloss Concordia",wiki:"de:Concordia (Bamberg)",lat:49.888092,lon:10.8885534,pid:"ChIJJU2XmBAjokcRVl4MLWTdMj8",desc:"Regnitz'in kıyısına, suyun içinden yükselir gibi yapılmış barok saray.",hist:"Böttingerhaus'u yaptıran Böttinger, 1716-1722 arasında bu ikinci sarayı nehrin kıyısına yaptırdı. Bahçesi doğrudan suya iner, bu yüzden Wasserschloss (su sarayı) denir. Adını sonradan burada toplanan Concordia adlı bir dernekten aldı.\n\nBugün Bavyera eyaletinin uluslararası sanatçı evi, Villa Concordia. Dünyanın her yerinden yazar, müzisyen ve ressamlar burada bir yıl kalıp çalışıyor.",why:"Karşı kıyıdan, Mühlwörth tarafından bakınca en güzel görünür.",dur:"10 dk",fee:"Bahçe ve dışı ücretsiz",hours:"Bahçe hafta içi gündüz açık (Google'a göre)"},
    {id:"b_hoffmann",cat:"hist",name:"E.T.A. Hoffmann Evi",wiki:"E._T._A._Hoffmann",gen:1,lat:49.8898685,lon:10.8909136,pid:"ChIJQTOTVRAjokcRCJ8IsyWjrKs",desc:"Fındıkkıran'ın yazarı E.T.A. Hoffmann'ın 1809-1813 arasında yaşadığı dar ev.",hist:"Ernst Theodor Amadeus Hoffmann, Çaykovski'nin balesine konu olan Fındıkkıran ve Fare Kral'ın yazarıdır. Bamberg'e 1808'de tiyatro müdürü olarak geldi. İşler iyi gitmeyince müzik dersi verdi, gazetelere yazdı, borç içinde yaşadı. Ama Bamberg yılları onu yazar yaptı: ilk öykülerini burada yazdı.\n\nEv Schillerplatz'ta, tiyatronun karşısında. Hoffmann en üst kattaki küçük odada, sokağa açılan bir kapaktan geçerek yazı odasına çıkardı. Meydanda, omzunda kedisi Murr ile Hoffmann'ın heykeli durur.",why:"Edebiyat seviyorsan küçük ve samimi bir müze. Heykel ve kedi için bile uğra.",dur:"30 dk",fee:null,hours:"Saatleri mevsime göre değişiyor, gitmeden kontrol et"},
    {id:"b_dioezesan",cat:"hist",name:"Diözesanmuseum (Katedral Hazinesi)",wiki:"de:Diözesanmuseum Bamberg",lat:49.8905902,lon:10.88309,pid:"ChIJR_h0NRYjokcRD2Q-unOcTz4",desc:"Katedralin yanındaki müze. İmparator Heinrich II'nin bin yıllık yıldızlı pelerini burada.",hist:"Müzenin en değerli parçası Sternenmantel, yani Heinrich II'nin yıldızlı pelerinidir. Yaklaşık 1020'de ipek üzerine altın iplikle işlendi ve üzerinde gökyüzü, burçlar ve yıldızlar vardır. Bin yaşındaki bu kumaşın ayakta kalması bile şaşırtıcıdır.\n\nAyrıca imparator çiftinin taçları, piskopos giysileri ve katedralden indirilen orijinal taş heykeller de sergilenir. Kombine biletle Tarih Müzesi'ne de girilebilir.",why:"Katedrali gördükten sonra hikâyeyi tamamlar.",dur:"1 sa",fee:"Ücretli (kombine bilet var)",hours:"Pzt, Sal, Per, Cum 10:00-17:00; Çarşamba kapalı; Cmt 10:00-16:15; Paz 13:00-17:00"},
    {id:"b_brauereimuseum",cat:"hist",name:"Fränkisches Brauereimuseum (Bira Müzesi)",wiki:"de:Fränkisches Brauereimuseum",lat:49.8938428,lon:10.8761299,pid:"ChIJW3MrCTwjokcR73oP57xPPrQ",desc:"Michaelsberg manastırının eski bira imalathanesinde Frankonya bira müzesi.",hist:"Benediktenler Michaelsberg'de yüzyıllarca bira yaptı. Müze bu eski imalathanenin beş katına yayılmıştır. Arpanın malta dönüşmesinden fıçılara kadar bütün süreç eski aletlerle gösterilir.\n\nYukarı Frankonya dünyada nüfusa oranla en çok bira fabrikası olan bölge sayılır. Müze bu kültürün neden burada geliştiğini de anlatır. Yorumlara göre açıklamalar çoğunlukla Almanca.",why:"Rauchbier'i içmeden önce nasıl yapıldığını görmek için.",dur:"1 sa",fee:"Yaklaşık €4 (yorumdan)",hours:"Çar-Cum 13:00-17:00, Cmt-Paz 11:00-17:00, Pazartesi ve Salı kapalı"},
    {id:"b_gaertner",cat:"hist",name:"Gärtnerstadt ve Bahçıvanlar Müzesi",wiki:"de:Gärtner- und Häckermuseum",lat:49.8994444,lon:10.8927778,pid:"ChIJs_Jsk2wjokcRMPdtAETmNSA",desc:"Bamberg'in UNESCO mirasının üçüncü parçası: şehrin içindeki sebze bahçeleri mahallesi ve bahçıvan müzesi.",hist:"Bamberg'in UNESCO Dünya Mirası alanı üç parçadır: tepedeki piskopos şehri, adadaki kentli şehri ve Gärtnerstadt, yani bahçıvanlar şehri. Orta Çağ'dan beri burada evlerin arkasında uzun sebze bahçeleri vardır ve şehrin ortasında hâlâ tarım yapılır. Bu Avrupa'da çok nadirdir.\n\nBamberg bahçıvanları soğanlarıyla ünlüydü, Bamberglilere bu yüzden takma adla Zwiebeltreter (soğan çiğneyen) denir. 16. yüzyıldan itibaren burada meyan kökü (Süßholz) de yetiştirildi ve şehrin armasına bile girdi. Bamberger Hörnla adlı patates çeşidi de buradan.\n\nMüze 18. yüzyıldan bir bahçıvan evinde, arkasında çalışan gerçek bir bahçe ile.",why:"Kalabalıktan uzak, gerçek Bamberg. Spezial ve Fässla'ya iki adım.",dur:"45 dk",fee:"Ücretli (Bamberg kartına dahil)",hours:"Sal-Paz 11:00-17:00, Pazartesi kapalı (sezon Nisan-Ekim)"},
    {id:"b_geyerswoerth",cat:"hist",name:"Schloss Geyerswörth ve Turist Bilgi",wiki:"de:Schloss Geyerswörth",lat:49.8911055,lon:10.8876801,pid:"ChIJWyKRzRYjokcRT1NQDIjwvgQ",desc:"Rathaus'un güneyinde, nehir adasındaki Rönesans saray. Hemen yanında turist bilgi ofisi var.",hist:"Saray adını 14. yüzyılda buraya yerleşen Geyer ailesinden alır (Wörth: nehir adası). 1580'lerde prens-piskopos Ernst von Mengersdorf onu Rönesans tarzında yeniden yaptırdı ve kentin aşağı yakasında kendine bir konut edindi.\n\nSarayın kulesi bir zamanlar şehre tepeden bakan bir seyir noktasıydı. Bina uzun süredir onarımda. Yanındaki Bamberg Tourismus ofisinden harita, rehberli tur ve Bamberg kartı alınabilir.",why:"Turist ofisine uğramak ve Rathaus'a güneyden bakmak için.",dur:"10 dk",fee:"Ücretsiz",hours:"Turist bilgi Pzt-Cum 09:30-18:00, Cmt 09:30-15:00, Pazar kapalı. Saray onarımda."},
    {id:"b_jakob",cat:"hist",name:"St. Jakob Kilisesi",wiki:"de:St. Jakob (Bamberg)",lat:49.890956,lon:10.8771781,pid:"ChIJZdux_TwjokcRGcneaPDJFLQ",desc:"Jakobsberg tepesindeki sade Romanesk kilise. Santiago yolunun Bamberg durağı.",hist:"Kilise 11. yüzyılda kuruldu ve Bamberg'in yedi tepesinden Jakobsberg'e adını verdi. İspanya'daki Santiago de Compostela'ya giden hacılar yüzyıllarca burada durdu. Dışı sonradan barok bir cephe aldı, içi ise sade Romanesk kalmıştır.",why:"Domberg ile Michaelsberg arasında, sessiz ve serin bir mola.",dur:"10 dk",fee:"Ücretsiz",hours:"Her gün 09:00-16:00"},

    {id:"b_rosengarten",cat:"park",name:"Rosengarten (Gül Bahçesi)",wiki:"de:Neue Residenz (Bamberg)",gen:1,lat:49.8920198,lon:10.8818531,pid:"ChIJI61APOIjokcRK98hIil6KJ0",desc:"Neue Residenz'in avlusundaki barok gül bahçesi. Terasından aşağı şehrin kırmızı çatıları görünür.",hist:"Bahçe 18. yüzyılda prens-piskoposların özel bahçesi olarak düzenlendi. Bugün binlerce gül, barok heykeller ve ıhlamur ağaçları var. Köşedeki küçük pavyon yazın kafe olur. Terasın köşesinden Michaelsberg manastırı ve şehrin çatıları tek karede görünür.",why:"Ücretsiz ve Bamberg'in en kolay ulaşılan manzarası. Ekim'de bile kalan güller oluyor.",dur:"20 dk",fee:"Ücretsiz",hours:"Her gün 10:00-16:00 (Google'a göre; yazın daha uzun)"},
    {id:"b_panorama",cat:"park",name:"Michelsberg Meyve Bahçeleri (Panoramaweg)",wiki:"Michaelsberg_Abbey,_Bamberg",gen:1,lat:49.8936644,lon:10.8793885,pid:"ChIJ3VdOcp0jokcRx4EeQEqkEWg",desc:"Manastırdan şehre inen, elma ağaçları arasından geçen patika. Her adımda manzara.",hist:"Michaelsberg'in yamacındaki meyve bahçeleri manastırın eski bahçeleridir ve bugün Bürgerspital vakfına aittir. Patikada banklar var. Yerlere düşen elmalar vakfın malıdır, toplama yasağı tabelalarla duyuruluyor.",why:"Manastırdan aşağı inerken bu yolu kullan.",dur:"20 dk",fee:"Ücretsiz",hours:"Gündüz açık"},
    {id:"b_hain",cat:"park",name:"Hain Parkı",wiki:"de:Hain (Bamberg)",lat:49.8810927,lon:10.8983721,pid:"ChIJSyoobYgjokcR-a7ypVULDTw",desc:"Regnitz'in iki kolu arasındaki büyük İngiliz bahçesi. Nehir kenarı yürüyüşü.",hist:"Hain 19. yüzyıl başında halka açık bir İngiliz tarzı park olarak düzenlendi. Ağaçların arasında eski heykeller, küçük tapınak benzeri yapılar ve nehir kıyısı boyunca uzun yollar var. Bamberglilerin pazar yürüyüşü yeridir.",why:"Eski şehirden 15 dakika güneyde, sonbahar renkleri için çok güzel.",dur:"1 sa",fee:"Ücretsiz",hours:"Her zaman açık"},
    {id:"b_erba",cat:"park",name:"ERBA Adası",wiki:"Bamberg",gen:1,lat:49.9031052,lon:10.8712446,pid:"ChIJ9_CqkEgjokcRDJ4zmZ5dq-M",desc:"Eski bir pamuk fabrikasının yerindeki nehir adası parkı. Adanın ucunda iki suyun birleştiği nokta.",hist:"ERBA, 19. yüzyılda kurulan Erlangen-Bamberg pamuk iplik fabrikasının kısaltmasıdır. Fabrika kapandıktan sonra alan 2012 Bavyera Bahçe Fuarı için parka çevrildi. Adanın kuzey ucunda Regnitz'in sol kolu ile Main-Tuna Kanalı birleşir; orada bir bankta oturan bronz BaERBAla heykeli var.",why:"Vaktin kalırsa, sakin bir nehir yürüyüşü.",dur:"1 sa",fee:"Ücretsiz",hours:"Her zaman açık"},

    {id:"b_kleinvenedig",cat:"photo",name:"Klein Venedig (Küçük Venedik)",wiki:"Klein-Venedig",lat:49.8928937,lon:10.8845904,pid:"ChIJZakEgmwjokcRUKa4YghKQ4I",desc:"Nehrin doğu kıyısında, suya inen balıkçı evleri. En iyi karşı kıyıdaki Am Leinritt yolundan görünür.",hist:"Bu evler Orta Çağ'dan beri balıkçıların ve kayıkçıların mahallesiydi. Her evin önünde suya inen küçük bir bahçe ve tekne iskelesi var. Bugünkü evlerin çoğu 17. ve 19. yüzyıllardan. Ağustos'taki Sandkerwa festivalinde burada kayıkla mızrak dövüşü (Fischerstechen) yapılır.",why:"Bamberg'in kartpostal karesi. Öğleden sonra güneş evlerin yüzüne vurur.",dur:"15 dk",fee:"Ücretsiz",hours:"Her zaman açık",tip:"Untere Brücke'den karşıya geç, nehir kıyısındaki Am Leinritt yolunda kuzeye yürü."},
    {id:"b_untere",cat:"photo",name:"Untere Brücke (Rathaus manzarası)",wiki:"Bamberg_City_Hall",gen:1,lat:49.8918239,lon:10.8866881,pid:"ChIJh5ynvxYjokcROTgGSbwgKvw",desc:"Rathaus'un kuzeyindeki köprü. Hem Rathaus hem Klein Venedig buradan görünür.",hist:"Köprünün ortasında İmparatoriçe Kunigunde'nin heykeli durur. Karşısında ise Rathaus'un nehre sarkan yarı ahşap Rottmeisterhäuschen'i. Akşamüstü burası şehrin en kalabalık noktasıdır; Bamberg'liler elinde bira ile köprü korkuluğuna yaslanır.",why:"Rathaus'un ünlü fotoğrafı buradan çekilir.",dur:"10 dk",fee:"Ücretsiz",hours:"Her zaman açık"},
    {id:"b_geyersteg",cat:"photo",name:"Geyerswörthsteg (Rathaus güneyden)",wiki:"Bamberg_City_Hall",gen:1,lat:49.8910507,lon:10.8874512,pid:"ChIJidgR0BYjokcRVYUeoDrmGjY",desc:"Rathaus'un güneyindeki yaya köprüsü. Rathaus'u nehirle birlikte cepheden gösterir.",hist:"Bu köprüden Rathaus, akıntının ortasında gemi gibi görünür. Arkada katedralin kuleleri de kadraja girer.",why:"Rathaus + katedral kuleleri tek karede.",dur:"10 dk",fee:"Ücretsiz",hours:"Her zaman açık"},
    {id:"b_altview",cat:"photo",name:"Altenburg Yolu Seyir Terası",wiki:"Altenburg_(Bamberg)",gen:1,lat:49.8844488,lon:10.8746406,pid:"ChIJQ4txyeUjokcRvMXg7tnCVvw",desc:"Altenburg'a çıkarken yarı yoldaki seyir terası. Bütün eski şehir ayağının altında.",hist:"Altenburger Straße'nin yamacındaki bu teras ve biraz yukarıdaki banklı nokta, katedralin dört kulesini, Michaelsberg'i ve Obere Pfarre'yi aynı anda gösterir. Yorumlara göre gün batımında en güzel hâli.",why:"Kaleye kadar çıkmasan bile buraya kadar gel.",dur:"15 dk",fee:"Ücretsiz",hours:"Her zaman açık"},
    {id:"b_kette",cat:"photo",name:"Kettenbrücke",wiki:"Bamberg",gen:1,lat:49.8962075,lon:10.8912998,pid:"ChIJaaIfbvgjokcRpzLSmu1TPEQ",desc:"Eski şehirle Gärtnerstadt'ı bağlayan, aşk kilitleriyle dolu köprü.",hist:"Burada 14. yüzyıldan beri köprü var. Adını 1829'da yapılan zincirli asma köprüden alır; bugünkü köprü sonradan yapıldı ama ad kaldı. Korkuluklar çiftlerin taktığı asma kilitlerle dolu.",why:"Gardan gelirken ilk durak. Bir kilit takmak isteyebilirsin.",dur:"5 dk",fee:"Ücretsiz",hours:"Her zaman açık"},

    /* ================= YEMEK VE BİRA ================= */
    {id:"b_schlenkerla",cat:"food",name:"Schlenkerla (Rauchbier)",wiki:"Schlenkerla",lat:49.8917033,lon:10.8849476,pid:"ChIJjSbp9RYjokcRPgC6cIlZSb0",price:"€€",rating:4.2,rc:4119,rdate:"19.10.2026",eat:"Aecht Schlenkerla Rauchbier Märzen (ahşap fıçıdan), Bamberger Zwiebel (kıyma doldurulmuş soğan, Rauchbier soslu), Schäufele.",hist:"Rauchbier, yani isli bira, maltın kayın odunu ateşinin dumanında kurutulmasıyla yapılır. Eskiden bütün maltlar böyle kurutulurdu; 19. yüzyılda dumansız kurutma fırınları çıkınca dünyada bu tat kayboldu. Bamberg'de ise iki bira evi, Schlenkerla ve Spezial, eski usulü bırakmadı. Bugün Rauchbier dendiğinde akla ilk Bamberg gelir.\n\nBinanın geçmişi 1405'e kadar belgelidir. Bira imalathanesi 1678'de kuruldu, resmi adı hâlâ Heller-Bräu'dür. Schlenkerla adı ise 1875'te işletmeyi alan Andreas Graser'den gelir: kolunu sallayarak, tuhaf bir yürüyüşle yürürmüş. Frankonya lehçesinde buna \"schlenkern\" denir ve halk meyhaneye Schlenkerla demeye başladı. İşletme bugün Graser-Trum ailesinin altıncı kuşağında.\n\nBira hâlâ ahşap fıçılardan, pompasız, yerçekimiyle doldurulur. İlk yudum füme jambon gibi gelir. Bamberg'lilerin sözü: üçüncü bardakta alışırsın.",why:"Bamberg'e gelip burada bir Rauchbier içmemek olmaz. Hem tarih hem tat.",hours:"Her gün 09:30-23:30",tip:"İçerisi doluysa sokaktaki pencereden bira alıp ayakta içmek yerel adet. Masalar paylaşılır."},
    {id:"b_spezial",cat:"food",name:"Brauerei Spezial",wiki:"Rauchbier",gen:1,lat:49.8968596,lon:10.8928067,pid:"ChIJvwayOhMjokcR6wYyeoNAZ4M",price:"€€",rating:4.4,rc:2129,rdate:"19.10.2026",eat:"Spezial Rauchbier Lager (Schlenkerla'dan daha yumuşak dumanlı), Schäufele ve patates köftesi (Kloß).",hist:"Spezial 1536'dan beri bira yapıyor ve Bamberg'in en eski Rauchbier bira evi sayılır. Maltını hâlâ kendi kurutma fırınında, kayın odunu dumanında kendisi kurutur. Bunu yapan dünyada çok az bira fabrikası kalmıştır.\n\nTurist Schlenkerla'ya, yerli Spezial'e gider derler. İçerisi uzun ahşap masalar, duvarda saat, köşede emekli Bamberg'liler.",why:"Rauchbier'in daha yumuşak, yerlilerin tercih ettiği hali. Schlenkerla ile karşılaştırmak için ikisini de iç.",hours:"Pzt-Cum 09:00-22:30, Cmt 09:00-14:00, Paz 09:00-21:00",tip:"Yorumlara göre kart yalnızca 50 euro üstünde geçiyor, nakit götür. Yer bulduğun boş sandalyeye otur."},
    {id:"b_faessla",cat:"food",name:"Brauerei Fässla",lat:49.897245,lon:10.892754,pid:"ChIJY46_UyojokcRu5jG9_kQSY0",price:"€€",rating:4.4,rc:2380,rdate:"19.10.2026",eat:"Gold-Pils ve koyu Zwergla; şnitzel ve köfteli Frankonya yemekleri. Rauchbier yok.",why:"Spezial'in tam karşısında. İki bira evini art arda gezmek için.",hours:"Pzt-Cmt 08:30-23:00, Paz 08:30-12:00",tip:"Yorumlara göre kartla ödemede ek ücret var, nakit götür."},

    /* ================= TARİHİ ================= */
    {id:"n_burg",cat:"hist",name:"Kaiserburg (İmparatorluk Kalesi)",wiki:"Nuremberg_Castle",lat:49.4580134,lon:11.0756516,pid:"ChIJB5JKSLBXn0cRm5zy7D3jUgo",desc:"Eski şehrin kuzeyindeki kaya tepesinde, Kutsal Roma-Germen imparatorlarının kalesi.",hist:"Kale 11. yüzyılda bir kaya sırtının üstüne kurulmaya başladı ve 1050'de ilk kez yazılı belgede geçer. Orta Çağ'da Almanya'nın sabit bir başkenti yoktu; imparatorlar kaleden kaleye dolaşarak hüküm sürerdi. Nürnberg bu kalelerin en önemlisiydi: 1050-1571 arasında hemen her imparator burada kaldı.\n\n1356'da İmparator IV. Karl'ın Altın Boğa fermanı, yeni seçilen her kralın ilk imparatorluk meclisini Nürnberg'de toplamasını şart koştu. İmparatorluk tacı ve kutsal emanetler de 1424'ten 1796'ya kadar Nürnberg'de saklandı.\n\nKale aslında tek bina değil, 220 metre uzunluğunda küçük bir şehirdir. İçeride imparator sarayı (Palas), iki katlı imparator şapeli, yuvarlak Sinwellturm kulesi ve kayaya yaklaşık 50 metre oyulmuş Derin Kuyu (Tiefer Brunnen) gezilir. Kuyuda rehber, bir mum indirip suyun ne kadar aşağıda olduğunu gösterir.",why:"Nürnberg'in tepesi. Kulenin ve avlunun manzarası bütün eski şehri kapsar.",dur:"1 sa 30 dk",fee:"Kombine bilet yaklaşık €10 (yorumdan, doğrula); avlu ve bahçe ücretsiz",hours:"Ekim-Mart her gün 10:00-16:00, Nisan-Eylül 09:00-18:00",tip:"Kuyu turu belli saatlerde, grupla yapılıyor; bileti alırken sor."},
    {id:"n_hauptmarkt",cat:"hist",name:"Hauptmarkt ve Schöner Brunnen",wiki:"Schöner_Brunnen",lat:49.454238,lon:11.0770384,pid:"ChIJBebKdABXn0cRVfgWZef27IU",desc:"Eski şehrin ana meydanı ve köşesindeki 19 metrelik altın renkli Gotik çeşme.",hist:"Bu meydanın geçmişi karanlıktır. 1349'a kadar burası Nürnberg'in Yahudi mahallesiydi. Veba salgını yıllarında İmparator IV. Karl'ın izniyle mahalle yıkıldı ve yüzlerce Yahudi öldürüldü. Boşalan yerde pazar meydanı açıldı, sinagogun yerine de Frauenkirche yapıldı.\n\nSchöner Brunnen (Güzel Çeşme) 1385-1396 arasında yapıldı. Bir kilise kulesi gibi yükselir ve üzerinde 40 figür var: kutsal Roma imparatorluğunun seçici prensleri, peygamberler ve kahramanlar. Bugün gördüğün figürler kopyadır; orijinallerinin bir kısmı Germanisches Nationalmuseum'da.\n\nÇeşmenin parmaklığında dövme demirden bir halka var. Rivayete göre onu çevirip dilek tutan dileğine kavuşur. Meydanın Noel pazarı Christkindlesmarkt dünyanın en ünlüsüdür.",why:"Nürnberg'in buluşma noktası. Halkayı çevir, sonra Frauenkirche'nin saatini bekle.",dur:"20 dk",fee:"Ücretsiz",hours:"Her zaman açık. Pazar tezgâhları Pzt-Cmt gündüz.",tip:"Halka çeşmenin parmaklığında, kuzeybatı yanında. Arkasında ikinci, gümüş renkli bir halka daha olduğu söylenir."},
    {id:"n_frauenkirche",cat:"hist",name:"Frauenkirche ve Männleinlaufen",wiki:"Frauenkirche,_Nuremberg",lat:49.4540298,lon:11.0780884,pid:"ChIJM8b6eKVXn0cRatouKhxsL8w",desc:"Hauptmarkt'ın doğu yanındaki Gotik kilise. Her gün öğlen 12'de cephedeki saat figürleri dönmeye başlar.",hist:"Kilise 1352-1362 arasında, yıkılan sinagogun yerine IV. Karl'ın isteğiyle yapıldı ve imparatorluk sarayı şapeli oldu.\n\nCephedeki saat 1509'da yerleştirildi. Her gün tam 12:00'de Männleinlaufen başlar: yedi seçici prens figürü, tahtta oturan imparator IV. Karl'ın etrafında üç kez dönerek onu selamlar. Bu sahne 1356'da kralın nasıl seçileceğini belirleyen Altın Boğa fermanını anlatır. Gösteri birkaç dakika sürer, meydanda herkes başını kaldırır.",why:"Öğlen 12'de meydanda ol ve saati izle.",dur:"20 dk",fee:"Ücretsiz",hours:"Gösteri her gün 12:00. Kilise gündüz açık, ayin saatlerinde gezilmez."},
    {id:"n_lorenz",cat:"hist",name:"St. Lorenz Kilisesi",wiki:"St._Lorenz,_Nuremberg",lat:49.4509924,lon:11.0783289,pid:"ChIJ8-gPtmlXn0cRjIg0DQNmyd4",desc:"Güney yakadaki iki kuleli büyük Gotik kilise. İçinde tavandan sarkan ahşap Meryem müjdesi var.",hist:"Nürnberg Pegnitz nehriyle ikiye ayrılır. Kuzey yakanın kilisesi St. Sebald, güney yakanınki St. Lorenz'dir. İki mahalle yüzyıllarca hangi kilisenin daha güzel olacağı konusunda yarıştı. St. Lorenz 13. yüzyılda başladı, gül pencereli batı cephesi ve iki kulesiyle 15. yüzyılda tamamlandı.\n\nİçeride iki başyapıt var. Koronun ortasında tavandan sarkan Engelsgruß (Melek Selamı): Veit Stoß 1517-1518'de ahşaptan oydu, Cebrail Meryem'e müjdeyi verir. Sol yanda ise 20 metre yükselen taş Sakramentshaus: Adam Kraft 1493-1496'da yaptı ve tabanında kendi heykelini diz çökmüş, elinde aletleriyle, bütün yapıyı sırtında taşırken yonttu.\n\n1945'te kilise ağır bombalandı. Değerli eserler önceden kaya mahzenlerine indirildiği için kurtuldu.",why:"Nürnberg'in en etkileyici iç mekânı. Adam Kraft'ın kendini yonttuğu figürü bul.",dur:"30 dk",fee:"Ücretsiz",hours:"Pzt-Cmt 09:00-17:30, Paz 13:00-15:30"},
    {id:"n_sebald",cat:"hist",name:"St. Sebald Kilisesi",wiki:"St._Sebaldus_Church,_Nuremberg",lat:49.4552444,lon:11.0760166,pid:"ChIJ_1bfv69Xn0cRoVzN_j4KHqA",desc:"Şehrin en eski kilisesi. İçinde şehrin koruyucu azizinin bronz mezar tapınağı var.",hist:"Kilise 1225-1273 arasında yapıldı ve adını şehrin koruyucu azizi Sebaldus'tan alır. Batı yanı ağır Romanesk, doğudaki koro ise ışıkla dolu geç Gotik. Bir binada iki çağ.\n\nOrtadaki Sebaldusgrab, azizin kemiklerinin durduğu gümüş sandığı koruyan bronz bir tapınaktır. Peter Vischer ve oğulları 1508-1519 arasında döktü. Yakından bak: tabanda salyangozlar taşır, yukarı çıktıkça Yunan tanrıları, peygamberler ve havariler gelir. Vischer kendini de bir köşeye, iş önlüğüyle koymuştur.",why:"Rathaus'un hemen karşısında. Bronz mezarın ayrıntıları için birkaç dakika ayır.",dur:"30 dk",fee:"Yaklaşık €5 (yorumdan)",hours:"Pzt-Cmt 09:30-18:00, Paz 11:00-18:00"},
    {id:"n_duerer",cat:"hist",name:"Albrecht Dürer Evi",wiki:"Albrecht_Dürer's_House",lat:49.4571961,lon:11.0737762,pid:"ChIJhSIs3LFXn0cR55XgdYda0BI",desc:"Ressam Albrecht Dürer'in 1509'dan ölümüne kadar yaşayıp çalıştığı yarı ahşap ev.",hist:"Albrecht Dürer 1471'de Nürnberg'de doğdu ve Alman Rönesansı'nın en büyük sanatçısı oldu. İtalya'ya gidip Rönesans'ı Almanya'ya getirdi, gravürleriyle bütün Avrupa'da tanındı. Ünlü tavşan resmi ve ellerini kavuşturmuş Dua Eden Eller çizimi ondandır.\n\nBu evi 1509'da satın aldı ve 1528'de ölene kadar burada yaşadı. Ev savaşta hasar gördü ama ana yapı ayakta kaldı. İçeride atölyesi yeniden kurulmuş; gravür baskısının nasıl yapıldığı gösteriliyor. Evin önündeki meydanda Dürer'in tavşanından esinlenen tuhaf bir bronz tavşan heykeli var.",why:"Kale yolunun dibinde. Sanatla ilgilenmesen bile 15. yüzyıldan bir evin içini görmek için.",dur:"1 sa",fee:"Yaklaşık €7,50 (yorumdan)",hours:"Her gün 10:00-18:00 (Google'a göre)"},
    {id:"n_rathaus",cat:"hist",name:"Altes Rathaus ve Zindanlar (Lochgefängnisse)",wiki:"Nuremberg_City_Hall",lat:49.455215,lon:11.077306,pid:"ChIJvx6Xh69Xn0cRGHwpOyc7mLc",desc:"Eski belediye binası ve altındaki Orta Çağ zindanları. Rehberli turla geziliyor.",hist:"Rathaus'un altındaki Lochgefängnisse, Orta Çağ Nürnberg'inin sorgu hapishanesiydi. Mahkûmlar mahkemeye çıkmadan önce bu karanlık, alçak tavanlı hücrelerde tutulurdu. Aşağıda sorgu odası ve dönemin işkence aletleri de var.\n\nTur yaklaşık yarım saat sürer ve 20 kişiyle sınırlıdır. Yorumlara göre İngilizce tur akşam saatinde ve yer önceden doluyor.",why:"Kısa, ucuz ve çok ilginç. Bileti internetten önceden al.",dur:"30 dk",fee:"Yaklaşık €4-6 (yorumdan)",hours:"Turlar her gün 11:00-18:00",tip:"Gruplar 20 kişi, kapıda bilet almak zor. Online rezervasyon yap."},
    {id:"n_felsen",cat:"hist",name:"Historische Felsengänge (Kaya Mahzenleri)",wiki:"Historischer_Kunstbunker",gen:1,lat:49.4569762,lon:11.0748632,pid:"ChIJZ0Uw1LFXn0cR99yMdLjniDs",desc:"Kale tepesinin altına oyulmuş kilometrelerce bira mahzeni. Rehberli turla iniliyor.",hist:"14. yüzyıldan itibaren Nürnberg'in bira yapanları kumtaşı kayanın içine mahzenler oydu. Şehir yasası her bira yapanın kendi mahzeni olmasını şart koşuyordu, çünkü Nürnberg'in ünlü kırmızı birası (Rotbier) serin ve sabit sıcaklıkta saklanmalıydı. Zamanla dört kat derinliğe inen bir labirent oluştu.\n\nİkinci Dünya Savaşı'nda bu tüneller hava saldırısı sığınağı oldu. Kentin sanat hazineleri de yakındaki başka bir kaya mahzeninde, Kunstbunker'de saklandı. Tur, Altstadthof bira evinin yanından başlar ve sonunda Rotbier tadımı yapılabilir.",why:"Yer altı Nürnberg'i. Turdan sonra yukarıda Rotbier iç.",dur:"1 sa 15 dk",fee:null,hours:"Turlar Pzt-Cum 11:00-17:30, Cmt-Paz 10:00-17:30",tip:"İngilizce tur az; yorumlara göre çoğunlukla hafta sonu belli saatte. Almanca tura sesli rehber sor."},
    {id:"n_weinstadel",cat:"hist",name:"Weinstadel",wiki:"de:Weinstadel (Nürnberg)",lat:49.4538698,lon:11.0732173,pid:"ChIJbb0KjoJXn0cR5E2CvjsJBv4",desc:"Pegnitz kıyısında, Almanya'nın en büyük yarı ahşap yapılarından biri.",hist:"Weinstadel 1446-1448 arasında şehir surlarının dışında yapıldı. İlk görevi cüzzamlılara hizmet etmekti: Paskalya'da şehre gelen cüzzamlı hastalar burada barındırılıp beslenirdi. Sonra imparatorluk şehrinin şarap deposu oldu, adını da buradan aldı. 1950'lerden beri öğrenci yurdu.\n\nNehir üstündeki kapalı ahşap köprü Henkersteg ve yandaki su kulesiyle birlikte Nürnberg'in en romantik köşesini oluşturur.",why:"Maxbrücke'den nehirle birlikte bak. Nürnberg'in en ünlü kartpostal karesi.",dur:"10 dk",fee:"Dışarıdan ücretsiz",hours:"Yalnızca dışarıdan"},
    {id:"n_henker",cat:"hist",name:"Henkersteg ve Cellat Evi",wiki:"de:Henkersteg",lat:49.4531258,lon:11.0730657,pid:"ChIJl148BEhXn0cRzI-HnEFVlmc",desc:"Pegnitz'in üstünde kapalı ahşap köprü ve şehrin cellâdının yaşadığı kule.",hist:"Orta Çağ'da cellât saygın ama dışlanmış bir meslekti: kimse onunla aynı masaya oturmak, aynı sokakta yaşamak istemezdi. Nürnberg şehri cellâdını bu yüzden nehrin ortasındaki kuleye yerleştirdi. Kule ile şehir arasındaki bu kapalı köprü, Henkersteg (cellât köprüsü), onun işe gidiş yoluydu.\n\nEn ünlü Nürnberg cellâdı Franz Schmidt'tir (1578-1617 arası görevde). Yüzlerce infazı kaydettiği günlüğü bugün de yayımlanıyor. Kule içinde onun hayatını anlatan küçük bir müze var.",why:"Köprünün içinden geç, sonra Maxbrücke'den dışarıdan bak.",dur:"15 dk",fee:"Köprü ücretsiz, müze ücretli",hours:"Köprü her zaman açık"},
    {id:"n_handwerker",cat:"hist",name:"Handwerkerhof",wiki:"Nuremberg",gen:1,lat:49.4476697,lon:11.0812015,pid:"ChIJlVkIMqdXn0cRFQlDyPLZOyk",desc:"Garın karşısında, sur içine kurulmuş küçük zanaatkârlar köyü.",hist:"Handwerkerhof eski şehrin surlarının Königstor kulesi yanındaki bölümüne 1971'de, Dürer'in doğumunun 500. yılı için kuruldu. Orta Çağ Nürnberg'i bir zanaat şehriydi: pusula, saat, oyuncak ve metal işi Avrupa'ya buradan yayıldı. Bu avluda bugün kuyumcu, çömlekçi, oyuncakçı ve Lebkuchen dükkânları var.",why:"Trenden inince ilk durak. Turistik ama sevimli.",dur:"20 dk",fee:"Ücretsiz",hours:"Avlu Pzt-Cmt 08:00-22:00, Paz 10:00-20:00; dükkânlar genelde gündüz"},
    {id:"n_gnm",cat:"hist",name:"Germanisches Nationalmuseum",wiki:"Germanisches_Nationalmuseum",lat:49.4484179,lon:11.0752469,pid:"ChIJR2fu16dXn0cRbb6itlaqASw",desc:"Alman kültür tarihinin en büyük müzesi. Dünyanın ayakta kalan en eski küresi burada.",hist:"Müze 1852'de kuruldu ve eski bir Kartuzyen manastırının içine yerleşti. Taş Devri'nden bugüne Almanca konuşulan dünyanın bütün hikâyesini anlatır: zırhlar, müzik aletleri, oyuncaklar, Dürer'in resimleri.\n\nEn ünlü parçası Martin Behaim'ın 1492'de yaptığı Erdapfel küresi. Kolomb Amerika'ya vardığı yıl yapıldı, bu yüzden üzerinde Amerika yok: Avrupa'dan batıya gidince doğrudan Asya'ya varılır.",why:"Yağmur yağarsa ya da tarih seviyorsan. Kolayca 2-3 saat geçer.",dur:"2 sa",fee:"Yaklaşık €10; Çarşamba 17:30'dan sonra ücretsiz (yorumdan)",hours:"Sal 10:00-18:00, Çar 10:00-20:30, Per-Paz 10:00-18:00, Pazartesi kapalı"},
    {id:"n_heiliggeist",cat:"hist",name:"Heilig-Geist-Spital",wiki:"de:Heilig-Geist-Spital (Nürnberg)",lat:49.453395,lon:11.080395,pid:"ChIJPcvUFgBXn0cRyIoCZc1ePQ8",desc:"Pegnitz'in üstüne kemerlerle oturtulmuş Orta Çağ hastanesi.",hist:"1332'de zengin bir tüccar olan Konrad Groß, yaşlı ve hastalar için bu vakıf hastanesini kurdu. Bina nehrin iki koluna kemerlerle oturur, bu yüzden hem karadan hem sudan girilebilirdi. İmparatorluk tacı ve kutsal emanetler 1424'ten itibaren yüzyıllarca bu binanın kilisesinde saklandı.\n\nBugün bir bölümü huzurevi, bir bölümü de geleneksel Frankonya lokantası.",why:"En güzel görüntüsü Museumsbrücke'den, nehrin üstünden.",dur:"10 dk",fee:"Dışarıdan ücretsiz",hours:"Dışarıdan her zaman"},
    {id:"n_memorium",cat:"hist",name:"Memorium Nürnberger Prozesse (Saal 600)",wiki:"Memorium_Nuremberg_Trials",lat:49.4543936,lon:11.0482094,pid:"ChIJ_d3zJlpWn0cRvHffruH1lvo",desc:"Nazi liderlerinin yargılandığı mahkeme salonu ve müze. Eski şehrin 3 km batısında.",hist:"20 Kasım 1945'te bu Adalet Sarayı'nın 600 numaralı salonunda tarihte ilk kez bir devletin liderleri uluslararası bir mahkemede yargılandı. Müttefikler Nürnberg'i bilerek seçti: binası savaştan sağlam çıkmıştı, yanında büyük bir hapishane vardı ve Nazi partisinin kongre şehri olarak sembolik bir anlamı vardı.\n\nDava 1 Ekim 1946'da sona erdi. Sanıkların çoğu suçlu bulundu, on iki kişi idama mahkûm edildi. Burada konan ilkeler, insanlığa karşı suç kavramı ve bugünkü Uluslararası Ceza Mahkemesi'nin temeli oldu.\n\nMüze salonun üst katında. Salonun kendisine de girilebilir, duruşma kayıtlarından görüntüler izletilir.",why:"Tarihin dönüm noktalarından birinin geçtiği yer. Sesli rehber İngilizce.",dur:"1 sa 30 dk",fee:"Ücretli",hours:"Pzt ve Çar-Cum 09:00-18:00, Cmt-Paz 10:00-18:00, Salı kapalı",tip:"Salı kapalı. U1 metrosu ile Bärenschanze durağı."},
    {id:"n_doku",cat:"hist",name:"Dokuzentrum Reichsparteitagsgelände",wiki:"Documentation_Center_Nazi_Party_Rally_Grounds",lat:49.4339206,lon:11.1127118,pid:"ChIJ24QK2MRZn0cRVeQyPYtH0Ho",desc:"Nazi partisinin kongre alanındaki belgeleme merkezi. Yeni sergisi Mayıs 2026'da açıldı.",hist:"Nazi partisi 1933-1938 arasında yıllık kongrelerini (Reichsparteitag) Nürnberg'de yaptı. Şehrin güneydoğusunda bunun için devasa bir alan planlandı. 1935'teki kongrede Yahudileri vatandaşlıktan çıkaran Nürnberg Yasaları ilan edildi.\n\nBelgeleme merkezi, bitirilemeyen Kongresshalle'nin bir kanadına yerleşti. Mimar Günther Domenig binanın içinden geçen cam ve çelik bir \"kazık\" ekledi: Nazi mimarisinin taş ağırlığını delen bir hat. Yenilenen kalıcı sergi Nürnberg ve Parti Kongreleri 22 Mayıs 2026'dan beri deneme işletmesinde, resmî açılışı 4 Kasım 2026'da yapılacak.",why:"Kongresshalle ve Zeppelin tribünüyle birlikte yarım gün. Tramvay 8 ile Doku-Zentrum durağı.",dur:"2 sa",fee:"Ücretli",hours:"Pzt-Cum 09:00-18:00, Cmt-Paz 10:00-18:00 (Google'a göre)"},
    {id:"n_kongress",cat:"hist",name:"Kongresshalle",wiki:"Congress_Hall_(Nuremberg)",lat:49.4323818,lon:11.1125338,pid:"ChIJ5UooKthZn0cRtZGkxOUaut4",desc:"Roma Kolezyumu'ndan esinlenen, hiç bitirilemeyen dev Nazi kongre binası.",hist:"Bina 50.000 kişilik bir kongre salonu olarak tasarlandı ve 1935'te inşaatı başladı. Savaş çıkınca yarım kaldı; çatısı hiç yapılmadı. Bugün ayakta kalan en büyük Nazi dönemi yapısıdır.\n\nİç avluya şu an Nürnberg operası için geçici bir tiyatro yapılıyor. Bu yüzden yorumlara göre avlunun görüntüsü inşaat nedeniyle kapalı. Dışarıdan, Dutzendteich gölünün kıyısından boyutu en iyi anlaşılır.",why:"Dokuzentrum'un hemen yanında. Göl kıyısından dışına bak.",dur:"20 dk",fee:"Dışarıdan ücretsiz",hours:"Dışarıdan her zaman"},
    {id:"n_zeppelin",cat:"hist",name:"Zeppelintribüne",wiki:"Zeppelinfeld",lat:49.4314767,lon:11.1249574,pid:"ChIJOdSgmyBZn0cRqt7iGL-PJjw",desc:"Hitler'in konuşmalarını yaptığı taş tribün. Bugün yarı harabe, ücretsiz gezilebiliyor.",hist:"Albert Speer'in tasarladığı tribün 1934-1937 arasında yapıldı. Önündeki alan yüz binlerce kişilik geçit törenleri içindi. Ortasındaki kürsüden Hitler konuşurdu. 1945'te Amerikan ordusu tribünün tepesindeki dev gamalı haçı havaya uçurdu.\n\nBugün tribün çürüyor ve şehir onu yıkmak yerine korumaya karar verdi: tarihin bu yüzü unutulmasın diye. Basamaklarda bilgi panoları var. Alan bugün yarış pisti ve konser yeri olarak kullanılıyor.",why:"Ücretsiz. Kürsünün üstüne çıkıp alanın büyüklüğüne bak.",dur:"30 dk",fee:"Ücretsiz",hours:"Gündüz açık alan"},
    /* ================= PARK ================= */
    {id:"n_burggarten",cat:"park",name:"Burggarten (Kale Bahçesi)",wiki:"Nuremberg_Castle",gen:1,lat:49.4584149,lon:11.0746996,pid:"ChIJvQD6x7FXn0cRPlK9HxmxIx8",desc:"Kalenin surları üzerinde, şehre bakan bahçe.",hist:"Kale bahçeleri 15. yüzyıldan beri burada. İmparator III. Friedrich'in \"asma bahçeler\" yaptırdığı anlatılır. Bugünkü bahçe surların tabyaları üzerine kurulu ve sonbaharda renkleriyle çok güzel.",why:"Kaleden sonra ücretsiz bir dinlenme ve manzara.",dur:"20 dk",fee:"Ücretsiz",hours:"Her gün yaklaşık 09:00-18:00 (mevsime göre)"},
    /* ================= FOTO NOKTALARI ================= */
    {id:"n_maxbruecke",cat:"photo",name:"Maxbrücke (Weinstadel manzarası)",wiki:"de:Weinstadel (Nürnberg)",gen:1,lat:49.4534382,lon:11.0725756,pid:"ChIJAaWt7q5Xn0cRlJOiluHGNW4",desc:"Nürnberg'in en ünlü manzarası: Henkersteg, cellât kulesi ve Weinstadel aynı karede.",hist:"Maxbrücke Nürnberg'in en eski taş köprülerinden biridir. Doğuya bakınca kapalı ahşap Henkersteg, solda yarı ahşap Weinstadel ve nehrin üstündeki su kulesi görünür. Akşam ışıklar yanınca daha da güzel.",why:"Nürnberg'in kartpostal karesi.",dur:"10 dk",fee:"Ücretsiz",hours:"Her zaman açık"},

    {id:"n_tiergaertner",cat:"photo",name:"Tiergärtnertorplatz",wiki:"de:Tiergärtnertor",lat:49.4574417,lon:11.0744156,pid:"ChIJk3dvEwBXn0cRJrtjF9aS7_I",desc:"Kalenin dibinde, yarı ahşap evler ve sur kapısıyla çevrili küçük meydan.",hist:"Tiergärtnertor, kalenin altındaki sur kapısıdır; adını imparatorların av hayvanlarını tuttuğu bahçeden alır. Meydanda Dürer Evi, Pilatushaus ve Dürer'in tavşanından esinlenen tuhaf bronz tavşan heykeli var. Yazın akşamları meydan, kaldırımda bira içenlerle dolar.",why:"Kale ile Dürer Evi arasında, Playmobil sahnesi gibi bir meydan.",dur:"15 dk",fee:"Ücretsiz",hours:"Her zaman açık"},
    {id:"n_ehekarussell",cat:"photo",name:"Ehekarussell (Evlilik Atlıkarıncası)",wiki:"de:Ehekarussell",lat:49.4505739,lon:11.0709227,pid:"ChIJj4eLa6lXn0cRJZhw8wrntVc",desc:"Evliliğin tatlı ve acı bütün hallerini anlatan tuhaf ve büyük bronz çeşme.",hist:"Heykeltıraş Jürgen Weber çeşmeyi 1984'te Beyaz Kule'nin önüne yaptı. Konusu Nürnbergli şair Hans Sachs'ın 1541 tarihli Acı Tatlı Evlilik Hayatı şiiridir: ilk aşktan kavgalara, çocuklardan ölüm döşeğine kadar. Figürler hem komik hem ürkütücüdür ve şehirde uzun süre tartışma yarattı.",why:"İkiniz için güzel ve komik bir fotoğraf durağı. Etrafında yavaşça dolaş.",dur:"15 dk",fee:"Ücretsiz",hours:"Her zaman açık"},
