<style>
:root{
  --sun-hi:#FFB547;--sun:#FF7A45;--sun-deep:#E8483F;--sun-ink:#7A1E1A;
  --orange:#FF8A1F;--orange-deep:#E85D04;--orange-soft:#FFD9A8;
  --ink:#3A1D0B;--ink-soft:#7A5236;--paper:#FFF7EA;--white:#fff;
  --hist:#6C4DF5;--arch:#55606E;--park:#1E9E5A;--food:#F0355B;--coffee:#7A4A2A;--bakery:#D4891F;--market:#2F7D8C;--photo:#D99A00;--walk:#1D3FA8;--me:#1273EB;
  --shadow:0 4px 0 rgba(58,29,11,.22);
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--orange);color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1,h2,h3,p,dl{margin:0}
.app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.screen{flex:1;min-height:0;position:relative}

/* Ana ekran */
#home{overflow-y:auto;padding:22px 16px 28px;display:flex;flex-direction:column;gap:18px;background:linear-gradient(170deg,var(--sun-hi),var(--sun) 40%,var(--sun-deep))}
.logo{display:flex;align-items:center;gap:12px}
.logo svg{width:60px;height:60px;flex:none;filter:drop-shadow(0 4px 0 rgba(58,29,11,.25))}
.word{font-family:var(--display);font-size:38px;line-height:.9;color:var(--white);font-weight:800;text-shadow:0 3px 0 var(--sun-deep)}
.word b{display:block;font-size:19px;letter-spacing:.34em;color:var(--sun-ink);text-shadow:none;font-weight:800;margin-top:4px}
.city-card{position:relative;display:block;width:100%;height:300px;text-align:left;border-radius:26px;border:4px solid var(--white);box-shadow:0 8px 0 rgba(58,29,11,.25);overflow:hidden;background:#B8431B;color:var(--white)}
.city-card:active{transform:translateY(3px)}
.city-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.city-card::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(40,16,4,.88))}
.city-body{position:absolute;left:16px;right:16px;bottom:14px;z-index:1;display:flex;flex-direction:column;gap:6px}
.city-name{font-family:var(--display);font-weight:800;font-size:40px;line-height:1}
.city-meta{font-weight:800;font-size:13.5px}
.go{align-self:flex-start;margin-top:4px;font-family:var(--display);font-weight:800;font-size:18px;color:var(--ink);background:var(--white);padding:7px 22px;border-radius:99px}
.ghost{border:3px dashed rgba(255,255,255,.8);border-radius:20px;padding:14px 16px;color:var(--white);font-weight:800;width:100%;text-align:left}
.ghost small{display:block;font-weight:700;color:var(--ink);margin-top:2px}
.note{background:var(--paper);border-radius:16px;padding:12px 14px;font-weight:700;font-size:13.5px}

/* Şehir ekranı */
#city{display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:8px 12px 6px}
.back{height:40px;padding:0 14px 0 10px;border-radius:99px;background:var(--white);box-shadow:var(--shadow);display:flex;align-items:center;gap:6px;flex:none;font-weight:800;font-size:14px;color:var(--ink)}
.back svg{width:18px;height:18px;flex:none}
.city-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--display);font-weight:800;font-size:23px;color:var(--white);text-shadow:0 3px 0 var(--orange-deep);line-height:1}
.gps{position:absolute;top:10px;left:10px;z-index:460;max-width:calc(100% - 20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 0 rgba(58,29,11,.18);font-size:12px;font-weight:800;background:rgba(255,255,255,.9);padding:5px 10px;border-radius:99px;display:flex;align-items:center;gap:6px}
.gps i{width:9px;height:9px;border-radius:50%;background:#B9A089}
.gps.on i{background:var(--me);box-shadow:0 0 0 3px rgba(18,115,235,.25)}
.gps.err i{background:var(--food)}
.chips{display:flex;gap:8px;padding:4px 12px 10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;font-weight:800;font-size:14px;padding:0 15px 0 12px;border-radius:99px;background:var(--white);box-shadow:var(--shadow);height:40px}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="false"]{background:rgba(255,255,255,.4);box-shadow:none;color:var(--ink-soft)}
.chip[aria-pressed="false"] i{background:transparent;border:2px solid var(--ink-soft)}
.view{flex:1;min-height:0;position:relative;border-top:4px solid var(--white);border-radius:22px 22px 0 0;overflow:hidden;background:#F6D9B0}
#map{position:absolute;inset:0;background:#F6D9B0;font-family:var(--body)}
.maplibregl-ctrl-attrib{font-size:10px}
.mk{display:block;cursor:pointer}
.mk.on{z-index:5}
.mk span{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:2px;white-space:nowrap;background:var(--white);border-radius:99px;box-shadow:0 2px 0 rgba(58,29,11,.2);font-weight:800;font-size:11.5px;color:var(--ink);padding:1px 8px;font-family:var(--body);display:none;pointer-events:none}
.mk.on span{display:block}
.mk{background:none;border:0;padding:0}
.mk.dim{opacity:.6}
.art{display:block;width:44px;height:52px;filter:drop-shadow(0 2px 0 rgba(58,29,11,.45)) drop-shadow(0 0 1.5px #fff)}
.hasart .pin{display:none}
.far .hasart .art{display:none}
.far .hasart .pin{display:grid}
.far .pin{width:22px;height:22px;border-width:2px;margin-bottom:4px}
.far .pin b{font-size:8px}
.mk.on .art{filter:drop-shadow(0 0 0 #3A1D0B) drop-shadow(0 0 3px #3A1D0B)}
.rstart.ferry{background:#0B8FB8;font-size:11px;font-family:var(--body)}
.src{font-size:12px;color:var(--ink-soft);font-weight:700}
.src a{color:var(--orange-deep)}
.histxt+.histxt{margin-top:-2px}
.pin{width:30px;height:30px;margin-bottom:6px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);border:3px solid var(--white);box-shadow:-2px 3px 0 rgba(58,29,11,.3);display:grid;place-items:center}
.pin b{transform:rotate(45deg);color:var(--white);font-weight:800;font-size:11px;line-height:1;font-family:var(--body)}
.pin b:empty{width:8px;height:8px;border-radius:50%;background:var(--white)}
.pin.ring b:empty{background:transparent;border:2.5px solid var(--white);width:11px;height:11px}
.pin.done{filter:saturate(.3);opacity:.75}
.pin.fav{border-color:#FFD23F}
.pin.sel{width:38px;height:38px;border-color:var(--ink)}
.rstart{width:30px;height:30px;border-radius:50%;background:var(--walk);border:3px solid var(--white);box-shadow:0 3px 0 rgba(58,29,11,.3);display:grid;place-items:center;color:var(--white);font-weight:800;font-family:var(--display);font-size:16px}
.rstart.sel{border-color:var(--ink)}
.medot{width:22px;height:22px;border-radius:50%;background:var(--me);border:4px solid var(--white);box-shadow:0 0 0 0 rgba(18,115,235,.5);animation:pulse 1.6s infinite}
@keyframes pulse{to{box-shadow:0 0 0 20px rgba(18,115,235,0)}}
.fab{position:absolute;right:12px;bottom:34px;width:52px;height:52px;border-radius:50%;background:var(--white);box-shadow:var(--shadow);display:grid;place-items:center;z-index:500}
.fab span{width:18px;height:18px;border-radius:50%;border:4px solid var(--me);box-shadow:inset 0 0 0 3px var(--white),inset 0 0 0 9px var(--me)}
#loading{position:absolute;inset:0;z-index:450;display:grid;place-items:center;align-content:center;gap:12px;background:#F6D9B0;font-weight:800;color:var(--ink-soft);text-align:center;padding:24px}
#loading i{width:44px;height:44px;border-radius:50%;border:5px solid rgba(58,29,11,.15);border-top-color:var(--orange-deep);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.help{position:absolute;left:12px;bottom:34px;width:44px;height:44px;border-radius:50%;background:var(--white);box-shadow:var(--shadow);z-index:500;font-family:var(--display);font-weight:800;font-size:20px}
#legend{position:absolute;left:12px;right:12px;bottom:90px;z-index:650;background:var(--paper);border-radius:18px;box-shadow:0 6px 20px rgba(58,29,11,.3);padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;font-size:13.5px;font-weight:700}
#legend h3{grid-column:1/-1;font-family:var(--display);font-size:17px;display:flex;justify-content:space-between;align-items:center}
#legend h3 button{font-size:13px;font-weight:800;color:var(--orange-deep);padding:4px}
#legend .sw{width:22px;height:22px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 1px 0 rgba(58,29,11,.3)}
#legend .ln{width:26px;height:0;border-top:5px dotted var(--c)}
#legend .ln.d{border-top-style:dashed}
#legend .me{width:18px;height:18px;border-radius:50%;background:var(--me);border:3px solid #fff;margin-left:2px}
#legend p{grid-column:1/-1;color:var(--ink-soft);font-size:12.5px}
.search{position:sticky;top:-14px;z-index:2;margin:-14px -16px 4px;padding:12px 16px 10px;background:var(--paper)}
.search input{width:100%;height:46px;border-radius:14px;border:2px solid #EBD3B4;background:#fff;padding:0 14px;font:inherit;font-weight:700;color:var(--ink)}
.search input:focus{outline:none;border-color:var(--orange)}
.prog{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 2px 0 rgba(58,29,11,.12);font-weight:800;font-size:13.5px}
.prog .bar{flex:1;height:10px;border-radius:99px;background:#F3E2CC;overflow:hidden}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--orange-deep));border-radius:99px}
.city-prog{display:flex;align-items:center;gap:8px;font-weight:800;font-size:12.5px}
.city-prog .bar{flex:1;max-width:160px;height:8px;border-radius:99px;background:rgba(255,255,255,.35);overflow:hidden}
.city-prog .bar i{display:block;height:100%;background:#fff}
.grab{position:sticky;top:0;z-index:3;height:22px;display:grid;place-items:center;margin-bottom:-22px;pointer-events:none}
.grab::before{content:"";width:44px;height:5px;border-radius:99px;background:rgba(58,29,11,.28)}
.stars{color:#C98200;font-weight:800}
.rd{color:var(--ink-soft);font-weight:700}
.factbtn{position:absolute;top:10px;right:10px;z-index:460;display:flex;align-items:center;gap:6px;height:42px;padding:0 16px 0 12px;border-radius:99px;background:linear-gradient(#FFB347,var(--orange-deep));color:#fff;font-family:var(--display);font-weight:800;font-size:16px;box-shadow:0 4px 0 #B84A00,0 6px 14px rgba(58,29,11,.25);animation:nudge 3s ease-in-out 1.2s 2}
.factbtn span{font-size:20px}
@keyframes nudge{0%,100%{transform:none}8%{transform:rotate(-4deg) scale(1.05)}16%{transform:rotate(4deg) scale(1.05)}24%{transform:none}}
.ptspill{position:absolute;top:60px;right:10px;z-index:460;display:flex;align-items:center;gap:5px;height:34px;padding:0 12px;border-radius:99px;background:var(--white);box-shadow:var(--shadow);font-weight:800;font-size:13.5px}
#factModal{position:fixed;inset:0;z-index:900;background:rgba(40,16,4,.55);display:grid;place-items:center;padding:20px}
.fact{width:100%;max-width:400px;background:var(--paper);border-radius:26px;border:4px solid #fff;box-shadow:0 10px 0 rgba(58,29,11,.25);padding:20px 18px 18px;display:flex;flex-direction:column;gap:10px;animation:pop .25s ease-out;max-height:90vh;overflow-y:auto}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.fact-k{align-self:flex-start;font-weight:800;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--orange-deep);padding:3px 10px;border-radius:99px}
.fact-e{font-size:46px;line-height:1}
.fact h2{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1}
.fact p{line-height:1.5;font-size:15.5px}
.fact-b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.qhead{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#FFA23F,var(--orange-deep));color:#fff;border-radius:20px;padding:16px;box-shadow:0 4px 0 rgba(58,29,11,.2)}
.qpts{display:flex;flex-direction:column;align-items:center;min-width:76px}
.qpts b{font-family:var(--display);font-size:40px;line-height:1}
.qpts span{font-weight:800;font-size:12px}
.qlv{flex:1;display:flex;flex-direction:column;gap:6px}
.qlv b{font-family:var(--display);font-size:22px;line-height:1}
.qlv .bar{height:10px;border-radius:99px;background:rgba(255,255,255,.35);overflow:hidden}
.qlv .bar i{display:block;height:100%;background:#fff;border-radius:99px}
.qlv small{font-weight:800;font-size:12px}
.qstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.qstats span{background:#fff;border-radius:14px;padding:8px;text-align:center;font-size:11.5px;font-weight:700;color:var(--ink-soft);box-shadow:0 2px 0 rgba(58,29,11,.12)}
.qstats b{display:block;font-family:var(--display);font-size:20px;color:var(--ink)}
.qcard{background:#fff;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 0 rgba(58,29,11,.12)}
.qcard.ok{background:#EEF8EE}
.qdiff{align-self:flex-start;color:#fff;font-weight:800;font-size:11.5px;padding:3px 10px;border-radius:99px}
.qt{font-family:var(--display);font-size:19px;line-height:1.15}
.qcard p{font-size:14px;line-height:1.4}
.qat{align-self:flex-start;font-weight:800;font-size:13px;color:var(--orange-deep);text-align:left}
.qbtn{cursor:pointer}
.qdone{font-weight:800;color:#1E7A43}
.qwait{font-weight:800;color:var(--ink-soft)}
.qimg{width:100%;max-height:220px;object-fit:cover;border-radius:12px}
.qq{font-weight:800}
.qopt{text-align:left;justify-content:flex-start;padding:8px 12px}
.qopt.wrong{background:#FDE2E4;color:#9B1C2C;box-shadow:none}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.badge{background:#fff;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;opacity:.45;filter:grayscale(1);box-shadow:0 2px 0 rgba(58,29,11,.12)}
.badge.on{opacity:1;filter:none;border:2px solid #FFD23F}
.badge span{font-size:26px}
.badge b{font-size:14px}
.badge small{font-size:11.5px;color:var(--ink-soft);font-weight:700}
.qhow{font-size:13px;line-height:1.55;color:var(--ink-soft);font-weight:700;background:#fff;border-radius:14px;padding:12px}
.tab{font-size:13.5px}
#splash{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(170deg,var(--sun-hi),var(--sun) 45%,var(--sun-deep));animation:spOut .5s ease-in 2.9s forwards;cursor:pointer}
.sp-logo{width:116px;height:116px;animation:spZoom 1.05s cubic-bezier(.2,1.4,.4,1) both;filter:drop-shadow(0 8px 0 rgba(58,29,11,.25))}
.sp-svg{width:100%;height:100%}
.sp-word{display:flex;flex-direction:column;align-items:center;font-family:var(--display);line-height:.9;clip-path:inset(0 100% 0 0);animation:spMask .75s cubic-bezier(.6,0,.2,1) 1s forwards}
.sp-word span{font-size:54px;font-weight:800;color:#fff;text-shadow:0 4px 0 var(--sun-deep)}
.sp-word b{font-size:26px;letter-spacing:.42em;margin-right:-.42em;color:var(--sun-ink);margin-top:4px}
.sp-motto{font-family:var(--display);font-weight:700;font-size:19px;color:#fff;opacity:0;transform:translateY(10px);animation:spUp .6s ease-out 1.75s forwards}
@keyframes spZoom{0%{transform:scale(3.4) rotate(-12deg);opacity:0}55%{opacity:1}100%{transform:none;opacity:1}}
@keyframes spMask{to{clip-path:inset(0 0 0 0)}}
@keyframes spUp{to{opacity:1;transform:none}}
@keyframes spOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#splash{animation:spOut .3s 1.2s forwards}.sp-word{clip-path:none}.sp-motto{opacity:1;transform:none}}
.planchip{position:absolute;left:50%;transform:translateX(-50%);bottom:34px;z-index:470;height:40px;padding:0 14px;border-radius:99px;background:var(--ink);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.planning .mk{opacity:.3}
.planning .mk.on{opacity:1}
.pmk{width:30px;height:30px;border-radius:50%;background:#E85D04;color:#fff;border:3px solid #fff;font-weight:800;font-size:13px;display:grid;place-items:center;box-shadow:0 3px 0 rgba(58,29,11,.35);cursor:pointer;font-family:var(--body)}
.pmk.meal{background:#7A4A2A}
.pmk.start{background:var(--ink);font-size:11px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.phead b{display:block;font-family:var(--display);font-size:22px;line-height:1.1}
.phead small{font-weight:700;color:var(--ink-soft);font-size:12.5px}
.phead .btn{min-height:40px;padding:0 14px}
#list>*{flex-shrink:0}
.pdays{display:flex;gap:8px;overflow-x:auto}
.pday{flex:none;height:40px;padding:0 16px;border-radius:99px;background:#fff;font-weight:800;box-shadow:0 2px 0 rgba(58,29,11,.12)}
.pday[aria-pressed="true"]{background:var(--orange-deep);color:#fff}
.psum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.psum span{background:#fff;border-radius:14px;padding:8px;text-align:center;font-size:11.5px;font-weight:700;color:var(--ink-soft);box-shadow:0 2px 0 rgba(58,29,11,.12)}
.psum b{display:block;font-family:var(--display);font-size:17px;color:var(--ink)}
.pact{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pact .btn:first-child:last-child{grid-column:1/-1}
.ptl{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.pwalk{font-size:12.5px;font-weight:700;color:var(--ink-soft);padding:2px 0 2px 46px;border-left:3px dotted #E7C79F;margin-left:16px}
.pstop{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border-radius:14px;padding:9px 12px;box-shadow:0 2px 0 rgba(58,29,11,.12);border-left:6px solid var(--c)}
.pstop .pn{flex:none;width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center}
.pstop .pt{flex:none;font-weight:800;font-size:13px;color:var(--orange-deep);width:42px}
.pstop .pb{flex:1;min-width:0}
.pstop .pb b{display:block;line-height:1.2}
.pstop .pb small{color:var(--ink-soft);font-weight:700;font-size:12px}
.pstop em{font-style:normal;font-weight:800;color:#1E7A43}
.pform{display:flex;flex-direction:column;gap:8px}
.pq{font-weight:800;margin-top:6px}
.prow{display:flex;flex-wrap:wrap;gap:8px}
.pcol{display:flex;flex-direction:column;gap:8px}
.pchip{min-height:42px;padding:0 16px;border-radius:99px;background:#fff;font-weight:800;box-shadow:0 2px 0 rgba(58,29,11,.12)}
.pchip.big{border-radius:16px;padding:10px 14px;text-align:left;display:flex;flex-direction:column;align-items:flex-start}
.pchip.big small{font-weight:700;font-size:12.5px;color:var(--ink-soft)}
.pchip[aria-pressed="true"]{background:var(--orange-deep);color:#fff}
.pchip[aria-pressed="true"] small{color:#FFE3C2}
.pgo{margin-top:10px;min-height:52px;font-size:16px}
.tab{font-size:13px}
.ic{width:1.2em;height:1.2em;flex:none;vertical-align:-.22em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn .ic{margin-right:6px}
.btn{display:flex;align-items:center;justify-content:center}
.pin b .ic{width:14px;height:14px;stroke-width:2.5;vertical-align:0}
.factbtn .ic{width:21px;height:21px;stroke-width:2.3}
.ptspill .ic{color:#F4B400;width:17px;height:17px}
.fact-art{width:84px;height:98px;filter:drop-shadow(0 3px 0 rgba(58,29,11,.25))}
.fact-ic{width:64px;height:64px;border-radius:50%;background:var(--orange-soft);color:var(--orange-deep);display:grid;place-items:center}
.fact-ic .ic{width:34px;height:34px}
.badge .ic{width:28px;height:28px;color:var(--orange-deep)}
.qat .ic,.pwalk .ic,.pstop small .ic{width:15px;height:15px}
.pmk.start .ic{width:14px;height:14px;stroke-width:2.6}
.pts{display:flex;flex-direction:column;background:#fff;border-radius:14px;box-shadow:0 2px 0 rgba(58,29,11,.12);overflow:hidden}
.pts div{display:flex;align-items:center;gap:10px;padding:10px 12px;font-weight:700;font-size:14px}
.pts div+div{border-top:1px solid #F3E2CC}
.pts .ic{color:var(--orange-deep);width:20px;height:20px}
.pts span{flex:1}
.pts b{font-family:var(--display);font-size:16px;white-space:nowrap}
.pnote{font-size:12.5px;color:var(--ink-soft);font-weight:700}
.plancard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--paper);border-radius:22px;padding:14px 16px;box-shadow:0 6px 0 rgba(58,29,11,.22)}
.plancard .pci{width:52px;height:52px;border-radius:16px;background:linear-gradient(160deg,var(--sun),var(--sun-deep));color:#fff;display:grid;place-items:center;flex:none}
.plancard .pci .ic{width:28px;height:28px}
.plancard b{display:block;font-family:var(--display);font-size:20px;line-height:1.1}
.plancard small{display:block;font-weight:700;color:var(--ink-soft);font-size:13px;margin-top:2px}
#toast{position:absolute;left:12px;right:76px;bottom:34px;z-index:500;background:var(--ink);color:var(--white);padding:10px 14px;border-radius:14px;font-weight:700;font-size:13px}

/* Liste */
#list{position:absolute;inset:0;z-index:600;overflow-y:auto;background:var(--paper);padding:14px 16px 20px;display:flex;flex-direction:column;gap:8px}
.lh{font-family:var(--display);font-weight:800;font-size:19px;margin-top:8px;display:flex;align-items:center;gap:8px}
.lh i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--white);border-radius:14px;padding:9px 12px;box-shadow:0 2px 0 rgba(58,29,11,.12);min-height:52px;border-left:6px solid var(--c)}
.row b{display:block;font-weight:800;line-height:1.2}
.row small{color:var(--ink-soft);font-weight:700}
.row div{min-width:0;flex:1}
.row em{font-style:normal;font-weight:800;font-size:12px;color:var(--ink-soft);flex:none;text-align:right}
.empty,.foot{font-weight:700;color:var(--ink-soft);padding:14px 0;font-size:12.5px}

/* Alt çubuk */
.tabs{display:flex;background:var(--white);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));gap:6px;box-shadow:0 -3px 0 rgba(58,29,11,.12);z-index:8}
.tab{flex:1;height:44px;border-radius:14px;font-weight:800;font-size:14.5px;color:var(--ink-soft)}
.tab[aria-selected="true"]{background:var(--orange-soft);color:var(--orange-deep)}

/* Kart */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:700;background:var(--paper);border-radius:24px 24px 0 0;box-shadow:0 -8px 24px rgba(58,29,11,.35);max-height:64%;overflow-y:auto;animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(100%)}}
.photo{position:relative;height:190px;background:var(--orange-soft)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo a{position:absolute;right:8px;bottom:6px;font-size:10.5px;font-weight:800;color:var(--white);background:rgba(0,0,0,.5);padding:2px 8px;border-radius:99px;text-decoration:none}
.photo.none{height:54px;background:none}
.x{position:absolute;right:12px;top:12px;z-index:2;width:40px;height:40px;border-radius:50%;background:var(--white);box-shadow:var(--shadow);font-weight:800;font-size:18px}
.sbody{padding:14px 16px 18px;display:flex;flex-direction:column;gap:11px}
.tag{align-self:flex-start;font-weight:800;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--white);background:var(--c);padding:3px 10px;border-radius:99px}
#sheet h2{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;text-wrap:balance}
.why{font-weight:800;color:var(--orange-deep)}
.sec{font-family:var(--display);font-weight:800;font-size:17px;margin-bottom:-6px}
.histxt{line-height:1.5}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.facts dt{font-weight:800;color:var(--ink-soft)}
.facts dd{margin:0;font-weight:700}
.open-q{background:#FFE9C7;border-radius:10px;padding:6px 10px;font-size:12.5px;font-weight:700}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{min-height:46px;border-radius:14px;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;padding:4px 8px;background:var(--white);color:var(--ink);box-shadow:var(--shadow)}
.btn.primary{background:#18A957;color:var(--white);box-shadow:0 4px 0 #0E7A3C}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--white)}
@media (min-width:760px){#sheet{left:auto;right:16px;bottom:16px;width:400px;border-radius:24px;max-height:calc(100% - 32px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
