/* ---------- Rota modu: rotayı başlat, konum oku, haritayı yöne göre çevir ----------
   Google Maps kadar yakına inilmez (NAV_ZOOM); harita hafif eğilir ve yürüdüğün yöne döner.
   Yön, yürürken GPS'ten, dururken telefonun pusulasından alınır. Hiçbiri yoksa rotanın sıradaki noktasına bakılır. */
var NAV = null;
var NAV_IC = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l7.5 18.2-7.5-4.3-7.5 4.3z" fill="currentColor"/></svg>';
var NAV_ZOOM = 16.4, NAV_PITCH = 48, NAV_KMH = 4.5;
var navHead = null, navGpsHead = null, navGpsT = 0, compassOn = false, mapTouch = false;

function makeMe(){
  const d = document.createElement("div"); d.className = "meloc" + (NAV ? " nav" : "");
  d.innerHTML = `<i class="halo"></i><i class="dot"></i><i class="arrow"><svg viewBox="0 0 46 46"><path d="M23 5c1.2 0 2 .7 2.6 1.9l11.6 26.4c1 2.3-1.3 4.4-3.5 3.2L23 31l-10.7 5.5c-2.2 1.2-4.5-.9-3.5-3.2L20.4 6.9C21 5.7 21.8 5 23 5z" fill="#1273EB" stroke="#fff" stroke-width="3.6" stroke-linejoin="round"/><path d="M23 12l7 16-7-3.6z" fill="#fff" opacity=".28"/></svg></i>`;
  return new maplibregl.Marker({element:d, rotationAlignment:"map", pitchAlignment:"map"}).setLngLat(ll(me)).addTo(map);
}
function meShape(){ if (meMarker){ meMarker.getElement().classList.toggle("nav", !!NAV); meMarker.setRotation(NAV && navHead !== null ? navHead : 0); } }

/* Pusula düğmesi: harita döndüyse görünür, dokununca kuzeye döner. */
function compassUI(){
  const c = $("#compass"); if (!c || !map) return;
  const b = map.getBearing(); $("#needle").setAttribute("transform", `rotate(${-b} 15 15)`);
  c.hidden = tab !== "map" || (Math.abs(b) < 1 && !NAV);
}
$("#compass").addEventListener("click", () => {
  if (!map) return;
  if (NAV){ navFollow(false); map.easeTo({bearing:0, duration:500}); return; }
  map.easeTo({bearing:0, pitch:0, duration:500});
});

/* Yön: kısa yoldan, yumuşak geçiş. */
const angD = (a, b) => ((b - a + 540) % 360) - 180;
function setHead(h){
  if (h === null || isNaN(h)) return;
  navHead = navHead === null ? h : (navHead + angD(navHead, h) * 0.35 + 360) % 360;
  meShape();
}
function onCompass(e){
  let h = null;
  if (typeof e.webkitCompassHeading === "number") h = e.webkitCompassHeading;
  else if (e.absolute && typeof e.alpha === "number") h = 360 - e.alpha;
  if (h === null) return;
  h = (h + (screen.orientation ? screen.orientation.angle : (window.orientation || 0)) + 360) % 360;
  if (Date.now() - navGpsT < 4000) return; // yürürken GPS yönü daha güvenilir
  setHead(h); navCam();
}
function compassStart(){
  if (compassOn) return;
  const go = () => { compassOn = true; addEventListener("deviceorientationabsolute", onCompass); addEventListener("deviceorientation", onCompass); };
  try {
    if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function")
      DeviceOrientationEvent.requestPermission().then(r => { if (r === "granted") go(); }).catch(() => {});
    else go();
  } catch(e){}
}

/* Rota çizgisi yardımcıları */
const mOf = (a, b) => km(a, b) * 1000;
function cumOf(line){ const c = [0]; for (let i = 1; i < line.length; i++) c.push(c[i-1] + mOf(line[i-1], line[i])); return c; }
/* Noktayı çizginin en yakın parçasına izdüşürür: {i: parça başı, t: 0-1, at: baştan metre, d: uzaklık, q: izdüşüm}. */
function nearSeg(line, cum, p, from, to){
  const kx = Math.cos(p[0] * Math.PI / 180) * 111320, ky = 110540; let best = {i:from, t:0, d:1e9};
  to = Math.min(to, line.length - 2);
  for (let i = from; i <= to; i++){
    const a = line[i], b = line[i+1], ax = (a[1]-p[1])*kx, ay = (a[0]-p[0])*ky, bx = (b[1]-p[1])*kx, by = (b[0]-p[0])*ky;
    const dx = bx - ax, dy = by - ay, L2 = dx*dx + dy*dy, t = L2 ? Math.max(0, Math.min(1, -(ax*dx + ay*dy) / L2)) : 0;
    const d = Math.hypot(ax + dx*t, ay + dy*t); if (d < best.d) best = {i, t, d};
  }
  const a = line[best.i], b = line[Math.min(best.i + 1, line.length - 1)];
  best.q = [a[0] + (b[0]-a[0])*best.t, a[1] + (b[1]-a[1])*best.t];
  best.at = cum[best.i] + (cum[Math.min(best.i + 1, cum.length - 1)] - cum[best.i]) * best.t; return best;
}
const bearingOf = (a, b) => { const r = Math.PI/180, y = Math.sin((b[1]-a[1])*r)*Math.cos(b[0]*r), x = Math.cos(a[0]*r)*Math.sin(b[0]*r) - Math.sin(a[0]*r)*Math.cos(b[0]*r)*Math.cos((b[1]-a[1])*r); return (Math.atan2(y, x)/r + 360) % 360; };

function navLayers(){
  const empty = {type:"Feature", geometry:{type:"LineString", coordinates:[]}};
  ["nav-done","nav-todo"].forEach(id => { if (!map.getSource(id)) map.addSource(id, {type:"geojson", data:empty}); else map.getSource(id).setData(empty); });
  if (!map.getLayer("nav-done")){
    map.addLayer({id:"nav-done", type:"line", source:"nav-done", layout:{"line-cap":"round","line-join":"round"}, paint:{"line-color":"#9AA3B5","line-width":7,"line-opacity":.85}});
    map.addLayer({id:"nav-case", type:"line", source:"nav-todo", layout:{"line-cap":"round","line-join":"round"}, paint:{"line-color":"#fff","line-width":13}});
    map.addLayer({id:"nav-todo", type:"line", source:"nav-todo", layout:{"line-cap":"round","line-join":"round"}, paint:{"line-color":"#1D3FA8","line-width":8}});
    map.addLayer({id:"nav-dash", type:"line", source:"nav-todo", layout:{"line-cap":"round","line-join":"round"}, paint:{"line-color":"#FFD23F","line-width":2.5,"line-dasharray":[0.1,3]}});
  }
  ["nav-done","nav-case","nav-todo","nav-dash"].forEach(id => { map.setLayoutProperty(id, "visibility", "visible"); map.moveLayer(id); });
}
const setLine = (id, pts) => { const s = map.getSource(id); if (s) s.setData({type:"Feature", geometry:{type:"LineString", coordinates:pts.map(ll)}}); };

/* Rotayı başlat: kısa açılış animasyonu. Çizgi baştan sona çizilir, sonra kamera konumuna eğilerek iner. */
function startNav(o){
  if (!map){ toast("Harita henüz yüklenmedi. Biraz bekleyip tekrar dene."); return; }
  compassStart();
  whenMap(() => {
    navStop(true);
    const line = o.line.length > 1 ? o.line : o.stops.map(s => s.p), cum = cumOf(line);
    const stops = o.stops.map(s => Object.assign({}, s, {at:nearSeg(line, cum, s.p, 0, line.length).at}));
    NAV = {name:o.name, line, cum, stops, idx:0, at:0, q:line[0], off:false, follow:true, t0:Date.now(), anim:true};
    navHead = null; closeSheet(); setTab("map");
    document.querySelector(".view").classList.add("navigating");
    clearPlanMap(); navLayers(); meShape(); compassUI();
    const fab = $("#locate"); fab.classList.add("recenter"); fab.innerHTML = "<span></span>Ortala"; fab.hidden = true;
    navBar();
    // 1) Genel bakış: tüm rota ekrana sığar, çizgi baştan sona çizilir.
    const bb = new maplibregl.LngLatBounds(ll(line[0]), ll(line[0])); line.forEach(p => bb.extend(ll(p)));
    const cam = map.cameraForBounds(bb, {padding:{top:120, bottom:80, left:40, right:40}, bearing:0});
    if (cam) map.easeTo({center:cam.center, zoom:cam.zoom, bearing:0, pitch:0, padding:{top:0, bottom:0, left:0, right:0}, duration:700});
    const T = 1300, t0 = performance.now(), total = cum[cum.length - 1];
    const step = now => {
      if (!NAV || NAV.t0 !== o._t) return;
      const f = Math.min(1, (now - t0) / T), e = 1 - Math.pow(1 - f, 3), L = total * e;
      let k = 1; while (k < line.length && cum[k] < L) k++;
      const pts = line.slice(0, k);
      if (k < line.length && k > 0){ const a = line[k-1], b = line[k], r = (L - cum[k-1]) / Math.max(1, cum[k] - cum[k-1]); pts.push([a[0] + (b[0]-a[0])*r, a[1] + (b[1]-a[1])*r]); }
      setLine("nav-todo", pts.length > 1 ? pts : [line[0], line[0]]);
      if (f < 1) requestAnimationFrame(step); else setTimeout(navDive, 250);
    };
    o._t = NAV.t0; requestAnimationFrame(step);
  });
}
/* 2) Kamera konumuna (şehirde değilsen rotanın başına) eğilerek, gidilecek yöne dönerek iner. */
function navDive(){
  if (!NAV) return;
  const here = me && inCity(), at = here ? me : NAV.line[0];
  if (here) navProgress(me);
  const nxt = NAV.line[Math.min(NAV.line.length - 1, NAV.idx + 3)];
  const b = navHead !== null ? navHead : bearingOf(at, nxt);
  if (navHead === null) setHead(b);
  NAV.anim = true;
  map.flyTo({center:ll(at), zoom:NAV_ZOOM, pitch:NAV_PITCH, bearing:b, duration:1900, curve:1.3, essential:true, padding:{top:90, bottom:120}});
  map.once("moveend", () => { if (NAV) { NAV.anim = false; $("#locate").hidden = true; } });
  if (!here) toast(me ? "Şu an " + city.name + " dışındasın. Rotanın başlangıcı gösteriliyor; şehre gelince ok seni takip eder." : "Konumun henüz alınamadı. Rotanın başlangıcı gösteriliyor; konum gelince ok seni takip eder.");
}

/* Kamera takibi: konum ya da yön değişince yumuşakça kayar. Elle oynayınca takip durur, "Ortala" çıkar. */
function navFollow(on){
  if (!NAV) return; NAV.follow = on;
  $("#locate").hidden = on || tab !== "map";
}
let camT = 0;
function navCam(force){
  if (!NAV || !map || NAV.anim || !NAV.follow || mapTouch || !me || !inCity()) return;
  const now = Date.now(); if (!force && now - camT < 250) return; camT = now;
  const c = map.getCenter(), b = map.getBearing(), tb = navHead !== null ? navHead : b;
  if (!force && mOf([c.lat, c.lng], me) < 1.5 && Math.abs(angD(b, tb)) < 3) return;
  map.easeTo({center:ll(me), bearing:tb, pitch:force ? NAV_PITCH : map.getPitch(), zoom:force ? NAV_ZOOM : map.getZoom(), padding:{top:90, bottom:120}, duration:force ? 700 : 450, easing:t => t});
}
(function(){ const el = $("#map");
  el.addEventListener("touchstart", () => { mapTouch = true; }, {passive:true});
  el.addEventListener("touchend", e => { if (!e.touches.length) mapTouch = false; }, {passive:true});
  el.addEventListener("touchcancel", () => { mapTouch = false; }, {passive:true});
})();

/* Konum geldikçe: yön, ilerleme, çizgi ve üst bant güncellenir. */
function navPos(pos){
  if (!NAV || !map) return;
  const c = pos.coords;
  if (c.heading !== null && !isNaN(c.heading) && (c.speed || 0) > 0.8){ navGpsT = Date.now(); setHead(c.heading); }
  else if (navHead === null && inCity()) setHead(bearingOf(me, NAV.line[Math.min(NAV.line.length - 1, NAV.idx + 2)]));
  if (!inCity()){ navBar(); return; }
  navProgress(me); navCam();
}
function navProgress(p){
  const N = NAV, L = N.line;
  // Önce ileriye doğru ara (geri sıçramasın); uzak kalırsa bütün çizgiye bak.
  let k = nearSeg(L, N.cum, p, Math.max(0, N.idx - 3), N.idx + 80);
  if (k.d > 45){ const g = nearSeg(L, N.cum, p, 0, L.length); if (g.d < k.d) k = g; }
  N.off = k.d > 45;
  if (!N.off){ N.idx = k.i; N.at = k.at; N.q = k.q; }
  if (!N.anim){
    setLine("nav-done", L.slice(0, N.idx + 1).concat([N.q]));
    setLine("nav-todo", [N.q].concat(L.slice(N.idx + 1)));
  }
  if (N.cum[N.cum.length - 1] - N.at < 30 && !N.off && !N.done){ N.done = true; toast(N.name + " bitti. Güzel yürüyüş!"); }
  navBar();
}
function navBar(){
  const N = NAV, el = $("#navbar"); if (!N){ el.hidden = true; return; }
  const here = me && inCity(), cur = here ? N.at : 0;
  const total = N.cum[N.cum.length - 1], left = Math.max(0, total - cur);
  const next = N.stops.find(s => s.at > cur + 15) || N.stops[N.stops.length - 1];
  const toNext = here ? (N.off ? mOf(me, next.p) : Math.max(0, next.at - cur)) : next.at;
  const mins = Math.max(1, Math.round(left / 1000 / NAV_KMH * 60));
  const head = here ? (N.off ? "Rotaya dön · " + fmtD(nearSeg(N.line, N.cum, me, 0, N.line.length).d / 1000) : (N.done ? "Rota tamamlandı" : next.name)) : N.name;
  const sub = here ? (N.off ? "Sıradaki durak: " + next.name : (N.done ? "Tebrikler" : fmtD(toNext / 1000) + " sonra · kalan " + fmtD(left / 1000) + " · ~" + mins + " dk"))
    : "Önizleme · " + fmtD(total / 1000) + " · ~" + Math.max(1, Math.round(total / 1000 / NAV_KMH * 60)) + " dk";
  const turn = here && navHead !== null && !N.off ? angD(navHead, bearingOf(me, next.p)) : 0;
  el.innerHTML = `<span class="nvi"><svg viewBox="0 0 24 24" style="transform:rotate(${Math.round(turn)}deg)" aria-hidden="true"><path d="M12 2.5l7.5 18.2-7.5-4.3-7.5 4.3z" fill="#fff"/></svg></span>
    <span class="nvt"><b>${esc(head)}</b><small>${esc(sub)}</small></span>
    <button class="nvx" type="button" id="navEnd">Bitir</button><span class="nvbar"><i style="width:${total ? Math.round(cur / total * 100) : 0}%"></i></span>`;
  el.hidden = tab !== "map";
}
$("#navbar").addEventListener("click", e => { if (e.target.closest("#navEnd")) navStop(); });

function navStop(silent){
  if (!NAV) return;
  NAV = null; navHead = null;
  document.querySelector(".view").classList.remove("navigating");
  $("#navbar").hidden = true;
  const fab = $("#locate"); fab.classList.remove("recenter"); fab.innerHTML = "<span></span>"; fab.hidden = tab !== "map";
  if (map && !silent){
    ["nav-done","nav-case","nav-todo","nav-dash"].forEach(id => { if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", "none"); });
    map.easeTo({pitch:0, bearing:0, zoom:Math.min(map.getZoom(), 15.5), padding:{top:0, bottom:0}, duration:800});
  }
  meShape(); compassUI();
}

/* Hazır yürüyüş rotası */
function startRouteNav(id){
  const r = city.routes.find(x => x.id === id); if (!r) return;
  const names = r.stops && r.stops.length === r.pts.length ? r.stops : null;
  startNav({name:r.name, line:r.geo ? r.geo.line : r.pts, stops:r.pts.map((p, i) => ({p, name:names ? names[i] : (i + 1) + ". durak"}))});
}
/* Günlük plan: duraklar sırayla, çizgi gerçek sokaklardan (olmazsa düz). */
function startPlanNav(d){
  const P = store.plan; if (!P) return;
  const rows = timeline(P, d).rows, pts = [P.start].concat(rows.map(r => ptOf(r.o)));
  const stops = [{p:P.start, name:"Başlangıç"}].concat(rows.map(r => ({p:ptOf(r.o), name:r.o.name.replace(/ \(.*\)$/, "")})));
  const go = line => startNav({name:(d + 1) + ". gün planı", line, stops});
  if (pts.length > 40){ go(pts); return; }
  fetch("https://routing.openstreetmap.de/routed-foot/route/v1/foot/" + pts.map(p => p[1] + "," + p[0]).join(";") + "?overview=full&geometries=geojson")
    .then(x => x.json()).then(j => go(j.routes && j.routes[0] ? j.routes[0].geometry.coordinates.map(c => [c[1], c[0]]) : pts)).catch(() => go(pts));
}

/* ---------- Arama: uygulamadaki noktalar + OpenStreetMap (Photon, yedek Nominatim) ----------
   Türkçe, İngilizce, Almanca, Çekçe ve Macarca genel kelimeler aynı anlama eşlenir:
   "tren istasyonu", "train station", "Bahnhof", "nádraží", "pályaudvar" hepsi gar arar. */
const SQ_GROUPS = {
  station:{w:["tren istasyonu","tren gari","istasyon","istasyonu","gar","gari","train station","railway station","station","bahnhof","hauptbahnhof","hbf","nadrazi","hlavni nadrazi","palyaudvar","vasutallomas","centraal"], tag:"railway:station", label:"Tren garı"},
  bus:{w:["otogar","otobus terminali","otobus","bus station","busbahnhof","zob","autobusove nadrazi","buszpalyaudvar"], tag:"amenity:bus_station"},
  airport:{w:["havalimani","havaalani","airport","flughafen","letiste","repuloter"], tag:"aeroway:aerodrome"},
  pharmacy:{w:["eczane","pharmacy","apotheke","lekarna","gyogyszertar"], tag:"amenity:pharmacy"},
  toilet:{w:["tuvalet","wc","toilet","toilets","toilette","toalety","mosdo"], tag:"amenity:toilets"},
  atm:{w:["atm","bankamatik","geldautomat","bankomat","cash machine"], tag:"amenity:atm"},
  hospital:{w:["hastane","hospital","krankenhaus","klinikum","nemocnice","korhaz"], tag:"amenity:hospital"},
  police:{w:["polis","karakol","police","polizei","policie","rendorseg"], tag:"amenity:police"},
  supermarket:{w:["market","supermarket","supermarkt","grocery","potraviny","szupermarket","bakkal"], tag:"shop:supermarket", cat:"market"},
  church:{w:["kilise","katedral","cami","church","cathedral","kirche","dom","kathedrale","kostel","katedrala","bazilika","basilica","templom","szekesegyhaz"], tag:"amenity:place_of_worship"},
  castle:{w:["kale","sato","saray","castle","palace","burg","schloss","residenz","hrad","zamek","var","palota","kastely"], tag:"historic:castle"},
  museum:{w:["muze","muzesi","museum","muzeum"], tag:"tourism:museum"},
  bridge:{w:["kopru","koprusu","bridge","brucke","most","hid","lanchid"]},
  square:{w:["meydan","meydani","square","platz","markt","namesti","ter"]},
  synagogue:{w:["sinagog","sinagogu","synagogue","synagoge","synagoga","zsinagoga"]},
  bath:{w:["hamam","hamami","kaplica","bath","baths","therme","bad","lazne","furdo","thermal"]},
  tower:{w:["kule","kulesi","tower","turm","vez","torony"]},
  park:{w:["park","parki","bahce","bahcesi","garden","garten","zahrada","kert","sady"], tag:"leisure:park"},
  beer:{w:["bira","birahane","beer","bier","brauerei","brewery","pivo","pivovar","sor","sorozo","bierkeller","keller"]},
  coffee:{w:["kahve","kafe","cafe","coffee","kaffee","kavarna","kave","kavezo"], cat:"coffee"},
  bakery:{w:["firin","pastane","bakery","backerei","pekarna","pekseg","cukraszda","konditorei"], cat:"bakery"},
  food:{w:["yemek","restoran","lokanta","restaurant","essen","restaurace","etterem","doner","kebab"], cat:"food"}
};
const sqNorm = t => String(t).toLocaleLowerCase("tr").replace(/ı/g, "i").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
const SQ_STOP = new Set(["the","de","der","die","das","von","en","ve","ile","bir","in","a","an","of","zum","zur","am","im","yakin","yakindaki","nerede","en yakin"]);
/* Sorgudan grup kelimelerini (en uzun eşleşme önce) ayıklar. */
function sqParse(q){
  let s = " " + sqNorm(q) + " "; const groups = [];
  const all = [];
  for (const g in SQ_GROUPS) SQ_GROUPS[g].w.forEach(w => all.push([sqNorm(w), g]));
  all.sort((a, b) => b[0].length - a[0].length);
  for (const [w, g] of all){ if (s.includes(" " + w + " ")){ if (!groups.includes(g)) groups.push(g); s = s.split(" " + w + " ").join(" "); } }
  const cityWords = new Set(Object.values(CITIES).flatMap(c => [sqNorm(c.name), sqNorm(c.key)]).concat(["bamberg","nurnberg","nuremberg","praha","prague","budapest","amsterdam","utrecht"]));
  const words = s.trim().split(" ").filter(w => w && !SQ_STOP.has(w) && !cityWords.has(w));
  return {groups, words, rest:words.join(" ")};
}
function sqHay(o){
  if (!o._hay){ const t = [o.name, o.wiki ? o.wiki.replace(/^de:/, "").replace(/_/g, " ") : "", o.desc || "", (o.stops || []).join(" ")].join(" ");
    o._hay = " " + sqNorm(t) + " "; o._nameN = " " + sqNorm(o.name + " " + (o.wiki ? o.wiki.replace(/^de:/, "").replace(/_/g, " ") : "")) + " "; }
  return o._hay;
}
/* Kısa kelimeler tam kelime, uzunlar başlangıç olarak eşleşir (gar ≠ Gärtnerstadt). */
const sqHas = (hay, w) => w.length >= 6 ? hay.includes(" " + w) : hay.includes(" " + w + " ");
function sqGroupHit(o, g){ const G = SQ_GROUPS[g]; if (G.cat && o.cat === G.cat) return true; sqHay(o); return G.w.some(w => sqHas(o._nameN, sqNorm(w))); }
/* Uygulamadaki noktalar, rotalar ve başlangıç noktaları içinde arar. */
function searchLocal(q){
  const P = sqParse(q), out = [];
  if (!P.words.length && !P.groups.length) return out;
  if (P.groups.includes("station") && city.starts && city.starts.centraal && city.starts.centraal.p)
    out.push({kind:"start", score:100, name:city.starts.centraal.label, sub:"Şehrin ana tren garı", p:city.starts.centraal.p});
  const items = city.places.concat(city.routes.filter(r => !r.ferry));
  items.forEach(o => {
    const hay = sqHay(o); let sc = 0, miss = 0;
    P.words.forEach(w => { const pre = w.length >= 3 ? " " + w : " " + w + " "; if (o._nameN.includes(pre)) sc += 4; else if (hay.includes(pre)) sc += 1.5; else if (w.length >= 5 && hay.includes(w)) sc += 1; else miss++; });
    P.groups.forEach(g => { if (sqGroupHit(o, g)) sc += 3; else miss++; });
    if (sc > 0 && miss <= (P.words.length + P.groups.length > 2 ? 1 : 0)) out.push({kind:o.pts ? "route" : "place", score:sc - miss, o});
  });
  return out.sort((a, b) => b.score - a.score).slice(0, 8);
}
let sqAbort = null;
async function searchGeo(q){
  const P = sqParse(q), G = P.groups.map(g => SQ_GROUPS[g]).find(x => x.tag);
  const text = P.rest || (G ? city.name : sqNorm(q));
  if (!text) return [];
  const b = city.bounds, c = map ? map.getCenter() : {lat:city.center[0], lng:city.center[1]};
  if (sqAbort) sqAbort.abort(); sqAbort = new AbortController();
  const sig = sqAbort.signal;
  const photon = bbox => "https://photon.komoot.io/api/?limit=10&q=" + encodeURIComponent(text) + "&lat=" + c.lat.toFixed(4) + "&lon=" + c.lng.toFixed(4) +
    (G ? "&osm_tag=" + encodeURIComponent(G.tag) : "") + (bbox ? "&bbox=" + [b[0][1], b[0][0], b[1][1], b[1][0]].join(",") : "");
  const fromPhoton = j => (j.features || []).map(f => { const p = f.properties || {}, g = f.geometry.coordinates;
    const name = p.name || [p.street, p.housenumber].filter(Boolean).join(" ") || p.osm_value;
    return {name, sub:[p.street && p.name ? p.street + (p.housenumber ? " " + p.housenumber : "") : "", p.district || p.city || p.county].filter(Boolean).join(", "), p:[g[1], g[0]], type:p.osm_value}; });
  try {
    let r = fromPhoton(await (await fetch(photon(true), {signal:sig})).json());
    if (!r.length) r = fromPhoton(await (await fetch(photon(false), {signal:sig})).json());
    return r;
  } catch(e){
    if (e.name === "AbortError") throw e;
    // Yedek: Nominatim (grup anahtarı İngilizce: station, pharmacy, airport...)
    const nq = (G ? P.groups.find(g => SQ_GROUPS[g].tag) + " " : "") + (P.rest || city.name);
    const u = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&accept-language=tr,en&q=" + encodeURIComponent(nq.trim()) +
      "&viewbox=" + [b[0][1], b[1][0], b[1][1], b[0][0]].join(",") + "&bounded=1";
    const j = await (await fetch(u, {signal:sig})).json();
    return j.map(x => ({name:x.name || x.display_name.split(",")[0], sub:x.display_name.split(",").slice(1, 3).join(","), p:[+x.lat, +x.lon], type:x.type}));
  }
}

/* Arayüz */
const SEARCH_IC = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>';
let sqMarker = null, sqTimer = 0, sqLast = null;
function sqClearMarker(){ if (sqMarker){ sqMarker.remove(); sqMarker = null; } }
function openSearch(){
  const p = $("#searchPanel"); p.hidden = false; closeSheet();
  const i = $("#sqInput"); i.value = ""; $("#sqRes").innerHTML = `<p class="sq-hint">Bir yer, sokak ya da \"tren garı\", \"eczane\", \"WC\" gibi bir şey yaz. Türkçe, İngilizce ya da yerel dilde yazabilirsin.</p>`;
  setTimeout(() => i.focus(), 50);
}
function closeSearch(){ $("#searchPanel").hidden = true; $("#sqInput").blur(); }
const sqDist = p => me && inCity() ? fmtD(km(me, p)) : "";
function sqRender(local, geo, loading){
  const L = local.map((r, i) => { const o = r.o, col = r.kind === "start" ? "var(--walk)" : r.kind === "route" ? "var(--walk)" : CATS[o.cat].c;
    const p = r.kind === "start" ? r.p : r.kind === "route" ? o.pts[0] : [o.lat, o.lon], d = sqDist(p);
    return `<button class="sq-item" type="button" data-sl="${i}"><i style="--c:${col}"></i><span><b>${esc(r.kind === "start" ? r.name : o.name)}</b><small>${esc(r.kind === "start" ? r.sub : r.kind === "route" ? "Yürüyüş rotası" : CATS[o.cat].tag)}${d ? " · " + d : ""}</small></span></button>`; }).join("");
  const Gh = (geo || []).map((r, i) => { const d = sqDist(r.p);
    return `<button class="sq-item" type="button" data-sg="${i}"><i class="geo"></i><span><b>${esc(r.name)}</b><small>${esc(r.sub || "")}${d ? (r.sub ? " · " : "") + d : ""}</small></span></button>`; }).join("");
  $("#sqRes").innerHTML = (L ? `<h4>Uygulamada</h4>${L}` : "") + (Gh ? `<h4>Haritada</h4>${Gh}` : "") +
    (loading ? `<p class="sq-hint">Haritada aranıyor…</p>` : (!L && !Gh ? `<p class="sq-hint">Sonuç bulunamadı. Farklı yazmayı dene.</p>` : ""));
}
async function runSearch(q){
  const local = searchLocal(q); sqLast = {local, geo:[]};
  sqRender(local, [], true);
  try { const geo = await searchGeo(q);
    const fresh = geo.filter(g => !local.some(l => { const p = l.kind === "start" ? l.p : l.kind === "route" ? l.o.pts[0] : [l.o.lat, l.o.lon]; return km(p, g.p) < 0.06; }));
    sqLast = {local, geo:fresh}; sqRender(local, fresh, false);
  } catch(e){ if (e.name !== "AbortError"){ sqRender(local, [], false); if (!local.length) $("#sqRes").insertAdjacentHTML("beforeend", `<p class="sq-hint">Harita araması şu an yanıt vermiyor. İnternet bağlantını kontrol et.</p>`); } }
}
$("#sqInput").addEventListener("input", e => { clearTimeout(sqTimer); const q = e.target.value.trim(); if (q.length < 2){ if (sqAbort) sqAbort.abort(); return; } sqTimer = setTimeout(() => runSearch(q), 350); });
$("#sqInput").addEventListener("keydown", e => { if (e.key === "Enter"){ clearTimeout(sqTimer); const q = e.target.value.trim(); if (q.length >= 2) runSearch(q); e.target.blur(); } });
$("#searchBtn").addEventListener("click", openSearch);
$("#searchPanel").addEventListener("click", e => {
  if (e.target.id === "searchPanel" || e.target.closest("#sqClose")){ closeSearch(); return; }
  const a = e.target.closest("[data-sl]"), b = e.target.closest("[data-sg]");
  if (a && sqLast){ const r = sqLast.local[+a.dataset.sl]; closeSearch();
    if (r.kind === "start") showGeo({name:r.name, sub:r.sub, p:r.p}); else { if (r.o.cat && !store.layers[r.o.cat]){ store.layers[r.o.cat] = true; save(); renderChips(); refresh(); } select(r.o.id); } }
  if (b && sqLast){ closeSearch(); showGeo(sqLast.geo[+b.dataset.sg]); }
});
/* Haritadan bulunan bir yer için kart: haritada göster ve rota oluştur. */
let sqCur = null;
function showGeo(r){
  if (!map) return; sqCur = r; sqClearMarker();
  const el = document.createElement("div"); el.className = "sq-pin"; el.innerHTML = "<i></i>";
  sqMarker = new maplibregl.Marker({element:el, anchor:"bottom"}).setLngLat(ll(r.p)).addTo(map);
  const h = $("#map").clientHeight, narrow = innerWidth < 760;
  map.flyTo({center:ll(r.p), zoom:Math.max(map.getZoom(), 16), offset:narrow ? [0, -h*0.22] : [-200, 0], duration:700});
  const d = me && inCity() ? km(me, r.p) : null;
  const gm = `https://www.google.com/maps/dir/?api=1&destination=${r.p.join(",")}&travelmode=walking`;
  const s = $("#sheet");
  s.innerHTML = `<div class="grab" aria-hidden="true"></div><button class="x" type="button" id="closeSheet" aria-label="Kartı kapat">✕</button>
    <div class="sbody"><span class="tag" style="--c:var(--walk)">Arama sonucu</span><h2>${esc(r.name)}</h2>${r.sub ? `<p>${esc(r.sub)}</p>` : ""}
    <dl class="facts">${d !== null ? `<dt>Uzaklık</dt><dd>Buradan ${fmtD(d)} (kuş uçuşu), yürüyerek yaklaşık ${Math.max(1, Math.round(d * 1.3 / 4.5 * 60))} dk</dd>` : `<dt>Konum</dt><dd>Canlı konumun yok ya da şehir dışındasın; rota harita merkezinden çizilir.</dd>`}</dl>
    <div class="acts"><button class="btn primary go-nav" type="button" data-sr="route">${NAV_IC}Buraya rota oluştur</button>
    <button class="btn" type="button" data-sr="show">Haritada göster</button>
    <a class="btn" href="${gm}" target="_blank" rel="noopener">Google Maps'te yol tarifi</a></div></div>`;
  s.hidden = false; s.scrollTop = 0; sel = null; refresh();
}
/* Uygulama içinde yürüyüş rotası: konumundan (yoksa harita merkezinden) hedefe. */
function routeTo(dest, name){
  compassStart();
  if (!map) return;
  let from;
  if (me && inCity()) from = me.slice();
  else { const c = map.getCenter(); from = [c.lat, c.lng]; toast("Canlı konumun şehirde değil; rota harita merkezinden çizildi."); }
  const direct = km(from, dest);
  if (direct < 0.03){ toast("Zaten oradasın."); return; }
  toast("Rota hesaplanıyor…");
  const go = line => { $("#toast").hidden = true; startNav({name:name, line, stops:[{p:from, name:"Başlangıç"}, {p:dest, name:name}]});
    if (direct > 6) setTimeout(() => toast("Yürüyerek uzun bir yol. Toplu taşıma için Google Maps'teki yol tarifini kullanabilirsin."), 3500); };
  fetch("https://routing.openstreetmap.de/routed-foot/route/v1/foot/" + from[1] + "," + from[0] + ";" + dest[1] + "," + dest[0] + "?overview=full&geometries=geojson")
    .then(x => x.json()).then(j => go(j.routes && j.routes[0] ? j.routes[0].geometry.coordinates.map(c => [c[1], c[0]]) : [from, dest])).catch(() => go([from, dest]));
}
$("#sheet").addEventListener("click", e => {
  const t = e.target.closest("[data-sr],[data-go]"); if (!t) return;
  e.stopPropagation();
  if (t.dataset.go){ const o = find(t.dataset.go); if (o) routeTo([o.lat, o.lon], o.name.replace(/ \(.*\)$/, "")); return; }
  if (!sqCur) return;
  if (t.dataset.sr === "route") routeTo(sqCur.p, sqCur.name);
  else if (t.dataset.sr === "show"){ const h = $("#map").clientHeight; map.flyTo({center:ll(sqCur.p), zoom:17, offset:innerWidth < 760 ? [0, -h*0.22] : [-200, 0], duration:600}); }
}, true);

/* Ana ekrana eklenince uygulama gibi çalışsın: servis çalışanını kaydet. */
if ("serviceWorker" in navigator && location.protocol === "https:" && location.hostname.endsWith("github.io")) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
/* Ana ekrandan değil de Safari'den açıldıysa, bir kez "Ana Ekrana Ekle" ipucu göster. */
(function(){
  if (!location.hostname.endsWith("github.io")) return;
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  let seen = false; try { seen = localStorage.getItem("dolcanrota.a2hs") === "1"; } catch(e){}
  if (standalone || !ios || seen) return;
  const n = document.createElement("p"); n.className = "note";
  n.innerHTML = "Uygulama gibi kullanmak için: alttaki <b>Paylaş</b> düğmesine bas, <b>Ana Ekrana Ekle</b>'yi seç. <button type=\"button\" style=\"font-weight:800;text-decoration:underline\">Tamam</button>";
  n.querySelector("button").onclick = () => { n.remove(); try { localStorage.setItem("dolcanrota.a2hs", "1"); } catch(e){} };
  document.getElementById("home").appendChild(n);
})();
</script>
