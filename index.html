<script>
/* =====================================================================
   ŞEHİR VERİSİ (arayüzden ayrı). Yeni şehir = CITIES içine yeni kayıt.
   fee/hours null ise doğrulanamamıştır. wiki = fotoğrafın çekildiği Wikipedia maddesi.
   ===================================================================== */
const CITIES = {
  amsterdam: {
    name:"Amsterdam", updated:"14.10.2026", hero:"Canals_of_Amsterdam",
    center:[52.3702,4.8935], zoom:13.6, minZoom:11,
    bounds:[[52.27,4.72],[52.45,5.06]],
    places:[
      /* ================= TARİHİ ================= */
      {id:"dam",cat:"hist",name:"Dam Meydanı",wiki:"Dam_Square",lat:52.3731006,lon:4.8924274,pid:"ChIJq-ry-tkJxkcR8i94uYaBUig",desc:"Şehrin kalbi. Kraliyet Sarayı, Nieuwe Kerk ve Ulusal Anıt aynı meydanda.",hist:"Amsterdam'ın adı buradan gelir. 1270 dolaylarında balıkçılar Amstel nehrinin ağzına, denizden gelen suyu tutmak için bir set (dam) kurdu. Setin çevresindeki yerleşim \"Amstelredam\", yani Amstel'deki set diye anıldı. Set zamanla genişleyip kasabanın pazar yerine dönüştü. Nehir o dönem bugünkü Damrak ve Rokin boyunca açıktan akıyordu, gemiler meydanın dibine kadar yanaşıp yükünü burada boşaltırdı.\n\nMeydanın batı yanını kaplayan dev yapı 17. yüzyılda belediye sarayı olarak yapıldı. Yanındaki Nieuwe Kerk 15. yüzyıldan kalma, Hollanda hükümdarları tahta burada çıkar. Doğu yandaki 22 metrelik beyaz dikilitaş, İkinci Dünya Savaşı kurbanları için 1956'da dikilen Ulusal Anıt'tır. Her yıl 4 Mayıs akşamı saat 20.00'de kral buraya çelenk koyar ve bütün ülke iki dakika susar.\n\nMeydanın en karanlık günü 7 Mayıs 1945'tir. Almanya teslim olmuş, halk kurtuluşu kutlamak için Dam'a dolmuştu. Meydana bakan bir binadaki Alman askerleri kalabalığa ateş açtı, 30'dan fazla kişi öldü. Dam 1960'larda hippi kuşağının uyuduğu yer, sonraki yıllarda da her büyük gösterinin adresi oldu.",why:"Bütün merkez rotaları buradan dağılır.",dur:"15 dk",fee:"Ücretsiz",hours:"Her zaman açık"},
      {id:"paleis",cat:"hist",name:"Koninklijk Paleis (Kraliyet Sarayı)",wiki:"Royal_Palace_of_Amsterdam",lat:52.3731835,lon:4.8913758,pid:"ChIJFQ6IwMYJxkcRis8dtZlOkTk",desc:"Dam'ın batı yanını kaplayan saray. Sesli rehber girişe dahil.",hist:"Bu bina saray olarak değil, belediye binası olarak yapıldı. Temeli 1648'de atıldı. Aynı yıl Münster Barışı imzalanmış, Hollanda İspanya'ya karşı seksen yıl süren bağımsızlık savaşını kazanmıştı. Amsterdam o sırada dünyanın en zengin ticaret şehriydi ve gücünü gösterecek bir bina istiyordu. Mimar Jacob van Campen, Roma'nın kamu binalarını örnek aldı. Bina 1655'te açıldığında Avrupa'nın en büyük idari yapısıydı ve dönemin şairleri ona \"dünyanın sekizinci harikası\" dedi.\n\nBataklık zeminde durabilmesi için 13.659 ahşap kazık çakıldı. Bu sayı Hollandalı çocuklara hâlâ bir tekerlemeyle ezberletilir. Çatıdaki Atlas heykeli gökküreyi sırtında taşır. İçerideki Burgerzaal'ın (Yurttaşlar Salonu) mermer zemininde doğu ve batı yarımküre ile gökyüzü haritası işlidir: Amsterdamlılar dünyanın üzerinde yürürdü. Alt kattaki mahkeme salonunda idam kararları okunurdu.\n\n1808'de Napolyon, kardeşi Louis Bonaparte'ı Hollanda kralı yaptı. Louis belediyeyi binadan çıkardı ve burayı saraya çevirdi. İçerideki ampir mobilyaların çoğu ondan kalmadır. Fransızlar gidince bina kraliyet ailesine geçti. Bugün kral burada yaşamaz, saray devlet ziyaretleri, yeni yıl resepsiyonu ve resmî törenler için kullanılır.",why:"İçerisi dışından beklenenden çok daha gösterişli.",dur:"1 sa",fee:null,hours:"Her gün 10:00-17:00 (tören günlerinde kapanabilir)"},
      {id:"nieuwekerk",cat:"hist",name:"Nieuwe Kerk",wiki:"Nieuwe_Kerk,_Amsterdam",lat:52.3737559,lon:4.8918665,pid:"ChIJ0T84-8YJxkcRpAGwFD2ingI",desc:"Dam'da, sarayın hemen yanındaki gotik kilise. Bugün büyük sergilere ev sahipliği yapıyor.",hist:"Adı \"Yeni Kilise\" ama 600 yaşında. 1400'lerin başında Amsterdam o kadar büyümüştü ki Oude Kerk (Eski Kilise) cemaate yetmiyordu, piskopos 1408'de ikinci bir kilise için izin verdi. Kilise 1645'te büyük bir yangında neredeyse tamamen yandı ve yeniden yapıldı.\n\nDikkat edersen kilisenin kulesi yok. Yangından sonra saraydan da yüksek bir kule planlandı ve temeli atıldı, ama şehir parasını yandaki yeni belediye sarayına harcamayı seçti. Yarım kalan kule kaidesi hâlâ batı cephesinde durur.\n\n1814'ten beri Hollanda hükümdarları tahta burada çıkar. Hollanda'da taç giyilmez, kral anayasaya bağlılık yemini eder. Willem-Alexander 2013'te burada göreve başladı, 2002'de Máxima ile de burada evlendi. İçeride ülkenin en büyük deniz kahramanı Amiral Michiel de Ruyter'in mermer mezarı vardır. Kilise bugün düzenli ibadet için kullanılmıyor, yıl boyunca sergi mekânı olarak açık.",why:"Sergi yoksa dışarıdan görmek yeter, bilet pahalı.",dur:"45 dk",fee:"Yaklaşık €25 (ziyaretçi yorumundan, sergiye göre değişir)",hours:"Her gün 10:00-17:00"},
      {id:"begijnhof",cat:"hist",name:"Begijnhof",wiki:"Begijnhof,_Amsterdam",lat:52.3694247,lon:4.8904379,pid:"ChIJeSe5CsEJxkcRdRlM21_MA9s",desc:"Alışveriş caddesinin hemen arkasında, kapıdan girince sessizleşen ortaçağ avlusu.",hist:"Begijnhof 14. yüzyılda \"begijn\"ler için kuruldu. Begijnler rahibe değildi: yemin etmez, mallarını korur, isterlerse ayrılıp evlenebilirlerdi. Ama bekâr yaşar, hastalara bakar ve dindar bir hayat sürerlerdi. Ortaçağ Avrupası'nda bir kadının kocası ya da manastırı olmadan bağımsız yaşayabildiği nadir yerlerden biriydi.\n\nAvlu, çevresindeki sokaklardan yaklaşık bir metre alçaktadır, çünkü şehrin ortaçağdaki zemin seviyesinde kalmıştır. 1421 ve 1452 yangınları ahşap Amsterdam'ın büyük bölümünü yok etti. 34 numaradaki Houten Huys (1420'ler) o yangınlardan sonra ayakta kalan ve şehrin en eski ahşap evi sayılan yapıdır. Yangınlardan sonra şehir ahşap cepheyi yasakladı, bugün gördüğün tuğla Amsterdam o yasağın sonucudur.\n\nAmsterdam 1578'de Protestanlığa geçince Katolik ibadeti yasaklandı ve avludaki şapel begijnlerin elinden alındı. Şapel 1607'de İngiliz Reform Kilisesi'ne verildi. Amerika'ya giden Pilgrim'lerden bazıları yola çıkmadan önce burada ibadet etti. Begijnler ise şapelin tam karşısındaki iki evi birleştirip dışarıdan ev gibi görünen gizli bir kilise yaptılar, o da hâlâ açık. Son begijn, Rahibe Antonia, 1971'de öldü.",why:"Kalabalığın ortasında beş dakikalık sakinlik.",dur:"15 dk",fee:"Ücretsiz",hours:"Her gün 10:00-18:00",tip:"İçeride insanlar yaşıyor: sessiz ol, video çekme. Vlog için giriş kapısının dışında anlat."},
      {id:"oudekerk",cat:"hist",name:"Oude Kerk",wiki:"Oude_Kerk,_Amsterdam",lat:52.3741277,lon:4.8982046,pid:"ChIJL33h87gJxkcRIu1FY7IyWV4",desc:"Amsterdam'ın ayakta kalan en eski binası, De Wallen'in tam ortasında.",hist:"13. yüzyılda bir balıkçı mezarlığının yanındaki ahşap şapel olarak başladı. Taş kilise 1306'da kutsandı ve denizcilerin koruyucusu Aziz Nikolaos'a adandı. Yüzyıllar boyunca her kuşak bir bölüm ekledi, o yüzden plan simetrik değildir. Ahşap tonozu Avrupa'nın en büyük ortaçağ ahşap tavanlarından biridir ve akustiği bununla ünlüdür.\n\nZemini baştan sona mezar taşıdır. Altında binlerce Amsterdamlı yatar: denizciler, tüccarlar, belediye başkanları. Rembrandt'ın eşi Saskia van Uylenburgh 1642'de buraya gömüldü. Her yıl 9 Mart sabahı güneş ışığı pencereden kısa bir süre Saskia'nın mezar taşına düşer.\n\n1566'daki İkonakırıcı Ayaklanma'da kalabalık kiliseye girip heykelleri parçaladı. 1578'de şehir Protestan olunca kilise Kalvinistlere geçti ve geri kalan süslemeler söküldü. Bugünkü sade iç mekân o günlerden kalmadır. Kilise uzun süre şehrin tapu arşivi ve evlilik kayıt yeri olarak da kullanıldı.\n\nBugün kapısı kırmızı fener vitrinlerine açılır. Liman mahallesinde kilise ile genelevler yüzyıllardır yan yanadır: denizciler önce eğlenir, sonra günah çıkarırdı. Kilisenin önündeki kaldırımda, kimin yaptığı bilinmeyen bronz bir kabartma ve seks işçilerine adanmış \"Belle\" heykeli vardır.",why:"Dışarıdan görmek ücretsiz ve yeterli olabilir.",dur:"30 dk",fee:"Yaklaşık €15 (ziyaretçi yorumundan, doğrula)",hours:"Pzt-Cmt 10:00-18:00, Paz 13:00-17:30"},
      {id:"solder",cat:"hist",name:"Ons' Lieve Heer op Solder (Çatıdaki Kilise)",wiki:"Ons'_Lieve_Heer_op_Solder",lat:52.3751438,lon:4.8994358,pid:"ChIJU-1ArbkJxkcR_EdFqWrlInA",desc:"Dışarıdan sıradan bir kanal evi. Çatı katında üç evin tavan arasına sığdırılmış koca bir kilise var.",hist:"1578'den sonra Amsterdam'da Katolik ayini resmen yasaktı. Ama şehir ticaretle yaşıyordu ve tüccarını kaçırmak istemiyordu. Çözüm tipik Hollanda usulüydü: görünmediği sürece göz yumulurdu. Böylece \"schuilkerk\" denen gizli kiliseler doğdu. Herkes yerini bilir, kimse bilmezden gelirdi.\n\nKeten tüccarı Jan Hartman 1661'de bu evi ve arkasındaki iki evi satın aldı. İki yıl içinde üç evin çatı katlarını birleştirdi, araya iki kat galeri koydu ve yaklaşık 150 kişilik bir kilise yaptı. Cemaat ara sokaktaki yan kapıdan girer, dar merdivenlerden çıkardı. Pembe mermer görünümlü sunak aslında boyalı ahşaptır.\n\nKilise 1887'ye kadar kullanıldı. O yıl gar karşısındaki Aziz Nikolaos Bazilikası açılınca cemaat oraya taşındı. Bir grup Amsterdamlı binayı yıkılmaktan kurtardı ve 1888'de müzeye çevirdi. Burası Rijksmuseum'dan sonra şehrin en eski ikinci müzesidir. Alt katlar 17. yüzyıl tüccar evi olarak döşeli: mutfak, yatak dolabı, oturma odası yerli yerinde.",why:"Amsterdam'ın hoşgörü hikâyesini tek binada anlatan yer.",dur:"1 sa",fee:null,hours:"Her gün 10:00-18:00",tip:"Çok dik ve dar merdivenler var."},
      {id:"waag",cat:"hist",name:"De Waag (Nieuwmarkt)",wiki:"Waag,_Amsterdam",lat:52.3727115,lon:4.9004026,pid:"ChIJVR5Sl74JxkcRPvBLwwIgPmA",desc:"Nieuwmarkt'ın ortasındaki kuleli, kale görünümlü yapı.",hist:"1488'de şehir surlarının kapılarından biri, Sint Antoniespoort olarak yapıldı. O zaman burası şehrin doğu ucuydu ve kapının önünde hendek vardı. Yüz yıl sonra şehir büyüdü, surlar yıkıldı, hendek doldurulup bugünkü Nieuwmarkt meydanı oldu. İşsiz kalan kapı 1617'de tartı evine (waag) çevrildi: şehre giren ağır mallar burada resmî olarak tartılır, vergisi buna göre kesilirdi.\n\nÜst katlar loncalara verildi. Her loncanın kendi kapısı vardı, bugün de kapıların üstünde armalarını görebilirsin: duvarcılar, demirciler, ressamlar. En ünlüsü cerrahlar loncasıdır. Kulede bir anatomi salonu (Theatrum Anatomicum) kurdular ve yılda bir kez, kışın, idam edilmiş bir suçlunun cesedi üzerinde halka açık ders verdiler. Rembrandt'ın 1632 tarihli \"Dr. Nicolaes Tulp'un Anatomi Dersi\" tablosu bu lonca için yapıldı ve genç ressamı bir gecede ünlü etti.\n\nMeydan uzun süre idamların yapıldığı yerdi. İkinci Dünya Savaşı'nda çevresi Yahudi mahallesiydi, Almanlar meydanı dikenli telle çevirip toplama noktası olarak kullandı. Waag daha sonra itfaiye, arşiv ve müze oldu. Bugün içi restoran.",why:"Meydandan bakmak yeter. İçerideki restoran bütçe dostu değil.",dur:"10 dk",fee:"Dışarıdan ücretsiz",hours:null},
      {id:"voc",cat:"hist",name:"Oost-Indisch Huis (VOC Merkezi)",wiki:"Oost-Indisch_Huis",lat:52.3708333,lon:4.8980556,pid:"ChIJp9elJr8JxkcRrpnA7pvELLw",desc:"Hollanda Doğu Hindistan Şirketi'nin (VOC) genel merkezi. Bugün Amsterdam Üniversitesi'nin binası, avlusu hafta içi açık.",hist:"VOC 1602'de kuruldu ve dünyanın ilk halka açık anonim şirketi sayılır. Herhangi bir Amsterdamlı, hizmetçiler dahil, hisse alabiliyordu. Bu hisselerin alınıp satıldığı yer de dünyanın ilk borsası oldu. Şirket 1606'da bu binaya yerleşti.\n\nŞirketi yöneten on yedi kişilik kurul, \"Heeren XVII\" (On Yedi Beyler), burada toplanırdı. Hangi geminin nereye gideceği, baharatın kaça satılacağı, hangi adaya kale kurulacağı bu odada kararlaştırıldı. VOC'nin kendi ordusu, donanması ve parası vardı, savaş ilan edip antlaşma imzalayabiliyordu. En parlak döneminde Asya'da on binlerce kişi çalıştırdı.\n\nBu zenginliğin bedeli ağırdı. Şirket, muskat tekelini ele geçirmek için 1621'de Banda Adaları halkının neredeyse tamamını öldürdü ya da sürdü, Asya'da köle ticareti yaptı. Hollanda bugün bu geçmişle açıkça yüzleşmeye çalışıyor.\n\nVOC yolsuzluk ve savaşlar yüzünden 1799'da iflas etti, borçları ve sömürgeleri devlete geçti. Bina sonradan üniversiteye verildi. Avluya Oude Hoogstraat 24'teki geçitten girilir.",why:"Küresel ticaretin ve borsanın doğduğu yer. Avlu ücretsiz.",dur:"15 dk",fee:"Avlu ücretsiz",hours:"Pzt-Cum gündüz (üniversite binası), hafta sonu kapalı"},
      {id:"zuiderkerk",cat:"hist",name:"Zuiderkerk",wiki:"Zuiderkerk",lat:52.3703054,lon:4.899804,pid:"ChIJ6anj6r4JxkcRxQixIaK9T2A",desc:"Dar sokakların arasından yükselen kule. Amsterdam'da Protestan ibadeti için yapılan ilk kilise.",hist:"Şehirdeki eski kiliselerin hepsi Katolik olarak yapılmış, sonradan Protestanlara geçmişti. Zuiderkerk (Güney Kilisesi) 1603-1611 arasında baştan Protestan ibadeti için tasarlandı. Mimarı, şehrin taş ustabaşı Hendrick de Keyser'di. Kendisi de 1621'de buraya gömüldü.\n\nKulesi şehrin en zarif kulelerinden sayılır. Londra'yı 1666 yangınından sonra yeniden kuran Christopher Wren'in kule tasarımlarında bu kuleden etkilendiği söylenir. Claude Monet 1874'te Amsterdam'a geldiğinde kuleyi Groenburgwal kanalından resmetti.\n\nRembrandt yakındaki evinde otururdu ve bebekken ölen üç çocuğu bu kiliseye gömüldü. 1944-45 kışında, \"Açlık Kışı\"nda, şehirde yiyecek ve yakacak kalmadı, ölenleri gömecek tabut ve işçi bulunamadı. Zuiderkerk geçici morg olarak kullanıldı.\n\nKilise 1929'da ibadete kapandı, bugün etkinlik mekânı.",why:"Kulenin en güzel açısı Groenburgwal köprüsünden.",dur:"10 dk",fee:"Dışarıdan ücretsiz",hours:null},
      {id:"rembrandt",cat:"hist",name:"Rembrandthuis",wiki:"Rembrandt_House_Museum",lat:52.369369,lon:4.901235,pid:"ChIJNR35jYUJxkcRALmB_1MbY54",desc:"Rembrandt'ın yaşadığı ve çalıştığı ev. Gravür ve boya yapımı gösterimleri var.",hist:"Ev 1606'da yapıldı. Rembrandt 1639'da, 33 yaşında ve ününün zirvesindeyken, 13.000 guldene satın aldı. Bir zanaatkârın yıllık kazancı o dönem 300 gulden civarındaydı. Parayı peşin veremedi, taksite bağladı.\n\nBurada yaklaşık yirmi yıl yaşadı. Gece Devriyesi'ni bu evde otururken yaptı. Üst kattaki büyük atölyede kuzey ışığında çalışır, çatı katında öğrencilerine ders verirdi. Alt kattaki odada sanat ticareti yapardı. Ayrıca tutkulu bir koleksiyoncuydu: deniz kabukları, Roma büstleri, silahlar, Asya'dan gelen eşyalar.\n\nEşi Saskia 1642'de bu evde öldü. Rembrandt harcamalarını kısmadı, siparişler azaldı, taksitler birikti. 1656'da iflas etti. Mahkeme evdeki her şeyin dökümünü çıkardı ve açık artırmayla sattı. 1658'de ev de satıldı, Rembrandt Jordaan'da kiralık küçük bir eve taşındı.\n\nO iflas dökümü bugün elimizde. Müze 1911'de açıldı ve evi 1990'larda o listeye bakarak, oda oda eski hâline göre döşedi.",why:"Küçük ama atölye hissi gerçek.",dur:"1 sa",fee:null,hours:"Her gün 10:00-18:00"},
      {id:"portsyn",cat:"hist",name:"Portekiz Sinagogu (Esnoga)",wiki:"Portuguese_Synagogue_(Amsterdam)",lat:52.3675815,lon:4.9053207,pid:"ChIJMzKtC70JxkcRLL3Z3onUWAI",desc:"17. yüzyıldan beri neredeyse hiç değişmemiş dev sinagog. İçeride elektrik yok, mumla aydınlatılıyor.",hist:"1492'de İspanya, ardından Portekiz, Yahudilerini ya din değiştirmeye ya da ülkeyi terk etmeye zorladı. Bir kısmı Osmanlı'ya, bir kısmı kuzeye gitti. 1600'lerden itibaren pek çok Sefarad aile, dinini açıkça yaşayabildiği Amsterdam'a yerleşti. Yanlarında ticaret ağlarını ve sermayelerini getirdiler ve şehrin Altın Çağı'nda büyük pay sahibi oldular. Filozof Spinoza bu cemaatte doğdu ve 1656'da görüşleri yüzünden cemaatten çıkarıldı.\n\nCemaat 1675'te bu sinagogu açtı. Mimar Elias Bouman, Kudüs'teki Süleyman Mabedi'nin o dönem bilinen çizimlerinden esinlendi. Açıldığında dünyanın en büyük sinagoglarından biriydi. Yahudilerin Avrupa'nın çoğunda gettoya kapatıldığı bir çağda, şehrin ortasında bu boyutta bir sinagog yapabilmeleri Amsterdam'ın farkını gösterir.\n\nİç mekân o günden beri neredeyse aynıdır. Elektrik ve ısıtma yoktur, akşam törenlerinde yaklaşık bin mum yakılır. Zemine, nemi alsın ve ayak sesini kessin diye eski Hollanda usulü ince kum serilir. Kompleksteki Ets Haim, dünyanın hâlâ çalışan en eski Yahudi kütüphanesidir.\n\nSavaşta Amsterdam Yahudilerinin büyük çoğunluğu öldürüldü, ama bina zarar görmeden kaldı.",why:"Karşısındaki Yahudi Müzesi ile aynı biletle gezilir.",dur:"1 sa",fee:"Yaklaşık €22 (ziyaretçi yorumundan, doğrula)",hours:null,tip:"Cumartesi ve Yahudi bayramlarında ziyarete kapalı olabilir."},
      {id:"montel",cat:"hist",name:"Montelbaanstoren",wiki:"Montelbaanstoren",lat:52.3720106,lon:4.9056278,pid:"ChIJDxYOhLsJxkcRmbq1H5bc6kE",desc:"Oudeschans kanalının kıyısında, tuğla gövdeli ve beyaz külahlı kule.",hist:"1512'de komşu Gelderland'ın askerleri Amsterdam'ın doğusundaki tersaneleri basıp gemileri yaktı. Şehir bunun üzerine limanı korumak için 1516'da bu gözetleme kulesini yaptı. O zamanki hâli bugünkü tuğla gövdeden ibaretti, tepesi düzdü ve üzerine top konurdu.\n\nŞehir büyüyünce kule surların içinde kaldı ve askerî anlamını yitirdi. 1606'da Hendrick de Keyser gövdenin üstüne sekizgen ahşap bölümü ve sivri külahı ekledi, kule süs ve saat kulesine dönüştü. Ancak yumuşak zemin ek yükü taşıyamadı, kule 1610'da eğilmeye başladı. Amsterdamlılar halatlarla çekip temeli güçlendirerek doğrulttu.\n\nSaati ve çanları sık sık yanlış zamanda çaldığı için halk kuleye \"Malle Jaap\" (Şaşkın Jaap) adını taktı. Doğu Hindistan'a giden VOC denizcileri bu kulenin önünde toplanır, küçük teknelerle açıktaki büyük gemilere taşınırdı. Aileler buradan el sallardı.\n\nRembrandt iki sokak ötede otururdu ve kuleyi çizdi, ama külahı beğenmediği için onu çizmedi.",why:"Turist akışının dışında, kanal kenarında sakin.",dur:"10 dk",fee:"Ücretsiz (içi kapalı)",hours:"Dışarıdan her zaman"},
      {id:"schreier",cat:"hist",name:"Schreierstoren",wiki:"Schreierstoren",lat:52.3764398,lon:4.9023003,pid:"ChIJ8-nz-rkJxkcR25uPlJXZKG4",desc:"Garın karşısında, ortaçağ surlarından ayakta kalan savunma kulesi. İçi bugün kafe.",hist:"1480'lerde şehir surlarının köşe kulesi olarak yapıldı. Amsterdam'ın ortaçağ surlarından bugüne kalan tek savunma kulesidir. Önü o zaman açık denizdi: IJ doğrudan Zuiderzee'ye, oradan Kuzey Denizi'ne açılırdı.\n\nAdı için iki hikâye var. Halk hikâyesine göre \"Ağlayanlar Kulesi\"dir: denizci eşleri, aylarca ve bazen yıllarca sürecek seferlere çıkan kocalarını buradan uğurlar, ağlardı. Duvardaki 1569 tarihli taş kabartmada ağlayan bir kadın görülür. Dilbilimciler ise adın, surun burada yaptığı keskin köşeden (\"scherpe hoek\") geldiğini söyler.\n\n4 Nisan 1609'da İngiliz kaptan Henry Hudson, VOC adına Asya'ya kuzeyden kısa bir yol bulmak için \"Halve Maen\" gemisiyle buradan yola çıktı. Yolu bulamadı, ama bugün kendi adını taşıyan nehre ve Manhattan adasına ulaştı. Birkaç yıl sonra orada Nieuw Amsterdam kuruldu, yani bugünkü New York. Kulenin duvarında bunu anlatan bir plaket var.",why:"New York'un hikâyesi bu kapıdan başlıyor.",dur:"10 dk",fee:"Dışarıdan ücretsiz",hours:"Kafe: her gün 09:00-20:00"},
      {id:"centraal",cat:"hist",name:"Amsterdam Centraal",wiki:"Amsterdam_Centraal_station",lat:52.3791283,lon:4.900272,pid:"ChIJIxbYDbcJxkcRQtHfOo0b58o",desc:"Şehrin ana garı ve çoğu ziyaretçinin Amsterdam'ı ilk gördüğü yer. Arkasından ücretsiz vapurlar kalkar.",hist:"Gar 1889'da açıldı. Mimarı, Rijksmuseum'u da tasarlayan Pierre Cuypers'ti, iki binanın birbirine benzemesi bundandır. Cuypers Katolikti ve ortaçağ mimarisine hayrandı. Protestan Amsterdam'da binalarının \"fazla katedral gibi\" olduğu söylendi.\n\nYeri büyük tartışma çıkardı. Gar, IJ'nin sığ sularına yapılan üç yapay adanın üzerine kuruldu ve 8.687 ahşap kazığın üstünde durur. Böylece şehir, yüzyıllardır hayat kaynağı olan limanından ve deniz manzarasından koparıldı. Belediye buna karşıydı, kararı Lahey'deki hükümet verdi. Bugün birçok şehir plancısı bunu Amsterdam'ın en büyük planlama hatası sayar.\n\nCepheye bak: iki kulede iki kadran var. Sağdaki saattir. Soldaki ise saat değil, rüzgârın yönünü gösteren bir kadrandır. Yelkenli çağında liman şehri için rüzgâr yönü saat kadar önemliydi.\n\nGarın IJ tarafındaki arka çıkışından, 2015'te açılan ve çinilerle kaplı bisiklet ve yaya tünelinden geçerek ücretsiz vapurlara ulaşılır.",why:"Arka taraftaki IJ manzarası ve vapurlar için.",dur:"15 dk",fee:"Ücretsiz",hours:"Her zaman açık"},
      {id:"wic",cat:"hist",name:"West-Indisch Huis",wiki:"West-Indisch_Huis_(Amsterdam)",lat:52.3801404,lon:4.8920136,pid:"ChIJayzHH8kJxkcROep7kb6lWZ8",desc:"Hollanda Batı Hindistan Şirketi'nin (WIC) ilk merkezi. New York'u kurma kararı bu binada alındı.",hist:"Bina 1617'de et hali olarak yapıldı. 1623'te, yeni kurulan Batı Hindistan Şirketi'ne (WIC) verildi ve 1647'ye kadar şirketin merkezi oldu. VOC Asya'yla ticaret yaparken WIC'nin alanı Atlas Okyanusu'ydu: Batı Afrika, Karayipler, Brezilya ve Kuzey Amerika.\n\n1625'te şirket yöneticileri bu binada, Manhattan adasının ucuna bir kale ve yerleşim kurulmasına karar verdi. Nieuw Amsterdam böyle doğdu. 1664'te İngilizler şehri aldı ve adını New York yaptı. Avludaki heykel, şehrin son Hollandalı valisi Peter Stuyvesant'a aittir.\n\n1628'de Amiral Piet Hein, Küba açıklarında İspanya'nın gümüş filosunu ele geçirdi. Ganimet bu binanın mahzenlerinde saklandı ve şirketin hissedarlarına tarihin en yüksek kâr paylarından birini getirdi.\n\nWIC'nin asıl kazancı ise köle ticaretinden geldi. Şirket yüz binlerce Afrikalıyı Atlas Okyanusu'nun karşı kıyısındaki plantasyonlara taşıdı. Hollanda köleliği 1863'te kaldırdı, hükümet ve kral son yıllarda bu geçmiş için resmen özür diledi.",why:"Brouwersgracht yürüyüşünün başında, dışarıdan bakmalık.",dur:"10 dk",fee:"Dışarıdan ücretsiz",hours:null},
      {id:"annefrank",cat:"hist",name:"Anne Frank Evi",wiki:"Anne_Frank_House",lat:52.3752182,lon:4.8839765,pid:"ChIJSRE-IcUJxkcRCltjPmVdmtQ",desc:"Prinsengracht 263. Frank ailesinin saklandığı arka ev. Giriş saatli, içeride fotoğraf yok.",hist:"Frank ailesi Frankfurtluydu. 1933'te Hitler iktidara gelince Otto Frank ailesini Amsterdam'a taşıdı ve reçel yapımında kullanılan pektin satan bir şirket kurdu. Bu bina şirketin deposu ve ofisiydi. Almanya 1940'ta Hollanda'yı işgal etti ve Yahudilere yönelik yasaklar adım adım geldi.\n\n1942 Temmuz'unda Anne'nin ablası Margot'ya çalışma kampı celbi gelince aile ertesi gün saklandı. Yer, binanın arka tarafındaki boş bölümdü: Achterhuis, yani Arka Ev. Girişi dönen bir kitaplıkla gizlenmişti. Kısa süre sonra van Pels ailesi ve diş hekimi Fritz Pfeffer de katıldı. Sekiz kişi, yaklaşık 50 metrekarede, 761 gün yaşadı. Gündüzleri alt katta işçiler çalıştığı için konuşamaz, su akıtamaz, tuvaleti kullanamazlardı. Otto'nun dört çalışanı her gün hayatını tehlikeye atarak yiyecek ve haber getirdi.\n\nAnne on üçüncü yaş gününde hediye edilen deftere günlük tutmaya başladı. Savaştan sonra yazar olmak istiyordu ve günlüğünü yayımlanmak üzere baştan yazıyordu.\n\n4 Ağustos 1944'te polis binayı bastı. İhbarı kimin yaptığı bugüne kadar kesin olarak bilinmiyor. Sekiz kişi Auschwitz'e gönderildi. Anne ve Margot oradan Bergen-Belsen'e nakledildi ve 1945 başında, kampın kurtarılmasından haftalar önce tifüsten öldüler. Anne 15 yaşındaydı. Sekiz kişiden yalnızca Otto Frank sağ döndü. Yardımcılardan Miep Gies, baskından sonra yerde bulduğu günlük sayfalarını saklamıştı ve Otto'ya verdi. Günlük 1947'de yayımlandı, bugün 70'ten fazla dile çevrildi. Ev 1960'ta müze oldu. Otto'nun isteğiyle odalar boş bırakıldı.",why:"Şehrin en ağır ve en önemli durağı.",dur:"1 sa",fee:null,hours:"Her gün 09:00-22:00",tip:"Biletler yalnızca internetten satılıyor ve haftalar önce tükeniyor. 14 Ekim için hemen bak."},
      {id:"westerkerk",cat:"hist",name:"Westerkerk",wiki:"Westerkerk",lat:52.3745315,lon:4.8835481,pid:"ChIJkyv4z8QJxkcR9FqUIxss0SM",desc:"Prinsengracht kıyısındaki Protestan kilisesi ve şehrin en yüksek kilise kulesi.",hist:"1620-1631 arasında, kanal halkası kazılırken, yeni zengin mahallenin kilisesi olarak yapıldı. Tasarım Hendrick de Keyser'indi, o ölünce oğlu Pieter tamamladı. Açıldığında dünyanın en büyük Protestan kilisesiydi.\n\n85 metrelik kulesi Westertoren, Amsterdam'ın en yüksek kilise kulesidir. Tepesindeki mavi taç, Habsburg İmparatoru I. Maximilian'ın tacıdır. Maximilian 1489'da, savaşlarında kendisine borç veren Amsterdam'a armasında imparatorluk tacını kullanma hakkını vermişti. Şehir bununla çok gurur duyardı. Amsterdamlılar kuleye \"Yaşlı Wester\" der ve hakkında şarkılar söyler.\n\nRembrandt 1669'da yoksulluk içinde öldü ve bu kilisede, kira karşılığı tutulan adsız bir mezara gömüldü. O tür mezarlar yirmi yıl sonra boşaltılırdı, kemiklerinin nerede olduğu bilinmiyor. İçeride yalnızca bir anma plaketi var. Oğlu Titus ve hayat arkadaşı Hendrickje de burada yatar.\n\nAnne Frank saklandığı evden bu kuleyi görür, çanlarını duyardı. Günlüğünde çanların, özellikle geceleri, ona güven verdiğini yazar. 1966'da Prenses Beatrix, Alman diplomat Claus von Amsberg ile bu kilisede evlendi. Savaşın üzerinden yirmi yıl geçmişti ve dışarıda protestocular sis bombası attı.",why:"Anne Frank Evi'nin hemen yanında.",dur:"15 dk",fee:null,hours:"Pzt-Cum 11:00-15:00, hafta sonu kapalı"},
      {id:"homomonument",cat:"hist",name:"Homomonument",wiki:"Homomonument",lat:52.3744126,lon:4.8849229,pid:"ChIJORAB88QJxkcRosGTKrR0CEA",desc:"Westerkerk'in yanında, biri kanala doğru inen üç pembe granit üçgen.",hist:"1987'de açıldı ve cinsel yönelimi yüzünden zulüm gören insanlar için dünyada yapılan ilk anıttır. Tasarım Karin Daan'a ait.\n\nPembe üçgen, Nazi toplama kamplarında eşcinsel erkeklerin giysilerine dikilen işaretti. Eşcinsel hareket bu utanç işaretini 1970'lerde sahiplenip gurur simgesine çevirdi. Anıttaki üç üçgen birlikte büyük bir üçgen oluşturur. Biri kanala basamak basamak iner ve bugünü, biri yerle aynı hizadadır ve geçmişi, biri yerden yükselir ve geleceği temsil eder. Üçgenlerin köşeleri Anne Frank Evi'ni, Dam'daki Ulusal Anıt'ı ve Hollanda'nın en eski eşcinsel hakları derneğinin binasını gösterir.\n\nHollanda 2001'de eşcinsel evliliği yasallaştıran ilk ülke oldu ve dünyadaki ilk resmî nikâhlar Amsterdam belediye binasında kıyıldı.",why:"Westerkerk'e gelmişken iki dakika.",dur:"5 dk",fee:"Ücretsiz",hours:"Her zaman açık"},
      {id:"munt",cat:"hist",name:"Munttoren",wiki:"Munttoren",lat:52.3670613,lon:4.8932245,pid:"ChIJZabaHsAJxkcRy92UyRY-mT0",desc:"Singel'in Amstel'e kavuştuğu yerdeki saat kulesi. Yanında yüzen çiçek pazarı var.",hist:"Kulenin alt bölümü, 1480'lerde yapılan Regulierspoort şehir kapısının bir parçasıydı. Kapı 1618'de yandı, yalnızca bu kule ve yanındaki nöbetçi evi kaldı. İki yıl sonra Hendrick de Keyser kuleye bugünkü zarif üst bölümü ve saati ekledi.\n\nAdı, yani \"Darphane Kulesi\", tek bir yıldan gelir. 1672 Hollanda tarihinde \"Felaket Yılı\" diye anılır: Fransa, İngiltere ve iki Alman piskoposluğu aynı anda saldırdı. Fransız ordusu, paranın basıldığı şehirleri işgal edince gümüş ve altın Amsterdam'a getirildi ve geçici olarak bu nöbetçi evinde basıldı.\n\nKuledeki çan takımını 1668'de, döneminin en ünlü çan dökümcüleri Hemony kardeşler yaptı. Çanlar hâlâ çeyrek saatte bir çalar, cumartesi öğleden sonraları da bir çancı elle konser verir.\n\nKulenin dibinden başlayan Bloemenmarkt, 1862'den beri kanalın üzerindeki mavnalarda kurulan çiçek pazarıdır. Bugün daha çok turistlere lale soğanı satılıyor.",why:"Tarihi Merkez rotasının bitiş noktası.",dur:"10 dk",fee:"Ücretsiz (içi gezilmiyor)",hours:"Dışarıdan her zaman"},
      {id:"magere",cat:"hist",name:"Magere Brug",wiki:"Magere_Brug",lat:52.3635978,lon:4.9023824,pid:"ChIJmSIs9ZYJxkcRkx-Ou1QOZFI",desc:"Amstel üzerindeki beyaz ahşap açılır köprü.",hist:"Adı \"Sıska Köprü\" demek. İlk köprü 1691'de yapıldı ve o kadar dardı ki iki yaya yan yana zor geçerdi. Şehir efsanesine göre köprüyü, nehrin iki yakasında oturan zengin Mager kız kardeşler birbirlerini kolayca ziyaret etmek için yaptırmıştır. Daha gerçekçi açıklama şu: şehir buraya geniş bir taş köprü planlamış, 1672'deki savaş yüzünden para kalmayınca ucuz ve dar bir ahşap köprüyle yetinmiştir.\n\nKöprü 1871'de genişletildi. Bugünkü yapı 1934 tarihlidir ve eskisinin biraz büyütülmüş kopyasıdır. Dokuz açıklıklıdır, ortadaki iki kanat teknelerin geçmesi için günde birçok kez açılır. 1994'e kadar elle açılırdı.\n\nAkşamları yüzlerce ampulle aydınlatılır. Söylenceye göre köprünün üzerinde ya da altından tekneyle geçerken öpüşen çiftler sonsuza dek birlikte kalır. Köprü 1971 yapımı James Bond filmi \"Diamonds Are Forever\"da görünür. Bugün motorlu araçlara kapalı, yalnızca yayalar ve bisikletliler geçebiliyor.",why:"Gece ışıklandırmasıyla en güzel hâlinde.",dur:"10 dk",fee:"Ücretsiz",hours:"Her zaman açık"},
      {id:"rijks",cat:"hist",name:"Rijksmuseum",wiki:"Rijksmuseum",lat:52.3599976,lon:4.8852188,pid:"ChIJ5Ra7we4JxkcRhYVAaq5zQ9U",desc:"Hollanda'nın ulusal müzesi: Rembrandt, Vermeer ve Gece Devriyesi.",hist:"Müze 1800'de Lahey'de, Fransızların Louvre'una özenilerek açıldı. 1808'de Kral Louis Bonaparte koleksiyonu Amsterdam'a, Dam'daki saraya taşıttı. Kendi binasına ancak 1885'te kavuştu.\n\nMimar Pierre Cuypers'ti. Bina gotik ve rönesans karışımıdır, cephesi Hollanda sanat tarihinden sahnelerle bezelidir. Protestan Kral III. Willem binayı \"fazla Katolik\" buldu, ona \"başpiskoposun sarayı\" dedi ve içine adım atmayacağını söyledi. Binanın ortasından geçen tonozlu geçit baştan beri şehrin güneyine açılan kapı olarak tasarlandı. Bugün içinden bisikletliler geçer ve sokak müzisyenleri akustiği yüzünden burayı sever.\n\n2003'te başlayan yenileme beş yıl sürecekti, on yıl sürdü. Gecikmenin bir nedeni, bisikletlilerin geçidin kapatılmasına karşı verdiği mücadeleydi ve bisikletliler kazandı. Müze 2013'te yeniden açıldı.\n\nKoleksiyonun kalbi \"Şeref Galerisi\"dir ve sonunda Rembrandt'ın 1642 tarihli Gece Devriyesi asılıdır. Tablo aslında gündüz sahnesidir, adı yüzyıllar içinde kararan vernikten gelir. 1715'te yeni yerine sığması için dört kenarından kesildi. 1975'te bir ziyaretçi ekmek bıçağıyla, 1990'da bir başkası asitle saldırdı. Tablo 2019'dan beri ziyaretçilerin gözü önünde, cam bir odanın içinde inceleniyor ve onarılıyor. Aynı galeride Vermeer'in Sütçü Kız'ı da var.",why:"Tek müze seçeceksen bu. Geçit ve bahçe ücretsiz.",dur:"2,5 sa",fee:null,hours:"Her gün 09:00-17:00",tip:"Saatli rezervasyon al."},
      {id:"scheepvaart",cat:"hist",name:"Scheepvaartmuseum (Denizcilik Müzesi)",wiki:"Het_Scheepvaartmuseum",lat:52.3715579,lon:4.9143762,pid:"ChIJX-2rTqEJxkcRhjlIZp4bqFk",desc:"Suyun ortasında duran dev taş depo ve önünde demirli bir VOC gemisi kopyası.",hist:"Bina 1656'da Amsterdam Amiralliği'nin deposu olarak yapıldı: 's Lands Zeemagazijn. Donanmanın topları, yelkenleri, halatları ve erzakı burada tutulurdu. Altın Çağ'da Hollanda dünyanın en büyük ticaret filosuna sahipti ve bu depo o gücün lojistik merkeziydi. Yapı, suyun içine çakılmış binlerce kazığın üstünde durur. Avlusunun altındaki sarnıçlarda gemiler için yağmur suyu biriktirilirdi.\n\nDonanma 1973'te binadan çıktı ve yerine müze açıldı. Avlunun üstü 2011'de, eski deniz haritalarındaki pusula çizgilerinden esinlenen cam bir çatıyla kapatıldı.\n\nRıhtımda duran gemi, VOC'ye ait \"Amsterdam\"ın birebir kopyasıdır. Aslı 1749'da ilk seferinde, İngiltere'nin Hastings kıyılarında fırtınada karaya oturdu ve hâlâ oradaki kumun altındadır. Kopyanın içine girip mürettebatın aylarca nasıl yaşadığını görebilirsin: alçak tavanlar, hamaklar, kaptan kamarası.",why:"Gemiyi rıhtımdan görmek ücretsiz.",dur:"2 sa",fee:"Yaklaşık €20 (ziyaretçi yorumundan, doğrula)",hours:"Her gün 10:00-17:00"},
      {id:"gooyer",cat:"hist",name:"De Gooyer Yel Değirmeni",wiki:"De_Gooyer",lat:52.3668138,lon:4.9261881,pid:"ChIJO_zmuuoJxkcRMrUB9cK_jeI",desc:"Şehir içinde kalan birkaç değirmenden biri ve Hollanda'nın en yüksek ahşap değirmeni. Dibinde bira fabrikası var.",hist:"De Gooyer bir un değirmenidir. Kökeni 16. yüzyıla uzanır ve şehir büyüdükçe birkaç kez sökülüp yeniden kuruldu. Bugünkü yerine 1814'te geldi. O zaman burası şehir surlarının üstüydü: surların üzerine, rüzgârı iyi alsın diye sıra sıra değirmen dizilmişti. De Gooyer o sıranın ayakta kalan son değirmenidir. Yaklaşık 26 metre yüksekliğiyle ülkenin en yüksek ahşap değirmeni sayılır.\n\nHollanda'da değirmenlerin çoğu tahıl öğütmek için değil, su pompalamak için yapıldı. Ülkenin dörtte biri deniz seviyesinin altındadır ve o topraklar yüzyıllarca yel değirmenleriyle kurutuldu.\n\nDeğirmenin içi gezilmiyor, kanatları da artık dönmüyor. Dibindeki eski belediye hamamında 1985'ten beri Brouwerij 't IJ adlı bira fabrikası çalışıyor ve terası değirmene bakıyor.",why:"Amsterdam'da değirmen fotoğrafı için en kolay yer.",dur:"15 dk",fee:"Ücretsiz (içi kapalı)",hours:"Dışarıdan her zaman"},

      /* ================= MİMARİ (modern, brutalist, Amsterdam Okulu) ================= */
      {id:"stopera",cat:"arch",name:"Stopera (Belediye ve Opera)",wiki:"Stopera",lat:52.3673062,lon:4.9009267,pid:"ChIJpRPs5r0JxkcRUUIx22yPJX0",desc:"Amstel kıyısındaki beyaz mermer ve kırmızı tuğla blok: belediye binası ile opera aynı çatı altında.",hist:"Adı bir protesto sloganından gelir: \"Stop de Opera\". Belediye binası (stadhuis) ile opera aynı yapıya konunca slogan binanın adı oldu.\n\nBurası savaştan önce Yahudi mahallesinin kalbi olan Vlooienburg'du. Sakinlerinin çoğu toplama kamplarında öldürüldü, boş kalan evler 1944-45 Açlık Kışı'nda yakacak için söküldü. Alan onlarca yıl boş kaldı. Şehir 1960'larda buraya metro, otoyol ve yeni bir belediye binası planladı. Mahalleli direndi, 1975'te Nieuwmarkt'ta polisle günlerce süren çatışmalar oldu. Otoyoldan vazgeçildi, ama Stopera yapıldı ve 1986'da açıldı. Mimarları Wilhelm Holzbauer ve Cees Dam'dı. Amsterdamlılar binaya uzun süre \"takma diş\" dedi.\n\nBelediye ile opera arasındaki geçit herkese açık ve ücretsizdir. Orada üç cam sütun durur. İkisi denizin o anki gerçek seviyesini gösterir, üçüncüsü çok daha yüksektir ve 1953 Büyük Sel'inde suyun ulaştığı seviyedir. Yanındaki bronz düğme NAP'ı, yani \"Normal Amsterdam Seviyesi\"ni işaretler. Avrupa'nın büyük bölümünde rakım bu noktaya göre ölçülür. Sütunların önünde durunca şehrin deniz seviyesinin altında yaşadığını gözünle görürsün.",why:"NAP sütunları vlog için güçlü ve ücretsiz bir sahne.",dur:"15 dk",fee:"Geçit ücretsiz",hours:"Geçit gündüz açık"},
      {id:"weesperflat",cat:"arch",name:"Weesperflat (Hertzberger Öğrenci Yurdu)",wiki:"Herman_Hertzberger",lat:52.3658395,lon:4.9054941,pid:"ChIJv0t5aNEJxkcR6p_zcLy3GWg",desc:"1966 tarihli çıplak beton öğrenci yurdu. Hollanda yapısalcılığının ilk örneklerinden.",hist:"Mimar Herman Hertzberger bu işi, okulu yeni bitirdiği yıllarda kazandığı bir yarışmayla aldı. Yapı 1966'da tamamlandı ve onun ilk büyük işidir.\n\nHertzberger, savaş sonrasının soğuk ve tekdüze toplu konutlarına karşı çıkan Hollandalı yapısalcıların önde gelen ismidir. Fikri şuydu: mimar her şeyi belirlememeli, insanların kendi kullanımlarını yaratabileceği bir iskelet sunmalıdır. Bu binada dördüncü kat boydan boya açık bir \"yaşam sokağı\"dır. Evli öğrenci daireleri bu havada sokağa açılır, beton korkuluklar oturma yeri ve masa olacak genişlikte yapılmıştır, çocuklar orada oynasın diye.\n\nCephe süssüzdür: çıplak beton, yatay bantlar, cam tuğla. Brutalizm adını Fransızca \"béton brut\"ten, yani ham betondan alır. Kaba demek değildir.\n\nBina hâlâ öğrenci yurdu olarak kullanılıyor ve koruma altında. İçeri girilmiyor, cephe sokaktan görülüyor.",why:"Stopera ve Hortus arasında, yol üstü.",dur:"5 dk",fee:"Dışarıdan ücretsiz",hours:null},
      {id:"dnb",cat:"arch",name:"De Nederlandsche Bank",wiki:"De_Nederlandsche_Bank",lat:52.3593988,lon:4.9002993,pid:"ChIJ52DmRpEJxkcRCVsiyDpIbfA",desc:"Hollanda Merkez Bankası. 1968 tarihli modernist blok, yenilemeden sonra giriş katı halka açık.",hist:"Bu meydanda 1864'ten itibaren Paleis voor Volksvlijt dururdu: Londra'daki Crystal Palace'tan esinlenen, cam ve demirden dev bir sergi sarayı. Fikir, Sarphatipark'a adını veren doktor Samuel Sarphati'nindi. Saray 1929'da bir gecede yandı. Amsterdamlılar bu kaybı hâlâ anar ve sarayın yeniden yapılması zaman zaman gündeme gelir.\n\nYerine 1960'larda merkez bankası yapıldı. Mimar Marius Duintjer'in tasarımı 1968'de açıldı: yatay bir kaidenin üzerinde yükselen sade bir kule. Savaş sonrası Hollanda modernizminin tipik örneğidir ve uzun yıllar şehrin en sevilmeyen binalarından biri oldu, çünkü yanan sarayın yerinde duruyordu ve çevresine kapalıydı. Ülkenin altın rezervi yıllarca bu binanın kasalarında tutuldu.\n\nBina yakın zamanda baştan sona yenilendi. 1991'de eklenen yuvarlak kule söküldü, altın başka bir yere taşındı, zemin kat ve iç avlu halka açıldı.",why:"İçeride ücretsiz sergi ve oturacak yer var.",dur:"20 dk",fee:"Ücretsiz (ziyaretçi yorumuna göre)",hours:"Pzt-Cum 09:00-17:00, hafta sonu kapalı"},
      {id:"hetschip",cat:"arch",name:"Het Schip (Amsterdam Okulu)",wiki:"Het_Schip",lat:52.3905036,lon:4.8736135,pid:"ChIJX1BYwSoIxkcR6aA3TPGp7Mg",desc:"1921 tarihli işçi konutu. Tuğladan yapılmış bir gemi gibi kıvrılır. Amsterdam Okulu mimarisinin başyapıtı.",hist:"20. yüzyılın başında Amsterdam işçileri nemli bodrumlarda ve tek odalı evlerde yaşıyordu. 1901 tarihli Konut Yasası, devlet kredisiyle sosyal konut yapılmasının önünü açtı. Sosyalist belediye ve işçi kooperatifleri bunu ciddiye aldı.\n\nMimar Michel de Klerk'e göre işçiler yalnızca sağlıklı değil, güzel evleri de hak ediyordu. 1919-1921 arasında yaptığı bu blok 102 daire, bir postane ve bir toplantı salonu içerir. Planı gemiyi andırdığı için \"Het Schip\" (Gemi) diye anıldı. Tuğlalar dalga gibi örülmüş, pencereler yelken biçiminde, köşede hiçbir işe yaramayan ama herkesin sevdiği sivri bir kule var. De Klerk'e kulenin neden gerekli olduğu sorulduğunda, işçilerin de bir kuleyi hak ettiğini söylediği anlatılır.\n\nBu üsluba Amsterdam Okulu denir: dışavurumcu, el işçiliğine dayalı, tuğlayı heykel gibi kullanan bir mimari. Aynı yıllarda Almanya'da doğan sade Bauhaus'un tam tersidir.\n\nDe Klerk 1923'te, 39 yaşında öldü. Cenazesine oturduğu evleri tasarladığı işçiler kalabalık hâlde katıldı. Eski postane bugün müzenin parçası, bir daire de 1920'lerdeki hâliyle döşeli.",why:"Mimari seviyorsan şehrin en iyi turu. Merkezden otobüs ya da 25 dk yürüyüş.",dur:"1,5 sa",fee:null,hours:"Sal-Paz 11:00-17:00, Pazartesi kapalı",tip:"Ziyaretçilere göre İngilizce rehberli tur her gün 15:00'te."},
      {id:"eye",cat:"arch",name:"Eye Filmmuseum",wiki:"Eye_Filmmuseum",lat:52.384348,lon:4.901276,pid:"ChIJ2eGVTbQJxkcRuT5BhGHEIrM",desc:"IJ'nin kuzey kıyısındaki beyaz, keskin açılı yapı. Hollanda'nın film müzesi ve sinematek.",hist:"IJ'nin kuzey kıyısı yüz yıl boyunca tersanelerin ve Shell'in araştırma laboratuvarlarının bulunduğu, şehirlinin pek uğramadığı bir sanayi bölgesiydi. Shell 2000'lerde çekilince belediye kıyıyı kültüre açmaya karar verdi. İlk büyük adım bu bina oldu.\n\nEye 2012'de açıldı. Tasarım Viyanalı Delugan Meissl ofisine ait. Binanın tek bir dik açısı yok gibidir. Mimarlar yapıyı, ışığa ve bakış açısına göre biçim değiştiren bir şey olarak düşündü, sinemanın kendisi gibi. Halk arasında \"dev diş\" ya da \"kuş\" diye anılır.\n\nİçeride dört sinema salonu, sergi alanı ve on binlerce filmlik Hollanda film arşivinin vitrini var. Müzenin adı hem \"göz\" demektir hem de IJ nehrinin adının okunuşuna göndermedir: ikisi de \"ay\" diye okunur.\n\nBinaya girmek ücretsizdir. İçerideki basamaklı kafe alanı, boydan boya camdan IJ'ye ve Centraal'e bakar.",why:"Vapurdan inince 3 dakika. Kafe manzarası bedava.",dur:"30 dk",fee:"Binaya giriş ücretsiz, sergi ve film biletli",hours:"Her gün 10:00-22:00"},
      {id:"adam",cat:"arch",name:"A'DAM Toren",wiki:"A'DAM_Toren",lat:52.3839583,lon:4.9021118,pid:"ChIJu0txQLQJxkcR9gp6-ShcF6Y",desc:"Eski Shell kulesi. Çatısında seyir terası ve binanın kenarından dışarı sallanan salıncak var.",hist:"Kule 1971'de Shell'in genel merkez binası olarak yapıldı. Mimarı Arthur Staal'dı. Köşeleri kırık, 45 derece döndürülmüş kare planı ve tepesindeki taç gibi çıkıntısıyla 1970'ler kurumsal modernizminin tipik örneğidir. Amsterdamlılar ona yıllarca \"Shell Kulesi\" dedi ve kuzey kıyısının simgesi oldu.\n\nShell 2009'da çıktı. Kule birkaç yıl boş kaldıktan sonra müzik ve gece hayatı sektöründen bir grup girişimci tarafından alındı ve 2016'da A'DAM adıyla yeniden açıldı. Ad hem Amsterdam'ın kısaltmasıdır hem de \"Amsterdam Dance And Music\"in baş harfleridir. İçinde otel, ofisler, gece kulüpleri ve dönen bir restoran var.\n\nÇatıdaki seyir terası yaklaşık 100 metre yüksektedir. \"Over the Edge\" adlı salıncak, binanın kenarından dışarı, boşluğa doğru sallanır ve Avrupa'nın en yüksek salıncağı olarak tanıtılır.",why:"Şehri yukarıdan görmenin en iyi yolu. Gün batımına yakın çık.",dur:"1 sa",fee:null,hours:"Her gün 10:00-22:00"},
      {id:"ndsm",cat:"arch",name:"NDSM Rıhtımı",wiki:"NDSM",lat:52.4005238,lon:4.8958329,pid:"ChIJg7YwoTkIxkcRdRzJp-FRIIg",desc:"Eski tersane. Dev hangarlar, vinçler, grafiti ve sokak sanatı müzesi. Vapurla 15 dakika.",hist:"NDSM, \"Hollanda Tersane ve Gemi İnşa Şirketi\"nin kısaltmasıdır. 20. yüzyılın ortasında burası dünyanın en büyük tersanelerinden biriydi ve dev petrol tankerleri burada suya indirilirdi. 1970'lerde Asya tersaneleriyle rekabet edemedi ve 1984'te iflas etti. On futbol sahasından büyük alan, hangarları ve kızaklarıyla terk edildi.\n\n1990'larda merkezdeki işgal evlerinden çıkarılan sanatçılar ve zanaatkârlar boş hangarlara yerleşti. Belediye onları kovmak yerine alanı \"kuluçka yeri\" ilan etti ve ucuza kiraladı. Ana gemi inşa hangarının içine, iskele demirleri ve konteynerlerle bir atölye şehri kuruldu.\n\nBugün alanda eski bir vinç otele, bir Sovyet denizaltısı ile bir Greenpeace gemisi mekâna dönüşmüş durumda. Eski kaynak hangarında dünyanın en büyük sokak sanatı müzelerinden STRAAT bulunuyor. Dış duvarların çoğu serbest grafiti alanıdır ve sürekli değişir. Anne Frank'ın dev duvar portresi burada, STRAAT'ın cephesindedir.\n\nBölge hızla konutlaşıyor, o yüzden ham hâli giderek azalıyor.",why:"Brutal, endüstriyel ve fotojenik. Vapur yolculuğu da gezinin parçası.",dur:"1,5 sa",fee:"Alan ücretsiz, STRAAT müzesi biletli",hours:"Alan her zaman açık"},
      {id:"burgerweeshuis",cat:"arch",name:"Burgerweeshuis (Aldo van Eyck)",wiki:"Amsterdam_Orphanage",lat:52.3408245,lon:4.8557425,pid:"ChIJM37t-fvhxUcRAU5qoznxbQo",desc:"1960 tarihli yetimhane. Yüzlerce küçük beton kubbeden oluşan, mimarlık okullarında ders diye okutulan yapı.",hist:"Mimar Aldo van Eyck, savaştan sonra Amsterdam'ın boş arsalarına yüzlerce çocuk oyun alanı tasarlamıştı. 1955'te şehrin yetimhanesini yapma işi ona verildi ve bina 1960'ta açıldı.\n\nVan Eyck tek büyük bir kurum binası yerine \"küçük bir şehir\" kurdu. Yapı, her biri küçük bir beton kubbeyle örtülü yüzlerce kare birimden oluşur. Birimler çapraz dizilir, aralarında avlular, iç sokaklar ve meydanlar oluşur. Her yaş grubunun kendi evi ve kendi avlusu vardır. Eşikler, basamaklar, alçak duvarlar ve yere gömülü aynalar çocuk boyuna göre tasarlanmıştır. Van Eyck'in sözü ünlüdür: bir ev küçük bir şehir, bir şehir büyük bir ev olmalıdır.\n\nBina, Hollanda yapısalcılığının kurucu örneği sayılır ve dünyadaki mimarlık öğrencilerinin çoğu planını çizmiştir. 1980'lerde yıkılması gündeme geldi. Dünyanın dört bir yanından mimarların katıldığı kampanya sonunda kurtarıldı. Bugün koruma altında ve bir şirketin ofisi olarak kullanılıyor.",why:"Mimarlık meraklısı için. Merkezden uzak, Olimpiyat Stadı'nın yanında.",dur:"20 dk",fee:"Dışarıdan ücretsiz",hours:null,tip:"İçerisi ofis, yalnızca özel günlerde açılıyor."},
      {id:"bijlmer",cat:"arch",name:"Kleiburg (Bijlmermeer)",wiki:"Bijlmermeer",lat:52.3187843,lon:4.9791185,pid:"ChIJs3XQYG0MxkcRSTrWr_8OjrA",desc:"400 metre uzunluğunda, 11 katlı beton konut bloğu. 1960'ların ütopyacı Bijlmer mahallesinden kalan son özgün yapı.",hist:"Bijlmermeer 1966-1975 arasında, şehir plancısı Siegfried Nassuth'un yönetiminde, \"geleceğin şehri\" olarak kuruldu. Fikir Le Corbusier'den geliyordu: yaşamak, çalışmak ve ulaşım birbirinden ayrılacaktı. On binlerce daire, bal peteği planlı ve birbirinin aynısı 31 dev blokta toplandı. Arabalar yükseltilmiş yollardan gider, altı tamamen park ve bisiklet yolu olurdu. Havadan bakınca mahalle bir desen gibi görünür.\n\nÜtopya tutmadı. Hedeflenen orta sınıf aileler müstakil ev için banliyölere gitti. Daireler boş kaldı. 1975'te Surinam bağımsız olunca Hollanda'ya gelen on binlerce Surinamlı buraya yerleştirildi. İşsizlik, uyuşturucu ve suç arttı, Bijlmer ülkenin en kötü ünlü mahallesi oldu.\n\n4 Ekim 1992'de İsrail havayolu El Al'a ait bir kargo uçağı iki motorunu kaybedip buradaki bloklara çakıldı. Resmî sayıya göre 43 kişi öldü. Gerçek sayının daha yüksek olduğu düşünülüyor, çünkü bloklarda kayıtsız göçmenler yaşıyordu.\n\n1990'lardan itibaren blokların çoğu yıkıldı. Kleiburg da yıkılacaktı. Bir grup girişimci binayı sembolik 1 avroya aldı, dışını onardı ve içi boş daireleri alıcıların kendilerinin bitirmesi için ucuza sattı. Proje 2017'de Avrupa'nın en önemli mimarlık ödülü olan Mies van der Rohe Ödülü'nü kazandı. Bugün Bijlmer, Surinam, Gana ve Antiller mutfaklarıyla şehrin en çok kültürlü bölgesidir.",why:"Sovyet blokları sevenler için Amsterdam'daki karşılığı. Metroyla 20 dk.",dur:"45 dk",fee:"Ücretsiz",hours:"Dışarıdan her zaman"},

      /* ================= PARK VE BAHÇE ================= */
      {id:"vondel",cat:"park",name:"Vondelpark",wiki:"Vondelpark",lat:52.3579946,lon:4.8686484,pid:"ChIJz3y0xeIJxkcRNcogBVV41Gw",desc:"Şehrin en büyük ve en sevilen parkı. Göletler, çimenler, açık hava tiyatrosu ve kafeler.",hist:"1860'larda Amsterdam'ın zenginleri, şehrin güneybatısındaki çayırları satın alıp bir at ve yürüyüş parkı kurdu. Park 1865'te açıldı. Tasarımı, İngiliz tarzı doğal peyzajın ustası Jan David Zocher ve oğlu Louis yaptı: düz hatlar yerine kıvrılan yollar, göletler ve ağaç kümeleri. İki yıl sonra parka 17. yüzyıl şairi Joost van den Vondel'in heykeli dikildi ve park onun adıyla anılmaya başladı.\n\nPark bataklık üzerine kuruludur ve yavaş yavaş çöker. Bu yüzden her kuşakta bir kez baştan sona yükseltilip yenilenir.\n\n1960'ların sonunda dünyanın her yerinden gelen hippiler geceleri burada uyurdu. Belediye buna göz yumdu, hatta havayolu şirketi bunu reklamında kullandı. Vondelpark bir kuşak için \"sihirli merkez\"di.\n\nPark 1953'e kadar özel mülktü, sonra belediyeye devredildi. Yazın açık hava tiyatrosunda ücretsiz konserler olur. Gül bahçesi ve Picasso'nun parka armağan ettiği \"Balık\" heykeli görülmeye değer. Ağaçlarda, kafesten kaçıp çoğalan yeşil papağanları görebilirsin.",why:"Rijksmuseum'dan sonra yürüyüş ve dinlenme.",dur:"1 sa",fee:"Ücretsiz",hours:"Her zaman açık"},
      {id:"ooster",cat:"park",name:"Oosterpark",wiki:"Oosterpark_(Amsterdam)",lat:52.3600823,lon:4.9204907,pid:"ChIJV7MaFnYJxkcRRsotO9L0WOI",desc:"Doğu yakasının göllü parkı. Sarphatistraat'ın ilerisinde, turistlerin az uğradığı sakin bir yer.",hist:"Vondelpark zenginlerin özel parkıydı. Oosterpark ise 1891'de belediyenin halk için yaptırdığı ilk büyük parktır. O zaman burası şehrin doğu ucuydu ve çevresine işçi mahalleleri kuruluyordu. Tasarım peyzaj mimarı Leonard Springer'e ait: ortada büyük, kıvrımlı bir gölet ve çevresinde dolanan yollar.\n\nParkta iki önemli anıt var. Birincisi, 2002'de açılan Ulusal Kölelik Anıtı'dır. Zincirlenmiş insanlardan özgürlüğe uzanan figürlere doğru ilerleyen bronz bir gruptur. Hollanda'da kölelik 1 Temmuz 1863'te kaldırıldı. Her yıl 1 Temmuz'da burada \"Keti Koti\" (Kırılan Zincirler) töreni yapılır ve kral 2023'te kölelik için resmî özrünü bu parkta diledi.\n\nİkincisi \"De Schreeuw\" (Çığlık) adlı çelik heykeldir. Film yönetmeni Theo van Gogh'u anar. Van Gogh, İslam'ı eleştiren bir film çektikten sonra 2 Kasım 2004'te parkın hemen dışındaki sokakta bisikletle giderken öldürüldü. Olay Hollanda'da ifade özgürlüğü ve göç tartışmalarını kökünden değiştirdi.\n\nParkın karşısındaki büyük bina Tropenmuseum'dur (bugünkü adıyla Wereldmuseum).",why:"Dappermarkt ve De Gooyer değirmeniyle aynı yürüyüşe sığar.",dur:"40 dk",fee:"Ücretsiz",hours:"Her zaman açık"},
      {id:"hortus",cat:"park",name:"Hortus Botanicus",wiki:"Hortus_Botanicus_(Amsterdam)",lat:52.3669189,lon:4.9076231,pid:"ChIJqxRzZuLhxUcRpgvqX1nIp1A",desc:"1638'den kalma botanik bahçesi. Küçük ama yoğun: tropik seralar, kelebek serası, palmiye evi.",hist:"1630'larda Amsterdam'ı veba vurdu. Belediye, hekimlerin ve eczacıların şifalı bitkileri tanıyıp yetiştirebilmesi için 1638'de bir bitki bahçesi kurdu. Bahçe 1682'de bugünkü yerine taşındı. Dünyanın en eski botanik bahçelerinden biridir.\n\nAsıl zenginliği VOC'den geldi. Şirketin gemileri Asya, Afrika ve Amerika'dan binlerce tohum, soğan ve fidan getirdi. Bunların arasında 1706'da Cava'dan gelen birkaç kahve fidanı da vardı. Amsterdam 1714'te bunlardan birini Fransa Kralı XIV. Louis'ye hediye etti. O fidanın torunları Fransız sömürgelerine, oradan Orta ve Güney Amerika'ya taşındı. Bugün Latin Amerika'da yetişen kahvenin büyük bölümünün soy ağacı bu bahçedeki o fidanlara uzanır. Güneydoğu Asya'daki palm yağı plantasyonlarının ilk ağaçları da buradan giden tohumlarla dikildi.\n\nPalmiye serasındaki dev sikas ağacı 300 yaşından büyüktür ve dünyadaki en eski saksı bitkilerinden sayılır. Modern genetiğin öncülerinden botanikçi Hugo de Vries 19. yüzyılın sonunda burada çalıştı ve mutasyon kuramını burada geliştirdi.",why:"Yağmurlu havada sıcak ve yeşil bir sığınak.",dur:"1 sa",fee:null,hours:"Her gün 10:00-17:00"},
      {id:"wester",cat:"park",name:"Westerpark ve Westergas",wiki:"Westerpark_(park)",lat:52.3861271,lon:4.877835,pid:"ChIJkweMYtMJxkcR19hz7lJVRVY",desc:"Batıdaki park ve yanındaki eski gaz fabrikası. Kırmızı tuğla sanayi binaları bugün kafe, sinema ve etkinlik mekânı.",hist:"Westergasfabriek 1885'te açıldı. Kömürden havagazı üretir, bu gaz şehrin sokak lambalarını yakardı. O dönemin sanayi binaları bile gösterişliydi: mimar Isaac Gosschalk fabrikayı Hollanda rönesansı üslubunda, kuleli ve süslü tuğla yapılar olarak tasarladı.\n\nHollanda 1960'larda kuzeyde dev doğalgaz yatakları bulunca havagazına gerek kalmadı. Fabrika 1967'de kapandı ve toprağı katran ve siyanürle zehirlenmiş hâlde kaldı. Alan otuz yıl depo olarak kullanıldı. 1990'larda sanatçılar boş binalarda partiler ve sergiler düzenlemeye başladı. Belediye toprağı temizletti ve alan 2003'te kültür parkı olarak açıldı. Eski gaz deposu bugün konser salonudur.\n\nYanındaki Westerpark daha eskidir, 1890'lardan kalmadır. İkisi birleşince merkeze en yakın büyük yeşil alan ortaya çıktı. Pazar günleri ayda bir büyük bir el işi ve yemek pazarı kurulur.",why:"Het Schip ile aynı yürüyüşe sığar. Hafta sonu canlı.",dur:"1 sa",fee:"Ücretsiz",hours:"Her zaman açık"},
      {id:"sarphati",cat:"park",name:"Sarphatipark",wiki:"Sarphatipark",lat:52.3536511,lon:4.8962456,pid:"ChIJ4SFGo40JxkcRMqDf88PiWoo",desc:"De Pijp'in ortasındaki küçük mahalle parkı. Albert Cuyp pazarından aldığını yemek için ideal.",hist:"Park adını Samuel Sarphati'den alır. Sarphati 19. yüzyılda yaşamış Portekiz Yahudisi kökenli bir doktordu ve yoksul hastalarını tedavi ederken asıl sorunun pis su, çöp ve kötü ekmek olduğunu gördü. Şehrin ilk çöp toplama hizmetini, ucuz ve temiz ekmek üreten bir fabrikayı, bir ticaret okulunu ve Amstel Oteli'ni kurdu. En büyük projesi, bugün merkez bankasının durduğu yerdeki cam sergi sarayıydı.\n\nDe Pijp mahallesi 1870'lerden itibaren, hızla büyüyen şehrin işçileri için ucuz ve dar evlerle kuruldu. Park 1885'te açıldı ve ortasına Sarphati'nin anıtı dikildi. Alman işgali sırasında, Sarphati Yahudi olduğu için anıt kaldırıldı ve parkın adı değiştirildi. Savaştan hemen sonra ikisi de geri getirildi.",why:"De Pijp lezzet turunun bitişi.",dur:"20 dk",fee:"Ücretsiz",hours:"Her zaman açık"},
      {id:"frankendael",cat:"park",name:"Park Frankendael",wiki:"Frankendael",lat:52.3511853,lon:4.9308048,pid:"ChIJs4UXQHsJxkcRbpshRTz-CIY",desc:"Doğudaki eski bir kır malikânesinin bahçesi. Süs bahçesi, çeşme, hobi bahçeleri ve çatısında leylek yuvası.",hist:"Burası Watergraafsmeer'dir: 1629'da yel değirmenleriyle kurutulmuş eski bir göl. Zemini deniz seviyesinin yaklaşık beş metre altındadır ve Amsterdam'ın en alçak yerlerinden biridir.\n\n17. ve 18. yüzyılda kanal evlerinde yaşayan zengin tüccarlar yazın şehrin kokusundan kaçmak için bu kurutulmuş toprağa kır evleri yaptırdı. Bir zamanlar burada onlarca malikâne vardı. Huize Frankendael bunlardan ayakta kalan tek örnektir. Evin önündeki mermer çeşme ve arkasındaki simetrik süs bahçesi o dönemden kalmadır.\n\nBelediye araziyi 19. yüzyılda satın aldı ve uzun süre şehir fidanlığı olarak kullandı. Bugün park, süs bahçesi, doğal bir bölüm ve mahallelinin sebze yetiştirdiği hobi bahçelerinden oluşuyor.",why:"Turist yok. Oost'ta sakin bir öğleden sonra için.",dur:"45 dk",fee:"Ücretsiz",hours:"Her gün 07:00-22:00"},
      {id:"rembrandtpark",cat:"park",name:"Rembrandtpark",wiki:"Rembrandtpark",lat:52.3685491,lon:4.8489341,pid:"ChIJ-e1IGhTixUcRy260F0WUXj4",desc:"Batıdaki geniş mahalle parkı. Göletler, çocuk çiftliği ve Vondelpark'ın sakin hâli.",hist:"Park, savaş sonrası Amsterdam'ın batıya doğru büyümesinin parçasıdır. Şehir 1930'larda \"Genel Genişleme Planı\"nı hazırladı: ışık, hava ve yeşil alan esasına dayanan, dünyada örnek gösterilen modern bir plan. Batıdaki yeni mahalleler savaştan sonra bu plana göre kuruldu ve aralarına geniş yeşil şeritler bırakıldı. Rembrandtpark 1970'lerde bu şeritlerden birine yapıldı.\n\nParkın içindeki çocuk çiftliği şehrin en eskilerindendir. Çevredeki yüksek konut blokları savaş sonrası modernizmin tipik örnekleridir.",why:"Foodhallen'e yakın. Kalabalıktan uzaklaşmak için.",dur:"40 dk",fee:"Ücretsiz",hours:"Her zaman açık"},

      /* ================= FOTO ================= */
      {id:"seven",cat:"photo",name:"Yedi Köprü Manzarası",wiki:"Reguliersgracht",lat:52.3649598,lon:4.8958703,pid:"ChIJJ6ZGa58JxkcRlJer3MCjMuU",desc:"Reguliersgracht boyunca arka arkaya dizilen köprü kemerleri.",hist:"Reguliersgracht 1660'larda, kanal halkasının doğuya doğru ikinci genişlemesi sırasında açıldı. Adını yakınlardaki bir manastırın \"Reguliers\" tarikatından alır. Kanalı kesen yedi kemerli taş köprü aynı hizada durur ve su seviyesinden bakınca iç içe geçmiş gibi görünür.\n\n1900'lerin başında belediye bu kanalı doldurup tramvay yolu yapmak istedi. Halk karşı çıktı ve kanal kurtuldu. Amsterdam'da doldurulan onlarca kanalın yanında bu, korumacıların ilk büyük zaferlerinden biridir.",why:"Klasik Amsterdam karesi.",dur:"10 dk",fee:"Ücretsiz",hours:"Her zaman",tip:"Yorumlara göre köprülerin hepsi karadan görünmüyor. En iyi hâli akşam ışıklarıyla veya tekneden."},
      {id:"dancing",cat:"photo",name:"Dans Eden Evler",wiki:"Amstel",lat:52.3677143,lon:4.8970266,pid:"ChIJBfLALQAJxkcRyOrYIGjehn0",desc:"Amstel'in karşı kıyısında birbirine yaslanmış eğri evler.",hist:"Amsterdam'ın altı turba ve çamurdur. Sağlam kum tabakası yaklaşık 11 metre aşağıdadır. Bu yüzden her bina, o kuma kadar çakılan ahşap kazıkların üzerinde durur. Kazıklar su altında kaldıkça yüzyıllarca dayanır, ama yeraltı suyu düşerse çürür. Çürüyen kazığın üstündeki ev o yana yatar. Bu sıradaki evler birbirine yaslanarak ayakta durur.\n\nEvlerin öne doğru eğik durması ise çoğu zaman kasıtlıdır. Merdivenler çok dar olduğu için eşyalar çatıdaki kancadan iple çekilirdi. Cephe öne eğik yapılırdı ki yük duvara çarpmasın.",why:"Kalabalık yok, kadraj hazır.",dur:"10 dk",fee:"Ücretsiz",hours:"Her zaman"},
      {id:"keizers",cat:"photo",name:"Keizersgracht Manzara Noktası",wiki:"Keizersgracht",lat:52.3636729,lon:4.8981499,pid:"ChIJMVP6UgAJxkcRbNQ1qvJWrgU",desc:"Evlerin ve ağaçların suya yansıdığı sakin bir kanal köşesi.",hist:"Kanal halkasının inşasına 1613'te başlandı. Şehir nüfusu elli yılda dört katına çıkmıştı ve belediye, ortaçağ çekirdeğinin çevresine yarım ay biçiminde üç büyük kanal kazdırdı: Herengracht (Beyler Kanalı), Keizersgracht (İmparator Kanalı) ve Prinsengracht (Prens Kanalı). Keizersgracht üçünün en genişidir ve adını İmparator I. Maximilian'dan alır.\n\nBu, döneminin en büyük şehir planlama projesiydi. Evlerin vergisi cephe genişliğine göre alındığı için evler dar, derin ve yüksek yapıldı. Kanal halkası 2010'da UNESCO Dünya Mirası listesine girdi.",why:"Sonbahar yaprakları için birebir.",dur:"10 dk",fee:"Ücretsiz",hours:"Her zaman"},

    routes:[
      {id:"r-merkez",name:"Tarihi Merkez",wiki:"Dam_Square",desc:"Gardan çıkıp Damrak, Dam, Kalverstraat ve Begijnhof üzerinden Munt Kulesi'ne.",hist:"Bu hat, Amstel nehrinin eski yatağını izler. Damrak ve Rokin bir zamanlar nehrin kendisiydi: gemiler denizden girip Dam'a kadar gelirdi. 19. yüzyılda büyük bölümü dolduruldu. Kalverstraat adını ortaçağdaki dana pazarından alır ve yüzyıllardır şehrin ana alışveriş sokağıdır.",why:"İlk gün şehri tanımak için.",stops:["Centraal","Damrak","Dam Meydanı","Begijnhof","Spui","Muntplein"],pts:[[52.3783,4.8995],[52.3765,4.8962],[52.3731,4.8924],[52.3694,4.8904],[52.3688,4.8909],[52.3668,4.8932]]},
      {id:"r-wallen",name:"De Wallen (Red Light)",wiki:"De_Wallen",desc:"Dam'dan Oudezijds kanallarına, Oude Kerk ve Nieuwmarkt üzerinden Zeedijk'e.",hist:"De Wallen şehrin en eski mahallesidir. Adı, ortaçağda kanalların kıyısını tutan toprak setlerden (wal) gelir. 14. yüzyıldan beri liman mahallesiydi: aylarca denizde kalan gemiciler buraya iner, meyhaneler ve genelevler onların parasıyla yaşardı.\n\nSeks işçiliği Hollanda'da yüzyıllarca yasak ama göz yumulan bir işti. Kadınlar önce kapı önünde, sonra perde arkasında, 20. yüzyılda da kırmızı ışıklı vitrinlerde çalıştı. 2000'de genelev yasağı kaldırıldı ve iş yasal, vergili ve denetimli hâle geldi.\n\nSon yıllarda belediye mahalleyi dönüştürüyor: vitrinlerin bir kısmı kapatıldı, rehberli turlar yasaklandı, sokakta esrar içmek cezaya bağlandı. Vitrinlerin şehrin güneyinde kurulacak bir \"erotik merkez\"e taşınması tartışılıyor ve seks işçilerinin çoğu buna karşı çıkıyor.\n\nZeedijk, mahallenin kuzey sınırıdır ve şehrin en eski sokaklarından biridir. Bugün Amsterdam'ın Çin mahallesi buradadır, sokak tabelaları iki dillidir.",why:"En iyi hâli hava kararırken.",tip:"Vitrinlerdeki kişilerin fotoğrafını veya videosunu çekmek yasak. Vlog çekerken kamerayı kanala ve binalara çevir.",stops:["Dam","Oudezijds Voorburgwal","Oude Kerk","Oudezijds Achterburgwal","De Waag","Zeedijk"],pts:[[52.3731,4.8924],[52.3724,4.8962],[52.3741,4.8979],[52.3746,4.8993],[52.3727,4.9004],[52.3755,4.9005],[52.377,4.8995]]},
      {id:"r-jordaan",name:"Jordaan ve Kanallar",wiki:"Jordaan",desc:"Brouwersgracht'tan Noordermarkt'a, Prinsengracht boyunca Anne Frank Evi ve Dokuz Sokak'tan Leidseplein'e.",hist:"Jordaan 1612'den itibaren, kanal halkasıyla aynı anda ama onun tam tersi bir mantıkla kuruldu. Kanal halkası zengin tüccarlar içindi. Jordaan ise işçiler, zanaatkârlar ve göçmenler için ucuz arsalara bölündü. Sokakları eski çayır hendeklerinin yönünü izlediği için kanal halkasına çapraz durur. Adının Fransızca \"jardin\"den (bahçe) geldiği söylenir, sokak adlarının çoğu çiçek ve ağaç adıdır.\n\n19. yüzyılda burası Avrupa'nın en kalabalık ve en yoksul mahallelerinden biriydi. 1934'te işsizlik yardımının kesilmesi üzerine günlerce süren bir ayaklanma çıktı. Savaştan sonra belediye mahalleyi yıkıp yeniden yapmayı planladı. Sakinler ve sanatçılar direndi, evler onarıldı. Bugün şehrin en pahalı ve en sevilen semtlerinden biridir.\n\nBrouwersgracht (Biracılar Kanalı) adını kıyısındaki bira fabrikalarından alır, eski depolar bugün konuttur. Dokuz Sokak (Negen Straatjes), üç büyük kanalı birbirine bağlayan küçük butik sokaklarıdır.",why:"Dar sokaklar, tekne evler, elmalı turta molası.",stops:["Brouwersgracht","Noordermarkt","Prinsengracht","Westerkerk","Runstraat","Leidseplein"],pts:[[52.3806,4.888],[52.3791,4.8863],[52.3765,4.8842],[52.3749,4.8837],[52.3688,4.8841],[52.3641,4.8828]]},
      {id:"r-foto",name:"Altın Kıvrım ve Amstel",wiki:"Herengracht",desc:"Muntplein'dan Herengracht'ın en zengin kıvrımına, Yedi Köprü, Amstel ve Magere Brug'dan Dans Eden Evler'e.",hist:"Herengracht'ın Leidsestraat ile Vijzelstraat arasındaki bölümü Gouden Bocht (Altın Kıvrım) diye bilinir. 1660'larda kanal halkası doğuya uzatılırken şehrin en zengin aileleri burada yan yana iki parsel alıp çift cepheli taş konaklar yaptırdı. Dar tuğla evlerin yerini geniş, Fransız saraylarını andıran cepheler aldı. Bugün çoğu banka, konsolosluk ve hukuk bürosudur.",why:"Fotoğraf rotası. Gün batımına denk getir.",stops:["Muntplein","Herengracht","Yedi Köprü","Keizersgracht","Magere Brug","Dans Eden Evler"],pts:[[52.3668,4.8932],[52.3657,4.8915],[52.36496,4.89587],[52.36367,4.89815],[52.36426,4.90116],[52.3636,4.90238],[52.36771,4.89703]]},
      {id:"r-pijp",name:"De Pijp Lezzet Turu",wiki:"De_Pijp",desc:"Rijksmuseum geçidinden Museumplein'a, Albert Cuyp pazarı boyunca Sarphatipark'a.",hist:"De Pijp (Pipo) 1870'lerden itibaren işçiler için kuruldu. Uzun, dar ve dümdüz sokakları yüzünden bu adı aldığı söylenir. Ucuz kiralar öğrencileri, sanatçıları ve göçmenleri çekti. Bugün şehrin en karışık ve en canlı yeme içme mahallesidir.",why:"Müzeden sonra ucuza karın doyurmak için.",stops:["Rijksmuseum","Museumplein","Albert Cuyp","Rudi's","Sarphatipark"],pts:[[52.36,4.8852],[52.3582,4.8838],[52.3553,4.8916],[52.3558,4.895],[52.3546,4.8962]]},
      {id:"r-noord",name:"Noord: IJ'nin Karşı Kıyısı",wiki:"Amsterdam-Noord",desc:"Buiksloterweg iskelesinden Eye Filmmuseum ve A'DAM kulesine, kıyı boyunca yürüyüş.",hist:"Amsterdam-Noord yüzyıllarca şehrin \"öbür tarafı\"ydı. Ortaçağda idam edilenlerin cesetleri ibret olsun diye bu kıyıda sergilenirdi. 20. yüzyılda tersaneler ve fabrikalar kuruldu, işçiler için bahçeli köy mahalleleri yapıldı. Köprü olmadığı için merkezle tek bağlantı vapurdu. 2018'de açılan Kuzey-Güney metro hattı bunu değiştirdi ve Noord bugün şehrin en hızlı değişen bölgesi.",why:"Vapurla 3 dakika, şehre karşıdan bakmak için.",stops:["Buiksloterweg iskelesi","Eye Filmmuseum","A'DAM Toren","Pont Neuf"],pts:[[52.38221,4.90313],[52.38435,4.90128],[52.38396,4.90211],[52.38275,4.9041]]},
      {id:"r-oost",name:"Oost: Bahçe, Park ve Değirmen",wiki:"Oosterpark_(Amsterdam)",desc:"Hortus Botanicus'tan Oosterpark'a, Dappermarkt üzerinden De Gooyer değirmenine.",hist:"Plantage mahallesi 17. yüzyılda şehrin bahçe bölgesi olarak planlandı, Hortus ve hayvanat bahçesi Artis buradadır. Savaştan önce burası Yahudi mahallesinin devamıydı. Rotanın başındaki Hollandsche Schouwburg tiyatrosu, işgal sırasında Yahudilerin toplanıp kamplara gönderildiği yerdi ve bugün anıttır.",why:"Turist kalabalığının dışında, yeşil bir yarım gün.",stops:["Hortus Botanicus","Oosterpark","Dappermarkt","De Gooyer"],pts:[[52.36692,4.90762],[52.36008,4.92049],[52.36224,4.92777],[52.36681,4.92619]]},
      /* ---------- Ücretsiz vapurlar ---------- */
      {id:"f-buik",ferry:"F3",name:"Vapur F3: Centraal - Buiksloterweg",wiki:"Amsterdam_Ferry_Service",desc:"Garın arkasından IJ'nin karşı kıyısına geçen ücretsiz vapur. Eye ve A'DAM kulesi iskelenin hemen yanında.",hist:"IJ üzerinde merkez ile Noord arasında köprü yoktur. Büyük gemilerin geçişini engellememek için şehir köprü yerine vapuru seçti. Vapurlar belediyenin ulaşım şirketi GVB tarafından işletilir ve yayalar, bisikletliler ve mopedler için ücretsizdir. Bilet ya da kart okutmak gerekmez, binip geçersin.",why:"Bedava IJ turu. Geceleri de çalışır.",facts:[["Ücret","Ücretsiz, bilet gerekmez"],["Sefer","Gündüz birkaç dakikada bir, gece de çalışır (ziyaretçi yorumuna göre)"],["Süre","Yaklaşık 3-5 dk"],["Nereden","Centraal'in arka (IJ) tarafı"]],pts:[[52.3807,4.8997],[52.38221,4.90313]]},
      {id:"f-ndsm",ferry:"F4",name:"Vapur F4: Centraal - NDSM",wiki:"Amsterdam_Ferry_Service",desc:"Garın arkasından eski NDSM tersanesine giden ücretsiz vapur. IJ boyunca kısa bir tekne gezisi gibi.",hist:"IJ, Amsterdam'ın limanıdır ve bir zamanlar denizin bir koluydu. 1870'lerde Kuzey Denizi Kanalı açılınca şehir açık denize doğrudan bağlandı, IJ'nin doğusu setle kapatıldı. Vapurdan batıya bakınca liman vinçlerini, doğuya bakınca garın arka cephesini görürsün.",why:"NDSM'ye gitmenin tek keyifli yolu.",facts:[["Ücret","Ücretsiz, bilet gerekmez"],["Sefer","Güncel saatleri GVB'den doğrula"],["Süre","Yaklaşık 15 dk"],["Nereden","Centraal'in arka (IJ) tarafı"]],tip:"Haritadaki vapur çizgisi şematiktir.",pts:[[52.3807,4.8997],[52.3868,4.8925],[52.395,4.889],[52.40121,4.89094]]}

function photo(title, size){

}

/* ---------- Harita (MapLibre + OpenFreeMap, anahtar gerektirmez) ---------- */
const ll = p => [p[1], p[0]];
function themed(style){
  const C = {land:"#FFE3B8", water:"#27B7D9", green:"#B4DB7A", bld:"#F5B872", edge:"#E39A4E", road:"#FFF9EE", cas:"#E9AE6E", text:"#5A3418", halo:"#FFF3DC"};
  style.layers = style.layers.filter(l => !/^poi/.test(l.id) && l.type !== "fill-extrusion");
  style.layers.forEach(l => { const sl = l["source-layer"] || "", p = l.paint = l.paint || {};
    if (l.type === "background") p["background-color"] = C.land;
    else if (l.type === "fill"){
      if (sl === "water"){ delete p["fill-pattern"]; p["fill-color"] = C.water; }
      else if (sl === "building"){ delete l.maxzoom; p["fill-color"] = C.bld; p["fill-outline-color"] = C.edge; p["fill-opacity"] = 1; }
      else if (sl === "park" || sl === "landcover"){ delete p["fill-pattern"]; p["fill-color"] = C.green; }
      else if (sl === "landuse"){ delete p["fill-pattern"]; p["fill-color"] = "#FFD7A0"; }
      else if (sl === "transportation" || sl === "aeroway") p["fill-color"] = C.road;
    } else if (l.type === "line"){
      if (sl === "waterway") p["line-color"] = C.water;
      else if (sl === "transportation" && !/rail|transit/.test(l.id)) p["line-color"] = /casing/.test(l.id) ? C.cas : C.road;
    } else if (l.type === "symbol" && l.layout && l.layout["text-field"]){
      const w = /water/.test(sl); p["text-color"] = w ? "#0B6E86" : C.text; p["text-halo-color"] = w ? "#BFEFF8" : C.halo; p["text-halo-width"] = 1.4;
    }
  });
  return style;
}
let lastPick = 0;
const ROUTE = "#1D3FA8", FERRY = "#0B8FB8";

  city = CITIES[key]; sel = null;
  $("#home").hidden = true; $("#city").hidden = false; $("#cityTitle").textContent = city.name;
  if (!(history.state && history.state.city)) history.pushState({city:key}, "");
  renderChips(); setTab("map"); startLocate();
  if (map){ map.resize(); return; }
  if (!window.maplibregl){ $("#loading").firstChild.hidden = true; $("#loading").lastChild.textContent = "Harita yüklenemedi. Bağlantını kontrol edip sayfayı yenile. Liste sekmesi yine çalışır."; return; }

    .catch(() => { $("#loading").lastChild.textContent = "Harita yüklenemedi. Bağlantını kontrol edip sayfayı yenile. Liste sekmesi yine çalışır."; $("#loading").firstChild.hidden = true; });
}
function initMap(style){
  const b = city.bounds;
  map = new maplibregl.Map({container:"map", style, center:ll(city.center), zoom:city.zoom, minZoom:city.minZoom, maxZoom:19,
    maxBounds:[[b[0][1], b[0][0]], [b[1][1], b[1][0]]], dragRotate:false, pitchWithRotate:false, attributionControl:{compact:true}});
  map.touchZoomRotate.disableRotation();
  city.places.forEach(p => { markers[p.id] = mk(p.id, (artOf(p) ? `<svg class="art" viewBox="0 0 48 56">${artOf(p)}</svg>` : "") + `<div class="${pinCls(p)}" style="--c:${CATS[p.cat].c}"><b>${p.cat === "coffee" ? ic("cup") : p.cat === "bakery" ? ic("croissant") : p.cat === "market" ? ic("cart") : (p.price || "")}</b></div>`, p.name, [p.lat, p.lon], "bottom"); if (ART[p.id]) markers[p.id].el.classList.add("hasart"); });
  let n = 0;
  city.routes.forEach(r => { markers[r.id] = mk(r.id, `<div class="rstart${r.ferry ? " ferry" : ""}">${r.ferry || ++n}</div>`, r.name, r.pts[0], "center"); });
  map.on("load", () => {
    $("#loading").hidden = true;
    city.routes.forEach(r => {
      map.addSource(r.id, {type:"geojson", data:gj(r.geo ? r.geo.line : r.pts)});
      map.addLayer({id:r.id + "-c", type:"line", source:r.id, layout:{"line-cap":"round","line-join":"round"}, paint:{"line-color":"#fff","line-width":9}});
      map.addLayer({id:r.id + "-l", type:"line", source:r.id, layout:{"line-cap":"round","line-join":"round"}, paint:{"line-color":r.ferry ? FERRY : ROUTE,"line-width":5,"line-dasharray":r.ferry ? [1.6,1.6] : [0.1,2]}});
      map.on("click", r.id + "-c", () => { lastPick = Date.now(); select(r.id); });
      if (!r.ferry) loadRoute(r);
    });
    // İsimler harita katmanı olarak çizilir: uzaktan da okunur, üst üste binenleri harita kendisi ayıklar.
    const fontLayer = map.getStyle().layers.find(l => l.type === "symbol" && l.layout && l.layout["text-font"]);
    const rank = {hist:1, arch:2, park:3, photo:4, coffee:5, bakery:5, market:6, food:5};
    map.addSource("names", {type:"geojson", data:{type:"FeatureCollection", features:city.places.map(p => ({type:"Feature", properties:{id:p.id, cat:p.cat, name:p.name.replace(/ \(.*\)$/, ""), rank:rank[p.cat] + (ART[p.id] ? 0 : .5)}, geometry:{type:"Point", coordinates:[p.lon, p.lat]}}))}});
    map.addLayer({id:"names", type:"symbol", source:"names", minzoom:12.5,
      layout:{"text-field":["get","name"], "text-font":fontLayer ? fontLayer.layout["text-font"] : ["Noto Sans Regular"], "text-size":["interpolate",["linear"],["zoom"],12.5,10.5,16,13], "text-anchor":"top", "text-offset":[0,0.35], "text-max-width":8, "symbol-sort-key":["get","rank"], "text-padding":4},
      paint:{"text-color":"#3A1D0B", "text-halo-color":"#FFFFFF", "text-halo-width":2}});

  map.on("dragstart", () => { follow = false; });

const gj = pts => ({type:"Feature", geometry:{type:"LineString", coordinates:pts.map(ll)}});
function mk(id, html, name, pos, anchor){
  const el = document.createElement("button"); el.type = "button"; el.className = "mk"; el.setAttribute("aria-label", name);
  el.innerHTML = html + "<span></span>"; el.lastChild.textContent = name;
  el.addEventListener("click", e => { e.stopPropagation(); lastPick = Date.now(); select(id); });

const pinCls = p => "pin" + (p.cat === "photo" ? " ring" : "") + (store.done[p.id] ? " done" : "") + (store.fav[p.id] ? " fav" : "") + (sel === p.id ? " sel" : "");
function refresh(){
  if (!map) return;
  city.places.forEach(p => { const el = markers[p.id].el; el.style.display = store.layers[p.cat] ? "" : "none"; el.querySelector(".pin").className = pinCls(p); el.classList.toggle("on", sel === p.id); el.classList.toggle("dim", !!store.done[p.id]); });
  city.routes.forEach(r => { const on = sel === r.id, el = markers[r.id].el; el.style.display = store.layers.walk ? "" : "none"; el.firstChild.classList.toggle("sel", on); el.classList.toggle("on", on);
    if (!map.getLayer(r.id + "-c")) return; const v = store.layers.walk ? "visible" : "none", base = r.ferry ? FERRY : ROUTE;
    map.setLayoutProperty(r.id + "-c", "visibility", v); map.setLayoutProperty(r.id + "-l", "visibility", v);
    map.setPaintProperty(r.id + "-c", "line-color", on ? "#3A1D0B" : "#fff"); map.setPaintProperty(r.id + "-c", "line-width", on ? 12 : 9);
    map.setPaintProperty(r.id + "-l", "line-color", on ? "#FFD23F" : base); map.setPaintProperty(r.id + "-l", "line-width", on ? 7 : 5);
    if (on){ map.moveLayer(r.id + "-c", "names"); map.moveLayer(r.id + "-l", "names"); } });
  if (map.getLayer("names")) map.setFilter("names", ["in", ["get","cat"], ["literal", Object.keys(CATS).filter(k => store.layers[k])]]);
}
/* Rotalar gerçek sokaklardan geçsin: yaya yönlendirme servisi (OSM). Olmazsa düz çizgi kalır. */
function loadRoute(r){
  const useGeo = g => { r.geo = g; const s = map.getSource(r.id); if (s) s.setData(gj(g.line)); };
  if (store.geo[r.id] && store.geo[r.id].v === r.pts.length){ useGeo(store.geo[r.id]); return; }
  fetch("https://routing.openstreetmap.de/routed-foot/route/v1/foot/" + r.pts.map(p => p[1] + "," + p[0]).join(";") + "?overview=full&geometries=geojson")
    .then(x => x.json()).then(j => { const rt = j.routes[0]; const g = {v:r.pts.length, km:rt.distance/1000, min:rt.duration/60, line:rt.geometry.coordinates.map(c => [c[1], c[0]])};
      store.geo[r.id] = g; save(); useGeo(g); if (sel === r.id) select(r.id, true); }).catch(() => {});
}

}
$("#chips").addEventListener("click", e => { const b = e.target.closest("[data-layer]"); if (!b) return;
  store.layers[b.dataset.layer] = !store.layers[b.dataset.layer]; save(); renderChips(); refresh(); if (tab !== "map") renderList(); });

/* ---------- Canlı konum ---------- */
const km = (a, b) => { const R = 6371, dLa = (b[0]-a[0])*Math.PI/180, dLo = (b[1]-a[1])*Math.PI/180;
  const h = Math.sin(dLa/2)**2 + Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); };
const fmtD = d => d < 1 ? Math.round(d*1000/10)*10 + " m" : d.toFixed(1).replace(".", ",") + " km";
const inCity = () => { const b = city.bounds; return me && me[0] > b[0][0] && me[0] < b[1][0] && me[1] > b[0][1] && me[1] < b[1][1]; };
function gps(cls, text){ const g = $("#gps"); g.className = "gps " + cls; g.lastChild.textContent = text; }
function toast(t){ const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 7000); }
let watching = false;
function startLocate(){
  if (watching) return;
  if (!navigator.geolocation){ gps("err", "Konum yok"); return; }
  watching = true; gps("", "Konum aranıyor");
  navigator.geolocation.watchPosition(pos => {
    me = [pos.coords.latitude, pos.coords.longitude]; const acc = pos.coords.accuracy;
    if (map){ if (!meMarker){ const d = document.createElement("div"); d.className = "medot"; meMarker = new maplibregl.Marker({element:d}).setLngLat(ll(me)).addTo(map); }
    meMarker.setLngLat(ll(me)); }
    try { onPos(pos); } catch(e){}
    if (inCity()){ gps("on", "Canlı konum ±" + Math.round(acc) + " m"); if (follow && map) map.panTo(ll(me)); }
    else gps("on", city.name + "'a " + fmtD(km(me, city.center)));
  }, err => {
    const framed = (() => { try { return window.top !== window.self; } catch(e){ return true; } })();
    gps("err", framed && err.code === 1 ? "Claude içinde konum yok" : "Konum kapalı");
    toast(framed && err.code === 1 ? "Claude içinde açılan sayfalar konum izni isteyemiyor. Harita, liste ve kartlar normal çalışır; canlı mavi nokta yalnızca uygulamanın kendi adresinde (aaronfuji.github.io/dolcan-rota) çalışır." : err.code === 1 ? "Konum izni verilmedi. Tarayıcı ayarlarından bu sayfa için konuma izin ver, sonra sayfayı yenile." : "Konum alınamadı. Telefonun konum servisini ve bağlantını kontrol et.");
  }, {enableHighAccuracy:true, maximumAge:3000, timeout:20000});
}
$("#locate").addEventListener("click", () => {
  if (!me){ toast("Konum henüz alınamadı. İzin penceresi çıktıysa izin ver."); return; }
  if (inCity()){ follow = true; map.flyTo({center:ll(me), zoom:Math.max(map.getZoom(), 16)}); }
  else toast("Konumun alındı: şu an " + city.name + " merkezine " + fmtD(km(me, city.center)) + " uzaktasın. Şehre girdiğinde mavi nokta haritada görünür.");
});

/* ---------- Kart ---------- */
const find = id => city.places.find(p => p.id === id) || city.routes.find(r => r.id === id);
function select(id, keepView){
  sel = id; const o = find(id), isRoute = !!o.pts, cat = isRoute ? "walk" : o.cat;
  if (tab !== "map") setTab("map"); refresh();
  if (!keepView && map){
    const h = $("#map").clientHeight, narrow = innerWidth < 760;
    if (isRoute){ const pts = (o.geo ? o.geo.line : o.pts), bb = new maplibregl.LngLatBounds(ll(pts[0]), ll(pts[0])); pts.forEach(p => bb.extend(ll(p)));
      map.fitBounds(bb, {padding:{top:40, left:40, right:narrow ? 40 : 440, bottom:narrow ? h*0.55 : 40}, duration:600}); }
    else map.flyTo({center:[o.lon, o.lat], zoom:Math.max(map.getZoom(), 16), offset:narrow ? [0, -h*0.25] : [-200, 0], duration:600});
  }
  const q = encodeURIComponent(o.name + ", " + city.name); let facts = "", gm, dir, open = [];
  if (isRoute){
    const g = o.geo;
    if (o.ferry) facts = o.facts.map(f => `<dt>${f[0]}</dt><dd>${esc(f[1])}</dd>`).join("");
    else facts = g ? `<dt>Mesafe</dt><dd>${g.km.toFixed(1).replace(".",",")} km</dd><dt>Süre</dt><dd>Yaklaşık ${Math.round(g.min/5)*5} dk (molasız)</dd>` : `<dt>Mesafe</dt><dd>Hesaplanıyor</dd>`;
    if (o.stops) facts += `<dt>Duraklar</dt><dd>${o.stops.map(esc).join(" → ")}</dd>`;
    const s = o.pts[0], e = o.pts[o.pts.length-1], mid = o.pts.slice(1,-1).map(p => p.join(",")).join("|");
    gm = `https://www.google.com/maps/dir/?api=1&origin=${s.join(",")}&destination=${e.join(",")}&waypoints=${encodeURIComponent(mid)}&travelmode=walking`;
    if (o.ferry) gm = `https://www.google.com/maps/dir/?api=1&origin=${s.join(",")}&destination=${e.join(",")}&travelmode=transit`;
    dir = `https://www.google.com/maps/dir/?api=1&destination=${s.join(",")}&travelmode=walking`;
  } else {
    if (me && inCity()) facts += `<dt>Uzaklık</dt><dd>Buradan ${fmtD(km(me, [o.lat, o.lon]))} (kuş uçuşu)</dd>`;
    if (o.rating) facts += `<dt>Google</dt><dd><span class="stars">★ ${o.rating.toFixed(1).replace(".",",")}</span> (${o.rc.toLocaleString("tr-TR")} yorum) <small class="rd">· ${o.rdate} itibarıyla, güncel puan Google Maps'te</small></dd>`;
    if (o.cat === "market") facts += `<dt>Fiyat</dt><dd>${o.price} ${o.price === "€" ? "(indirim marketi, en ucuz)" : "(orta-üst)"}</dd>`;
    if (o.eat) facts += `<dt>${o.cat === "coffee" ? "Ne içilir" : o.cat === "bakery" ? "Ne alınır" : "Ne yenir"}</dt><dd>${esc(o.eat)}</dd>` + (o.price ? `<dt>Fiyat</dt><dd>${o.price} ${o.price === "€" ? "(ucuz)" : "(orta)"}</dd>` : "");
    if (o.dur) facts += `<dt>Süre</dt><dd>${esc(o.dur)}</dd>`;
    if (!["food","coffee","bakery","market"].includes(o.cat)) facts += `<dt>Giriş</dt><dd>${o.fee ? esc(o.fee) : "Doğrulanmadı"}</dd>`;
    facts += `<dt>Saatler</dt><dd>${o.hours ? esc(o.hours) : "Doğrulanmadı"}</dd>`;
    if (o.cat === "market") open.push("Poşet paralı, yanında çanta taşı. Çoğu şubede kendin okut-öde kasası var.");
    if (!["food","coffee","bakery","market"].includes(o.cat) && !o.fee) open.push("Açık nokta: güncel giriş ücreti doğrulanmadı, resmi siteden bak.");
    gm = `https://www.google.com/maps/search/?api=1&query=${q}&query_place_id=${o.pid}`;
