    {id:"w_stephan",cat:"hist",name:"Stephansdom",wiki:"St._Stephen's_Cathedral,_Vienna",lat:48.2084114,lon:16.3734707,pid:"ChIJz-w_Ip8HbUcRWTHc-vNXlxc",desc:"Viyana'nın simgesi olan Gotik katedral. Desenli kiremit çatısı, 136 metrelik güney kulesi ve duvarlarında 1683 kuşatmasından kalma top gülleleri var.",hist:"Bugünkü katedralin en eski bölümü, batı cephesindeki Riesentor (Dev Kapı) ve iki Heidentürme (Pagan Kuleleri), 13. yüzyıldan kalma Romanesk yapıdır. Güney kulesi 1359-1433 arasında, tam 75 yılda yükseldi. Kuzey kulesine 1450'de başlandı ama 1511'de inşaat durdu ve kule hiç bitirilmedi; tepesine sonradan bir kubbe kondu.\n\nOsmanlı tarihiyle bağı çok güçlüdür. 1683 kuşatmasında Viyana'nın şehir komutanı Ernst Rüdiger von Starhemberg, güney kulesinin bekçi odasından Osmanlı ordusunun hareketlerini izledi. Katedral binden fazla top atışına maruz kaldığı söylenir; o güllelerden bazıları güney kulesinin ve kilisenin güney cephesinin duvarlarına hatıra olarak gömüldü, yanlarına da 1683 yılı kazındı.\n\nKuzey kulesinde asılı dev çan Pummerin'in hikâyesi de 1683'e bağlanır. İlk Pummerin 1711'de, Osmanlı ordusunun kuşatmadan sonra geride bıraktığı toplardan dökülmüştü. Bu çan 12 Nisan 1945'te katedraldeki yangında düşüp parçalandı. Parçaları da kullanılarak 1951'de St. Florian'da yeniden döküldü; bugünkü Pummerin yaklaşık 20 tondur.\n\nKatedralin kuzeydoğu köşesinde Capistrano Kürsüsü vardır. İmparator III. Friedrich'in davetiyle Viyana'ya gelen Fransisken vaiz Giovanni da Capistrano 1451'de burada Osmanlılara karşı haçlı seferi çağrısı yaptı. Kürsünün üstündeki barok heykel grubu 1737'de eklendi.\n\nGirişin sağındaki duvarda kazınmış O5 işaretine de bak: İkinci Dünya Savaşı sonunda Nazi karşıtı direnişin işaretiydi. 5, alfabenin beşinci harfi E'yi gösterir; O5, yani OE, Österreich demektir.",why:"Viyana'da her rota buradan başlar. Dışını dolaşmak ve girişteki bölümden içeri bakmak ücretsiz. Güney kulesi merdiveni şehrin en iyi manzaralarından biri.",dur:"1 sa",fee:"Girişteki bölüm ücretsiz. İç tur, Güney Kulesi (343 basamak), Kuzey Kulesi (asansör) ve katakombların her biri yaklaşık €8, hepsini kapsayan bilet yaklaşık €29 (2026 rehber kaynağından, girişte doğrula)",hours:"Kilise Pzt-Cmt 06:00-22:00, Paz 07:00-22:00. Turistik gezi Pzt-Cmt 09:00-11:30 ve 13:00-16:30, Paz 13:00-16:30",tip:"Top güllelerini görmek için güney cephesi boyunca yürü ve duvarlarda 1683 yazısını ara. Akşam ışıklandırılmış çatı çok güzel."},
    {id:"w_pest",cat:"hist",name:"Veba Sütunu (Pestsäule)",wiki:"Plague_Column,_Vienna",lat:48.2087219,lon:16.3698073,pid:"ChIJK-3S6ZgHbUcRiFS6mC6Lyhk",desc:"Graben caddesinin ortasında bulutlar ve meleklerle süslü barok anıt.",hist:"1679'da Viyana'yı büyük bir veba salgını kasıp kavurdu. İmparator I. Leopold salgın bitince bir şükran sütunu yaptıracağına söz verdi. Önce ahşap bir sütun kondu, bugünkü taş anıt 1693'te tamamlandı. Tepesinde Kutsal Üçleme, ortasında dua eden I. Leopold'un heykeli var.\n\nİlginç bir tarih çakışması: vebadan yalnızca dört yıl sonra, 1683'te Osmanlı ordusu şehrin önüne geldi. Kuşatma sırasında şehrin içinde yeniden salgın hastalıklar yayıldı.",why:"Graben'de yürürken bir dakika dur, yukarı bak. Gece ışıklı hâli daha güzel.",dur:"10 dk",fee:"Ücretsiz",hours:"Her zaman açık"},
    {id:"w_peter",cat:"hist",name:"Peterskirche",wiki:"Peterskirche,_Vienna",lat:48.209427,lon:16.3699436,pid:"ChIJFe64kpgHbUcRdVjp66weUF8",desc:"Graben'in hemen yanında, Roma'daki Aziz Petrus'u örnek alan altın süslemeli barok kilise.",hist:"Bu noktada 12. yüzyıldan beri kilise var. Bugünkü yapı 18. yüzyılın başında barok tarzda yeniden yapıldı ve 1733 dolayında tamamlandı. Yapımı İmparator I. Leopold'un adağına bağlanır, bu yüzden ana sunağın üstünde onun arması var. Küçük bir oval alana sığdırılmış kubbe ve freskler barok Viyana'nın en yoğun iç mekânlarından birini oluşturur.",why:"Giriş ücretsiz ve neredeyse her gün kısa, ücretsiz org konserleri var (bağışla).",dur:"20 dk",fee:"Ücretsiz (konserde bağış)",hours:"Pzt-Cum 08:00-19:00, Cmt-Paz 09:00-19:00",tip:"Org konseri saatlerini kapıdaki panoda ya da kilisenin sitesinde kontrol et."},
    {id:"w_ankeruhr",cat:"hist",name:"Ankeruhr",wiki:"Ankeruhr",lat:48.2107949,lon:16.373668,pid:"ChIJUwmrHKIHbUcRJXhRuEHANRI",desc:"Hoher Markt'ta iki binayı birbirine bağlayan köprüdeki Jugendstil saat. Her saat başı tarihî bir figür geçer.",hist:"Saat 1911-1914 arasında ressam Franz von Matsch'ın tasarımıyla, bir sigorta şirketinin iki binasını birleştiren köprüye yapıldı. On iki saat boyunca Avusturya tarihinden on iki figür sırayla geçer. Öğlen 12'de bütün figürler müzik eşliğinde birlikte geçer. Hoher Markt, Roma döneminde Vindobona askeri kampının olduğu yerdir.",why:"Öğlen 12'yi buraya denk getirebilirsen izle.",dur:"15 dk",fee:"Ücretsiz",hours:"Her zaman, gösteri öğlen 12'de",tip:"12'den birkaç dakika önce gel, kalabalık oluyor."},
    {id:"w_hofburg",cat:"hist",name:"Hofburg Sarayı",wiki:"Hofburg",lat:48.2056578,lon:16.3647803,pid:"ChIJ3wYgv5kHbUcRX0LEFIAWhYY",desc:"Habsburgların 600 yılı aşkın kışlık sarayı. 18 kanat ve 19 avludan oluşan şehir içinde bir şehir.",hist:"Hofburg'un en eski bölümü 13. yüzyıldan kalmadır. Habsburglar 1918'e kadar imparatorluğu buradan yönetti ve her imparator bir kanat ekledi; bu yüzden sarayda Gotik'ten barok ve 19. yüzyıla kadar her dönem yan yanadır.\n\n1529'da Kanuni Sultan Süleyman ve 1683'te Merzifonlu Kara Mustafa Paşa Viyana'yı kuşattığında hedefin kalbi burasıydı. 1683'te Osmanlı'nın ana saldırısı tam bu sarayın önündeki Burg ve Löbel burçlarına yöneldi.\n\nBugün sarayın bir bölümünde Avusturya Cumhurbaşkanlığı ofisi çalışır. Ziyaretçiler İmparatorluk Daireleri'ni (Kaiserappartements), Gümüş Koleksiyonu'nu ve Sisi Müzesi'ni tek biletle gezer. Avlular, Michaelerplatz ve Heldenplatz ücretsiz dolaşılır.",why:"Franz Joseph ve Sisi'nin dünyasını görmek için. Sadece avlularda yürümek bile değer.",dur:"1 sa 30 dk",fee:"Kaiserappartements ve Sisi Müzesi bileti €15 (18 Kasım'a kadar indirimli, resmi siteden)",hours:"Kaiserappartements 18 Kasım'a kadar her gün 10:00-16:30 (son giriş 16:00). Avlular her zaman açık",tip:"Dikkat: Sisi Müzesi bölümü yenileme nedeniyle 19 Kasım 2026'ya kadar kapalı; o tarihe kadar bilet İmparatorluk Daireleri içindir ve fiyat bu yüzden indirimli."},
    {id:"w_schatz",cat:"hist",name:"İmparatorluk Hazinesi (Schatzkammer)",wiki:"Imperial_Treasury,_Vienna",lat:48.2067393,lon:16.365773,pid:"ChIJ3wYgv5kHbUcRf_qQCrZSEa8",desc:"Kutsal Roma-Germen İmparatorluk tacı, Habsburg taçları ve Osmanlı yapımı bir taç aynı salonlarda.",hist:"Hazine, Hofburg'un en eski kısmı olan İsviçre Avlusu'ndadır. En değerli parçası, 10. yüzyıldan kalma Kutsal Roma-Germen İmparatorluk Tacı'dır; sekiz köşeli, taşlarla kaplı bu taç yüzyıllarca imparatorların taç giyme töreninde kullanıldı.\n\nVlog için çok güzel bir ayrıntı: Hazinede Macar-Erdel prensi Bocskai István'ın tacı da durur. Bu taç Osmanlı yapımıdır ve 1605'te Sultan I. Ahmed adına Sadrazam Lala Mehmed Paşa tarafından Bocskai'ye hediye edildi. Habsburglarla savaşan Bocskai'yi Osmanlılar destekliyordu. Sonradan taç Habsburg hazinesine geçti.",why:"Taç meraklısı değilsen bile İmparatorluk Tacı ve Osmanlı tacı için yarım saat ayır.",dur:"1 sa",fee:"Ücretli, güncel fiyat için KHM sitesine bak (KHM ile kombine bilet seçenekleri var)",hours:"Sal kapalı, diğer günler 09:00-17:30",tip:"Salı günü kapalı. Bocskai tacı vitrininin önünde çekim için iyi ışık var."},
    {id:"w_heldenplatz",cat:"hist",name:"Heldenplatz",wiki:"Heldenplatz",lat:48.2065038,lon:16.3634618,pid:"ChIJf5_KqpAHbUcROuTS5DKluMk",desc:"Hofburg'un önündeki dev tören meydanı. Ortasında Prens Eugen'in at üstündeki heykeli var.",hist:"Meydan, Franz Joseph'in hiç tamamlanmayan İmparatorluk Forumu planının parçasıdır. Yarım daire biçimli Neue Burg kanadı bu planın tek bitmiş parçasıdır.\n\nMeydandaki iki atlı heykelden biri Savoy Prensi Eugen'dir. Eugen, 1683 kuşatmasından sonra Osmanlılara karşı savaşan Habsburg ordusunun en ünlü komutanıydı; 1697'de Zenta'da ve 1717'de Belgrad'da Osmanlı ordularını yendi. Belvedere Sarayı onun yazlık sarayıydı.\n\nMeydanın karanlık günü 15 Mart 1938'dir: Hitler, Neue Burg'un balkonundan Avusturya'nın Almanya'ya katıldığını burada ilan etti.",why:"Hofburg'dan Ringstraße'ye geçerken yol üstünde. Prens Eugen heykeli 1683 sonrasının hikâyesi için iyi bir çekim noktası.",dur:"15 dk",fee:"Ücretsiz",hours:"Her zaman açık"},
    {id:"w_prunksaal",cat:"hist",name:"Ulusal Kütüphane Görkemli Salonu (Prunksaal)",wiki:"Austrian_National_Library",lat:48.2062609,lon:16.3668953,pid:"ChIJ9SMnY5kHbUcRR2-0Bsb53Vc",desc:"Freskli kubbesi ve 200 bini aşkın eski kitabıyla Avrupa'nın en güzel barok kütüphane salonlarından biri.",hist:"Salonu İmparator VI. Karl yaptırdı. Mimar Johann Bernhard Fischer von Erlach tasarladı, ölümünden sonra oğlu Joseph Emanuel 1726'da bitirdi. Kubbedeki freskler Daniel Gran'ın eseridir.\n\nSalonun ortasındaki oval bölümde Prens Eugen'in özel kütüphanesi durur. Osmanlılara karşı kazandığı savaşlarla ünlenen Eugen yaklaşık 15 bin ciltlik bir koleksiyon toplamıştı; ölümünden sonra imparator bu kitapları satın aldı.",why:"Hofburg'un içinde, Josefsplatz'tan giriliyor. Viyana'nın en fotojenik iç mekânlarından.",dur:"45 dk",fee:"Ücretli, güncel fiyatı onb.ac.at'te doğrula",hours:"Ekim-Mayıs arası Pazartesi kapalı. Sal-Paz 09:00-18:00, Per 21:00'e kadar. 21 Ekim 2026'da 14:00'te kapanıyor",tip:"Ekim-Mayıs arasında Pazartesi kapalı."},
    {id:"w_srs",cat:"hist",name:"İspanyol Binicilik Okulu",wiki:"Spanish_Riding_School",lat:48.2076428,lon:16.3661597,pid:"ChIJu-a-u5kHbUcR5BCKUtuMx0I",desc:"Beyaz Lipizzan atlarının barok salonda gösteri ve sabah antrenmanı yaptığı okul.",hist:"Okul en az 16. yüzyıldan beri vardır; adını İspanya'dan gelen atlardan alır. Lipizzan ırkı 1580'de bugünkü Slovenya'daki Lipica'da kurulan Habsburg harasından gelir. Gösterilerin yapıldığı Kış Binicilik Salonu 1729-1735 arasında Joseph Emanuel Fischer von Erlach tarafından yapıldı.",why:"Atlara ilgin varsa sabah antrenmanı en ucuz yol. Yorumlar gösteriler konusunda karışık (Google 3.5).",dur:"1 sa",fee:"Sabah antrenmanı €17'den, gösteri €26'dan, rehberli tur €24'ten (resmi siteden)",hours:"Program günlere göre değişiyor, srs.at'te kontrol et",tip:"Ucuz galeri biletlerinde görüş kötü olabiliyor, yorumlarda sık geçiyor. Bilet yalnızca resmi siteden al."},
    {id:"w_gruft",cat:"hist",name:"İmparatorluk Mezarlığı (Kaisergruft)",wiki:"Imperial_Crypt",lat:48.2057146,lon:16.3700245,pid:"ChIJG0kLqp4HbUcRvbtOLMhP3gc",desc:"Kapuçin Kilisesi'nin altında 150 Habsburg'un yattığı mahzen. Maria Theresia, Franz Joseph ve Sisi burada.",hist:"Mahzende 1633'ten beri Habsburglar gömülüdür; aralarında 12 imparator ve 18 imparatoriçe var. En gösterişli lahit, Maria Theresia ile eşi I. Franz Stephan'ın çift lahitidir: üstünde ikisi yüz yüze uzanmış halde betimlenir.\n\nFranz Joseph, Sisi ve oğulları Veliaht Rudolf yan yana yatar. Son büyük cenaze 2011'de Otto von Habsburg'unkiydi.\n\nBir gelenek: Habsburg cenaze alayı kapıya geldiğinde rahip \"Kim o?\" diye sorar. Ölünün bütün unvanları sayılınca kapı açılmaz; ancak \"ölümlü, günahkâr bir insan\" denince açılır.",why:"Habsburg tarihini en doğrudan anlatan yer. 45 dakika yeter.",dur:"45 dk",fee:"€15 (resmi siteden)",hours:"Her gün 10:00-18:00, son giriş 17:30"},
    {id:"w_oper",cat:"hist",name:"Viyana Devlet Operası",wiki:"Vienna_State_Opera",lat:48.2034306,lon:16.3692034,pid:"ChIJ1b8dhpwHbUcRVn03JY0mWf0",desc:"Ringstraße'nin ilk büyük binası. Dünyanın en çok oyun sergileyen opera evlerinden biri.",hist:"Opera 25 Mayıs 1869'da Mozart'ın Don Giovanni'siyle açıldı. Viyanalılar binayı başta çok eleştirdi; mimarlardan Eduard van der Nüll bu eleştirilerin ardından intihar etti, ortağı August Sicard von Sicardsburg birkaç hafta sonra öldü. İkisi de açılışı göremedi.\n\nBina 1945'te bombalanıp büyük ölçüde yandı ve 1955'te yeniden açıldı. Gustav Mahler bir dönem operanın direktörlüğünü yaptı.",why:"Gösteriye gitmesen bile dışarıdan görmek ve akşam ışıklarında bakmak şart. Ayakta bilet (Stehplatz) çok ucuz.",dur:"20 dk",fee:"Dışarıdan ücretsiz. Rehberli tur ve ayakta bilet var, güncel fiyatı wiener-staatsoper.at'te doğrula",hours:"Tur ve gösteri saatleri günlere göre değişiyor",tip:"Ayakta biletler gösteriden kısa süre önce satılıyor; günün programına bak."},
    {id:"w_albertina",cat:"hist",name:"Albertina",wiki:"Albertina",lat:48.2046992,lon:16.3681824,pid:"ChIJwVp-8psHbUcRuN43n5iK72Y",desc:"Habsburg sarayında Monet'den Picasso'ya modern sanat ve dünyanın en büyük grafik koleksiyonlarından biri.",hist:"Saray, Maria Theresia'nın damadı Sachsen-Teschen Dükü Albert'in adını taşır; resim ve çizim koleksiyonunu o başlattı. Koleksiyonun en ünlü parçası Albrecht Dürer'in 1502 tarihli Tavşan suluboyasıdır, ışıktan zarar görmesin diye çok nadiren sergilenir.\n\nBinanın terası eski şehir surlarının bir burcu üzerindedir. Önündeki Bitzinger sosis büfesiyle aynı yerde, Viyana'nın en eski ve en yeni yüzü yan yanadır.",why:"Sanat seviyorsan. Yoksa terasa çıkıp operaya bakmak bile güzel ve ücretsiz.",dur:"1 sa 30 dk",fee:"Ücretli, güncel fiyatı albertina.at'te doğrula",hours:"Her gün 10:00-18:00, Çar ve Cum 21:00'e kadar"},
    {id:"w_khm",cat:"hist",name:"Kunsthistorisches Museum",wiki:"Kunsthistorisches_Museum",lat:48.2038016,lon:16.3617874,pid:"ChIJ8XfPY5oHbUcRQbimbLVSYG8",desc:"Habsburgların sanat koleksiyonu. Dünyanın en büyük Bruegel koleksiyonu ve muhteşem bir kubbe salonu.",hist:"Müze, Habsburgların yüzyıllar boyunca topladığı sanat eserlerini sergilemek için yapıldı ve 1891'de açıldı. Karşısındaki ikiz bina Doğa Tarihi Müzesi'dir; ikisinin arasındaki meydanda Maria Theresia'nın anıtı durur.\n\nResim galerisinde Pieter Bruegel'in Babil Kulesi ve Karda Avcılar tabloları var. Giriş katındaki kubbeli salonun kafesi Avrupa'nın en güzel müze kafelerinden biridir.",why:"Tek müze göreceksen bu olabilir. Babil Kulesi için doğrudan Bruegel salonuna git.",dur:"2 sa",fee:"€22 online, €24 gişede (resmi siteden)",hours:"Her gün 10:00-18:00, Per 21:00'e kadar",tip:"Online almak €2 ucuz. Perşembe akşamı daha sakin."},
    {id:"w_rathaus",cat:"hist",name:"Viyana Belediye Sarayı (Rathaus)",wiki:"Vienna_City_Hall",lat:48.21097,lon:16.3566389,pid:"ChIJ_WDSuJUHbUcR2QUpvg7vqR4",desc:"Ringstraße üzerindeki neo-Gotik belediye binası. Kulesinin tepesinde Rathausmann heykeli var.",hist:"Bina 1872-1883 arasında mimar Friedrich von Schmidt tarafından yapıldı. Ana kulenin tepesindeki zırhlı şövalye heykeli Rathausmann, şehrin sembollerinden biridir. Önündeki parkta kışın Noel pazarı, yazın açık hava film festivali kurulur.",why:"Ringstraße yürüyüşünde dışarıdan görmek yeterli. Önündeki park dinlenmek için iyi.",dur:"15 dk",fee:"Dışarıdan ücretsiz. İç turlar ücretsiz ama önceden kayıt gerekiyor (yorumdan)",hours:"Ofis Pzt-Cum 07:30-17:00, dış cephe her zaman"},
    {id:"w_votiv",cat:"hist",name:"Votivkirche",wiki:"Votivkirche",lat:48.2154012,lon:16.3590821,pid:"ChIJzUye7b4HbUcRNoMdL9KwzbE",desc:"İkiz kuleli neo-Gotik kilise. Bir suikastten kurtulan imparator için şükran olarak yapıldı.",hist:"18 Şubat 1853'te Macar milliyetçisi János Libényi, surların üstünde yürüyen genç İmparator Franz Joseph'i bıçakladı. İmparatoru yakası kurtardı. Kardeşi Arşidük Maximilian bir şükran kilisesi için bağış kampanyası başlattı. Kilise Heinrich von Ferstel'in tasarımıyla 1856-1879 arasında yapıldı.",why:"Ringstraße'nin kuzey ucunda. İçi sakin, vitrayları güzel.",dur:"20 dk",fee:"Ücretsiz",hours:"Pzt kapalı, Sal-Cum 10:00-16:00, Cmt 11:00-19:00, Paz 09:00-13:00"},
    {id:"w_karls",cat:"hist",name:"Karlskirche",wiki:"Karlskirche",lat:48.1985626,lon:16.3716999,pid:"ChIJx2oWgoIHbUcRMvVm3Lylq84",desc:"Dev bakır kubbesi ve Roma'daki Trajan Sütunu'nu andıran iki sütunuyla Viyana'nın en büyük barok kilisesi.",hist:"1713'te Viyana bir veba salgını daha yaşadı. İmparator VI. Karl, salgın biterse vebalılara şifacı olarak bilinen Aziz Carlo Borromeo adına bir kilise yaptıracağını adadı. Kiliseyi Johann Bernhard Fischer von Erlach tasarladı, oğlu 1737'de tamamladı.\n\nCephedeki iki dev sütunun üzerindeki kabartmalar azizin hayatını anlatır. Önündeki havuz ve Henry Moore heykeli ile Karlsplatz akşamları çok güzeldir.",why:"Dışarıdan görmek ücretsiz ve yeterli. İçinde akşamları Vivaldi konserleri var.",dur:"30 dk",fee:"İç kısım ücretli, güncel fiyatı girişte doğrula",hours:"Pzt-Cum 07:30-19:00, Cmt 08:30-18:00, Paz 09:00-19:00"},
    {id:"w_wienmuseum",cat:"hist",name:"Wien Museum",wiki:"Wien_Museum",lat:48.199437,lon:16.37296,pid:"ChIJQ-DcB3gHbUcRtahQce46Ytg",desc:"Viyana'nın Roma döneminden bugüne tarihi. Kalıcı sergi ücretsiz, çatısında kafe var.",hist:"Şehir müzesi yenilenip Aralık 2023'te yeniden açıldı. Kalıcı sergi şehrin tarihini kronolojik olarak anlatır; Klimt ve Schiele tabloları da var.\n\nOsmanlı tarihiyle ilgili çarpıcı bir ayrıntı: Müze, 1683 kuşatmasını yöneten Merzifonlu Kara Mustafa Paşa'ya ait olduğu söylenen kafatasını yüzyıllarca koleksiyonunda tuttu. Kara Mustafa yenilgiden sonra 25 Aralık 1683'te Belgrad'da padişahın emriyle idam edildi. 1688'de Belgrad'ı alan Habsburg askerleri mezarını açtı ve kafatası Viyana'ya getirildi; önce şehrin cephaneliğinde, 1886'dan sonra da şehir müzesinde saklandı. Kafatasının bugün sergide olup olmadığını doğrulayamadım.",why:"Ücretsiz ve Karlskirche'nin yanında. 1683 kuşatmasının şehir açısından nasıl anlatıldığını görmek için iyi.",dur:"1 sa 30 dk",fee:"Kalıcı sergi ücretsiz",hours:"Pzt kapalı. Sal 09:00-18:00, Çar 11:00-18:00, Per 09:00-21:00, Cum 09:00-18:00, Cmt-Paz 10:00-18:00",tip:"Pazartesi kapalı. Kara Mustafa ile ilgili bir şey sergileniyor mu, girişte sor."},
    {id:"w_belv",cat:"hist",name:"Belvedere Sarayı",wiki:"Belvedere,_Vienna",lat:48.1914751,lon:16.3809322,pid:"ChIJpZ4LAn0HbUcRB3aToFL8ZUo",desc:"Prens Eugen'in yazlık sarayı. Üst Belvedere'de Klimt'in Öpücük tablosu, iki saray arasında teraslı bahçe.",hist:"Belvedere, Osmanlılara karşı kazandığı zaferlerle Avrupa'nın en ünlü komutanlarından biri olan Savoy Prensi Eugen için yapıldı. Eugen 1697'de Zenta'da, 1716'da Petervaradin'de ve 1717'de Belgrad'da Osmanlı ordularını yendi; bu zaferlerden gelen servet ve itibar bu sarayın arkasındadır. Aşağı Belvedere 1716 dolayında, Üst Belvedere 1723'te bitti. Mimarı Johann Lukas von Hildebrandt'tır.\n\nÜst Belvedere bugün Avusturya sanatı müzesidir. Gustav Klimt'in 1908 tarihli altın varaklı Öpücük tablosu buradadır. Bahçe ücretsizdir ve Üst Belvedere'nin önündeki havuzdan sarayın yansıması çok sevilen bir fotoğraftır.",why:"Klimt için Üst Belvedere yeterli. Bahçe ücretsiz, Hauptbahnhof'a yürüme mesafesinde.",dur:"1 sa 30 dk",fee:"Üst Belvedere €23, Aşağı €20, ikisi birden €32 (resmi siteden). Bahçe ücretsiz",hours:"Üst Belvedere her gün 09:00-18:00, Aşağı Belvedere 10:00-18:00",tip:"Prens Eugen'in Osmanlı zaferlerini anlatmak için sarayın önü çok iyi bir vlog sahnesi."},
    {id:"w_hgm",cat:"hist",name:"Askeri Tarih Müzesi (HGM)",wiki:"Museum_of_Military_History,_Vienna",lat:48.1842718,lon:16.3889357,pid:"ChIJJSoU-t6pbUcRJXTZ_tcG-7g",desc:"Arsenal'deki görkemli binada Habsburg ordusunun tarihi. Saraybosna suikastının arabası da burada.",hist:"Müze, 1848 devriminden sonra yapılan dev Arsenal kışla kompleksinin içindedir. En ünlü parçası Arşidük Franz Ferdinand'ın 28 Haziran 1914'te Saraybosna'da vurulduğu arabadır; bu suikast Birinci Dünya Savaşı'nı başlattı.\n\nMüzenin ilk salonları 17. yüzyıl savaşlarına, bu arada Osmanlı-Habsburg savaşlarına ayrılmıştır. Hangi Osmanlı parçalarının şu an sergilendiğini doğrulayamadım.",why:"Osmanlı-Habsburg savaşları ve 1914 için. Hauptbahnhof'a yakın.",dur:"2 sa",fee:"Ücretli, güncel fiyatı hgm.at'te doğrula",hours:"Pzt kapalı, Sal-Paz 09:00-17:00",tip:"Pazartesi kapalı."},
    /* ================= SCHÖNBRUNN ================= */
    {id:"w_schoen",cat:"hist",name:"Schönbrunn Sarayı",wiki:"Schönbrunn_Palace",lat:48.1858124,lon:16.3127641,pid:"ChIJv3zAHAmobUcRyYvq5F26aU4",desc:"Habsburgların 1.441 odalı yazlık sarayı ve dev barok bahçesi. Bahçe ücretsiz.",hist:"Burada önce bir av köşkü vardı. 1683'te Viyana'yı kuşatan Osmanlı ordusu şehrin çevresindeki köşkleri ve köyleri yakıp yıktı; bu köşk de zarar gördü. Kuşatmadan sonra İmparator I. Leopold, mimar Johann Bernhard Fischer von Erlach'a yeni bir saray çizdirdi. Yani Schönbrunn, bir anlamda 1683'ün yıkıntıları üzerinde doğdu.\n\nSaraya bugünkü biçimini 1740'lardan sonra Maria Theresia verdi. Altı yaşındaki Mozart 1762'de burada imparatoriçenin önünde çaldı. Franz Joseph burada doğdu ve 1916'da burada öldü. Son imparator I. Karl 1918'de hükümetten çekildiğini bu sarayda imzaladı.",why:"Saray içi pahalı ama bahçe ücretsiz ve çok büyük. Gloriette'e kadar yürümek şart.",dur:"3 sa",fee:"Bahçe ücretsiz. State Apartments €30, Palace Ticket (Grand Tour) €42, Classic Pass €49 (resmi siteden)",hours:"Saray her gün 08:30-17:30",tip:"U4 hattıyla Schönbrunn durağında in. Biletli girişler saatli; online al. 6 Kasım'dan itibaren akşamları Imperial Lights ışık bahçesi açılıyor."},
    {id:"w_gloriette",cat:"photo",name:"Gloriette",wiki:"Gloriette",lat:48.1782686,lon:16.3087421,pid:"ChIJtyTF8lqpbUcRgncv_koB670",desc:"Schönbrunn bahçesinin tepesindeki kemerli yapı. Sarayın ve Viyana'nın en güzel manzarası buradan.",hist:"Gloriette 1775'te Maria Theresia için yapıldı ve Habsburgların bir zaferini anan bir anıt olarak tasarlandı. Tepeye yerleştirilmesinin amacı, aşağıdaki saraydan bakınca bahçenin sonunu taçlandırmasıdır. Bugün ortasında Café Gloriette çalışır.",why:"Saraydan 15-20 dakikalık yokuş. Gün batımına denk getirirsen en güzel fotoğraf.",dur:"45 dk",fee:"Yanına çıkmak ücretsiz; terası Exklusivgärten biletine (€16) dahil",hours:"Teras her gün 09:30-17:30",tip:"İkiniz birlikte, arkada saray ve şehir olacak şekilde çekin."},
    {id:"w_cafegloriette",cat:"coffee",name:"Café Gloriette",wiki:"Gloriette",gen:1,lat:48.1782328,lon:16.30878,pid:"ChIJfUKmznSobUcRhSONpphi5jo",price:"€€",rating:4.4,rc:10948,rdate:"20.10.2026",eat:"Melange, Sisi ve Gloriette pastası, elmalı strudel.",why:"Tepeye çıkınca manzaralı bir kahve molası. Yorumlara göre fiyatlar merkezdeki ünlü kafelerle aynı.",hours:"Her gün 09:00-18:00"},
    /* ================= 1683 KUŞATMASININ İZLERİ ================= */
    {id:"w_kahlenberg",cat:"photo",name:"Kahlenberg Manzara Terası",wiki:"Kahlenberg",lat:48.2744864,lon:16.3367417,pid:"ChIJySqKZQAJbUcRFpd7qYshu3I",desc:"484 metrelik tepeden bütün Viyana ve Tuna. 12 Eylül 1683'teki büyük meydan muharebesinin başladığı yer.",hist:"Osmanlı ordusu 14 Temmuz 1683'te Viyana'yı kuşattı. İki ay süren kuşatmanın sonunda şehir düşmek üzereydi. 12 Eylül sabahı Polonya Kralı III. Jan Sobieski ile Lorraine Dükü Karl'ın komutasındaki kurtarma ordusu bu tepelerden indi. Gün boyu süren muharebenin sonunda, akşamüstü Polonya kanatlı süvarilerinin büyük hücumu Osmanlı ordugâhını dağıttı.\n\nKara Mustafa Paşa ordusuyla Belgrad'a çekildi ve 25 Aralık 1683'te padişahın emriyle orada idam edildi. Bu yenilgi Osmanlıların Orta Avrupa'daki ilerleyişinin sonu oldu; 1699 Karlofça Antlaşması'yla Macaristan'ın büyük kısmı Habsburglara geçti.\n\nTepede bugün bir manzara terası, Sobieski anısına bir kilise ve restoranlar var.",why:"1683 hikâyesini anlatmanın en etkileyici yeri: tepeden bakınca ordunun nereden indiğini, şehrin nerede olduğunu görürsün.",dur:"1 sa 30 dk",fee:"Ücretsiz",hours:"Her zaman açık",tip:"U4 ile Heiligenstadt'a git, oradan 38A otobüsüyle Kahlenberg durağına çık. Dönüşte bağların arasından Heiligenstadt'a yürüyebilirsin (Kahlenberg rotası)."},
    {id:"w_josefs",cat:"hist",name:"Kahlenberg St. Josef Kilisesi",wiki:"de:St. Josef am Kahlenberg",lat:48.2749828,lon:16.3367374,pid:"ChIJz0aZmsoIbUcRG0dIjfvUe0g",desc:"Tepedeki küçük barok kilise. İçinde Sobieski Şapeli ve Polonyalı komutanlar için anma plakaları var.",hist:"Kilise, 1683'teki kurtarma ordusunun hatırasıyla özdeşleşmiştir. Rivayete göre muharebe sabahı bu tepede ayin yapıldı. İçinde Kral Jan III. Sobieski'ye adanmış bir şapel, 1683 komutanları ve 1983'te burayı ziyaret eden Papa II. Jan Paul için plakalar bulunur. Bugün Polonyalı rahipler yönetir, Lehçe ayin yapılır.\n\nTürkiye'den gelen biri için ilginç bir yer: aynı olay burada Avrupa'nın kurtuluşu olarak anılırken, Osmanlı tarihinde bir dönemin bitişidir.",why:"Manzara terasının hemen yanında, 10 dakika ayır.",dur:"15 dk",fee:"Ücretsiz",hours:"Saatlerini Google Maps'te kontrol et"},
    {id:"w_tuerkenschanz",cat:"park",name:"Türkenschanzpark",wiki:"Türkenschanzpark",lat:48.2348279,lon:16.3338496,pid:"ChIJA65nM34IbUcRToCv4--54vw",desc:"Adını 1683'teki Osmanlı siperlerinden alan büyük, ağaçlıklı park.",hist:"Park, 1683 kuşatmasında Osmanlı ordusunun tabyalar (Schanzen) kurduğu tepenin üzerindedir; adı \"Türk tabyası parkı\" demektir. Alan 19. yüzyıl sonunda park olarak düzenlendi. Ağaçlar, gölet ve şelaleyle Viyana'nın en güzel mahalle parklarından biridir; sonbaharda renkleri çok güzeldir.",why:"Kahlenberg'e giderken ya da dönerken bir mola. Turist yok.",dur:"45 dk",fee:"Ücretsiz",hours:"Her gün 06:00-20:00"},
    {id:"w_liebenberg",cat:"hist",name:"Liebenberg Anıtı",wiki:"de:Liebenberg-Denkmal",lat:48.2125465,lon:16.3617288,pid:"ChIJWciFkb0HbUcR4IZ8tQk5Sx0",desc:"1683 kuşatmasında şehri savunan belediye başkanının altın Zafer tanrıçalı dikilitaşı.",hist:"Johann Andreas von Liebenberg 1680-1683 arasında Viyana belediye başkanıydı. 1679 vebasında şehri yönetti, 1683'te savunma çalışmalarını ve halktan kurulan milis birliklerini örgütledi. Kurtuluşu göremeden, kuşatma sırasında öldü.\n\nAnıt 1890'da, savaşın en sert geçtiği surların, yani Mölker Bastei'nin önüne dikildi. Tepesinde altın yaldızlı bir Zafer figürü durur.",why:"Ringstraße'de üniversitenin karşısında. 1683 rotasının son durağı.",dur:"10 dk",fee:"Ücretsiz",hours:"Her zaman açık"},
    {id:"w_schotten",cat:"hist",name:"Schottenkirche",wiki:"Schottenstift",lat:48.2120575,lon:16.3646286,pid:"ChIJh7MsQ70HbUcR6tcwIQjo2GE",desc:"Freyung meydanındaki manastır kilisesi. 1683'te Viyana'yı savunan komutan Starhemberg burada gömülü.",hist:"Manastırı 1155'te Babenberg Dükü II. Heinrich kurdu ve İrlandalı keşişleri getirdi; o dönemde İrlanda'ya Latince Scotia dendiği için adı Schotten (İskoçlar) oldu.\n\nKilisede 1683 kuşatmasında şehrin askeri komutanı Ernst Rüdiger von Starhemberg'in mezarı ve anıtı bulunur. Starhemberg iki ay boyunca, çok az askerle, Osmanlı lağımlarına ve hücumlarına karşı şehri tuttu.",why:"Freyung'dan geçerken. Ücretsiz ve sakin.",dur:"15 dk",fee:"Ücretsiz",hours:"Saatlerini Google Maps'te kontrol et"},
    {id:"w_kolschitzky",cat:"hist",name:"Kolschitzky Anıtı",wiki:"de:Georg Franz Kolschitzky",lat:48.1881418,lon:16.3728732,pid:"ChIJ-4ut2tWpbUcRnsZtqezqgEA",desc:"Bir binanın köşesinde, Osmanlı kıyafetiyle kahve döken adam heykeli. Viyana kahvesinin efsanesi.",hist:"Efsaneye göre 1683 kuşatmasında Türkçe bilen Georg Franz Kolschitzky, Osmanlı kıyafeti giyip ordugâhın içinden geçerek kurtarma ordusuna haber taşıdı. Zaferden sonra Osmanlıların bıraktığı kahve çuvallarını ödül olarak aldı ve Viyana'nın ilk kahvehanesini açtı.\n\nGerçek biraz farklı: Viyana'nın ilk kahvehanesini 1685'te Johannes Diodato adında bir tüccar açtı. Kolschitzky ve iki eski haberci 1686'da kahve satma izni aldı. Yani Viyana kahvesi gerçekten 1683'ün ardından ve Osmanlı'dan geldi, ama ilk kahveci Kolschitzky değildi.\n\nAnıt, Favoritenstraße ile Kolschitzkygasse'nin köşesindedir.",why:"Kahve ile Osmanlı arasındaki bağı anlatmak için güzel bir vlog karesi. Ama merkezden uzak ve yorumlara göre çevresi pek hoş değil.",dur:"10 dk",fee:"Ücretsiz",hours:"Her zaman",tip:"Yalnızca bu anıt için gitmeye değmez; Belvedere ya da Hauptbahnhof'tan geçerken uğra. Merkezde Domgasse'de de Kolschitzky için bir anma plakası var."},
    /* ================= MİMARİ ================= */
    {id:"w_hundert",cat:"arch",name:"Hundertwasserhaus",wiki:"Hundertwasserhaus",lat:48.207337,lon:16.394294,pid:"ChIJd7QUtBIHbUcRnIE5N35NVIQ",desc:"Renkli, eğri duvarlı, çatısında ağaçlar olan belediye konutu. İçinde insanlar yaşıyor.",hist:"Ressam Friedensreich Hundertwasser düz çizgiden nefret ederdi; ona göre doğada düz çizgi yoktu. Viyana belediyesi için tasarladığı bu konut 1983-1985 arasında mimar Joseph Krawina ile yapıldı. Yerler dalgalı, pencereler farklı boyda, çatıda ve teraslarda 200'den fazla ağaç ve çalı var. Kiracıların pencerelerinin çevresini istedikleri gibi boyama hakkı vardır.",why:"Dışarıdan görmek ücretsiz ve 15 dakika yeter. Karşıdaki Hundertwasser Village'da tuvalet bile tasarım.",dur:"20 dk",fee:"Ücretsiz (yalnızca dışarıdan)",hours:"Dış cephe her zaman",tip:"Yakındaki Kunst Haus Wien'de Hundertwasser müzesi var (Löwengasse'den 5 dakika)."},
    {id:"w_kunsthaus",cat:"arch",name:"Kunst Haus Wien (Hundertwasser Müzesi)",wiki:"Kunst_Haus_Wien",lat:48.211076,lon:16.393286,pid:"ChIJzb8zkw0HbUcR8HQWK_ZQXHM",desc:"Hundertwasser'ın kendi tasarladığı müze. Resimleri, mimari maketleri ve dalgalı zeminleri.",hist:"Eski bir mobilya fabrikası binası 1991'de Hundertwasser tasarımıyla müzeye dönüştürüldü. Ressamın hayatını, resimlerini ve ekolojik mimari fikirlerini tek yerde anlatır.",why:"Hundertwasserhaus'u beğendiysen içini görmek için.",dur:"1 sa",fee:"Ücretli, güncel fiyatı girişte doğrula",hours:"Her gün 10:00-18:00"},
    {id:"w_mq",cat:"arch",name:"MuseumsQuartier",wiki:"Museumsquartier",lat:48.2033369,lon:16.3586166,pid:"ChIJ30_rPpAHbUcR_-tB67Mp1JQ",desc:"Eski imparatorluk ahırlarında müzeler, kafeler ve avludaki renkli oturma blokları.",hist:"Avlunun çevresindeki barok binalar 18. yüzyılda Fischer von Erlach'ın tasarladığı imparatorluk ahırlarıdır. 2001'de Leopold Museum (Schiele koleksiyonu), MUMOK ve Kunsthalle ile kültür kompleksine dönüştü. Avludaki büyük oturma blokları (Enzis) yerlilerin buluşma yeridir.",why:"KHM'den sonra avluda oturup mola vermek için. Avlu ücretsiz.",dur:"30 dk",fee:"Avlu ücretsiz, müzeler ayrı biletli",hours:"Avlu her zaman açık"},
    /* ================= PARK VE MANZARA ================= */
    {id:"w_riesenrad",cat:"photo",name:"Riesenrad (Prater Dönme Dolabı)",wiki:"Wiener_Riesenrad",lat:48.2166995,lon:16.3959008,pid:"ChIJJYWNjA8HbUcRBlfleWeh1qw",desc:"1897'den kalma, ahşap kabinli dev dönme dolap. Prater lunaparkının simgesi.",hist:"Dönme dolap 1897'de İmparator Franz Joseph'in tahttaki 50. yılı için İngiliz mühendis Walter Basset tarafından yapıldı. 1945'te yanıp kabinleri yok oldu, ama yeniden kuruldu. 1949 yapımı Üçüncü Adam filminin ünlü sahnesi bu kabinlerde çekildi. Prater, eskiden imparatorluk av alanıydı; II. Joseph 1766'da halka açtı.",why:"Yavaş döner, kabinden şehir ve Tuna manzarası. Akşam ışıkları yanınca daha güzel.",dur:"1 sa",fee:"Ücretli, güncel fiyatı wienerriesenrad.com'da doğrula",hours:"Her gün 10:00-21:45",tip:"Kuyruk uzun olabiliyor, bileti online al."},
    {id:"w_stadtpark",cat:"park",name:"Stadtpark ve Johann Strauss Anıtı",wiki:"Stadtpark,_Vienna",lat:48.2038059,lon:16.3791518,pid:"ChIJVTinfnYHbUcRYzuAvj58p9g",desc:"Ringstraße üzerindeki park. Keman çalan altın Strauss heykeli Viyana'nın en çok fotoğraflanan anıtlarından.",hist:"Stadtpark 1862'de, eski surların yıkılmasından sonra açılan ilk halk parkıdır. Vals Kralı Johann Strauss (oğul) için yapılan altın yaldızlı anıt 1921'de açıldı. Strauss'un Mavi Tuna valsi Avusturya'nın gayri resmi marşı sayılır.",why:"İç şehirden Hundertwasser tarafına yürürken üstünde.",dur:"20 dk",fee:"Ücretsiz",hours:"Her zaman açık"},
    /* ================= KAHVEHANELER ================= */
    {id:"w_central",cat:"coffee",name:"Café Central",wiki:"Café_Central",lat:48.2104274,lon:16.3654339,pid:"ChIJLzsM95cHbUcRSS5C-z-H-ls",price:"€€",rating:4.3,rc:30420,rdate:"20.10.2026",eat:"Melange, Einspänner, elmalı strudel, Kaiserschmarrn.",hist:"Café Central 1876'da Palais Ferstel'in içinde açıldı. 20. yüzyıl başında Viyana'nın entelektüel merkeziydi: Lev Troçki burada satranç oynardı, şair Peter Altenberg adresini bu kafe olarak verirdi. Girişte Altenberg'in masada oturan heykeli var.",why:"Dünyanın en ünlü kahvehanelerinden. Mimarisi için bir kahve iç; yemek için başka yer seç (yorumlarda fiyat-kalite eleştiriliyor).",hours:"Saatlerini Google Maps'te kontrol et",tip:"Kapıda uzun kuyruk olur. Rezervasyon yap ya da sabah erken git."},
    {id:"w_hawelka",cat:"coffee",name:"Café Hawelka",wiki:"Café_Hawelka",lat:48.2079316,lon:16.3697835,pid:"ChIJ5f5FIZkHbUcRdBWrSKcFTPA",price:"€€",rating:4.0,rc:9128,rdate:"20.10.2026",eat:"Buchteln (marmelatlı mayalı çörek), Melange.",hist:"Leopold ve Josefine Hawelka bu kafeyi 1939'da devraldı. Savaştan sonra sanatçıların ve yazarların buluşma yeri oldu. Josefine'nin yaptığı Buchteln efsaneleşti; bugün de kafenin imza tatlısıdır. İç mekân onlarca yıldır neredeyse hiç değişmedi.",why:"Turistik kafelerin en eski ve sahici hissettireni. Buchteln için git.",hours:"Pzt-Per 09:00-24:00, Cum-Cmt 09:00-01:00, Paz 10:00-21:00"},
    {id:"w_landtmann",cat:"coffee",name:"Café Landtmann",wiki:"Café_Landtmann",lat:48.2115469,lon:16.3615167,pid:"ChIJualQc5wHbUcRrzBxds3JZ7I",price:"€€",rating:4.4,rc:21492,rdate:"20.10.2026",eat:"Viyana kahvaltısı, Sachertorte, Kaiserschmarrn.",hist:"Landtmann 1873'te Ringstraße'de, Burgtheater'in yanında açıldı. Sigmund Freud'un sevdiği kafelerden biri olarak bilinir. Bugün de politikacıların ve gazetecilerin buluştuğu yerdir.",why:"Ringstraße yürüyüşünde kahvaltı ya da kahve molası için.",hours:"Pzt-Cmt 07:30-24:00, Paz 07:30-22:00"},
    {id:"w_sperl",cat:"coffee",name:"Café Sperl",wiki:"Café_Sperl",lat:48.1998326,lon:16.3611306,pid:"ChIJ2XE5E4UHbUcRnNXnuwsVah8",price:"€€",rating:4.0,rc:6276,rdate:"20.10.2026",eat:"Sperl pastası, elmalı strudel, kahvaltı.",hist:"Sperl 1880'de açıldı ve bilardo masalarıyla bilinen klasik bir mahalle kahvehanesidir. Before Sunrise filminin bir sahnesi burada çekildi.",why:"Naschmarkt'a yakın, merkezdeki ünlülerden biraz daha sakin ve ucuz.",hours:"Pzt-Cmt 07:00-22:00, Paz 10:00-20:00"},
    {id:"w_prueckel",cat:"coffee",name:"Café Prückel",wiki:"Café_Prückel",lat:48.2075943,lon:16.3804047,pid:"ChIJoY8VFnUHbUcRWhR8IXaIed4",price:"€€",rating:4.0,rc:5356,rdate:"20.10.2026",eat:"Wiener Schnitzel, Marillenknödel, kahvaltı.",hist:"Prückel 1903'te Stubentor'da açıldı. İç mekânı 1955'te mimar Oswald Haerdtl'in yaptığı 50'ler modern tasarımıdır; imparatorluk süslemeli kafelerden farklı, ferah bir havası var.",why:"Stadtpark'ın karşısında, Hundertwasser rotasının başında mola.",hours:"Her gün 08:30-22:00"},
    {id:"w_frauenhuber",cat:"coffee",name:"Café Frauenhuber",wiki:"Café_Frauenhuber",lat:48.2057306,lon:16.3722611,pid:"ChIJATgjhZ4HbUcRV-h1Ls4Y9ok",price:"€€",rating:4.0,rc:2238,rdate:"20.10.2026",eat:"Elmalı strudel ve vanilya sosu, gulaş.",hist:"Frauenhuber, Viyana'nın hâlâ açık olan en eski kahvehanesi olarak bilinir; 1824'ten beri kafe. Ziyaretçi yorumlarına göre binadaki eski restoran salonunda Mozart ve Beethoven çalmıştı.",why:"Kärntner Straße'nin yanında, turist akışından biraz uzak klasik kafe.",hours:"Pzt-Cmt 08:00-22:00, Paz 10:00-20:00"},
    {id:"w_jonas",cat:"coffee",name:"Jonas Reindl Coffee Roasters",lat:48.2149013,lon:16.3618455,pid:"ChIJDbD-L7wHbUcRkOB0QT93fJg",price:"€",rating:4.5,rc:1212,rdate:"20.10.2026",eat:"Kendi kavurdukları filtre kahve, flat white, cappuccino.",why:"Viyana'nın en bilinen specialty kahvecilerinden. Votivkirche'nin dibinde.",hours:"Pzt-Cum 08:00-17:30, Cmt-Paz 09:00-17:00"},
    {id:"w_kaffemik",cat:"coffee",name:"Kaffemik",lat:48.1991539,lon:16.3509685,pid:"ChIJmU3YGIwHbUcRn4dcNeZmgrg",price:"€",rating:4.7,rc:1095,rdate:"20.10.2026",eat:"Kendi kavurdukları espresso ve filtre, tek kökenli çekirdekler.",why:"Yorumlara göre Viyana'nın en iyi specialty kahvesi. Küçük ve oturacak yer az.",hours:"Pzt-Cum 08:00-18:00, Cmt 10:00-18:00, Paz 11:00-17:00"},
    /* ================= PASTANE VE FIRIN ================= */
    {id:"w_sacher",cat:"bakery",name:"Café Sacher",wiki:"Sachertorte",gen:1,lat:48.2039459,lon:16.3698418,pid:"ChIJI85wbpwHbUcR2nlviUzwg9s",price:"€€",rating:3.9,rc:20631,rdate:"20.10.2026",eat:"Orijinal Sachertorte ve krema, elmalı strudel.",hist:"Sachertorte'yi 1832'de 16 yaşındaki çırak aşçı Franz Sacher, Prens Metternich'in bir yemeği için yaptı. Oğlu Eduard Sacher 1876'da operanın arkasındaki Hotel Sacher'i açtı.\n\nTarifin sahipliği yüzünden Sacher ile Demel yıllarca mahkemelik oldu. Sonunda Sacher \"Original Sacher-Torte\" adını kullanma hakkını aldı; Demel kendi pastasını farklı adla satıyor. Fark mı? Sacher'de kayısı reçeli pastanın ortasında, Demel'de yalnızca çikolata kaplamanın altında.",why:"Pastanın doğduğu yerde bir dilim. Turistik, ama bir kez yapılır.",hours:"Her gün 07:00-23:00",tip:"Masa için kuyruk varsa yandaki Sacher dükkânından kutulu pasta alıp parkta yiyebilirsin."},
    {id:"w_demel",cat:"bakery",name:"Demel",wiki:"Demel",lat:48.2085962,lon:16.3672185,pid:"ChIJiY3_UpgHbUcRWCIbHu4EWXY",price:"€€",rating:4.2,rc:22602,rdate:"20.10.2026",eat:"Kaiserschmarrn (yaparken camdan izlenir), Annatorte, Demel'in Sachertorte'si.",hist:"Demel imparatorluk sarayının resmî pastanesiydi (k.u.k. Hofzuckerbäcker). 18. yüzyılın sonunda kuruldu ve 19. yüzyıldan beri Kohlmarkt'taki bu dükkânda. Vitrinleri hâlâ sezona göre şekerden heykellerle süslenir.",why:"Kaiserschmarrn'ı Viyana'da en güzel yaptığı söylenen yer. Mutfak camdan görünüyor.",hours:"Her gün 10:00-19:00",tip:"Sadece Kaiserschmarrn istiyorsan paket servis penceresinden alabilirsin, kuyruk beklemezsin."},

    {id:"w_mayer",cat:"food",name:"Mayer am Pfarrplatz (Heuriger)",wiki:"Heuriger",gen:1,lat:48.2550739,lon:16.3588896,pid:"ChIJd4EG-hgGbUcRZemvOwfpNGU",price:"€€€",rating:4.3,rc:1753,rdate:"20.10.2026",eat:"Kendi bağlarının şarabı (Gemischter Satz), açık büfe soğuk ve sıcak yemekler, kızarmış domuz.",hist:"Heuriger, bağcının kendi yeni şarabını kendi bahçesinde sattığı şarap evidir. Bu hak 1784'te İmparator II. Joseph'in fermanıyla verildi. Viyana, şehir sınırları içinde ciddi miktarda şarap üreten nadir başkentlerdendir.\n\nMayer am Pfarrplatz'ın binasında Beethoven 1817'de bir süre yaşadı; bu yüzden binaya Beethovenhaus denir.",why:"Kahlenberg'den aşağı yürüyen rotanın sonunda şarap ve akşam yemeği.",hours:"Pzt 12:00-24:00, Sal-Per 16:00-24:00, Cum-Paz 12:00-24:00",tip:"Akşam için rezervasyon önerilir."},

    {id:"w_brunnenmarkt",cat:"market",name:"Brunnenmarkt",wiki:"de:Brunnenmarkt",lat:48.2123173,lon:16.3362901,pid:"ChIJdZn7Q5UHbUcRoTDxNRZvO3o",price:"€",rating:4.5,rc:2145,rdate:"20.10.2026",eat:"Türk ve Balkan tezgâhları: meyve, sebze, peynir, et, baklava, simit.",hist:"Brunnenmarkt, Viyana'nın en uzun sokak pazarı olarak bilinir ve Ottakring'deki Türk topluluğunun kalbidir. 1960'lardan itibaren Türkiye'den gelen işçiler ve aileleri bu mahalleye yerleşti. Bugün tezgâhlarda Türkçe en çok duyulan dillerden biridir. Pazarın ucundaki Yppenplatz kafe ve restoranlarla dolu bir meydandır.",why:"Viyana'daki Türkiye'yi görmek için en iyi yer. Ucuz ve canlı.",hours:"Pzt-Cum 06:00-21:00, Cmt 06:00-18:00, Pazar kapalı",tip:"Cumartesi en kalabalık ve en canlı gün."},

  routes:[
    {id:"r-w-1683",name:"1683 Osmanlı Kuşatmasının İzleri",wiki:"Battle_of_Vienna",desc:"Stephansdom'un top güllesi gömülü duvarları ve Capistrano Kürsüsü'nden Domgasse'deki Kolschitzky plakasına, Graben ve Am Hof üzerinden Starhemberg'in yattığı Schottenkirche'ye, oradan surların en çok zorlandığı Mölker Bastei'deki Liebenberg Anıtı'na.",hist:"14 Temmuz 1683'te Merzifonlu Kara Mustafa Paşa komutasındaki Osmanlı ordusu Viyana'yı kuşattı. Şehrin içinde 15 bine yakın asker ve milisle Starhemberg ve belediye başkanı Liebenberg iki ay direndi. Osmanlı lağımcıları surların altına tüneller kazıp patlattı; en ağır çatışmalar Hofburg'un ve bugünkü Mölker Bastei'nin önündeki burçlarda yaşandı. 12 Eylül'de kurtarma ordusu Kahlenberg'den inince kuşatma tek günde çöktü.\n\nBu rota şehrin içinde o iki ayın izlerini sırayla gösterir. Kahlenberg rotasıyla birleştirirsen hikâyenin iki yüzünü de anlatmış olursun.",why:"Vlog için en güçlü rota. Her durakta anlatacak bir hikâye var.",stops:["Stephansdom (top gülleleri, Capistrano Kürsüsü)","Domgasse (Kolschitzky plakası)","Graben ve Veba Sütunu","Am Hof","Schottenkirche (Starhemberg)","Liebenberg Anıtı"],pts:[[48.2081,16.3738],[48.2079,16.3754],[48.2087,16.3698],[48.2110,16.3682],[48.2120,16.3646],[48.2125,16.3617]]},
    {id:"r-w-kahlenberg",name:"Kahlenberg'den Bağlar Arasından Heiligenstadt'a",wiki:"Kahlenberg",desc:"Kurtarma ordusunun 12 Eylül 1683'te indiği tepeden, bağların arasından Heiligenstadt'taki Heuriger'e yokuş aşağı yürüyüş.",hist:"Sabah 38A otobüsüyle Kahlenberg'e çık, terastan şehre bak ve St. Josef Kilisesi'ni gör. Sonra yokuş aşağı, Viyana bağlarının arasından in. 1683'te kurtarma ordusu da bu yamaçlardan aşağı, Osmanlı ordugâhına doğru inmişti. Rotanın sonunda Beethoven'ın yaşadığı evdeki Heuriger'de bir kadeh yeni şarap.",why:"Şehirden kaçış, manzara ve tarih bir arada. Yokuş aşağı olduğu için kolay.",stops:["Kahlenberg terası","St. Josef Kilisesi","Bağlar","Mayer am Pfarrplatz"],pts:[[48.2745,16.3367],[48.2551,16.3589]]},
    {id:"r-w-altstadt",name:"İç Şehir Klasikleri",wiki:"Innere_Stadt",desc:"Stephansdom'dan Graben ve Kohlmarkt boyunca Michaelerplatz'a, Hofburg'un içinden Josefsplatz'a, Kaisergruft'tan Kärntner Straße ile Opera'ya.",hist:"İç şehir (Innere Stadt), 1850'lerde yıkılan surların içinde kalan eski Viyana'dır ve bütünüyle UNESCO Dünya Mirası listesindedir. Bu rota imparatorluk Viyanası'nın kalbinden geçer: katedral, sarayın kapısı, mezarlık ve opera tek yürüyüşte.",why:"İlk gün için ideal başlangıç. Durakların çoğu ücretsiz.",stops:["Stephansdom","Graben (Veba Sütunu)","Kohlmarkt (Demel)","Michaelerplatz","Josefsplatz","Kaisergruft","Kärntner Straße","Opera"],pts:[[48.2084,16.3735],[48.2087,16.3698],[48.2086,16.3672],[48.2079,16.3665],[48.2063,16.3669],[48.2057,16.3700],[48.2045,16.3705],[48.2034,16.3692]]},
    {id:"r-w-ring",name:"Ringstraße Boyunca",wiki:"Ringstraße",desc:"Opera'dan Burggarten ve Heldenplatz'a, Parlamento ve Belediye Sarayı'nın önünden Liebenberg Anıtı'na ve Votivkirche'ye.",hist:"İmparator Franz Joseph 1857'de şehri çevreleyen surların yıkılmasını emretti. Yerine açılan Ringstraße bulvarı boyunca opera, müzeler, parlamento, belediye ve üniversite gibi 19. yüzyılın büyük binaları dizildi. Surlar 1683'te Osmanlı'ya karşı şehri kurtarmıştı; 170 yıl sonra onların yerine bu gösterişli bulvar yapıldı.",why:"Viyana'nın 19. yüzyıl yüzü. Tramvay 1 ve 2 de aynı yoldan geçiyor, yorulursan bin.",stops:["Opera","Burggarten","Heldenplatz","Parlamento","Rathaus","Liebenberg Anıtı","Votivkirche"],pts:[[48.2031,16.3689],[48.2050,16.3660],[48.2065,16.3635],[48.2081,16.3593],[48.2110,16.3577],[48.2125,16.3617],[48.2154,16.3591]]},
    {id:"r-w-belvedere",name:"Karlskirche'den Belvedere'ye",wiki:"Belvedere,_Vienna",desc:"Karlskirche ve Wien Museum'dan Schwarzenbergplatz'a, Aşağı Belvedere'den teraslı bahçe boyunca Üst Belvedere'ye ve Hauptbahnhof'a.",hist:"Bu rota Prens Eugen'in dünyasına çıkar. Osmanlılara karşı kazandığı zaferlerle zenginleşen prens, şehrin hemen dışına iki saray ve aralarında yokuş yukarı bir barok bahçe yaptırdı. Bahçenin tepesinden bakınca Viyana silueti tam karşında durur.",why:"Bahçe ücretsiz. Tren saatinden önce son yürüyüş olarak çok uygun, sonu gara çıkıyor.",stops:["Karlskirche","Wien Museum","Schwarzenbergplatz","Aşağı Belvedere","Belvedere Bahçesi","Üst Belvedere","Hauptbahnhof"],pts:[[48.1986,16.3717],[48.1994,16.3730],[48.2003,16.3746],[48.1966,16.3799],[48.1940,16.3804],[48.1915,16.3809],[48.1852,16.3766]]},

let query = "";
const norm = t => String(t).toLocaleLowerCase("tr").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
function setTab(t){
  tab = t; document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  $("#list").hidden = t === "map"; $("#locate").hidden = t !== "map"; $("#helpBtn").hidden = t !== "map"; $("#searchBtn").hidden = t !== "map"; $("#searchPanel").hidden = true; if ($("#planChip")) $("#planChip").hidden = t !== "map" || planOnMap === null; $("#legend").hidden = true; $("#navbar").hidden = !NAV || t !== "map"; compassUI();
  if (t !== "map"){ $("#sheet").hidden = true; $("#toast").hidden = true; renderList(); } else if (map) map.resize();
}
document.querySelector(".tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) setTab(b.dataset.tab); });
function renderList(){
  if (tab === "quest"){ renderQuest(); return; }
  if (tab === "plan"){ renderPlan(); return; }
  if (!$("#q")){
    $("#list").innerHTML = `<div class="search"><input id="q" type="search" placeholder="Ara: kilise, patates, park…" aria-label="Noktalarda ara" autocomplete="off"></div><div id="listBody"></div>`;
    $("#q").addEventListener("input", e => { query = e.target.value; renderList(); });
  }
  const favOnly = tab === "fav", near = me && inCity(), q = norm(query.trim()); let html = "";
  if (!q && !favOnly){ const d = doneCount(city), t = totalCount(city);
    html += `<div class="prog"><span>${d} / ${t} gittin</span><span class="bar"><i style="width:${Math.round(d/t*100)}%"></i></span></div>`; }
  for (const k in CATS){
    if (!store.layers[k]) continue;
    let items = (k === "walk" ? city.routes : city.places.filter(p => p.cat === k)).slice();
    if (favOnly) items = items.filter(o => store.fav[o.id]);
    if (q) items = items.filter(o => norm(CATS[k].label + " " + CATS[k].tag + " " + o.name + " " + (o.desc || "") + " " + (o.eat || "") + " " + (o.why || "")).includes(q));
    if (near && k !== "walk") items.sort((a, b) => km(me, [a.lat, a.lon]) - km(me, [b.lat, b.lon]));
    if (!items.length) continue;
    html += `<h2 class="lh" style="--c:${CATS[k].c}"><i></i>${CATS[k].label}</h2>` + items.map(o => {
      const sub = o.ferry ? o.why : o.pts ? (o.geo ? o.geo.km.toFixed(1).replace(".",",") + " km · " + Math.round(o.geo.min/5)*5 + " dk" : o.why) : ((o.rating ? "★ " + o.rating.toFixed(1).replace(".",",") + " · " : "") + (o.price ? o.price + " · " : "") + o.why);
      const right = [near && !o.pts ? fmtD(km(me, [o.lat, o.lon])) : "", store.done[o.id] ? "Gittim ✓" : ""].filter(Boolean).join("<br>");
      return `<button class="row" type="button" data-id="${o.id}" style="--c:${CATS[k].c}"><div><b>${esc(o.name)}</b><small>${esc(sub)}</small></div>${right ? `<em>${right}</em>` : ""}</button>`;
    }).join("");
  }
  $("#listBody").innerHTML = (html.includes("class=\"row\"") ? html : html + `<p class="empty">${q ? "Aramana uyan nokta yok. Başka bir kelime dene ya da üstteki kapalı katmanları aç." : favOnly ? "Henüz favorin yok. Bir noktanın kartından Favori'ye bas." : "Bütün katmanlar kapalı. Üstteki çiplerden birini aç."}</p>`) + `<p class="foot">Veriler en son ${city.updated} tarihinde doğrulandı.${near ? " Liste sana yakınlığa göre sıralı." : ""}</p>`;
}

const levelOf = p => { let i = 0; while (i + 1 < LEVELS.length && p >= LEVELS[i+1][0]) i++; return i; };
const placeById = id => city && city.places.find(p => p.id === id);

function award(n, why){
  const before = levelOf(store.pts);
  store.pts += n; save(); updatePill();
  toast("+" + n + " puan · " + why);
  const after = levelOf(store.pts);
  if (after > before) setTimeout(() => toast("Yeni seviye: " + LEVELS[after][1]), 2600);
  checkBadges();
  if (tab === "quest") renderQuest();
}
function checkBadges(){
  BADGES.forEach(b => { if (!store.badges[b.id] && b.ok()){ store.badges[b.id] = dayKey(); save(); setTimeout(() => toast("Yeni rozet: " + b.t), 1300); } });

/* ---------- Konum: yürüme, ziyaret, rota durakları ---------- */
let lastWalk = null, lastFix = null;
function onPos(pos){
  if (!city) return;
  const p = [pos.coords.latitude, pos.coords.longitude], acc = pos.coords.accuracy, t = pos.timestamp || Date.now();
  lastFix = {p, acc, t:Date.now()};
  if (acc > 40) return;
  // Yürüme: makul hızdaki (tramvay/bisiklet değil) adımlar sayılır. 100 m = 1 puan.
  if (lastWalk){
    const d = km(lastWalk.p, p) * 1000, dt = Math.max(1, (t - lastWalk.t) / 1000);
    if (d >= 8){
      if (d <= 250 && d / dt <= 2.8) store.walkM += d;
      lastWalk = {p, t};
      const due = Math.floor(store.walkM / 100) - store.walkPaid;
      if (due >= 5){ store.walkPaid += due; award(due, "yürüyüş (" + (store.walkM/1000).toFixed(1).replace(".",",") + " km)"); }
      else save();
    }
  } else lastWalk = {p, t};
  // Yerinde ziyaret: 50 m içine girince otomatik "Gittim" ve 5 puan.
  city.places.forEach(o => {
    if (!store.visits[o.id] && km(p, [o.lat, o.lon]) * 1000 <= 50){
      store.visits[o.id] = dayKey(); store.done[o.id] = 1; save(); refresh();
      award(5, o.name.replace(/ \(.*\)$/, "") + " ziyaret edildi");
    }
  });
  // Rota durakları: hepsinden geçince rota tamamlanır, 40 puan.
  city.routes.filter(r => !r.ferry).forEach(r => {
    const hits = store.routeHits[r.id] = store.routeHits[r.id] || [];
    r.pts.forEach((q, i) => { if (!hits.includes(i) && km(p, q) * 1000 <= 70){ hits.push(i); save(); } });
    if (!store.routesDone[r.id] && hits.length === r.pts.length){
      store.routesDone[r.id] = dayKey(); store.routeDay[dayKey()] = r.id; store.done[r.id] = 1; save(); refresh();
      award(40, r.name + " rotası tamamlandı");
    }
  });
}

const DIFF = {easy:["Kolay",10,"#1E9E5A"], medium:["Orta",25,"#E8890C"], hard:["Zor",50,"#D7263D"]};
function todays(){ const n = dayNum(); const MS = city.missions, E = MS.easy, M = MS.medium, H = MS.hard; return {easy:E[n % E.length], medium:M[(n * 3 + 1) % M.length], hard:H[(n * 5 + 2) % H.length]}; }

let photos = {}; try { photos = JSON.parse(localStorage.getItem("dolcanrota.photos") || "{}"); } catch(e){}
const savePhotos = () => { try { localStorage.setItem("dolcanrota.photos", JSON.stringify(photos)); } catch(e){ const k = Object.keys(photos); if (k.length > 1){ delete photos[k[0]]; savePhotos(); } } };
let quizOpen = null, busy = null;

function renderQuest(){
  const lv = levelOf(store.pts), cur = LEVELS[lv], nx = LEVELS[lv+1];
  const pct = nx ? Math.round((store.pts - cur[0]) / (nx[0] - cur[0]) * 100) : 100;
  const T = todays();
  let h = `<div class="qhead"><div class="qpts"><b>${store.pts}</b><span>puan</span></div>
    <div class="qlv"><b>${cur[1]}</b><span class="bar"><i style="width:${pct}%"></i></span><small>${nx ? (nx[0] - store.pts) + " puan sonra: " + nx[1] : "En yüksek seviye"}</small></div></div>
    <div class="qstats"><span><b>${(store.walkM/1000).toFixed(1).replace(".",",")}</b> km yürüdün</span><span><b>${Object.keys(store.visits).length}</b> yer ziyaret</span><span><b>${Object.keys(store.routesDone).length}</b> rota bitti</span></div>
    <h2 class="lh">Günün görevleri</h2>`;
  for (const k of ["easy","medium","hard"]){
    const m = T[k], [lab, pts, col] = DIFF[k], done = store.missions[mKey(m)], pl = m.at && placeById(m.at);
    let act = "";
    if (done) act = `<p class="qdone">✓ Tamamlandı · +${pts} puan</p>` + (photos[mKey(m)] ? `<img class="qimg" alt="Kanıt fotoğrafı" src="${photos[mKey(m)]}">` : "");
    else if (busy === m.id) act = `<p class="qwait">Konumun kontrol ediliyor…</p>`;
    else if (m.type === "photo") act = `<label class="btn primary qbtn">${ic("camera")}Kanıt fotoğrafı çek<input type="file" accept="image/*" capture="environment" data-m="${k}" hidden></label>`;
    else if (m.type === "quiz" && quizOpen === m.id) act = `<p class="qq">${esc(m.q)}</p>` + m.o.map((o, i) => `<button class="btn qopt" type="button" data-qa="${k}:${i}">${esc(o)}</button>`).join("");
    else if (m.type === "quiz") act = `<button class="btn primary qbtn" type="button" data-qs="${k}">${ic("pin")}Buradayım, soruyu aç</button>`;

function freshPos(){
  if (lastFix && Date.now() - lastFix.t < 15000 && lastFix.acc <= 60) return Promise.resolve(lastFix.p);
  return new Promise((ok, no) => navigator.geolocation ? navigator.geolocation.getCurrentPosition(p => ok([p.coords.latitude, p.coords.longitude]), no, {enableHighAccuracy:true, maximumAge:10000, timeout:15000}) : no(new Error("no geo")));
}

}

async function thumb(file){

    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const s = 360 / Math.max(img.width, img.height), c = document.createElement("canvas");
    c.width = Math.round(img.width * Math.min(1, s)); c.height = Math.round(img.height * Math.min(1, s));
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); return c.toDataURL("image/jpeg", 0.6);
  } catch(e){ return null; } finally { URL.revokeObjectURL(url); }
}

/* =====================================================================
   GÜNLÜK PLANLAYICI: gün sayısı, tempo ve başlangıca göre rota üretir.
   Plan telefonda saklanır (store.plan).
   ===================================================================== */
const PACE = {
  sakin:{label:"Sakin", km:7, hrs:7, stay:1, steps:"~10.000 adım"},
  orta:{label:"Orta", km:14, hrs:9, stay:0.7, steps:"~20.000 adım"},
  full:{label:"Full", km:21, hrs:11, stay:0.5, steps:"~30.000 adım"}
};
const STARTS = CITIES.amsterdam.starts = {
  me:{label:"Konumum"},
  centraal:{label:"Centraal", p:[52.3791, 4.9003]},
  dam:{label:"Dam", p:[52.3731, 4.8924]},
  leidse:{label:"Leidseplein", p:[52.3641, 4.8828]},
  museum:{label:"Museumplein", p:[52.3577, 4.8822]}
};
const INTEREST = {hist:"Tarih", arch:"Mimari", park:"Park", photo:"Foto"};
const WALK_KMH = 4.5, DETOUR = 1.3, DAY_START = 9.5;
let planForm = {days:2, pace:"orta", start:"centraal", interests:{hist:true, arch:false, park:true, photo:true}, meals:true};
let planDay = 0, planOnMap = null, planMarkers = [];

const legKm = (a, b) => km(a, b) * DETOUR;
const durH = o => { const m = /(\d+(?:,\d+)?)\s*(sa|dk)/.exec(o.dur || ""); if (!m) return o.cat === "park" ? 0.5 : 0.3; const v = parseFloat(m[1].replace(",", ".")); return m[2] === "sa" ? v : v / 60; };
const ptOf = o => [o.lat, o.lon];
const fmtT = h => { const m = Math.round(h * 60); return String(Math.floor(m / 60) % 24).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); };
const fmtKm = v => v.toFixed(1).replace(".", ",");
function scoreOf(o){
  const base = {hist:3, arch:2, park:2, photo:2}[o.cat] || 1;
  return base + (ART[o.id] ? 1.2 : 0) + (o.hist ? 0.4 : 0);
}

function buildPlan(f){
  const start = f.start === "me" && me && inCity() ? me.slice() : ((city.starts[f.start] || {}).p || city.starts.centraal.p);
  const pace = PACE[f.pace];
  let cand = city.places.filter(o => f.interests[o.cat]);
  // Sakin tempoda merkezden çok uzak noktaları ele (ör. Bijlmer).
  const maxR = f.pace === "sakin" ? 3.2 : f.pace === "orta" ? 5 : 9;
  cand = cand.filter(o => km(city.center, ptOf(o)) <= maxR);
  // Günlere bölme: merkeze göre açıya göre sırala, eşit parçalara ayır (her gün bir bölge).
  const c0 = city.center;
  cand.sort((a, b) => Math.atan2(a.lat - c0[0], a.lon - c0[1]) - Math.atan2(b.lat - c0[0], b.lon - c0[1]));
  const D = f.days, sectors = Array.from({length:D}, (_, i) => cand.slice(Math.round(i * cand.length / D), Math.round((i + 1) * cand.length / D)));
  const used = new Set(), usedFood = new Set(), days = [];
  const reserveKm = f.meals ? 1.2 : 0, reserveH = f.meals ? 2 : 0, near = f.pace === "full" ? 1.2 : f.pace === "orta" ? 0.7 : 0.35;
  const st = Array.from({length:D}, () => ({cur:start, kmU:0, hU:0, seq:[]}));
  const grow = (S, pool) => {
    for (;;){
      let best = null, bestV = -1;
      for (const o of pool){
        if (used.has(o.id)) continue;
        const l = legKm(S.cur, ptOf(o)), h = l / WALK_KMH + durH(o) * pace.stay;
        if (S.kmU + l > pace.km - reserveKm || S.hU + h > pace.hrs - reserveH) continue;
        const v = scoreOf(o) / (l + near);
        if (v > bestV){ bestV = v; best = o; }
      }
      if (!best) return;
      const l = legKm(S.cur, ptOf(best)); S.kmU += l; S.hU += l / WALK_KMH + durH(best) * pace.stay;
      S.seq.push(best); used.add(best.id); S.cur = ptOf(best);
    }
  };
  // 1. tur: her gün yalnızca kendi bölgesinden. 2. tur: kalan noktalar, en boş günden başlayarak.
  st.forEach((S, d) => grow(S, sectors[d]));
  st.slice().sort((x, y) => x.hU - y.hU).forEach(S => grow(S, cand));
  st.forEach(S => { twoOpt(start, S.seq); days.push(f.meals ? addMeals(start, S.seq, usedFood, pace.stay) : S.seq.map(o => ({id:o.id, kind:"see"}))); });
  return {f:JSON.parse(JSON.stringify(f)), start, days, made:dayKey()};
}
function twoOpt(start, seq){
  const len = s => { let t = 0, c = start; s.forEach(o => { t += legKm(c, ptOf(o)); c = ptOf(o); }); return t; };
  let improved = true, n = 0;
  while (improved && n++ < 40){
    improved = false;
    for (let i = 0; i < seq.length - 1; i++) for (let j = i + 1; j < seq.length; j++){
      const t = seq.slice(0, i).concat(seq.slice(i, j + 1).reverse(), seq.slice(j + 1));
      if (len(t) + 1e-9 < len(seq)){ seq.splice(0, seq.length, ...t); improved = true; }
    }
  }
}
function nearestOf(cats, p, usedFood){
  let best = null, bd = 1e9;
  city.places.forEach(o => { if (!cats.includes(o.cat) || usedFood.has(o.id)) return; const d = km(p, ptOf(o)); if (d < bd){ bd = d; best = o; } });
  if (best) usedFood.add(best.id);
  return best;
}
function addMeals(start, seq, usedFood, stayF){
  const out = [];
  if (seq.length){ const m = nearestOf(["coffee","bakery"], seq[0] ? ptOf(seq[0]) : start, usedFood); if (m) out.push({id:m.id, kind:"coffee"}); }
  let t = DAY_START, cur = start, lunch = false;
  for (const o of seq){
    t += legKm(cur, ptOf(o)) / WALK_KMH;
    if (!lunch && t >= 12.5){ const m = nearestOf(["food"], cur, usedFood); if (m){ out.push({id:m.id, kind:"lunch"}); t += 0.75; } lunch = true; }
    out.push({id:o.id, kind:"see"}); t += durH(o) * stayF; cur = ptOf(o);
  }
  if (!lunch && seq.length >= 2){ const m = nearestOf(["food"], cur, usedFood); if (m) out.splice(Math.ceil(out.length / 2), 0, {id:m.id, kind:"lunch"}); }
  const m = nearestOf(["food"], cur, usedFood); if (m) out.push({id:m.id, kind:"dinner"});
  return out;
}
const MEAL = {coffee:["Kahve molası", 0.33, "cup"], lunch:["Öğle yemeği", 0.75, "plate"], dinner:["Akşam yemeği", 1, "moon"]};
function timeline(plan, d){
  let t = DAY_START, cur = plan.start, kmT = 0; const rows = [];
  plan.days[d].forEach(s => {
    const o = find(s.id); if (!o) return;
    const l = legKm(cur, ptOf(o)); kmT += l; t += l / WALK_KMH;
    const stay = s.kind === "see" ? durH(o) * PACE[plan.f.pace].stay : MEAL[s.kind][1];
    rows.push({o, s, arrive:t, walkMin:Math.round(l / WALK_KMH * 60), walkKm:l, stay}); t += stay; cur = ptOf(o);
  });
  return {rows, km:kmT, end:t};
}

/* ---------- Plan sekmesi ---------- */
function renderPlan(){
  const P = store.plan;
  if (!P || P.editing){ renderPlanForm(); return; }
  if (planDay >= P.days.length) planDay = 0;
  const tl = timeline(P, planDay), steps = Math.round(tl.km * 1350 / 500) * 500;
  let h = `<div class="phead"><div><b>${P.f.days} günlük plan</b><small>${PACE[P.f.pace].label} tempo · ${(city.starts[P.f.start] || city.starts.centraal).label} başlangıç</small></div><button class="btn" type="button" data-pl="edit">Yeni plan</button></div>
    <div class="pdays">${P.days.map((_, i) => `<button type="button" class="pday" data-pd="${i}" aria-pressed="${i === planDay}">${i + 1}. Gün</button>`).join("")}</div>
    <div class="psum"><span><b>${fmtKm(tl.km)} km</b>yürüyüş</span><span><b>~${steps.toLocaleString("tr-TR")}</b>adım (duraklar arası)</span><span><b>${fmtT(DAY_START)}–${fmtT(tl.end)}</b>tahmini</span></div>
    <div class="pact"><button class="btn primary go-nav" type="button" data-pl="nav">${NAV_IC}Rotayı başlat</button><button class="btn" type="button" data-pl="map">${ic("map")}Haritada göster</button>${gmLinks(P, planDay)}</div><ol class="ptl">`;
  tl.rows.forEach((r, i) => {
    const o = r.o, cat = CATS[o.cat], tag = r.s.kind === "see" ? cat.label : ic(MEAL[r.s.kind][2]) + " " + MEAL[r.s.kind][0];
    h += `${r.walkMin ? `<li class="pwalk">${ic("walk")} ${r.walkMin} dk · ${fmtKm(r.walkKm)} km</li>` : ""}
      <li><button class="pstop" type="button" data-id="${o.id}" style="--c:${cat.c}"><span class="pn">${i + 1}</span><span class="pt">${fmtT(r.arrive)}</span><span class="pb"><b>${esc(o.name)}</b><small>${tag} · ${Math.round(r.stay * 60)} dk${o.rating ? " · ★ " + o.rating.toFixed(1).replace(".", ",") : ""}</small></span>${store.visits[o.id] || store.done[o.id] ? '<em>✓</em>' : ""}</button></li>`;
  });
  h += `</ol><p class="foot">Süreler tahmini. Hızlı tempolarda müzelerde daha kısa kalacağın varsayılır. Yürüyüş ${WALK_KMH} km/saat ve sokak kıvrımları için kuş uçuşunun 1,3 katı. Müze ve yemek saatlerini kartlardan kontrol et. Plan bu telefonda saklanır.</p>`;
  const keep = renderPlan.lastDay === planDay && renderPlan.lastMade === P.made + P.days.length; $("#list").innerHTML = h; if (!keep) $("#list").scrollTop = 0;
  renderPlan.lastDay = planDay; renderPlan.lastMade = P.made + P.days.length;
}
function gmLinks(P, d){
  const pts = timeline(P, d).rows.map(r => ptOf(r.o));
  const all = [P.start].concat(pts), out = [];
  for (let i = 0; i < all.length - 1; i += 9){
    const part = all.slice(i, i + 10); if (part.length < 2) break;
    const o = part[0].join(","), de = part[part.length - 1].join(","), wp = part.slice(1, -1).map(p => p.join(",")).join("|");
    out.push(`https://www.google.com/maps/dir/?api=1&origin=${o}&destination=${de}${wp ? "&waypoints=" + encodeURIComponent(wp) : ""}&travelmode=walking`);
  }
  return out.map((u, i) => `<a class="btn" href="${u}" target="_blank" rel="noopener">Google Maps${out.length > 1 ? " " + (i + 1) + ". kısım" : "'te aç"}</a>`).join("");
}
function renderPlanForm(){
  const f = planForm, chip = (k, v, l, on) => `<button type="button" class="pchip" data-pf="${k}:${v}" aria-pressed="${on}">${l}</button>`;
  $("#list").innerHTML = `<div class="pform">
    <h2 class="lh">Günlük plan oluştur</h2>

    <p class="pq">Ne kadar yoğun olsun?</p><div class="pcol">${Object.entries(PACE).map(([k, p]) => `<button type="button" class="pchip big" data-pf="pace:${k}" aria-pressed="${f.pace === k}"><b>${p.label}</b><small>${p.steps} · günde ~${p.km} km</small></button>`).join("")}</div>
    <p class="pq">Nereden başlıyorsun?</p><div class="prow">${Object.entries(city.starts).map(([k, s]) => chip("start", k, s.label, f.start === k)).join("")}</div>
    <p class="pq">Neleri görmek istersin?</p><div class="prow">${Object.entries(INTEREST).map(([k, l]) => chip("int", k, l, !!f.interests[k])).join("")}</div>
    <div class="prow">${chip("meals", 1, ic("plate") + " Kahve ve yemek molalarını ekle", f.meals)}</div>
    <button class="btn primary pgo" type="button" data-pl="make">Planımı oluştur</button>
    ${store.plan ? `<button class="btn" type="button" data-pl="back">Kayıtlı plana dön</button>` : ""}
    <p class="foot">Plan, şehri günlere bölge bölge ayırır; her gün aynı semtte kalırsın. Başlangıç "Konumum" ise ve ${city.loc} değilsen ${city.starts.centraal.label}'den başlar.</p></div>`;
}
$("#list").addEventListener("click", e => {
  if (tab !== "plan") return;

/* ---------- Planı haritada göster ---------- */
function whenMap(fn){ if (!map) return; if (map.isStyleLoaded()) fn(); else map.once("load", fn); }
function clearPlanMap(){

  $("#map").classList.remove("planning"); $("#planChip").hidden = true;

function showPlanDay(d){

  if (!map){ toast("Harita henüz yüklenmedi. Biraz bekleyip tekrar dene."); return; }
  whenMap(() => {
    clearPlanMap(); planOnMap = d;

    const data = {type:"Feature", geometry:{type:"LineString", coordinates:pts.map(ll)}};
    if (!map.getSource("plan")){
      map.addSource("plan", {type:"geojson", data});

      map.addLayer({id:"plan-l", type:"line", source:"plan", layout:{"line-cap":"round","line-join":"round"}, paint:{"line-color":city.theme.deep,"line-width":6}});
    } else { map.getSource("plan").setData(data); map.setLayoutProperty("plan-c", "visibility", "visible"); map.setLayoutProperty("plan-l", "visibility", "visible"); map.moveLayer("plan-c"); map.moveLayer("plan-l"); }
    const s = document.createElement("div"); s.className = "pmk start"; s.innerHTML = ic("flag");
    planMarkers.push(new maplibregl.Marker({element:s}).setLngLat(ll(P.start)).addTo(map));
    rows.forEach((r, i) => { const el = document.createElement("button"); el.type = "button"; el.className = "pmk" + (r.s.kind !== "see" ? " meal" : ""); el.textContent = i + 1; el.setAttribute("aria-label", (i + 1) + ". durak: " + r.o.name);
      el.addEventListener("click", ev => { ev.stopPropagation(); lastPick = Date.now(); select(r.o.id); });
      planMarkers.push(new maplibregl.Marker({element:el}).setLngLat(ll(ptOf(r.o))).addTo(map)); });
    $("#map").classList.add("planning");
    const chip = $("#planChip"); chip.hidden = false; chip.firstChild.textContent = (d + 1) + ". gün planı ";
    const bb = new maplibregl.LngLatBounds(ll(pts[0]), ll(pts[0])); pts.forEach(p => bb.extend(ll(p)));
    map.fitBounds(bb, {padding:{top:110, bottom:60, left:40, right:40}, duration:700});
    // Gerçek sokaklardan geçen çizgi (yaya yönlendirme). Olmazsa düz çizgi kalır.
    if (pts.length <= 40) fetch("https://routing.openstreetmap.de/routed-foot/route/v1/foot/" + pts.map(p => p[1] + "," + p[0]).join(";") + "?overview=full&geometries=geojson")
      .then(x => x.json()).then(j => { if (planOnMap === d && j.routes && j.routes[0]) map.getSource("plan").setData({type:"Feature", geometry:j.routes[0].geometry}); }).catch(() => {});
  });
}
